 cotton:0 "Coton"
 cotton_RGO_SIZE:0 "Taille de la plantation de coton"
 dye:0 "Colorant"
 dye_RGO_SIZE:0 "Taille de la plantation de plantes tinctoriales"
 wool:0 "Laine"
 wool_RGO_SIZE:0 "Taille de l'élevage de moutons"
 silk:0 "Soie"
 silk_RGO_SIZE:0 "Taille de l'élevage de vers à soie"
 coal:0 "Charbon"
 coal_RGO_SIZE:0 "Taille de la mine de charbon"
 sulphur:0 "Soufre"
 sulphur_RGO_SIZE:0 "Taille de la mine de soufre"
 iron:0 "Fer"
 iron_RGO_SIZE:0 "Taille de la mine de fer"
 timber:0 "Bois"
 timber_RGO_SIZE:0 "Taille de l'exploitation forestière"
 tropical_wood:0 "Bois exotique"
 tropical_wood_RGO_SIZE:0 "Taille de l'exploitation de bois exotique"
 rubber:0 "Caoutchouc"
