l_french:
 aeroplane_factory:0 "Usine d'avions"
 aeroplane_factory_desc:0 "Des pièces mécaniques, des composants électriques et du caoutchouc sont nécessaires pour produire des avions."
 barrel_factory:0 "Usine de chars"
 barrel_factory_desc:0 "Les chars n'étaient guère plus que des pièces d'artillerie montées sur un châssis mobile. Par conséquent, des automobiles et des pièces d'artillerie sont nécessaires pour produire des chars."
 automobile_factory:0 "Usine d'automobiles"
 automobile_factory_desc:0 "Des pièces mécaniques, des composants électriques et du caoutchouc sont nécessaires pour produire des automobiles."
 radio_factory:0 "Usine de radios"
 radio_factory_desc:0 "Les radios furent parmi les premiers biens de consommation de masse du XXe siècle. Du verre et des composants électriques sont nécessaires pour les produire."
 telephone_factory:0 "Usine de téléphones"
 telephone_factory_desc:0 "Le téléphone est une invention déterminante dans le secteur des communications. Du verre et des composants électriques sont nécessaires pour sa production."
 electric_gear_factory:0 "Usine de composants électriques"
 electric_gear_factory_desc:0 "Les composants électriques sont produits à l'aide de caoutchouc, de charbon et de fer. Les composants électriques sont nécessaires dans différents secteurs, notamment pour la production d'automobiles et d'avions."
 machine_parts_factory:0 "Usine de pièces mécaniques"
 synthetic_oil_factory:0 "Usine d'huile de synthèse"
 synthetic_oil_factory_desc:0 "L'usine d'huile de synthèse produit de l'huile à partir de charbon. Cette huile est vitale pour les nations qui n'ont pas accès au pétrole."
 fuel_refinery:0 "Raffinerie de pétrole"
 fuel_refinery_desc:0 "La raffinerie transforme le pétrole en carburant pour les automobiles."
 steamer_shipyard:0 "Chantier de construction de steamers"
 steamer_shipyard_desc:0 "Les bateaux à vapeur, ou steamers, constituent un progrès majeur par rapport aux bateaux à voile, car ils ne dépendent pas du vent. De plus, ils peuvent être plus grands et plus robustes. L'acier et le charbon sont indispensables aux steamers."
 clipper_shipyard:0 "Chantier de construction de clippers"
 clipper_shipyard_desc:0 "Les clippers sont de simples navires commerciaux qui utilisent leurs voiles et le vent pour se déplacer. Ce chantier naval a besoin de tissus et de bois."
 steel_factory:0 "Aciérie"
 steel_factory_desc:0 "Du fer et du charbon sont ici utilisés pour produire de l'acier. L'acier permet de fabriquer des armes, des voies ferrées ainsi qu'un large éventail de bâtiments et autres éléments."
 artillery_factory_desc:0 "Les pièces d'artillerie sont produites avec de l'acier et des explosifs. L'artillerie renforce considérablement la puissance de feu des divisions armées."
 small_arms_factory:0 "Usine d'armes légères"
 small_arms_factory_desc:0 "De l'acier et des munitions sont nécessaires pour produire des armes légères. Il s'agit de l'équipement de base de toutes les divisions nouvellement formées."
 explosives_factory:0 "Usine d'explosifs"
 explosives_factory_desc:0 "Les explosifs sont produits à partir d'engrais et de munitions. Ils étaient principalement utilisés par l'artillerie."
 ammunition_factory:0 "Usine de munitions"
 ammunition_factory_desc:0 "C'est ici que sont produits différents types de munitions à partir de fer, de charbon et de soufre."
 canned_food_factory:0 "Usine de conserves alimentaires"
 canned_food_factory_desc:0 "Du fer et du bétail sont nécessaires pour produire des conserves. Compte tenu de sa longue durée de conservation, ce type de nourriture est principalement destiné aux forces armées."
 paper_mill:0 "Usine de papier"
 paper_mill_desc:0 "Une usine de papier utilise du bois pour produire du papier. Le papier est utilisé pour les livres, les journaux et les autres moyens d'information."
 dye_factory:0 "Usine de teinture"
 dye_factory_desc:0 "La teinture pouvait être issue de plantations ou être produite de manière synthétique à partir de charbon."
 lumber_mill:0 "Scierie"
 lumber_mill_desc:0 "La scierie transforme la matière première en bois. Ce bois sert à construire des bâtiments, des navires, des meubles ou à fabriquer du papier."
 fabric_factory:0 "Usine de tissus"
 fabric_factory_desc:0 "Le coton est ici transformé en tissu qui sert notamment à fabriquer les voiles des navires ainsi que des vêtements."
 cement_factory:0 "Cimenterie"
 cement_factory_desc:0 "Le ciment est utilisé pour construire des édifices robustes comme les forteresses ou les ponts. Du charbon est nécessaire pour produire du ciment."
 glass_factory:0 "Verrerie"
 glass_factory_desc:0 "Du charbon est nécessaire pour produire du verre. Le verre est principalement utilisé pour produire des miroirs et des fenêtres."
 fertilizer_factory:0 "Usine d’engrais"
 fertilizer_factory_desc:0 "Dans cette usine, le soufre est transformé en engrais. Ce dernier permet d'améliorer la productivité des fermes."
 luxury_clothes_factory:0 "Usine de vêtements de luxe"
 luxury_clothes_factory_desc:0 "Dans cette usine, les vêtements ordinaires sont retraités avec de la soie afin de produire des vêtements de soie pour les classes supérieures de la population."
 luxury_furniture_factory:0 "Usine de meubles de luxe"
 luxury_furniture_factory_desc:0 "Les meubles sont ici transformés en produits de luxe grâce à du bois exotique. Le mobilier de luxe qui en résulte est acheté par les classes supérieures de la population."
 furniture_factory:0 "Usine de meubles"
 furniture_factory_desc:0 "Les meubles sont fabriqués avec du bois. Ils sont indispensables à tous les foyers et sont donc accessibles au grand public."
 regular_clothes_factory:0 "Usine d'habillement"
 regular_clothes_factory_desc:0 "Le tissu et la teinture sont indispensables à cette usine où sont produits les vêtements destinés au grand public."
 liquor_distillery:0 "Distillerie"
 liquor_distillery_desc:0 "Cette distillerie produit l'alcool accessible au grand public. Les céréales constituent la matière première nécessaire à la production de cet alcool."
 winery:0 "Exploitation vinicole"
 winery_desc:0 "Le vin est un important symbole de statut social pour les classes supérieures de la population. Le vin est produit à partir de fruits."
 fort:0 "Fort"
 naval_base:0 "Base navale"
 railroad:0 "Chemin de fer"
 bakery_desc:0 "without grain and bread, cities as we know them could not sustain their population."
 anarchic_bomb_throwers:0 "Lanceurs de bombes anarchistes"
 desc_anarchic_bomb_throwers:0 "La baisse des dépenses consacrées à la lutte contre le crime se traduit par une moindre efficacité en termes de réponse aux atteintes à la sécurité comme les soulèvements d'anarchistes."
 citizen_guard:0 "Garde citoyenne"
 desc_citizen_guard:0 "La baisse des dépenses consacrées à la lutte contre le crime se traduit par une moindre efficacité en termes de réponse aux atteintes à la sécurité tels que les combats entre gangs."
 immoral_business:0 "Activité immorale"
 machine_politics:0 "Clientélisme"
 desc_machine_politics:0 "Le système du clientélisme se traduit, par essence, par la corruption des principales minorités par les politiciens usant de leur influence. Les nominations à des postes gouvernementaux sont des moyens de corruption."
 mafia:0 "Mafia"
 desc_mafia:0 "Si les institutions de lutte contre le crime d'une province sont trop sollicitées, le crime organisé se transforme en mafia. Et la productivité de la province baisse."
 rotten_boroughs:0 "Bourgs pourris"
 desc_rotten_boroughs:0 "Le système des bourgs pourris consiste à créer des circonscriptions électorales si petites qu'elles permettent une victoire certaine par le biais de la corruption."
 spoil_system:0 "Système des dépouilles"
 desc_spoil_system:0 "À défaut d'institutions de contrôle suffisantes, les politiciens usent de leur pouvoir et de leur influence pour assurer leur fortune et leur gloire personnelles. Cela se traduit par un militantisme accru de toute la population de la province."
 terrorist_cells:0 "Cellules terroristes"
 desc_terrorist_cells:0 "Avec la réduction du personnel de sécurité de la province, les terroristes ont moins de mal à se cacher en attendant l'occasion de frapper."
 government_sanitarium:0 "Sanatorium"
 desc_government_sanitarium:0 "Le gouvernement met un sanatorium à la disposition des tuberculeux de cette province."
 academic_confusion:0 "Confusion académique"
 academic_confusion_desc:0 "Notre académie est en proie à la panique à la suite d'un changement paradigmatique au sein de notre effectif. Tant que cela durera, notre prestige et notre recherche en pâtiront."
 liberal_agitation:0 "Agitation libérale"
 desc_liberal_agitation:0 "Des exaltés de cette province soutiennent la révolution libérale."
 springtime_of_nations:0 "Le Printemps des nations!"
 springtime_of_nations_desc:0 "Les nations endormies d'Europe se réveillent pour lutter contre les spectres du despotisme et de la tyrannie."
 global_liberal_agitation:0 "Agitation libérale"
 desc_global_liberal_agitation:0 "Des exaltés soutiennent le libéralisme et la révolution."
 potato_blight:0 "Le mildiou de la pomme de terre"
 desc_potato_blight:0 "La famine s'étend tandis que les cultures pourrissent dans nos champs."
 anti_jacobin_tract:0 "Tract antijacobin"
 desc_anti_jacobin_tract:0 "Un tract contre-révolutionnaire en faveur de l'ordre, de la religion et de la monarchie a été largement diffusé dans notre pays."
 cholera_epidemic_small:0 "Épidémie de choléra"
 desc_cholera_epidemic_small:0 "Le choléra a fait son apparition dans cette province et l'épidémie guette la population."
 cholera_epidemic_big:0 "Épidémie de choléra"
 desc_cholera_epidemic_big:0 "Le choléra a fait son apparition dans cette province et l'épidémie guette la population."
 conservative_reaction:0 "Opposition conservatrice"
 desc_conservative_reaction:0 "Les conservateurs qui siègent au parlement sont mécontents."
 liberal_reaction:0 "Opposition libérale"
 desc_liberal_reaction:0 "Les libéraux qui siègent au parlement sont mécontents."
 national_tragedy:0 "Drame national"
 desc_national_tragedy:0 "Notre nation déplore la perte d'une nouvelle jeune fille dans les mines de charbon."
 western_influences:0 "Influences occidentales"
 desc_western_influences:0 "Notre gouvernement mène une politique visant à encourager les influences occidentales."
 uncivilized_isolationism:0 "Isolationnisme"
 desc_uncivilized_isolationism:0 "Notre pays a fermé ses ports et ses frontières aux étrangers."
 western_presence:0 "Présence occidentale"
 desc_western_presence:0 "Une communauté d'expatriés issus de différents pays européens et de grandes puissances s'est formée ici."
 foreign_smugglers:0 "Contrebandiers étrangers"
 desc_foreign_smugglers:0 "Un cercle de contrebandiers dirigé par des étrangers sévit dans cette province."
 foreign_trading_post:0 "Comptoir étranger"
 desc_foreign_trading_post:0 "Une catégorie distincte de nos citoyens, tenue à l'écart du reste de la population, gère un comptoir réservé aux étrangers de cette province."
 silk_famine:0 "Épidémie de pébrine"
 desc_silk_famine:0 "Une épidémie locale de pébrine empêche les élevages de vers à soie de fonctionner à pleine capacité."
 naval_school:0 "École navale"
 desc_naval_school:0 "La marine marchande possède une École navale dans cette province. Outre l'art du commandement, on y apprend à utiliser les dernières technologies navales."
 trade_restrictions:0 "Restrictions commerciales"
 desc_trade_restrictions:0 "Notre pays régule et interdit certaines importations et exportations."
 colonial_dry_spell:0 "Sécheresse"
 colonial_dry_spell_desc:0 "Il a très peu plu dans cette province pendant l'été et les exploitations agricoles souffrent de ce manque d'eau."
 colonial_exploitation:0 "Exploitation coloniale"
 colonial_exploitation_desc:0 "Nous exploitons toutes les richesses de cette province."
 colonial_museum_of_natural_history:0 "Museum d'histoire naturelle"
 colonial_museum_of_natural_history_desc:0 "Un museum d'histoire naturelle a ouvert ses portes dans cette province."
 colonial_mismanagement:0 "Mauvaise gestion coloniale"
 colonial_mismanagement_desc:0 "Compte tenu des sommes dérisoires octroyées au Bureau colonial (dépenses administratives), cette colonie est en situation de ruine bureaucratique."
 colonial_recruitment:0 "Terre! Liberté! Travail!"
 colonial_recruitment_desc:0 "Une campagne gouvernementale promettant terres et opportunités attire les immigrants vers cette province."
 baby_boom:0 "Baby Boom"
 loyal_askaris:0 "Gurkhas, Askaris et tirailleurs"
 loyal_askaris_desc:0 "Généralement, les habitants de cette province vous soutiennent. D'ailleurs, certains servent ou sont prêts à servir dans les régiments militaires coloniaux."
 female_suffrage:0 "Droit de vote des femmes"
 female_suffrage_desc:0 "Notre pays accorde aux femmes la même égalité qu'aux hommes ainsi que le droit de voter lors des élections générales."
 labor_union:0 "Syndicat professionnel"
 desc_labor_union:0 "Les salariés de votre province ont uni leurs forces pour créer un syndicat professionnel."
 worker_union:0 "Syndicat de salariés"
 strike_solution:0 "Une solution à la grève"
 desc_strike_solution:0 "Votre générosité a mis fin à la grève."
 province_strike:0 "Grève provinciale"
 desc_province_strike:0 "Les salariés de votre province se sont mis en grève."
 black_shirts:0 "Les Chemises noires"
 desc_black_shirts:0 "Les Chemises noires provoquent les habitants de la province."
 free_corps:0 "Les Corps francs"
 desc_free_corps:0 "Inspirés par les Chemises noires, les Corps francs sont un véritable fléau pour votre province."
 the_massacre:0 "Le massacre"
 desc_the_massacre:0 "Un groupe de socialistes et de libéraux a été assassiné."
 fascist_welfare:0 "État providence et fascisme"
 beer_hall_putsch:0 "Le putsch de la Brasserie"
 local_opium_habit:0 "Le problème de l'opium"
 desc_local_opium_habit:0 "La consommation d'opium de cette province atteint un seuil épidémique."
 sayings_of_the_dutch:0 "Études hollandaises"
 desc_sayings_of_the_dutch:0 "Nous avons traduit un grand nombre d'œuvres littéraires occidentales pour les incorporer à nos connaissances nationales et ainsi relancer notre recherche scientifique."
 european_military_mission:0 "Mission militaire"
 desc_european_military_mission:0 "Une grande puissance a établi une mission militaire dans cette province."
 extraterritoriality_granted:0 "Exterritorialité accordée"
 desc_extraterritoriality_granted:0 "Notre pays a accordé l'exterritorialité aux citoyens des grandes puissances."
 military_reform:0 "Réforme militaire"
 desc_military_reform:0 "Nous sommes en train de réformer notre armée selon les normes européennes."
 educational_reform:0 "Réforme de l'éducation"
 desc_educational_reform:0 "Nous avons réformé notre système éducatif. Cela favorise notre recherche mais déplaît aux traditionnalistes."
 legation_quarter:0 "Quartier des légations"
 kettler_denkmal:0 "Monument dédié à un diplomate étranger"
 desc_kettler_denkmal:0 "Ce monument dédié à un diplomate étranger rappelle au peuple que notre gouvernement a renoncé à notre indépendance."
 local_economic_downturn:0 "Ralentissement économique local"
 desc_local_economic_downturn:0 "Cette province connaît un ralentissement économique momentané, mais devrait se rétablir d'ici quelques années."
 free_staters:0 "Free-Staters"
 desc_free_staters:0 "Les Free-Staters de cette province militent pour son accession à l'Union en tant qu'État libre."
 border_ruffians:0 "Les Border Ruffians"
 desc_border_ruffians:0 "Les Border Ruffians empoisonnent la vie des habitants de cette province."
 underground_railroad:0 "Chemin de fer souterrain"
 desc_underground_railroad:0 "Cette province est équipée d'une voie ferrée souterraine qui conduit les esclaves vers la liberté."
 knights_of_the_golden_circle:0 "Les Chevaliers du Cercle d'or"
 desc_knights_of_the_golden_circle:0 "Une organisation secrète dédiée à la promotion de l'esclavage sévit dans cette province."
 american_anti_slavery_society:0 "L'American Anti-Slavery Society"
 desc_american_anti_slavery_society:0 "Une organisation prônant l'abolition de l'esclavage sévit dans cette province."
 copperhead_democrats:0 "Les copperheads"
 desc_copperhead_democrats:0 "Des démocrates opposés à la Guerre de Sécession sévissent dans cette province."
 the_homestead_act:0 "The Idea of Panarcadianism"
 desc_the_homestead_act:0 "With the people of Arcadia fully accepting the rule of the Union, our country stands unified and glorious as never before. With peace ruling on our continent, weary citizens of the Old World look upon our country with hopes never equaled before…"
 the_homestead_act2:0 "L'idéal Amériguain"
 the_slavery_debate:0 "Le débat sur l'esclavage"
 desc_the_slavery_debate:0 "Le débat sur l'esclavage est très animé aux États-Unis où l'on assiste à un éveil progressif de la conscience populaire. Si la Chambre haute obtient un jour une représentation libérale d'au moins 30 %, le Sud risque de faire sécession."
 blood_and_iron_mine:0 "Sang et mine de fer"
 desc_blood_and_iron_mine:0 "Un filon de minerai de fer riche mais dangereux est exploité dans cette province."
 libertine_culture:0 "Culture libertine"
 desc_libertine_culture:0 "Notre nation adopte une approche libertine vis-à-vis de la consommation d'alcool. Onze bouteilles de bière sur le mur... Yo-ho-ho! Et une bouteille de rhum!"
 temperance_league:0 "Ligue antialcoolique"
 desc_temperance_league:0 "Notre nation possède une puissante ligue antialcoolique très influente, y compris au sein des cercles gouvernementaux."
 beer_halls:0 "Brasseries"
 desc_beer_halls:0 "Cette province possède une brasserie, un saloon ou un bar. Les citoyens y passent beaucoup de temps."
 destitution_and_poverty:0 "Misère et pauvreté"
 desc_destitution_and_poverty:0 "La consommation d'alcool est un problème de plus en plus pesant pour cette province."
 liquor_prohibition:0 "Prohibition de l'alcool"
 desc_liquor_prohibition:0 "La vente, la possession et la consommation de boissons alcoolisées est interdite dans notre pays."
 minority_building_restrictions:0 "Restrictions de construction pour les minorités"
 desc_minority_building_restrictions:0 "Notre pays mène une politique qui empêche les minorités de construire des bâtiments en dur, même si la terre leur appartient."
 dryzymalas_wagon:0 "Le chariot de Drzyma?a"
 desc_dryzymalas_wagon:0 "Le vieux Drzyma?a contourne l'interdiction des constructions en dur en vivant dans un chariot."
 discriminatory_school_system:0 "Système scolaire discriminatoire"
 desc_discriminatory_school_system:0 "Notre système scolaire est discriminatoire envers les citoyens qui n'embrassent pas notre culture nationale."
 flying_university:0 "L'Université volante"
 desc_flying_university:0 "Une organisation clandestine permet de faire des études dans une langue minoritaire."
 organic_work:0 "Travail organique"
 desc_organic_work:0 "Un mouvement dédié au travail en tant que forme de résistance sévit dans cette province."
 egyptian_excavations:0 "Fouilles égyptiennes"
 egyptian_excavations_desc:0 "Notre pays mène des fouilles archéologiques dans la vallée des rois."
 trek_boers:0 "Le Trek des Boers"
 desc_trek_boers:0 "Les Boers de la colonie du Cap migrent vers cette province. C'est ce que l'on appellera plus tard le 'Grand Trek'."
 gold_rush:0 "Ruée vers l'or"
 desc_gold_rush:0 "Cette province prospère grâce à la découverte d'or."
 witwatersrand_gold_rush:0 "La ruée vers l’or de Witwatersrand"
 desc_witwatersrand_gold_rush:0 "Une ruée vers l’or dans le Witwatersrand nous fait connaître internationalement."
 local_tractors:0 "Tracteurs"
 desc_local_tractors:0 "L'agriculture mécanisée a été introduite dans cette province sous la forme de tracteurs qui améliorent l'efficacité et réduisent l'intensité de main-d'œuvre de l'agriculture locale."
 local_electricity:0 "Éclairage électrique"
 desc_local_electricity:0 "Cette province a été équipée d'éclairages électriques, ce qui améliore l'efficacité de toute la production locale, car les ouvriers travaillent dans des environnements neufs et bien éclairés."
 local_nitroglycerin:0 "Nitroglycérine"
 desc_local_nitroglycerin:0 "Cette province sait utiliser les explosifs modernes pour exploiter les mines locales."
 local_distribution_channels:0 "Détaillants"
 desc_local_distribution_channels:0 "De nouvelles et efficaces méthodes et structures de vente et de revente de marchandises ont été introduites dans cette province, laissant les agriculteurs libres de s'occuper de leurs champs."
 local_machine_tools:0 "Extraction minière mécanisée"
 desc_local_machine_tools:0 "Dans cette province, l'extraction s'effectue au moyen d'outils mécanisés neufs qui améliorent l'efficacité des exploitations minières locales."
 pandemic_influenza:0 "Pandémie de grippe"
 desc_pandemic_influenza:0 "Une pandémie de grippe a éclaté dans notre pays, tuant des milliers de gens. Nous espérons seulement qu'elle touchera également nos ennemis."
 trustee_system:0 "Le 'Trusty System'"
 trustee_system_desc:0 "Dans les prisons de cet État, les condamnés sont surveillés par des codétenus. Cette méthode a nettement accru la production."
 penal_colonies:0 "Colonies pénales"
 penal_colonies_desc:0 "Plusieurs colonies de taille et de forme variables sont dispersées autour de notre Empire. Elles accueillent nos pires criminels."
 stock_market_crash:0 "Krach boursier"
 stock_market_crash_desc:0 "Notre pays ressent les effets d'un krach boursier."
 great_depression:0 "Grande dépression"
 central_bank_established:0 "Banque centrale"
 central_bank_established_desc:0 "La banque centre de notre gouvernement maintient un monopole strict sur l'émission de la devise."
 local_stock_exchange:0 "Bourse"
 local_stock_exchange_desc:0 "Cette province abrite une bourse locale qui améliore le rendement de la production locale."
 economic_boom:0 "Essor économique"
 economic_boom_desc:0 "Notre économie est en plein essor grâce à nos banques d'investissement ainsi qu'à une longue période de chômage plutôt bas."
 building_suez_canal:0 "Building the Suez Canal"
 building_suez_canal_desc:0 "The Suez Canal is currently under construction. After each completed phase an event will fire to keep you informed of the progress. Construction will take approximately 10 years."
 building_suez_canal_revolt:0 "Worker revolt at the Suez Canal"
 building_suez_canal_revolt_desc:0 "Construction off the Suez Canal has halted until the revolt is over."
 suez_canal:0 "Suez Canal"
 suez_canal_treaty:0 "Suez Canal Treaty"
 suez_canal_treaty_desc:0 "In $YEAR$ the Suez Canal Treaty was signed exchanging canal rights for a financial reimbursement of 10,0,000 plus an annuity of 250,000."
 building_panama_canal:0 "Building the Andagoya Canal"
 building_panama_canal_desc:0 "The Andagoya Canal is currently under construction. After each completed phase an event will fire to keep you informed of the progress. Construction will take approximately 12.5 years."
 panama_canal:0 "Andagoya Canal"
 panama_canal_treaty:0 "Hay-Bunau-Varilla treaty"
 panama_canal_treaty_desc:0 "The Hay-Bunau-Varilla treaty was an agreement between the USA and the Andagoya granting exclusive canal rights to the USA across the isthmus of Andagoya in exchange for a financial reimbursement of 10,0,000 plus an annuity of 250,000."
 building_panama_canal_scandal:0 "Andagoya Canal Scandal"
 building_panama_canal_scandal_desc:0 "Until the memory of the disastrous construction attempt of the Andagoya Canal has faded enough we can't resume construction."
 building_kiel_canal:0 "Building the Kiel Canal"
 building_kiel_canal_desc:0 "The Kiel Canal is currently under construction. After each completed phase an event will fire to keep you informed of the progress. Construction will take approximately 8 years."
 kiel_canal:0 "Kiel Canal"
 military_goods:0 "Biens militaires"
 ammunition:0 "Munitions"
 small_arms:0 "Petites armes"
 artillery:0 "Artillerie"
 canned_food:0 "Nourriture en boîte"
 barrels:0 "Fûts"
 aeroplanes:0 "Avions"
