 GC_DESC:0 "Depuis la fin de la Grande Guerre Allemande, les idéaux de liberté et d'indépendance des révolutionnaires allemands semblent enterrés. En Angleterre, en Hollande ou dans le Brandebourg, l'autorité de rois étrangers est incontestée. Mais le calme qui règne sur l'Europe depuis la fin de la guerre est trompeur: à travers le continent, les débuts de l'industrialisation, la dissémination de nouveaux savoirs et une insatisfaction croissante parmi les populations augurent des changements à venir. En Amérique, de jeunes puissances émergent pour défier celles du vieux monde, et dans l'Asie réputée endormie, de veilles nations se réinventent..."
