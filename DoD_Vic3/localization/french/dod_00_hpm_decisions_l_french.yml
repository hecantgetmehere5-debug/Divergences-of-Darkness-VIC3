 devil_island_desc:0 "they sometimes scared other potential criminals to go straight. If the original sentence exceeded eight years, they were forced to stay as residents for the remainder of their lives and were provided land to settle on - helping populating the area."
 imperial_rescript_desc:0 "' however, Inoue Kowashi and other proponents of the 'modernization' of Japan felt that this would encourage a return to the old feudal order, and pushed for an 'emperor-centered' philosophy. Prime Minister Yamagata Aritomo authorized the drafting of the Rescript, which was a compromise written largely by Inoue Kowashi with input from Motoda Nagazane and others. After it was issued, the Rescript was distributed to all schools in the country, together with a portrait of Emperor Meiji.'"
 fsa_enact_anaconda_plan_title:0 "Le plan Anaconda"
 unite_ethiopia_1_desc:0 "Le Zemene Mesafint était une période dans l'histoire éthiopienne où le pays était ravagé par les conflits entre les nobles et l'usurpateur Tewodros II. La société et la culture stagnèrent. Les conflits religieux entre orthodoxes ou avec les musulmans servaient souvent de prétextes à des luttes de pouvoir."
