l_french:
 IS_IN_REGION:0 "Est dans la région"
 EVTNAME10120_NEW:0 "La Tribune de $COUNTRY_ADJ$"
 EVTDESC10130_NEW:0 "Une branche locale de la Société chartiste, appelant à un élargissement du droit de vote et à la fin du système électoral censitaire est apparue en $COUNTRY$."
 EVTDESC10170_NEW:0 "Comme des rats porteurs de maladies contagieuses, les prédicateurs modernes vont et viennent facilement de part et d'autres de nos frontières. L'agitation libérale s'étend à $PROVINCENAME$ depuis une province voisine."
 EVTNAME13010:0 "Les naufragés"
 EVTOPTA13010:0 "Les laisser rentrer chez eux."
 EVTOPTB13010:0 "Les obliger à rester."
 EVTNAME13015:0 "Contrebandiers étrangers"
 EVTDESC13056:0 "Les grands voiliers de commerce sillonent nos côtes du nord au sud, comme des loups à l'abattage des faibles et des corruptibles avec le poison qu'ils vendent. Partout où il y a un port non encore exposé, un navire étranger accoste bientôt, et plante un autre croc dans notre organisme national. L'usage de l'opium s'est étendue à $PROVINCENAME$."
 EVTDESC13061:0 "L'usage de l'opium dans une province voisine s'est maintenant étendue à l'intérieur de ses terres. Les fermiers et ouvriers ne parviennent plus à se présenter au travail, et des champs entiers retombent en friche, les gens de $PROVINCENAME$ glissent de plus en plus dans les brumes de la dépendance."
 EVTDESC13140:0 "Des renseignements confidentiels concernant nos préparatifs militaires ont été divulgués par la mission militaire de $PROVINCENAME$, estropiant gravement notre effort de guerre. Nous avons expulsé les membres de la mission, mais le mal est fait."
 EVTDESC13280:0 "Les réformes menées dans notre pays déplaisent aux élites foncières de $PROVINCENAME$."
 EVTDESC60140:0 "Alors que les libéraux tiennent les rênes de notre pays, ils estiment le moment venu pour une convention constitutionnelle. Les vues de chacun, du moins de tous ceux qui importent vraiment, seront représentées dans cette nouvelle assemblée afin de forger la voie de nos nations."
 apply_for_USA_statehood2_title:0 "Demande de rattachement en tant qu'État"
 apply_for_USA_statehood2_desc:0 "Notre position géographique sur le continent nord Américain, et les liens qui nous unissent aux Etats-Unis font que ces derniers accepteraient probablement une pétition sur une demande de rattachement en tant qu'Etat. En faisant cela, notre pays serait annexé aux Etats-Unis."
 form_germany_AUS_title:0 "Pour l'Allemagne, hip hip hip, hourra!"
 portuguese_civil_code_desc:0 "it was divided into four sections: the person, the acquisition of goods, goods, and the defense of those goods or rights."
 fsa_shermans_march_to_the_sea_title:0 "La marche de Sherman vers la mer"
 fsa_shermans_march_to_the_sea_desc:0 "Durant la campagne qu'il mena en Géorgie de novembre à décembre 1864, le Major-général William Tecumseh Sherman appliqua une doctrine de guerre totale, que l'on pourrait plutôt qualifier de campagne de terreur ayant pour cible la population civile du Sud. En agissant profondément au sein des territoires confédérés, et en détruisant la majorité des infrastructures civiles de la Géorgie, Sherman est souvent cité pour avoir brisé la volonté de combattre du Sud. Appliquons sa méthode, et cela pourrait être le dernier clou du cercueil des Confédérés."
 fsa_enact_radical_reconstruction_title:0 "Reconstruction radicale"
 austrian_form_south_german_confederation2_desc:0 "Il fallut attendre la proclamation de l'Empire allemand qui suivit la guerre franco-allemande pour assister à l'unification de l'Allemagne. Pourtant, avec la montée du nationalisme au XIXe siècle, l'unification aurait été possible bien avant cela, comme en témoigne l'assemblée de Francfort de 1848. En nous imposant dans les États du sud, nous formerons les États du sud de l'Allemagne."
 peking_convention_TPG_title:0 "La convention de Pékin."
 peking_convention_TPG_desc:0 "Depuis le traité de Nerchinsk (1689), l’Empire russe a reconnu le fleuve Argun et les monts Stanovoy comme frontière naturelle entre la Russie et la Chine.  Au cours du XIXe siècle, les Russes franchirent cette frontière pour s’emparer des vastes territoires entre les monts Stanovoy et le fleuve Amour. Les Puissances occidentales mirent plus tard un terme à la seconde guerre de l’opium en brûlant les palais d’été de l’empereur et en s’emparant de Pékin. Un général russe avisé du nom de Nicolaï Ignatiev parvint à convaincre les chinois que seul le soutien de la Russie permettrait l'évacuation de Pékin par les alliés. Le prix de ce soutien fut la convention de Pékin, qui entérinait les conquêtes de Muravyov et cédait à la Russie les territoires entre le fleuve Ussuri et la côte pacifique. Ainsi, la Russie gagna-t-elle 560 000 kilomètres carrés sans tirer un coup de fusil."
