 unite_ethiopia_1_desc:0 "The Zemene Mesafint was a period in Ethiopian history when the country was rent by conflicts between the Solomonic loyalist nobles and the usurper - Emperor Tewodros II. Both society and culture stagnated. Religious conflict both within the Ethiopian Orthodox Church and with Ethiopian Muslims were often used as the pretext for the powerful to battle each other."
