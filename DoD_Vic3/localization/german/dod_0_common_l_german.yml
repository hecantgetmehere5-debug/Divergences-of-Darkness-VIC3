 reactionary_rebels_title:0 "Reaktionär"
 reactionary_rebels_name:0 "$COUNTRY$-Reaktionäre"
 reactionary_rebels_desc:0 "Reaktionäre Rebellen lechzen nach einer Rücke zur guten, alten Zeit. Ob sie nun wahre Monarchisten sind oder einfach nur gegen alles, was sie als moderne Ideologien ansehen, man kann diese Konterrevolutionäre immer in vorderster Front im Kampf gegen Sozialismus und Liberalismus finden"
 reactionary_rebels_army:0 "$COUNTRY_ADJ$ Weiße Armee"
 fascist_rebels_title:0 "Faschist"
 fascist_rebels_name:0 "$COUNTRY$-Faschisten"
 fascist_rebels_desc:0 "Das Freikorps sind Revolutionäre, die von der radikalen neuen Ideologie des Faschismus angetrieben werden. Unter den Dogmen der Gewalt und der Massenaktionen machen diese schlachterprobten Revolutionäre vor nichts Halt, um alte Monarchien und junge Demokratien gleichsam zu stürzen und sie alle mit einem absolutistischen faschistischen Staat zu ersetzen."
 fascist_rebels_army:0 "$COUNTRY_ADJ$ Freikorps"
 communist_rebels_title:0 "Kommunist"
 communist_rebels_name:0 "$COUNTRY$-Kommunisten"
 communist_rebels_desc:0 "Die Roten Garden sind Kommunisten, die in offener Rebellion gegen die Regierung angehen und, noch wichtiger, gegen alles, das sie als reaktionäres Machwerk des bourgeoisen Staats und selbst der Gesellschaft ansehen. In Opposition gegen die Institutionen der Religionen, Traditionen, privaten Eigentums und Familie streben diese Revolutionäre statt dessen eine 'Diktatur des Proletariats' an, den ersten Schritt auf dem langen, leichengepflasterten Weg zur verheißenen Utopie des Kommunismus."
 communist_rebels_army:0 "$COUNTRY_ADJ$ Rote Garden"
 anarcho_liberal_rebels_title:0 "Anarcho-Liberal"
 anarcho_liberal_rebels_name:0 "$COUNTRY$-Anarcho-Liberale"
 anarcho_liberal_rebels_desc:0 "Die Bürgerwache sind militante Liberale, die sich in offener Rebellion gegen die - echten oder angenommenen - unterdrückenden Praktiken der Regierung und des Staatsapparats befinden und danach streben, ihre persönliche Freiheit um jeden Preis zu verteidigen. Diese Revolutionäre sehen sich im Kampf gegen den Tyrannen als Freiheitskämpfer im eigentlichen Sinne."
 anarcho_liberal_rebels_army:0 "$COUNTRY_ADJ$ Bürgerwache"
 nationalist_rebels_title:0 "Nationalist"
 nationalist_rebels_name:0 "$INDEP$-Nationalisten"
 nationalist_rebels_desc:0 "Nationalistische Rebellen kämpfen für die Freiheit ihres Volkes. Gut diszipliniert und ausgerüstet konzentrieren sich auf die Erlangung der Unabhängigkeit für ihr Land."
 nationalist_rebels_army:0 "$INDEP$-Nationalisten"
 pan_nationalist_rebels_title:0 "Pan-Nationalisten"
 pan_nationalist_rebels_name:0 "$UNION_ADJ$ Pan-Nationalisten"
 pan_nationalist_rebels_desc:0 "Pan-nationalistsche Rebellen wollen sich in einer freien und unabhängigen Nation mit denen zusammenschließen, die sie als kulturelle Verwandte ansehen. Sie werden von den Idealen der romantischen Nationalistenbewegung getrieben, und ihr Zugehörigkeitsinn für das Land, für welches sie kämpfen, macht sie zu entschlossenen und zähen Bedrohungen von Frieden und Ordnung."
 pan_nationalist_rebels_army:0 "Junge $UNION$ Brigaden"
 liberal_rebels_title:0 "Jakobinische Rebellen"
 liberal_rebels_name:0 "Jakobinische Rebellen"
 liberal_rebels_army:0 "Republikanische Wache"
 red_shirts_title:0 "Camicie Rosse"
 red_shirts_name:0 "Garibaldis Rothemden"
 red_shirts_desc:0 "Die Rothemden (Camicie rosse) waren Freiwillige, die unter Giuseppe Garibaldi dienten, als dieser darum kämpfte, die vielen italienischen Splitterstaaten zu einem Nationalstaat zu vereinen. Ihren Namen bekamen sie durch die roten Hemden, die Garibaldi und seine Männer trugen. Der charismatische und national wie international beliebte Garibaldi, der im Allgemeinen als Freiheitskämpfer angesehen wird, war maßgeblich an der italienischen Vereinigung unter der sardinischen Krone beteiligt. Diese italienischen Pan-Nationalisten kämpfen für die Vereinigung Italiens."
 red_shirts_army:0 "Rothemden-Expedition der Tausend"
