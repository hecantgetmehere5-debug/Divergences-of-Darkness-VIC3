l_german:
 aeroplane_factory:0 "Flugzeugfabrik"
 aeroplane_factory_desc:0 "Zum Flugzeugbau sind Maschinenteile, Elektroteile und Gummi erforderlich."
 barrel_factory:0 "Geschützrohrfabrik"
 barrel_factory_desc:0 "Panzer waren anfänglich kaum mehr als auf bewegliche Untersätze montierte Artillerie. Daher sind Automobile und Artillerie zur Panzerproduktion erforderlich."
 automobile_factory:0 "Automobilfabrik"
 automobile_factory_desc:0 "Zur Automobilproduktion sind Maschinenteile, Elektroteile und Gummi erforderlich."
 radio_factory:0 "Radiofabrik"
 radio_factory_desc:0 "Radiogeräte gehörten zu den ersten Massengebrauchsgütern des zwanzigstens Jahrhunderts. Für diese Geräte werden Glas und Elektroteile benötigt."
 telephone_factory:0 "Telefonfabrik"
 telephone_factory_desc:0 "Das Telefon ist ein wichtiger Durchbruch in der Kommunikationstechnologie. Glas und Elektroteile werden in dieser Fabrik gebraucht."
 electric_gear_factory:0 "Elektroteilefabrik"
 electric_gear_factory_desc:0 "Elektroteile werden mit Gummi, Kohle und Eisen produziert. Elektroteile sind wichtig für eine Reihe von Produkten, unter anderem für Automobile und Flugzeuge."
 machine_parts_factory:0 "Maschinenteilefabrik"
 synthetic_oil_factory:0 "Syntheseölfabrik"
 synthetic_oil_factory_desc:0 "Die Syntheseölfabrik produziert Öl aus Kohle. Unerlässlich für Nationen, die keinen Zugang zu Ölvorkommen haben."
 fuel_refinery:0 "Treibstoffraffinerie"
 fuel_refinery_desc:0 "Die Treibstoffraffinerie verarbeitet Öl zu Treibstoffen für Automobile."
 steamer_shipyard:0 "Dampferwerft"
 steamer_shipyard_desc:0 "Dampfer stellen eine gewaltige Verbesserung gegenüber den Klippern dar, da sie windunabhängig und größer sind und stabiler gebaut werden können. Für den Dampferbau sind Stahl und Kohle erforderlich."
 clipper_shipyard:0 "Klipperwerft"
 clipper_shipyard_desc:0 "Klipper sind einfache Handelssegler. Ihre Werften brauchen Stoff und Holz."
 steel_factory:0 "Stahlfabrik"
 steel_factory_desc:0 "Hier werden Eisen und Kohle zur Stahlproduktion eingesetzt. Stahl wird bei der Produktion Bau von Waffen, Eisenbahnschienen und einer breiten Palette anderer Gebäude und Gegenstände eingesetzt."
 artillery_factory_desc:0 "Artilleriegeschütze werden mit Stahl und Sprengstoffen produziert. Artillerie erhöht die Feuerkraft von Armeedivisionen stark."
 small_arms_factory:0 "Handfeuerwaffenfabrik"
 small_arms_factory_desc:0 "Stahl und Munition sind zur Herstellung von Handfeuerwaffen erforderlich, die die Grundausrüstung für alle neuen Divisionen darstellen."
 explosives_factory:0 "Sprengstofffabrik"
 explosives_factory_desc:0 "Mit Dünger und Munition werden Sprengstoffe hergestellt, die hauptsächlich von der Artillerie benötigt werden."
 ammunition_factory:0 "Munitionsfabrik"
 ammunition_factory_desc:0 "Hier werden viele Arten von Munition produziert. Die Voraussetzungen sind Eisen, Kohle und Schwefel."
 canned_food_factory:0 "Konservenfabrik"
 canned_food_factory_desc:0 "Eisen und Vieh sind zur Konservenproduktion erforderlich. Diese Konserven werden wegen ihrer langen Haltbarkeit hauptsächlich von den Streitkräften abgenommen."
 paper_mill:0 "Papiermühle"
 paper_mill_desc:0 "In einer Papiermühle wird Papier produziert. Papier wird zur Produktion von Büchern, Zeitungen und anderen Informationsmedien verwendet."
 dye_factory:0 "Farbstofffabrik"
 dye_factory_desc:0 "Farbstoffe konnten nicht nur auf Plantagen gewonnen, sondern auch synthetisch mit Kohle produziert werden."
 lumber_mill:0 "Sägemühle"
 lumber_mill_desc:0 "In Sägemühlen wird Holz zu Schnittholz verarbeitet, das dann für Gebäude, Papier, Schiffe oder Möbel verwendet werden kann."
 fabric_factory:0 "Stofffabrik"
 fabric_factory_desc:0 "Baumwolle wird hier zu Stoffen verarbeitet. Stoffe sind dicht gewebte Textilien und werden unter anderem für Segel und Kleidung gebraucht."
 cement_factory:0 "Betonfabrik"
 cement_factory_desc:0 "Beton ist ein Baumaterial für solide Objekte wie Festungen oder Brücken. Zur Betonproduktion ist Kohle notwendig."
 glass_factory:0 "Glashütte"
 glass_factory_desc:0 "Diese Fabrik braucht Kohle zur Glasproduktion. Glas wird hauptsächlich für Spiegeln und Fenstern verwendet."
 fertilizer_factory:0 "Düngerfabrik"
 fertilizer_factory_desc:0 "In dieser Fabrik wird Schwefel zu Dünger verarbeitet. Diese Dünger werden auf Farmen zur Produktivitätserhöhung eingesetzt."
 luxury_clothes_factory:0 "Luxuskleiderfabrik"
 luxury_clothes_factory_desc:0 "In dieser Fabrik werden normale Kleidungsstücke unter Verwendung von Seide zu Kleidung für die reichen Bevölkerungsschichten umgearbeitet."
 luxury_furniture_factory:0 "Luxusmöbelfabrik"
 luxury_furniture_factory_desc:0 "Hier werden Möbel mit Tropenhölzern in Luxusgüter verwandelt. Die fertigen Tropenmöbel werden von den reichen Bevölkerungsschichten für ihre Häuser gekauft."
 furniture_factory:0 "Möbelfabrik"
 furniture_factory_desc:0 "Möbel aus Schnittholz sind eine Notwendigkeit für jedes Heim und daher der allgemeinen Bevölkerung zugänglich."
 regular_clothes_factory:0 "Kleiderfabrik"
 regular_clothes_factory_desc:0 "Stoff und Farbstoffe sind die Voraussetzungen für diese Fabrik, in der Kleidung für die allgemeine Bevölkerung produziert werden."
 liquor_distillery:0 "Schnapsbrennerei"
 liquor_distillery_desc:0 "Schnaps ist der Alkohol für die breite Masse. Getreide dient als Rohmaterial zur Schnapsproduktion."
 winery:0 "Winzerei"
 winery_desc:0 "Wein ist ein wichtiges Statussymbol für die reichen Bevölkerungsschichten. Eine Winzerei stellt aus Früchten Wein her."
 fort:0 "Fort"
 naval_base:0 "Marinestützpunkt"
 railroad:0 "Eisenbahn"
 anarchic_bomb_throwers:0 "Anarchistische Bombenleger"
 desc_anarchic_bomb_throwers:0 "Weniger Geld für die Verbrechensbekämpfung führt zu einer verringerten Reaktionsfähigkeit auf Sicherheitsrisiken wie anarchistische Rebellionen."
 citizen_guard:0 "Bürgerwache"
 desc_citizen_guard:0 "Weniger Geld für die Verbrechensbekämpfung führt zu einer verringerten Reaktionsfähigkeit auf Sicherheitsrisiken wie Straßenbanden."
 immoral_business:0 "Unmoralische Geschäfte"
 desc_immoral_business:0 "Mit steigenden Kriminalitätsraten und weniger Regierungskontrolle werden sich Geschäftsleute vermehrt auf ihre eigenen Profite konzentrieren. Dies führt zu einem höheren Zusammenbruchsrisiko für das gesamte System, da jeder seinen persönlichen Interessen nachgeht."
 machine_politics:0 "Politikmaschinerie"
 desc_machine_politics:0 "Beim Politikmaschinerie-System ging es um Bestechungsgelder, die Politiker mit Hilfe ihres Einflusses hauptsächlich Minoritäten zukommen ließen. Innerhalb dieses Systems war es gang und gäbe, Regierungsjobs zu Bestechungszwecken auszunutzen."
 mafia:0 "Mafia"
 desc_mafia:0 "Wenn die Institutionen zur Verbrechensbekämpfung in einer Provinz überlastet sind, entwickelt sich organisiertes Verbrechen in Form einer Mafia. Solche Organisationen verringern die Produktion in der Provinz."
 rotten_boroughs:0 "Rotten Boroughs"
 desc_rotten_boroughs:0 "Das System der Rotten Boroughs schaffte so kleine Wahldistrikte, dass Wahlsiege durch Bestechung gewonnen werden konnten."
 spoil_system:0 "Verdorbenes System"
 desc_spoil_system:0 "Ohne ausreichende Kontrollinstitutionen nutzten Politiker schließlich ihre Vorrechte und ihren Einfluss, um sich persönliche Vorteile in Form von Reichtum und Ruhm zu verschaffen. Dies führt zu erhöhter Militanz der gesamten Bevölkerung in der Provinz."
 terrorist_cells:0 "Terroristenzellen"
 desc_terrorist_cells:0 "Mit weniger Sicherheitspersonal in der Provinz können Terroristen leichter in ihren Verstecken auf Gelegenheiten zum Zuschlagen warten."
 government_sanitarium:0 "Sanitarium"
 desc_government_sanitarium:0 "Die Regierung betreibt ein Sanitarium für Tuberkulosepatienten in dieser Provinz."
 academic_confusion:0 "Akademisches Durcheinander"
 academic_confusion_desc:0 "Nach einem Paradigmenwechsel in unserem Bildungsministerium ist unsere akademische Welt in einem Zustand totalen Durcheinanders. Solange dieser Effekt anhält, leiden unser Prestige und unsere Forschung darunter."
 liberal_agitation:0 "Liberale Agitation"
 desc_liberal_agitation:0 "Aufwiegler in diesen Provinzen fordern die liberale Revolution."
 springtime_of_nations:0 "Frühling der Nationen!"
 springtime_of_nations_desc:0 "Die schlummernden Nationen Europa erwachen, um die Gespenster des Despotismus und der Tyrannei zu vertreiben."
 global_liberal_agitation:0 "Liberale Agitation"
 desc_global_liberal_agitation:0 "Aufwiegler in diesen Provinzen fordern die liberale Revolution."
 potato_blight:0 "Kartoffelfäule"
 desc_potato_blight:0 "Hunger breitet sich aus, weil die Ernte tot und verfaulend auf unseren Feldern liegt."
 anti_jacobin_tract:0 "Antijakobinertrakt"
 desc_anti_jacobin_tract:0 "Ein Traktat über die Gründe von Konterrevolution, Ordnung, Religion und Monarchie ist in unserem Land in breitem Umlauf."
 cholera_epidemic_small:0 "Ausbruch der Cholera"
 desc_cholera_epidemic_small:0 "Cholera ist in dieser Provinz ausgebrochen und droht, sich weiter zu verbreiten."
 cholera_epidemic_big:0 "Choleraepidemie"
 desc_cholera_epidemic_big:0 "Cholera ist in dieser Provinz ausgebrochen und droht, sich weiter zu verbreiten."
 conservative_reaction:0 "Konservative Opposition"
 desc_conservative_reaction:0 "Die Konservativen im Parlament sind unzufrieden."
 liberal_reaction:0 "Liberale Opposition"
 desc_liberal_reaction:0 "Die Liberalen im Parlament sind unzufrieden."
 national_tragedy:0 "Nationale Tragödie"
 desc_national_tragedy:0 "Unser Nation betrauert ein weiteres Mädchen, das den Kohlefeldern zum Opfer fiel."
 western_influences:0 "Westlicher Einfluss"
 desc_western_influences:0 "Unsere Regierung verfolgt eine Politik, die westliche Einflüsse aktiv fördert."
 uncivilized_isolationism:0 "Isolationismus"
 desc_uncivilized_isolationism:0 "Unser Land hat seine Häfen und Grenzen für Ausländer geschlossen."
 western_presence:0 "Westliche Präsenz"
 desc_western_presence:0 "Eine Ausländergemeinde aus verschiedenen europäischen Ländern und Großmächten hat sich hier gebildet."
 foreign_smugglers:0 "Ausländische Schmuggler"
 desc_foreign_smugglers:0 "Ein von Ausländern geführter Schmugglerring arbeitet in dieser Provinz."
 foreign_trading_post:0 "Ausländischer Handelsposten"
 desc_foreign_trading_post:0 "Eine separate Klasse unserer Bürger, die von der allgemeinen Bevölkerung ferngehalten wird, betreibt einen Handelsposten in dieser Provinz."
 silk_famine:0 "Seidenhungersnot"
 desc_silk_famine:0 "Eine lokale Epidemie der Pébrine-Krankheit hindert lokale Seidenproduzenten daran, mit voller Kapazität zu arbeiten"
 naval_school:0 "Marineschule"
 desc_naval_school:0 "Die Handelsmarine betreibt eine Marineschule in dieser Provinz, wo sie Unterricht in Führungstum und den neuesten Flottentechnologien anbietet"
 trade_restrictions:0 "Handelsbeschränkungen"
 desc_trade_restrictions:0 "Es ist die Politik unseres Landes, gewisse Im- und Exporte zu regulieren und zu unterbinden."
 colonial_dry_spell:0 "Trockenphase"
 colonial_dry_spell_desc:0 "Diesen Sommer ist in dieser Provinz nur wenig Regen gefallen, und die Farmen leiden."
 colonial_exploitation:0 "Koloniale Ausbeutung"
 colonial_exploitation_desc:0 "Wir pressen den letzten Heller aus dieser Provinz."
 colonial_museum_of_natural_history:0 "Naturgeschichtliches Museum"
 colonial_museum_of_natural_history_desc:0 "Ein Naturgeschichtliches Museum wurde in dieser Provinz errichtet."
 colonial_mismanagement:0 "Koloniale Fehlverwaltung"
 colonial_mismanagement_desc:0 "Die geringen Summen, die wir dem Kolonialamt zuweisen (Verwaltungsausgaben), haben diese Kolonie in einen Zustand bürokratischen Verfalls sinken lassen."
 colonial_recruitment:0 "Land! Freiheit! Arbeit!"
 colonial_recruitment_desc:0 "Eine Regierungskampagne zieht Einwanderer mit Versprechungen von Land und Zukunftsgelegenheiten in die Provinz."
 baby_boom:0 "Baby-Boom"
 loyal_askaris:0 "Gurkhas, Askaris & Tirailleure"
 loyal_askaris_desc:0 "Die Menschen in dieser Provinz unterstützen unsere Regierung zum Großteil, und viele von ihnen dienen in kolonialeigenen Militärregimentern, bzw. sind gewillt, dort zu dienen."
 female_suffrage:0 "Frauenwahlrecht"
 female_suffrage_desc:0 "Unser Land gewährt Frauen denselben Rechtsstatus wie Männern sowie das Wahlrecht für Parlamentswahlen."
 labor_union:0 "Arbeitergewerkschaft"
 desc_labor_union:0 "Die Arbeiter haben sich zusammengeschlossen und eine Gewerkschaft in Ihrer Provinz gegründet."
 worker_union:0 "Arbeitergewerkschaft"
 strike_solution:0 "Streiklösung"
 desc_strike_solution:0 "Ihre Großzügigkeit hat den Streik gestoppt."
 province_strike:0 "Provinzstreik"
 desc_province_strike:0 "Die Arbeiter streiken in Ihrer Provinz."
 black_shirts:0 "Schwarzhemden"
 desc_black_shirts:0 "Schwarzhemden provozieren die Bewohner der Provinz."
 free_corps:0 "Freikorps"
 desc_free_corps:0 "Das Freikorps wurde inspiriert von den Schwarzhemden und ist eine Plage in Ihrer Provinz."
 the_massacre:0 "Das Massaker"
 desc_the_massacre:0 "Eine aus Sozialisten und Liberalen bestehende Gruppe wurde ermordet."
 fascist_welfare:0 "Faschistische Wohlfahrt"
 beer_hall_putsch:0 "Bierkellerputsch"
 local_opium_habit:0 "Opiumproblem"
 desc_local_opium_habit:0 "Unsere Untertanen in dieser Provinz konsumieren Opium in erschreckendem Maße."
 sayings_of_the_dutch:0 "Holländische Sprichwörter"
 desc_sayings_of_the_dutch:0 "Wir haben eine große Menge westlicher Literatur übersetzt und sie in unseren nationalen Wissenskanon einfließen lassen, was unsere wissenschaftliche Forschung auf neue Höhen treibt."
 european_military_mission:0 "Militärmission"
 desc_european_military_mission:0 "Eine Großmacht hat eine Militärmission in dieser Provinz eingerichtet."
 extraterritoriality_granted:0 "Extraterritorialität gewährt"
 desc_extraterritoriality_granted:0 "Unser Land hat Bürgern der Großmächte Extraterritorialität gewährt."
 military_reform:0 "Militärreform"
 desc_military_reform:0 "Wir reformieren gerade unsere Armee auf europäische Standards."
 educational_reform:0 "Bildungsreform"
 desc_educational_reform:0 "Wir haben unser Bildungssystem reformiert. Dies hilft zwar unserer Forschung, ist aber auch bei den Traditionalisten sehr unbeliebt."
 legation_quarter:0 "Legationsviertel"
 kettler_denkmal:0 "Gedenkstätte an ausländischen Diplomaten"
 desc_kettler_denkmal:0 "Diese Gedenkstätte an einen ausländischen Diplomaten dient als permanente Erinnerung an unser Volk, dass unsere Regierung mit unserer Unabhängigkeit Schindluder treibt."
 local_economic_downturn:0 "Lokale Wirtschaftskrise"
 desc_local_economic_downturn:0 "Die Provinz befindet sich in einer vorübergehenden Wirtschaftskrise, sollte sich aber innerhalb weniger Jahre wieder erholen."
 free_staters:0 "Freistaatler"
 desc_free_staters:0 "Freistaatler sind in dieser Provinz aktiv, wo sie sich darum bemühen, die Provinz als freien Staat der Union anzufügen."
 border_ruffians:0 "Border Ruffians"
 desc_border_ruffians:0 "Border Ruffians verderben die Lebensqualität der Menschen in dieser Provinz."
 underground_railroad:0 "Underground Railroad"
 desc_underground_railroad:0 "Eine Underground Railroad arbeitet in dieser Provinz"
 knights_of_the_golden_circle:0 "Knights of The Golden Circle"
 desc_knights_of_the_golden_circle:0 "Eine Geheimgesellschaft, die sich der Förderung der Sklaverei verschrieben hat, operiert in dieser Provinz."
 american_anti_slavery_society:0 "American Anti-Slavery Society"
 desc_american_anti_slavery_society:0 "Eine Gesellschaft, die sich der Abschaffung der Sklaverei verschrieben hat, operiert in dieser Provinz."
 copperhead_democrats:0 "Copperhead-Demokraten"
 desc_copperhead_democrats:0 "Pro-sezessionistische Demokraten sind in dieser Provinz aktiv"
 the_homestead_act:0 "The Idea of Panarcadianism"
 desc_the_homestead_act:0 "With the people of Arcadia fully accepting the rule of the Union, our country stands unified and glorious as never before. With peace ruling on our continent, weary citizens of the Old World look upon our country with hopes never equaled before…"
 the_homestead_act2:0 "Der Amerige Ideal"
 the_slavery_debate:0 "Die Sklaverei-Debatte"
 desc_the_slavery_debate:0 "Die Sklaverei wird in den Vereinigten Staaten heftig debattiert und das Volksbewusstsein über die Angelegenheit steigt täglich. Wenn die Liberalen im Oberhaus mindestens 30 Prozent der Stimmen haben, könnte sich der Süden sehr wohl zur Sezession entscheiden."
 blood_and_iron_mine:0 "Blut-und-Eisenmine"
 desc_blood_and_iron_mine:0 "Eine reiche, aber sehr schwierig und gefährlich abzubauende Eisenerzader wird in dieser Provinz abgebaut."
 libertine_culture:0 "Freizügige Kultur"
 desc_libertine_culture:0 "Unsere Nation hat einen freizügigen Ansatz zum Gebrauch von Alkohol. Heute blau und morgen blau, und übermorgen wieder."
 temperance_league:0 "Abstinenzlerliga"
 desc_temperance_league:0 "Unsere Nation hat eine starke und prominente Abstinenzlerliga mit viel Einfluss selbst auf Regierungskreise."
 beer_halls:0 "Bierschänke"
 desc_beer_halls:0 "Diese Provinz hat eine Bierschänke, einen Saloon oder eine Bar für jede Gelegenheit, und die Bewohner verbringen viel Zeit in ihnen."
 destitution_and_poverty:0 "Armut & Verzweiflung"
 desc_destitution_and_poverty:0 "Alkoholmissbrauch wird immer mehr zu einem großen sozialen Problem in dieser Provinz."
 liquor_prohibition:0 "Alkoholprohibition"
 desc_liquor_prohibition:0 "Verkauf, Besitz und Genuss von Alkohol sind in unserem Land verboten."
 minority_building_restrictions:0 "Baubeschränkungen für Minderheiten"
 desc_minority_building_restrictions:0 "Unser Land hat Gesetze, die Minderheiten den Bau permanenter Gebäude selbst auf ihrem eigenen Land untersagen."
 dryzymalas_wagon:0 "Dryzymalas Kutschwagen"
 desc_dryzymalas_wagon:0 "Der alte Dryzymala unterläuft diese Gesetze, indem er in einem Kutschwagen lebt."
 discriminatory_school_system:0 "Diskriminierendes Schulsystem"
 desc_discriminatory_school_system:0 "Unser Schulssystem diskriminiert Bürger, die einer anderen Kultur als der Nationalkultur angehören."
 flying_university:0 "Fliegende Universität"
 desc_flying_university:0 "Eine Untergrundorganisation bietet höhere Bildung in einer Minderheitensprache an."
 organic_work:0 "Organische Arbeit"
 desc_organic_work:0 "In dieser Provinz operiert eine Widerstandsbewegung."
 egyptian_excavations:0 "Ägyptische Ausgrabungen"
 egyptian_excavations_desc:0 "Unser Land führt die archäologischen Ausgrabungen im Tal der Könige."
 trek_boers:0 "Treck-Buren"
 desc_trek_boers:0 "Buren aus der Kapkolonie wandern in diese Provinz ein. Ein kleines Rinnsal im großen Fluss', der einst als der 'Große Treck' bekannt wird."
 gold_rush:0 "Goldrausch"
 desc_gold_rush:0 "Diese Provinz floriert, weil Gold gefunden wurde."
 witwatersrand_gold_rush:0 "Witwatersrand-Goldrausch"
 desc_witwatersrand_gold_rush:0 "Ein Goldrausch im Witwatersrand macht uns international bekannt."
 local_tractors:0 "Traktoren"
 desc_local_tractors:0 "Mechanisierte Agrikultur ist in dieser Provinz in Form von Traktoren eingetroffen, was die Effizienz der lokalen Bauern erhöht und ihre Arbeitsintensität verringert."
 local_electricity:0 "Elektrisches Licht"
 desc_local_electricity:0 "Elektrische Straßenbeleuchtung wurde in dieser Provinz installiert, was die Effizienz der gesamten lokalen Produktion steigert, da die Arbeiter in neuer und gut beleuchteter Umgebung ihr Werk verrichten."
 local_nitroglycerin:0 "Nitroglyzerin"
 desc_local_nitroglycerin:0 "Wissen um moderne Sprengstoffe hat sich in diese Provinz ausbegreitet und hilft bei den lokalen Bergbauunternehmungen."
 local_distribution_channels:0 "Kommerzielle Einzelhändler"
 desc_local_distribution_channels:0 "Neue und effiziente Modi und Strukturen zum Kauf und Verkauf von Gütern wurden in dieser Provinz eingeführt, was den Bauern mehr Zeit zur Bearbeitung ihrer Felder lässt."
 local_machine_tools:0 "Mechanisierter Bergbau"
 desc_local_machine_tools:0 "Der Bergbau in dieser Provinz wird mit neuen und mechanisierten Werkzeugen ausgeführt, was seine Effizienz steigert."
 pandemic_influenza:0 "Influenzaepidemie"
 desc_pandemic_influenza:0 "Eine Influenzaepidemie ist in unserem Land ausgebrochen und hat Tausende von Opfern gefordert. Wir können nur hoffen, dass sie auch unsere Feinde erreicht."
 trustee_system:0 "Das Treuhändersystem"
 trustee_system_desc:0 "Insassen überwachen ihre Mitinsassen in den Gefängnissen dieses Staates, und die Produktion ist deswegen angestiegen."
 penal_colonies:0 "Strafkolonien"
 penal_colonies_desc:0 "Um unser Reich herum verstreut liegen mehrere Strafkolonien verschiedener Größen und Ausführungen, in die wir unsere schlimmsten Verbrecher verbannen."
 stock_market_crash:0 "Börsencrash"
 stock_market_crash_desc:0 "Unser Land leidet unter den Auswirkungen eines Börsencrashs."
 great_depression:0 "Große Depression"
 central_bank_established:0 "Zentralbank"
 central_bank_established_desc:0 "Die Zentralbank unserer Regierung behält sich ein striktes Notenprivileg vor."
 local_stock_exchange:0 "Börse"
 local_stock_exchange_desc:0 "In dieser Provinz gibt es eine lokale Börse, die die lokale Produktionsleistung steigert."
 economic_boom:0 "Wirtschaftsboom"
 economic_boom_desc:0 "Dank unseren Investmentbanken und eine langen Zeitspanne mit geringer Arbeitslosigkeit boomt unsere Wirtschaft."
 building_suez_canal:0 "Building the Suez Canal"
 building_suez_canal_desc:0 "The Suez Canal is currently under construction. After each completed phase an event will fire to keep you informed of the progress. Construction will take approximately 10 years."
 building_suez_canal_revolt:0 "Worker revolt at the Suez Canal"
 building_suez_canal_revolt_desc:0 "Construction off the Suez Canal has halted until the revolt is over."
 suez_canal:0 "Suez Canal"
 suez_canal_treaty:0 "Suez Canal Treaty"
 suez_canal_treaty_desc:0 "In $YEAR$ the Suez Canal Treaty was signed exchanging canal rights for a financial reimbursement of 10,0,000 plus an annuity of 250,000."
 building_panama_canal:0 "Building the Andagoya Canal"
 building_panama_canal_desc:0 "The Andagoya Canal is currently under construction. After each completed phase an event will fire to keep you informed of the progress. Construction will take approximately 12.5 years."
 panama_canal:0 "Andagoya Canal"
 panama_canal_treaty:0 "Hay-Bunau-Varilla treaty"
 panama_canal_treaty_desc:0 "The Hay-Bunau-Varilla treaty was an agreement between the USA and the Andagoya granting exclusive canal rights to the USA across the isthmus of Andagoya in exchange for a financial reimbursement of 10,0,000 plus an annuity of 250,000."
 building_panama_canal_scandal:0 "Andagoya Canal Scandal"
 building_panama_canal_scandal_desc:0 "Until the memory of the disastrous construction attempt of the Andagoya Canal has faded enough we can't resume construction."
 building_kiel_canal:0 "Building the Kiel Canal"
 building_kiel_canal_desc:0 "The Kiel Canal is currently under construction. After each completed phase an event will fire to keep you informed of the progress. Construction will take approximately 8 years."
 kiel_canal:0 "Kiel Canal"
 military_goods:0 "Militärgüter"
 ammunition:0 "Munition"
 small_arms:0 "Handfeuerwaffen"
 artillery:0 "Artillerie"
 canned_food:0 "Konserven"
 barrels:0 "Geschützrohre"
 aeroplanes:0 "Flugzeuge"
 raw_material_goods:0 "Rohmaterialen"
