 GC_DESC:0 "Ever since the end of the Great German War, the ideals of freedom and nationhood cherished by the German rebels seem buried. In England, Holland or Brandenburg, the authority of foreign kings is uncontested. But the calm over Europe since the end of the war is an illusion: throughout the continent, the beginnings of industrialisation, the spread of new knowledge and a growing discontent amongst the population hints at changes to come. In America, young powers are emerging to challenge those in the old world, and in supposedly sleeping Asia, old nations are reinventing themselves..."
 REMOVE_GC_DESC:0 "Prinzessin Victoria ist 16 Jahre alt und wird bald den Thron Großbritanniens besteigen. Seit Äonen feststehende Konzepte sind dabei, zu kollabieren, und eine neue Ordnung wird an ihrer Stelle aus der Asche steigen. Eine industrielle Revolution hat schon begonnen, mit sozialen und ökonomischen Umwälzungen, die der Kriegsführung neue Schrecken und Barbareien anfügen werden"
