l_english:
 dod_mid.1.t:0 "Our Claim to Sibir"
 dod_mid.1.d:0 "The Khanate of Sibir was the last true remnant of the Golden Horde, surviving only because Moscow and its neighbours were forever at war. Its lands beyond the Urals are ours to take."
 dod_mid.1.f:0 "Our Claim to Sibir"
 dod_mid.1.a:0 "To the East, brothers."
 dod_mid.2.t:0 "The Druze Revolt"
 dod_mid.2.d:0 "Since the peasants' revolt of 1834 the Druze nobles have resented every overseer sent to them. Their overlords call them heretics and treat them as such, and now the mountains are in arms."
 dod_mid.2.f:0 "The Druze Revolt"
 dod_mid.2.a:0 "Stop this revolt by any means necessary."
 dod_mid.3.t:0 "Ancient Ruins in Baalbeck"
 dod_mid.3.d:0 "Travellers in the hills around Baalbeck have found a great number of Roman ruins, preserved by the dry air. Scholars across Europe are writing about them."
 dod_mid.3.f:0 "Ancient Ruins in Baalbeck"
 dod_mid.3.a:0 "Great!"
 dod_mid.4.t:0 "Missionaries in Beirut"
 dod_mid.4.d:0 "Western missionaries have opened schools and printing presses in Beirut, serving the many faiths of Lebanon. The city is becoming a centre of learning."
 dod_mid.4.f:0 "Missionaries in Beirut"
 dod_mid.4.a:0 "Great!"
 dod_mid.5.t:0 "Punjab in Open Revolt!"
 dod_mid.5.d:0 "The Punjabis have risen against our rule and rallied around the son of Ranjit Singh, who has entered Lahore in triumph. We must act fast or our Indian ambitions end here."
 dod_mid.5.f:0 "Punjab in Open Revolt!"
 dod_mid.5.a:0 "Damn the Punjabis!"
 dod_restore_the_rashidis:0 "Restore the House of Rashid"
 dod_restore_the_rashidis_desc:0 "In the wars of the early century the Saudis and their allies sought to unite Arabia. The Al Rashid rallied the north against them. Now their throne can be restored."
 dod_unite_arabia:0 "Establish the Greater Arabian Caliphate"
 dod_unite_arabia_desc:0 "We have subdued every other Arabian ruler and expelled the foreigners from their courts. Let our dynasty rule the Holy Lands for a thousand years."
 dod_declare_permanent_jihad:0 "Declare Permanent Jihad"
 dod_declare_permanent_jihad_desc:0 "With the Holy Cities and most of the faithful united under one flag, we can renew the old idea of the jihad. The infidels may not like it, but our path is righteous."
 dod_letat_cest_moi:0 "L'Etat C'est Moi!"
 dod_letat_cest_moi_desc:0 "Our actions have reduced the nobility's hold on government. The Shah's rule over the country is now undisputed."
 dod_sedentarise_the_khanate:0 "Sedentarise the Khanate"
 dod_sedentarise_the_khanate_desc:0 "For millennia the great nomad empires rose and fell under the same blueprint. To survive the modern age, the Khanate must settle its people."
