 dod_east.1.t:0 "The Benevolent Phoenix"
 dod_east.1.d:0 "The Renfenghuang Emperor, the Benevolent Phoenix of Tungning, proclaims himself the one true heir of the Ming. In Nanjing, the old capital of the first and Southern Ming, a regency of Jiangsu notables still rules in another's name. The Emperor means to end it."
 dod_east.1.f:0 "One Emperor under Heaven."
 dod_east.1.a:0 "March on Nanjing!"
 dod_east.1.b:0 "Strengthen ourselves first."
 dod_east.2.t:0 "Victory in Nanjing!"
 dod_east.2.d:0 "The Regency of Nanjing has been vanquished. Its leaders have been killed or forced to kowtow before the one true Emperor, who can now pursue his Self-Strengthening reforms without opposition."
 dod_east.2.f:0 "The Phoenix triumphs."
 dod_east.2.a:0 "Long live the Emperor!"
 dod_east.3.t:0 "The Defeat of the Phoenix Emperor"
 dod_east.3.d:0 "The Phoenix Emperor's campaign has been crushed by our armies. The Regency of Jiangsu, founded by the great men of the province after the fall of the Southern Ming, has defended its independence."
 dod_east.3.f:0 "Jiangsu endures."
 dod_east.3.a:0 "The Regency endures!"
 dod_east.10.t:0 "The Joseon Restoration"
 dod_east.10.d:0 "Korean nobles have taken advantage of the unrest at home to restore the Joseon dynasty and proclaim it the only rightful ruler of Korea. With local support, they have seized control of the peninsula."
 dod_east.10.f:0 "Korea rises."
 dod_east.10.a:0 "Reconquer Korea!"
 dod_east.10.b:0 "Enforce a peace and let Korea go."
 dod_east.20.t:0 "The Cossack Baron"
 dod_east.20.d:0 "Roman Stroganov-Romanov is a strange man who has found his home in the open steppe, riding with a falcon on his wrist. His skill in our recent campaigns has won the respect of the kurultai, despite his foreign birth. He asks for a place at the Khan's side."
 dod_east.20.f:0 "A Russian among the Oirat."
 dod_east.20.a:0 "Make him a minister."
 dod_east.20.b:0 "Send him away."
 dod_east.21.t:0 "The Asiatic Legions"
 dod_east.21.d:0 "Minister Stroganov-Romanov wants to raise 'Asiatic Legions' with professional officers trained in mixed European and Chinese tactics. Our traditional warrior elite refuses to serve under them."
 dod_east.21.f:0 "Modern legions, or the old horde?"
 dod_east.21.a:0 "Raise the Legions."
 dod_east.21.b:0 "The horde needs no reform."
 dod_east.22.t:0 "The Mad Baron"
 dod_east.22.d:0 "Spurned at court, Stroganov-Romanov has gone mad in the steppe. He has gathered a whole corps of cavalry, declared that he will build a Great Empire to purge Europe, and ridden against the Khan of Mongolia."
 dod_east.22.f:0 "The steppe madness."
 dod_east.22.a:0 "Disown the madman."
 dod_east.22.b:0 "If he wins, Mongolia is ours."
 dod_east.30.t:0 "A Japanese Request"
 dod_east.30.d:0 "A caravan from Japan has brought a letter from the Emperor. He asks us to protect a group of Buddhist monks who wish to reach Tibet without crossing war-torn China."
 dod_east.30.f:0 "Pilgrims to Lhasa."
 dod_east.30.a:0 "Escort the monks to Lhasa."
 dod_east.30.b:0 "We cannot spare the riders."
 dod_east.31.t:0 "A Japanese Lama"
 dod_east.31.d:0 "A caravan from Urumqi has brought Japanese monks to study our sacred texts. Their leader, Kawaguchi, has already won the favour of the Dalai Lama, who calls him one of the wisest monks he has ever met."
 dod_east.31.f:0 "A friend from the east."
 dod_east.31.a:0 "Welcome them."
 dod_east.32.t:0 "Operation Tsunami"
 dod_east.32.d:0 "The steppe is hard to rule: far from the Home Islands, empty, and rich only in resources. Better to rule it through friendly regimes. The Dzungar Khanate would make a fine protectorate of our glorious nation."
 dod_east.32.f:0 "A friendly regime in Urumqi."
 dod_east.32.a:0 "Launch Operation Tsunami."
 dod_east.32.b:0 "The steppe is not worth it."
