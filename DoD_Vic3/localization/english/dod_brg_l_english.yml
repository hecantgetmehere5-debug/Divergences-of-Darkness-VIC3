l_english:
 dod_integrate_provencal:0 "Integration of the Provencaux"
 dod_integrate_provencal_desc:0 "Occitania has always been the hardest of our continental lands to rule. With the Anglois ideal accepted, we can finally win over the Provencaux."
 dod_integrate_irish:0 "The Kingdom of Ireland"
 dod_integrate_irish_desc:0 "The King has been Lord of Ireland since the submission of the Irish lords, a title most Irish reject. Crowning him King in Ireland would make the Irish an integral part of the realm."
 dod_integrate_scottish:0 "Integrating Scotland"
 dod_integrate_scottish_desc:0 "Our hold on Scotland is recent, and the Scots doubt we are their rightful brethren. With the Anglois dream spreading through the Lowlands and Highlands, it may finally be possible to win them over."
 dod_integrate_basque:0 "Integration of the Basques"
 dod_integrate_basque_desc:0 "We can work with the Basque people and make them an integral part of the realm."
 dod_reclaim_england:0 "Reclaim England!"
 dod_reclaim_england_desc:0 "An independent English state is an insult to our unity. Let us reclaim what is rightfully ours."
 dod_reclaim_occitania:0 "Reclaim Occitania!"
 dod_reclaim_occitania_desc:0 "An independent Occitan state is an insult to our unity. Let us reclaim what is rightfully ours."
 dod_reclaim_ireland:0 "Reclaim Ireland"
 dod_reclaim_ireland_desc:0 "Ireland was lost, but with our power firmly established in the isles we can reclaim what was once ours."
 dod_act_of_union:0 "Pass the Act of Union"
 dod_act_of_union_desc:0 "Uniting England, Wales, Scotland and Ireland is the final step in forging a British Commonwealth. Protected by the sea on every side, we could rule the waves. Rule, Britannia!"
 dod_beornia_claim_england:0 "England to the English"
 dod_beornia_claim_england_desc:0 "We began as refugees without resources in a foreign land; today we are a Great Power. We can now challenge the French tyrants who drove us out, and work to reconquer our homeland."
 dod_beornia_eternal_england:0 "Eternal England"
 dod_beornia_eternal_england_desc:0 "Driven from green England by the Norman invaders centuries ago, we have fulfilled our fathers' dream: England is ours once more! Mutually exclusive with proclaiming the Holy Britannian Empire."
 dod_beornia_holy_britannia:0 "Proclaim the Holy Britannian Empire"
 dod_beornia_holy_britannia_desc:0 "Instead of dreaming of the lands we left centuries ago, we must focus on our new home, Ameriga. Let us forge an empire yet unseen! Mutually exclusive with reclaiming England."
 dod_batavia_claim_netherlands:0 "The Netherlands to the Dutch"
 dod_batavia_claim_netherlands_desc:0 "We began as refugees in a foreign land; today we are a Great Power. We can now challenge the Burgundian tyrants who drove us out, and work to free our homeland."
 dod_batavia_free_state:0 "The Free State of the Netherlands"
 dod_batavia_free_state_desc:0 "Our pioneers set out decades ago to found a free Dutch state in Africa. We have done far more: we have freed our brothers from Burgundian rule. Today we proclaim the Free State of the Netherlands!"
 dod_burgundy_rhineland:0 "Integration of the Rhineland"
 dod_burgundy_rhineland_desc:0 "The Rhine has been Burgundy's border since the conquests of Charles the Bold. The Rhinelanders were never as close to the Crown as the Dutch, but it is time to make them full members of the realm."
 dod_fall_of_burgundy:0 "Fall of Burgundy"
 dod_fall_of_burgundy_desc:0 "We no longer hold any of our European heartland. Perhaps it is time to admit defeat, give up the name of Burgundy and build a new nation at the Cape."
 dod_abolish_selon:0 "Abolish the Treaty of Selon"
 dod_abolish_selon_desc:0 "The Treaty of Selon has governed relations between the European empires and the native states of the East Indies for over a century. It has reached the end of its useful life."
 dod_anglois_censorship:0 "Anglois Censorship"
 dod_anglois_censorship_desc:0 "The Crown has banned nationalist societies."
 dod_anglois_dream_broken:0 "The Anglois Dream Broken"
 dod_anglois_dream_broken_desc:0 "Our claim to rule both France and England has been shattered."
 dod_angevin_legacy_ends:0 "End of the Angevin Legacy"
 dod_angevin_legacy_ends_desc:0 "Where the Plantagenets ruled, new nations have arisen."
 dod_realm_pacified:0 "Realm Pacified"
 dod_realm_pacified_desc:0 "The revolutionaries have been defeated."
 dod_crown_prevails:0 "The Crown Prevails"
 dod_crown_prevails_desc:0 "The Plantagenet Crown has won the loyalty of its peoples."
 dod_selon_abolished:0 "Selon Treaty Abolished"
 dod_selon_abolished_desc:0 "Nothing restrains European expansion in the East anymore."
 dod_act_of_union_mod:0 "Act of Union"
 dod_act_of_union_mod_desc:0 "The British isles are united under one Crown."
 dod_brg.1.t:0 "A Savoyard Opportunity"
 dod_brg.1.d:0 "For a long time we have coveted the Alpine passes held by the Duke of Savoy. The Dual Monarchy is busy with its own troubles and is in no position to protect the Duke."
 dod_brg.1.f:0 "The Alps are within reach."
 dod_brg.1.a:0 "We will claim Savoy!"
 dod_brg.1.b:0 "It is too risky."
 dod_brg.2.t:0 "Ultimatum from Antwerp"
 dod_brg.2.d:0 "Burgundy demands that we place our Alpine lands under its protection, to be joined to its Duchy of Geneva. With the Dual Monarchy facing unrest at home, we cannot count on Paris to defend us."
 dod_brg.2.f:0 "Bow to Antwerp, or fight?"
 dod_brg.2.a:0 "We will not surrender our ancestral lands!"
 dod_brg.2.b:0 "We will not risk a war against Burgundy..."
 dod_brg.3.t:0 "The Savoyard Answer"
 dod_brg.3.d:0 "The Duke of Savoy has refused. Only war will settle the question of the Alps."
 dod_brg.3.f:0 "We will take it then!"
 dod_brg.3.a:0 "We will take it then!"
 dod_brg.3.b:0 "Let it go."
 dod_brg.5.t:0 "The Treaty of Selon Abolished"
 dod_brg.5.d_spain:0 "The Treaty of Selon, signed in the eighteenth century by Burgundy, Spain, the Dual Monarchy and Scandinavia, guaranteed the peaceful, trade-oriented development of European power in the Far East, and above all protected our monopoly. The other powers ignored it more and more, and now it is gone. The race for the East has begun."
 dod_brg.5.d_other:0 "The Treaty of Selon, which for a century kept the European powers from waging wars of expansion in the East Indies, is no more. Burgundy, Scandinavia and the Dual Monarchy had chafed against it for decades; now nothing stands between them and the riches of the East."
 dod_brg.5.f:0 "The East is open."
 dod_brg.5.a:0 "We must protect our trade with the East!"
