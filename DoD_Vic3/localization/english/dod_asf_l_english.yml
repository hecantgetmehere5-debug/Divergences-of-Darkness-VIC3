 dod_asf.1.t:0 "The Treasure Fleets"
 dod_asf.1.d:0 "Where other dynasties turned inward, the Ming of this world sent Zheng He's treasure fleets ever further, to Zhourao and to the far side of the ocean. Old charts from those voyages have been found in a temple archive, and scholars argue over what they mean."
 dod_asf.1.f:0 "The ocean was once ours."
 dod_asf.1.a:0 "Fund a new survey of the seas."
 dod_asf.1.b:0 "The past is past."
 dod_asf.2.t:0 "The Regency of Nanjing"
 dod_asf.2.d:0 "In Nanjing, the regents who rule in the young Emperor's name quarrel over who will hold the seal when he comes of age."
 dod_asf.2.f:0 "Whose hand holds the seal?"
 dod_asf.2.a:0 "Support the senior regent."
 dod_asf.2.b:0 "Let the Emperor rule early."
 dod_asf.3.t:0 "The Heavenly Kingdom"
 dod_asf.3.d:0 "The preachers of the Taiping Heavenly Kingdom proclaim a new faith and a new order, and peasants flock to their banners from every province of the south."
 dod_asf.3.f:0 "Heaven on earth?"
 dod_asf.3.a:0 "Spread the word of the Heavenly King."
 dod_asf.3.b:0 "Temper the preachers."
 dod_asf.4.t:0 "The Tungning Merchants"
 dod_asf.4.d:0 "The merchant houses of Tungning trade with Burgundians, Scandinavians and Japanese alike, and grow rich on it. The court frets that the Europeans want more than trade."
 dod_asf.4.f:0 "Profit, or danger?"
 dod_asf.4.a:0 "Open more ports."
 dod_asf.4.b:0 "Keep the barbarians at arm's length."
 dod_asf.10.t:0 "Firearms of the Sengoku"
 dod_asf.10.d:0 "Since Burgundian traders brought the first guns to Japan in 1502, the long wars of the Sengoku made Japanese gunsmiths the finest in Asia. Some say there were once more guns in Japan than in all of Europe."
 dod_asf.10.f:0 "The way of the gun."
 dod_asf.10.a:0 "Revive the old gunsmith guilds."
 dod_asf.11.t:0 "Korea under Japan"
 dod_asf.11.d:0 "Korea has been under Japanese rule since 1668. Korean scholars petition for the restoration of the old Joseon courts and examinations."
 dod_asf.11.f:0 "The Hermit Kingdom remembers."
 dod_asf.11.a:0 "Grant the scholars their courts."
 dod_asf.11.b:0 "Korea is Japanese."
 dod_asf.12.t:0 "The Ainu Protectorate"
 dod_asf.12.d:0 "The Ainu of northern Hokkaido have been under Japanese protection since 1668. Settlers now press into their hunting grounds."
 dod_asf.12.f:0 "The people of the north."
 dod_asf.12.a:0 "Protect the Ainu lands."
 dod_asf.12.b:0 "Let the settlers in."
 dod_asf.13.t:0 "The Daimyo of the South"
 dod_asf.13.d:0 "The great southern clans of Satsuma, Choshu and Tosa still remember the Sengoku, when they answered to no one. Their envoys in the capital are insolent."
 dod_asf.13.f:0 "Old clans, old pride."
 dod_asf.13.a:0 "Remind them who rules."
 dod_asf.13.b:0 "Flatter them with honours."
 dod_asf.20.t:0 "The Legacy of Akbar"
 dod_asf.20.d:0 "Akbar the Great conquered Bengal and ruled a realm of many faiths. His heirs debate whether his tolerance was wisdom or weakness."
 dod_asf.20.f:0 "Sulh-i-kul: peace with all."
 dod_asf.20.a:0 "Follow Akbar's tolerance."
 dod_asf.20.b:0 "The faith must come first."
 dod_asf.21.t:0 "The Glory of Vijayanagar"
 dod_asf.21.d:0 "The empire of Vijayanagar, which in another world fell to the Deccan sultans, endures. Hampi's temples still ring with festival drums."
 dod_asf.21.f:0 "The City of Victory."
 dod_asf.21.a:0 "Hold a great festival at Hampi."
 dod_asf.22.t:0 "The Nasirid Sultans"
 dod_asf.22.d:0 "The Nasirid Sultans of Bengal have grown rich through good relations with the Anglo-French of Ceylon. Some nobles say the friendship has become dependence."
 dod_asf.22.f:0 "Friends, or masters?"
 dod_asf.22.a:0 "Trade is trade."
 dod_asf.22.b:0 "Seek new partners."
 dod_asf.23.t:0 "The Crown Colony of Ceylon"
 dod_asf.23.d:0 "Ceylon has been an Anglo-French crown colony since the Kandy Wars. The colonial governor writes that the old Kandyan nobles are restless."
 dod_asf.23.f:0 "The pearl of the Indian Ocean."
 dod_asf.23.a:0 "Win over the nobles."
 dod_asf.23.b:0 "Rule firmly."
 dod_asf.30.t:0 "The Spice Islands"
 dod_asf.30.d:0 "Burgundian and Scandinavian merchants compete for the spice trade of the Moluccas and Malacca, as they have since the sixteenth century."
 dod_asf.30.f:0 "Cloves and nutmeg."
 dod_asf.30.a:0 "Press our merchants' interests."
 dod_asf.30.b:0 "There is enough for all."
 dod_asf.31.t:0 "Christiania"
 dod_asf.31.d:0 "The old Tondolese Kingdom was renamed Christiania in honour of King Christian II. Filipino nobles still use the old name among themselves."
 dod_asf.31.f:0 "Tondo, or Christiania?"
 dod_asf.31.a:0 "Christiania it is."
 dod_asf.31.b:0 "Allow the old name in local use."
 dod_asf.32.t:0 "Zhourao Superiority"
 dod_asf.32.d:0 "In Zhourao, settled by Ming explorers four centuries ago, some officials preach that the colonists are destined to rule the whole southern continent and all the islands around it."
 dod_asf.32.f:0 "Destiny of the south."
 dod_asf.32.a:0 "Embrace the doctrine."
 dod_asf.32.b:0 "Reject such arrogance."
 dod_asf.33.t:0 "The Lanfang Kongsi"
 dod_asf.33.d:0 "The Lanfang Republic, founded by Hakka miners in Borneo, governs itself through its kongsi assembly, a republic in all but name."
 dod_asf.33.f:0 "A republic of miners."
 dod_asf.33.a:0 "Long live the kongsi!"
 dod_asf.34.t:0 "The Treaty of Selon"
 dod_asf.34.d:0 "The old Treaty of Selon has kept the European powers from waging open war for land in the East for a century. Local rulers rely on it more than they would admit."
 dod_asf.34.f:0 "A fragile shield."
 dod_asf.34.a:0 "Honour the Treaty."
 dod_asf.40.t:0 "The Last Khanate"
 dod_asf.40.d:0 "The Dzungar Khanate is the last great power of the steppe, heir of Chagatai and Genghis. Its nobles debate whether to remain riders or to build cities."
 dod_asf.40.f:0 "Riders, or builders?"
 dod_asf.40.a:0 "We remain the horde."
 dod_asf.40.b:0 "Build cities and schools."
 dod_asf.41.t:0 "The Karlani Shahdom"
 dod_asf.41.d:0 "The Karlani Shahs of Afghanistan rule from Kabul over proud tribes who obey only when it suits them."
 dod_asf.41.f:0 "The tribes of the mountains."
 dod_asf.41.a:0 "Win the tribes with gold."
 dod_asf.41.b:0 "Win them with steel."
