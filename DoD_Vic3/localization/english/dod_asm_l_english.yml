l_english:
 dod_asm.1.t:0 "Batavia is Lost"
 dod_asm.1.d:0 "We have failed to regain our concession in Batavia. Our inability to subdue the Sultanate of Java has made us the laughing stock of Europe."
 dod_asm.1.f:0 "Batavia is Lost"
 dod_asm.1.a:0 "A great humiliation for Burgundy!"
 dod_asm.2.t:0 "The Council of Granada"
 dod_asm.2.d:0 "With the fate of Gran Colombia decided, emissaries from the southern states met to form a new country. The Federation of Granada is the result."
 dod_asm.2.f:0 "The Council of Granada"
 dod_asm.2.a:0 "Let them have what they want."
 dod_form_china_manchu:0 "Complete the Conquest"
 dod_form_china_manchu_desc:0 "The Qing who united our lands invaded China under the Kangxi Emperor, but the Ming resisted in the south. Now we have finished what he began."
 dod_form_china_claimant:0 "Claim the Mandate of Heaven"
 dod_form_china_claimant_desc:0 "After centuries of war since the Manchu invasion we have brought unity back to China. It is time to claim the Mandate of Heaven for good."
 dod_form_china_yuan:0 "Resurrect the Yuan Empire"
 dod_form_china_yuan_desc:0 "The Mongol Empire of Genghis Khan was divided among his sons. One branch once ruled China. Now the Yuan can rise again."
 dod_form_china_return:0 "Return Home"
 dod_form_china_return_desc:0 "After centuries of isolation across the sea, we have returned to bring unity to our motherland. Let the capital move back to the mainland."
 dod_form_china_tibet:0 "Become the Lord of Heaven"
 dod_form_china_tibet_desc:0 "Centuries ago our kings led great invasions into a fractured China. We have finished what they started."
 dod_treaty_of_batavia:0 "The Treaty of Batavia"
 dod_treaty_of_batavia_desc:0 "Batavia is in our hands. Now we can sit down with our former colonial masters and make them recognise it as Javanese."
 dod_goa_treaty:0 "Treaty with Spain over Goa"
 dod_goa_treaty_desc:0 "We no longer need the colonial ports of the European powers. Spain could be asked to give up its claims on the coast."
 dod_masulipatnam_treaty:0 "Treaty with Burgundy over Masulipatnam"
 dod_masulipatnam_treaty_desc:0 "We no longer need the colonial ports of the European powers. Burgundy could be asked to give up Masulipatnam."
 dod_native_protection_act:0 "The Natives' Status: The Protection Act"
 dod_native_protection_act_desc:0 "The natives have been pushed to the edge of our society and grow more militant. A Protection Act would set aside lands and rights for them."
 dod_native_integration_act:0 "The Natives' Status: The Integration Act"
 dod_native_integration_act_desc:0 "If a native becomes one of us and assimilates, he should be treated as an equal. An Integration Act would make that the law."
 dod_native_suppression_act:0 "The Natives' Status: The Suppression Act"
 dod_native_suppression_act_desc:0 "Some in the government call for the natives to be driven from the land altogether."
 dod_rohnnst_question:0 "The Rohnnst"
 dod_rohnnst_question_desc:0 "When the Cree mixed with the Chinese of Qingqiu and the Vinlandic Scandinavians, a new people was born: the Rohnnst. They trade with us and have formed a proto-state of their own."
 dod_greater_euskadia:0 "Greater Euskadia"
 dod_greater_euskadia_desc:0 "To keep our place on the Bay of Biscay we must extend our lands to the north."
 dod_clm_controlled_dissolution:0 "The Controlled Dissolution of Gran Colombia"
 dod_clm_controlled_dissolution_desc:0 "Gran Colombia cannot hold together. Rather than let it be torn apart, the Congress can divide it peacefully: Mexico, Granada and Quito would each go their own way."
