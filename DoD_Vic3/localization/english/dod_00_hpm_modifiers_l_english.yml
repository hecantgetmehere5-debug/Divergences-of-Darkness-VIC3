l_english:
 smithian_school:0 "Smithianism"
 smithian_school_desc:0 "'Laissez-faire philosophies, such as minimizing the role of government intervention and taxation in the free markets, and the idea that an 'invisible hand' guides supply and demand are among the key ideas Adam Smith's writing is responsible for promoting. Our trade policies are largely inspired by him.'"
 french_liberal_school:0 "Orthodox Liberal School"
 french_liberal_school_desc:0 "The Orthodox school of economic thought, also known as the French Liberal School or Oprtimist School, voraciously defends free trade and laissez-faire capitalism. They are the primary opponents of collectivist, interventionist and protectionist ideas.  Our trade policies are largely inspired by this school."
 no_trade_policy_set:0 "No Set Trade Policy"
 no_trade_policy_set_desc:0 "Our government doesn't have a set trade policy and prefers to make snap decisions on tariffs."
 mercantilism:0 "Mercantilism"
 mercantilism_desc:0 "Mercantilism is a type of policy designed to maximize the trade of a nation and especially to maximize the accumulation of gold and silver. It promotes governmental regulation of a nation's economy for the purpose of augmenting state power at the expense of rival national powers."
 economic_nationalism:0 "Economic Nationalism"
 economic_nationalism_desc:0 "The aim of this policy is to have a country that is economically independent and nationally self-sufficient. It favors policies that emphasize domestic control of the economy, labor, and capital formation, even if this requires the heavy imposition of tariffs and other restrictions on the movement of labor, goods and capital."
 polish_uprising_mobilization:0 "Polish Uprising"
 polish_uprising_mobilization_desc:0 "We are mobilizing our society so Poland can be free once more."
 war_propaganda:0 "War Propaganda"
 war_propaganda_desc:0 "Our country is currently undertaking a massive propaganda campaign, pushing the people to support our war policies."
 government_propaganda:0 "Government Propaganda"
 government_propaganda_desc:0 "Our country is currently undertaking a massive propaganda campaign, pushing the people to support our government policies."
 credit_risk:0 "High Credit Risk"
 credit_risk_desc:0 "Revolts, wars or general instability, our country is too much of a risk for other countries to lend money to us."
 sound_dues:0 "Sound Dues Toll"
 sound_dues_toll:0 "Sound Dues Toll"
 unrecognized_country:0 "Unrecognized Country"
 unrecognized_country_desc:0 "As a young rebellious country, no one recognizes our right to self rule."
 monthly_payment_made:0 "Monthly Payment"
 monthly_payment_made_desc:0 "We already contributed to our overlord's coffers this month."
 using_foreign_ships:0 "Uses Imported Ships"
 using_foreign_shipyards:0 "Uses Western Shipyards"
 using_foreign_weapons:0 "Uses Foreign Weapons"
 using_foreign_artillery:0 "Uses Foreign Artillery"
 sicilian_mafia:0 "Sicilian Mafia"
 desc_sicilian_mafia:0 "The Sicilian Mafia, also known as simply the Mafia or Cosa Nostra, is a criminal syndicate born in Sicily and operating in provinces with South Italians. They profit mainly through racketeering, badly affecting producers' profits and their capability to hire new workers, but they also dwell on political corruption and other criminal areas. Their brutal methods makes them infamous where they operate."
 owed_steamers:0 "Owed Steamers"
 owed_artillery:0 "Owed Artillery"
 owed_canned_food:0 "Owed Canned Food"
 total_reform:0 "Comprehensive Miracle"
 total_reform_desc:0 "Our country is going through comprehensive reforms, promoting nothing short of a true miracle."
 slave_revolution:0 "Slave Revolution"
 relutanct_figher:0 "Reluctant Fighter"
 relutanct_figher_desc:0 "This nation doesn't seems to have its own ambitions and is reluctant to fight for another country."
 silver_mine:0 "Silver Mine"
 krakow_is_austrian:0 "Krakow is Austrian"
 great_irish_famine:0 "Great Irish Famine"
 preparations_to_kill:0 "Extermination Camps"
 sunni_country:0 "Sunni Religion"
 shiite_country:0 "Shiite Religion"
 ibadi_country:0 "Ibadi Religion"
 catholic_country:0 "Catholic Religion"
