 jain_country:0 "Jain Religion"
 zoroastrian_country:0 "Zoroastrian Religion"
 assyrian_country:0 "Assyrian Religion"
 animist_country:0 "Animist Religion"
 native_assimilation_act_policy:0 "Native Assimilation Act"
 native_assimilation_act_policy_desc:0 "The government is working towards the assimilation of the native population."
 native_removal_act_policy:0 "Native Removal Act"
 native_removal_act_policy_desc:0 "Discriminatory policies aim to eliminate and push out the native population."
 african_integration_policy:0 "African Integration Policy"
 native_assimilation_enacted:0 "Native Integration Policy"
 new_world_nation:0 "New World Nation"
 low_healthcare_poorly_funded:0 "Poorly Funded Healthcare"
 desc_low_healthcare_poorly_funded:0 "Less government investment in administration results in a poorly funded healthcare system."
 good_healthcare_poorly_funded:0 "Poorly Funded Healthcare"
 desc_good_healthcare_poorly_funded:0 "Less government investment in administration results in a poorly funded healthcare system."
 capital_health_care:0 "Local Capital Healthcare"
 local_trinket_health_care:0 "Trinket Healthcare"
 local_low_health_care:0 "Low Healthcare"
 local_acceptable_health_care:0 "Acceptable Healthcare"
 local_good_health_care:0 "Good Healthcare"
 pearl_season:0 "Pearl Hunting Season"
 pearl_season_desc:0 "The population in this province is engaging in the much profitable pearl hunting activity."
 religious_minority_oppression:0 "Oppressed Religious Minorities"
 religious_minority_oppression_desc:0 "Religious minorities are being mistreated, resulting in ever increasing militancy and consciousness of these people."
 armenian_diaspora:0 "Armenian Diaspora"
 armenian_diaspora_desc:0 "This province contains a minority population that comes from the Armenian diaspora."
 earthquake_devastation:0 "Earthquake Devastation"
 earthquake_devastation_desc:0 "A powerful earthquake has recently devastated this province, leaving thousands homeless and disrupting the lives of scores of people."
 education_fully_funded:0 "Excellent Education System"
 health_care_fully_funded:0 "Excellent Healthcare"
 neglected_education:0 "Neglected Education Funding"
 trinket_health_care_fully_funded:0 "Fully Funded Healthcare"
 low_health_care_fully_funded:0 "Fully Funded Healthcare"
 acceptable_health_care_fully_funded:0 "Fully Funded Healthcare"
 good_health_care_fully_funded:0 "Fully Funded Healthcare"
 low_schools_fully_funded:0 "Fully Funded Education"
 acceptable_schools_fully_funded:0 "Fully Funded Education"
 good_schools_fully_funded:0 "Fully Funded Education"
 rally_tribesmen:0 "Rally Tribesmen"
 rally_tribesmen_desc:0 "A portion of our people leave a nomadic lifestyle with bits of a centuries old warrior culture. By reaching to these people and rallying them to our cause, we can raise a much greater army to fulfill our country's destiny."
 tanzimat_land_reform:0 "Ottoman Land Code"
 tanzimat_land_reform_desc:0 "The Ottoman Land Code was the beginning of a systematic land reform program during the Tanzimat period of the Ottoman Empire. The reasons behind the law were twofold. (1) to increase tax revenue, and (2) to exercise greater state control over the area."
 war_economy_ships:0 "Emergency Ship Building"
 preparing_for_war:0 "Preparing for War"
 preparing_for_war_desc:0 "War with the North is inevitable and we must be ready for it."
 missionary_activity:0 "Missionary Activity"
 missionary_activity_desc:0 "Foreign missionaries are active in our country."
 exploiting_the_land:0 "Exploiting the Land"
 desc_exploiting_the_land:0 "The time of the Zemene Mesafint is an arduous and perilous time, so all rulers are required to cut costs and take as much money from their population as they can."
 small_immigration_boom:0 "Immigration Boom"
 desc_small_immigration_boom:0 "Due to favorable socio-economical conditions, this province is experiencing an immigration boom."
 disunited_country:0 "Disunited Country"
 disunited_country_desc:0 "Warlords, regionalism and outlaws threaten to rip our country apart. A good part of our manpower and government efforts are directed exclusively to maintain our country together. Our ruler is frequently in campaign against rebellious warlords."
 tewodros_reforms:0 "Kassa Hailu"
 tewodros_reforms_desc:0 "While our current ruler Kassa Hailu might be one of the finest strategists in recent history, he was also a shifta, an outlaw, and this lowers our nation in the eyes of others."
 colonial_museum_of_natural_history:0 "Museum of Natural History"
 colonial_museum_of_natural_history_desc:0 "A Museum of Natural History has been established in our country."
 plantation:0 "Plantations and Mines"
 serial_killer:0 "Serial Killer On The Loose"
 silver_age:0 "A Silver Age"
 silver_age_desc:0 "Our most excellent leader will take us through a time of trouble to a better tomorrow."
 pancasila:0 "Pancasila"
 bazaari_strike:0 "Bazaari strike"
 bazaari_strike_desc:0 "Our merchant elites shut down all activities. The economy is taking a heavy blow."
 exemplary_troops:0 "Exemplary troops"
 exemplary_troops_desc:0 "By their feats or even by their mere being, our elite troops inspire the most basic ruffians, giving them the morale needed to charge a firing machine gun."
 submarine_warfare:0 "Submarine warfare"
 submarine_warfare_desc:0 "We are leading innovation in naval technology and instilling fear in the heart of our enemies!"
 rancho:0 "Rancho California"
 reading:0 "Reading"
 reading_desc:0 "A great work of literature inspired the people to read. The masses may become educated... The horror!"
 hague_convention:0 "Ratified Hague Convention"
 hague_convention_desc:0 "We have signed the Hague Convention to further an era of peace and stability in the world."
 camillo_cavour:0 "Camillo Cavour"
 camillo_cavour_desc:0 "Our excellent minister is leading our nation in the right way. Modernity is now at our doorstep. Huzzah!"
 small_baby_boom:0 "Baby Boom"
 dust_bowl:0 "Dust Bowl"
 emigrant_aid_company:0 "Emigrant Aid Company"
 bleeding_state:0 "Bleeding State"
 free_staters_national:0 "Free Staters Prohibition"
 free_staters_national_desc:0 "A few free staters settlers were prohibited from migrating to another state, generating a public commotion."
 copperhead_democrats_national:0 "Copperhead Democrats"
 copperhead_democrats_national_desc:0 "Abolitionist democrats and southern pro-slavery groups are debating the future of slavery in our nation."
 underground_railroad_shutdown:0 "Underground Railroad Shutdown"
 underground_railroad_shutdown_desc:0 "A few underground railroads in our nation were shut down and this act is fresh in the memory of the American people."
 fugitive_slave:0 "Fugitive Slave"
 fugitive_slave_desc:0 "A recent decision regarding a fugitive slave is still fresh in the memory of our people."
 abolitionist_pamphlets:0 "Abolitionist Pamphlets"
 slave_market:0 "Slave Market"
 drinking_gourd:0 "Drinking Gourd"
 fire_eaters:0 "Fire-Eaters"
 yankee_doodle:0 "Yankee Doodle"
 wish_I_was_dixie:0 "Dixie Identity"
 southern_manorialism:0 "Southern Manorialism"
 southern_pride:0 "Southern Pride"
 desc_southern_pride:0 "The dixies are a proud people, proud of their land and proud of the beauty of their women."
 enclosures:0 "Enclosures"
 desc_enclosures:0 "The legal process of enclosing a number of small landholdings to create one larger farm. Once enclosed, use of the land became restricted to the owner, and it ceased to be common land for communal use."
 haussmanns_renovations:0 "Haussmann's Renovations"
 desc_haussmanns_renovations:0 "The Haussmann's renovations, envisioned by Georges-Eugene Haussmann, included the demolition of crowded and unhealthy medieval neighborhoods, the building of wide avenues, parks and squares, the annexation of the suburbs surrounding Paris, and the construction of new sewers, fountains and aqueducts."
 foreign_claims:0 "Foreign Claims"
 foreign_claims_desc:0 "Another nation is claiming this province, a claim that they will lose soon enough."
 IS_IN_DEFAULT_TO:0 "Is in default to this country."
 IS_NOT_IN_DEFAULT_TO:0 "Is not in default to this country."
 warship_commissioned:0 "Warship Delivered"
 warship_commissioned_desc:0 "Constructing, delivering or receiving a new, foreign warship is a complicated matter. Sailors need to be trained, officers instructed and the bureaucratic paperwork needs to be done. Because of that, it will take some time for us to be able to get involved in matters like this again."
 ironclad_commision:0 "Iron Clad Commissions"
 sino_portuguese_treaty_of_peking_signataire:0 "Signatory of the Treaty of Peking"
 local_distribution_channels_und_electricity:0 "Commercial Retailers and Electrical Lighting"
 desc_local_distribution_channels_und_electricity:0 "New and efficient modes and structures for the selling and reselling of goods have been implemented in this province, leaving farmers free to tend their fields and electrical lights have been put up on the streets in this province, increasing the efficiency of all local production, as workers work in new and well lit environs."
 freedom_of_religion:0 "Freedom of Religion"
 freedom_of_religion_desc:0 "No one is forced or coerced into following any religion in our country, religious minorities have a protected status."
 repatriation:0 "Repatriation"
 desc_repatriation:0 "Refugee Camps, population exchanges, mass expulsions. Whatever the reason, we have lots of people to repatriate and because of that we are making more space for them."
 gaslights:0 "Gas Lights"
 gaslights_desc:0 "The introduction of gas lights meant that predefined areas like small rooms or big factory floors could be enlightened. This meant that people were no longer limited by sunrise and sunset."
 local_nitroglycerin_and_machine_tools:0 "Mechanized Mining"
 desc_local_nitroglycerin_and_machine_tools:0 "The mining process in this province is carried out with new and mechanized tools as well as new explosives, increasing the efficiency of local mining operations and the size of mines."
 modern_sail_ships:0 "Modern Sail Ships"
 modern_sail_ships_desc:0 "Modern techniques of building, equipping and staffing sail ships allow for more effective and powerful ships."
 population_exchange_with_turkey:0 "Population Exchange with Turkey"
 albania_exchange:0 "Albania Exchange"
 bosnia_exchange:0 "Bosnia Exchange"
 montenegro_exchange:0 "Montenegro Exchange"
 southern_serbia_exchange:0 "Southern Serbia Exchange"
 macedonia_exchange:0 "Dobrudja Exchange"
 dobrudja_exchange:0 "Albania Exchange"
 bulgaria_exchange:0 "Bulgaria Exchange"
 eastern_rumelia_exchange:0 "Albania Exchange"
 thessalia_exchange:0 "Thessaly Exchange"
 southern_macedonia_exchange:0 "Southern Macedonia Exchange"
 eastern_macedonia_exchange:0 "Eastern Macedonia Exchange"
 machine_politics:0 "Political Machine"
 desc_machine_politics:0 "Political Machines are a party organization, headed by a single boss or small autocratic group, that commands enough votes to maintain political and administrative control of a city, county, or state. It is in essence the bribery of mainly minorities by politicians using their influence. It is common to use the appointment for government jobs as a means of bribery within this system."
 spoil_system:0 "Spoils System"
 desc_spoil_system:0 "The spoils system (also known as a patronage system) is a practice in which a political party, after winning an election, gives government jobs to its supporters, friends and relatives as a reward for working toward victory, and as an incentive to keep working for the party — as opposed to a merit system, where offices are awarded on the basis of some measure of merit, independent of political activity."
 instigators:0 "Political Instigators"
 desc_instigators:0 "If the crime fighting institutions in a province became overstretched, instigators would run amok and eventually gather sufficient attention and support to cause an impact in the established order."
 kleptocrats:0 "Kleptocrats"
 desc_kleptocrats:0 "Kleptocracy is a term applied to a government seen as having a particularly severe and systemic problem with officials or a ruling class (collectively, kleptocrats) taking advantage of corruption to extend their personal wealth and political power. Typically this system involves the embezzlement of state funds at the expense of the wider population, sometimes without even the pretense of honest service. Lacking sufficient control institutions in a country where external oversight is impossible or does not exist can mean that the bureaucrats would become kleptocrats."
 international_zone_modifier:0 "International Zone"
 international_zone_modifier_desc:0 "Our country has been declared an international zone, a hub of trade and commerce and a neutral zone for foreign parts to meet."
 international_zone:0 "International Zone"
 isolationist_foreign_training:0 "Ineffective Foreign Training"
 isolationist_foreign_training_desc:0 "We might be able to use this military reform but our disdain for western technology is stopping us from fully using our experiences with it to feed our research."
 isolationist_foreign_naval_schools:0 "Ineffective Naval Schools"
 isolationist_foreign_naval_schools_desc:0 "We might be able to use this military reform but our disdain for western technology is stopping us from fully using our experiences with it to feed our research."
 isolationist_foreign_officers:0 "Ineffective Foreign Officers"
 isolationist_foreign_officers_desc:0 "We might be able to use this military reform but our disdain for western technology is stopping us from fully using our experiences with it to feed our research."
 isolationist_foreign_naval_officers:0 "Ineffective Naval Officers"
 isolationist_foreign_naval_officers_desc:0 "We might be able to use this military reform but our disdain for western technology is stopping us from fully using our experiences with it to feed our research."
 naval_school:0 "Naval School"
 desc_naval_school:0 "The Merchant Marine operates a Naval School in one of our provinces, providing lessons in leadership and education in the latest naval technologies."
 historical_congo:0 "Historical Congo"
 neuchatel_crisis_escalated:0 "Neuchatel Crisis"
 preparations_for_war:0 "Preparations for War"
 preparations_for_war_desc:0 "There's an incoming war, or so some say."
 congo_company:0 "The Congo Company"
 congo_company_desc:0 "With its residence on the Congo, the company was made to explore the natural resources of the Congo and make sure its riches and the natives benefit us."
 congo_exploitation:0 "Congolese Exploitation"
 congo_exploitation_desc:0 "All blacks saw this man as the devil of the Equator...From all the bodies killed in the field, you had to cut off the hands. He wanted to see the number of hands cut off by each soldier, who had to bring them in baskets...A village which refused to provide rubber would be completely swept clean. As a young man, I saw [Fiévez's] soldier Molili, then guarding the village of Boyeka, take a net, put ten arrested natives in it, attach big stones to the net, and make it tumble into the river...Rubber causes these torments"
 philantropic_work:0 "Philanthropic Work"
 philantropic_work_desc:0 "We are guiding this nation in the principles of civilizing and helping the natives."
 refused_gp_deliberation:0 "Defied the Great Powers"
 refused_gp_deliberation_desc:0 "We defied the deliberation of the Great Powers. There's a looming threat of war to enforce the decisions made in the Congress, but if we can hold out for enough time they may be forced to recognize that we are right."
 mandate_of_heaven:0 "Mandate of Heaven"
 mandate_of_heaven_desc:0 "By Divine Right, the Emperor is ruler of all under Heaven."
 the_congo_reform_association:0 "The Congo Reform Association"
 the_congo_reform_association_desc:0 "An international humanitarian organization is casting a less than favorable light on our colonial policies in the Congo."
 indian_territory:0 "Indian Territory"
 indian_territory_desc:0 "The Indian Territory is a land area set aside by the United States Government for the relocation of the indigenous peoples of the Americas who held aboriginal title to their land."
 reconstruction:0 "Reconstruction Policies"
 reconstruction_desc:0 "After the Civil War, our torn nation needs to be rebuilt. With policies such as the  theTen-Percent Plan, a plan that stipulates that each secessionist state had to redraft its constitution and could reenter the Union only after 10 percent of its eligible voters pledged an oath of allegiance to the United States and other reconstruction plans, the USA can recover from the effects of this devastating war."
 cultural_resurgence:0 "Cultural Resurgence"
 cultural_resurgence_desc:0 "This province is experiencing a complete resurgence of an old culture."
 chinese_treaty_port:0 "Chinese Treaty Port"
 chinese_treaty_port_desc:0 "We negotiated a treaty with the Chinese and acquired the rights over a Chinese port and city."
 negotiating_unequal_treaty:0 "Unequal Treaty"
 negotiating_unequal_treaty_desc:0 "We have lost a war and like vultures, the westerners descended upon us imposing their conditions including the opening of our country, monetary reparations and even the secession of territory."
 negotiating_treaty:0 "Negotiating Treaty"
 negotiating_treaty_desc:0 "Our diplomats are negotiating a treaty with a defeated nation."
 lacks_writing_system:0 "Lacks Writing System"
 lacks_writing_system_desc:0 "Our society lacks a writing system. Without this the written word, the organizational structures of the government will always be simple."
 penal_colony:0 "Penal Colony"
 penal_colony_desc:0 "This province is home to a sizeable penal colony. Most of the poor strata are convicts or former convicts, leading to widespread poverty."
 divided_society:0 "Divided Society"
 divided_society_desc:0 "Our society is deeply divided by racial issues. There's distrust and resentment all around and because of that integration is severely affected."
 caudillo_leaders:0 "Caudillo"
 caudillo_leaders_desc:0 "A caudillo is a type of militia leader with a charismatic personality and enough of a populist program of generic future reforms to gain broad sympathy, at least at the outset, among the common people. Effective caudillismo depends on a personality cult. Since the caudillo typically held power by controlling a patronage network that brooked no rival structure, some caudillos took up an anti-clerical stand. Many of the caudillos used their newly gained power, which was unchecked because it was extra-constitutional, to promote their own wealth and interests."
 corrupt_army:0 "Corrupt Officials"
 corrupt_army_desc:0 "After one defeat, one of our generals blamed the failure on enemy magic, which prompted an angry response from the ruler. It's evident that the organization and logistics of our army are inadequate, officer training is deficient, and corruption is widespread."
 fanatic_army:0 "Fanatic Loyalty"
 fanatic_army_desc:0 "Marked by a high level of discipline and fanaticism, our army is recruiting people from all over our country to fight for our cause. These conscripts firmly believe in our mission and are of an undying loyalty to us."
 irish_poverty:0 "Irish Poverty"
 animists_run:0 "Animist Emigration"
 hormuz_strait:0 "Hormuz Strait"
 the_french_foreign_legion:0 "La Légion Étrangère"
 the_hedeselskab:0 "The Hedeselskab"
 the_hedeselskab_desc:0 "The foundation of the Danish Moor Company lead to the drainage and improvement of vast areas."
 emigration_boom:0 "Emigration Boom"
 emigration_boom_desc:0 "Changing life conditions in our country are stimulating a big relocation of our people."
 gold_rush_country:0 "Gold Rush"
 gold_rush_country_desc:0 "Our country is experiencing a gold rush leading people from all over the old world to flock to our country."
 global_baby_boom:0 "Baby Boom"
 global_baby_boom_desc:0 "Improvements in life conditions in our country are leading to a country-wide baby boom."
 political_education:0 "Ideological Education"
 political_education_desc:0 "Education in our country is full blown ideological indoctrination, and has severe changes every time our leader changes. Universal public education is thus enforced and alphabetization is a priority, but at the cost of free thinking."
 cult_of_personality:0 "Cult of Personality"
 cult_of_personality_desc:0 "A cult of personality arises when an individual uses mass media, propaganda, or other methods, to create an idealized, heroic, and at times, worshipful image, often through unquestioning flattery and praise."
 totalitarian_system:0 "Totalitarianism"
 totalitarian_system_desc:0 "Totalitarianism is a political system in which the state holds total authority over the society and seeks to control all aspects of public and private life wherever possible."
 the_terror:0 "The Terror"
 the_terror_desc:0 "To overcome our enemies we must have our own militarism. We must carry along with 90 percent out of the total population of our country. As for the rest, we have nothing to say to them. They must be annihilated."
 chinese_foreign_training:0 "Foreign Training in China"
 chinese_foreign_weapons:0 "Western Weapons in China"
 chinese_foreign_officers:0 "Foreign Officers in China"
 chinese_foreign_artillery:0 "Western Artillery in China"
 pandemic_influenza_immunity:0 "Influenza Free"
 pandemic_influenza_immunity_desc:0 "A Pandemic of Influenza ravages our country, but this small isolated community is immune to it, thank to its remote location."
 population_resettlement:0 "Population Resettlement"
 population_resettlement_desc:0 "Our nation is working on the national integration of a region by resettling our citizens."
 trade_city:0 "Trade City"
 trade_city_desc:0 "Located in this province is an important trade city, a hub of trade of the region, enjoying much economic prosperity."
 peacetime_mobilization:0 "Peace Time Mobilization"
 peacetime_mobilization_desc:0 "Conscripts are being drafted left and right and our poor are being trained and prepared to fight, yet there's no war. This large disruption in the country's daily life is making our pops tired and our neighbors wary."
 tribute_received:0 "Tribute Received"
 tribute_received_desc:0 "One of our vassals paid their due tribute to us."
 tribute_paid:0 "Tribute Paid"
 tribute_paid_desc:0 "We have to share part of our earnings with our overlord over the time period and as suck we are poorer from that."
 islamic_law_triggered:0 "Islamic Law"
 islamic_law_triggered_desc:0 "Islamic law is now the basis law code of our society. It deals with several topics including: crime, politics, and economics, as well as personal matters such as sexual intercourse, hygiene, diet, prayer, everyday etiquette and fasting."
 deportation_underway:0 "Deportation"
 deportation_underway_desc:0 "'People from different ethnicities are being 'encouraged' to move out of this country.'"
 treaty_port:0 "Treaty Port"
 treaty_port_desc:0 "This port was ceded to a foreign administration and it's a hub of trade from China to the rest of the world."
 drained_marsh:0 "Drained Marsh"
 drained_marsh_desc:0 "This marshland was drained and as a result it is more habitable."
 backed_down_on_promise:0 "Backed Down on Promises"
 backed_down_on_promise_desc:0 "Our government broke one or more important promises to our population."
 highlander_raids:0 "Highlander Raids"
 highlander_raids_desc:0 "Highlander raiders are looting our provinces in numbers."
 jewish_farms:0 "Jewish Farmlands"
 jewish_farms_desc:0 "Jews who immigrated to Israel purchased land that was mostly semi-arid, although much had been rendered untillable by deforestation, soil erosion and neglect. They set about clearing rocky fields, constructing terraces, draining swampland, reforesting, counteracting soil erosion, and washing salty land. Since independence, the total area under cultivation has increased from 408,000 acres (1,650 km2) to 1,070,000 acres (4,300 km2), while the number of agricultural communities has increased from 400 to 725. Agricultural production has expanded 16 times, three times more than population growth."
 monument_under_construction:0 "Under Construction"
 monument_under_construction_desc:0 "We are building a great project to celebrate our nation greatness."
 recently_built_city:0 "Recently Built City"
 recently_built_city_desc:0 "The capital of this province was recently built by the government, moving a lot of workers to the region to  build a city with modern infrastructure."
 law_changed_by_force:0 "Law Changed"
 law_changed_by_force_desc:0 "We pressured the upper house to pass an urgent reform."
 social_reformed_nation:0 "Full Welfare State"
 social_reformed_nation_desc:0 "Our country social reforms match every socialist demand, having some scholars call us an welfare state."
 wahhabism_in_nejd:0 "Wahhabism"
 wahhabism_in_nejd_desc:0 "'The 'pivotal idea' of Wahhabism teaching was that people who called themselves Muslims but who participated in such innovations were not just misguided or committing a sin, but were 'outside the pale of Islam altogether', as were Muslims who disagreed with his definition. This included not just lax, unlettered, nomadic Bedu, but Shia, Sufi, and Ottomans.'"
 russian_army:0 "The Russian Army"
 russian_army_desc:0 "The Russian Army may be the biggest land force of Europe, but it is poorly supplied and organized."
 landlocked_nation:0 "Landlocked Nation"
 landlocked_nation_desc:0 "Our nation doesn't have any access to the sea, greatly increasing import costs."
 fundamentalist_sympathies:0 "Islamic Fundamentalists"
 fundamentalist_sympathies_desc:0 "Islamic Fundamentalists are agitating the people in this province."
 new_constitution:0 "The New Constitution"
 new_constitution_desc:0 "Our country issued a new constitution, guaranteeing voting and citizen rights and putting down the revolutionary flames."
 rise_of_a_nation:0 "Rise of a Nation"
 rise_of_a_nation_desc:0 "Our proud nation is free, and our culture blossoms again."
 sounds_dues_toll:0 "The Sound Toll"
 sounds_dues_toll_desc:0 "The Sound Dues (or the Sound Toll) is a toll on the use of the Sound which constituted up to two thirds of Denmark's state income in the 16th and 17th centuries. The dues was introduced by King Eric of Pomerania in 1429."
 MODIFIER_DEBT_DEFAULT_TO:0 "Debt Default To"
 generalised_debt_default:0 "Generalized Debt Default"
 MODIFIER_GENERALISED_DEBT_DEFAULT:0 "Generalized Debt Default"
 hunger_riots:0 "Hunger Riots"
 desc_hunger_riots:0 "A province where the poor are under severe hardship and that lacks an effective police force and has less money for crime fighting results in demonstrations getting out of hand and devolving in outright riots."
 preparations_to_kill_desc:0 "We are solving the minorities problem in our country. Minorities are being sorted out in concentration camps and waiting for their fate, or being delivered to it already."
 withdrew_from_geneva_convention:0 "Withdrew from the Geneva Convention"
 withdrew_from_geneva_convention_desc:0 "Our country is no longer a signatory of the Geneva Convention."
 genocide:0 "Systematic Extermination"
 genocide_desc:0 "Our aggressive policies against minorities are promoting a shift in our country."
 small_but_efficient:0 "Small But Efficient"
 small_but_efficient_desc:0 "Our country might be small, but that just means we can run it better."
 own_kiel_canal:0 "The Kiel Canal"
 own_kiel_canal_desc:0 "We own the Kiel Canal, linking the Baltic and the North Sea without the need to sail around Denmark, and we receive the dividends of its toll."
 own_suez_canal:0 "The Suez Canal"
 own_suez_canal_desc:0 "We own the Suez Canal, linking the Mediterranean and the Red Sea without the need to sail around Africa, and we receive the dividends of its toll and glory for its possession."
 own_panama_canal:0 "The Panama Canal"
 own_panama_canal_desc:0 "We own the Panama Canal, a huge feat of engineering linking the Pacific and the Atlantic Oceans, and we receive the dividends of its toll and glory for its possession."
 rebuilding_city:0 "Rebuilding"
 rebuilding_city_desc:0 "Our city is rebuilding."
 slave_growth:0 "Slave Demographics"
 slave_growth_desc:0 "The population of slaves changed in our country."
 assegai:0 "Impi"
 assegai_desc:0 "Military innovations such as the assegai, the age-grade regimental system and encirclement tactics helped make the Zulu one of the most powerful nations in southern and south-eastern Africa."
 will_influence_elections:0 "Following Elections"
 will_influence_elections_desc:0 "We are following this year election."
 let_the_chips_fall:0 "Not Following Elections"
 let_the_chips_fall_desc:0 "We are not involved in this year election."
 the_big_army:0 "The Big Army"
 the_big_army_desc:0 "General Urquiza is gathering a huge army, compromised of volunteers from Uruguay and all over the country, to defeat Rosas."
 small_immigration_boom_desc:0 "Our nation thrives and therefore more people flock to our cities each day."
 the_big_ben:0 "The Big Ben"
 the_big_ben_desc:0 "The Clock Tower derives its nickname from the bell, the Big Ben. With an extreme accuracy, the clock tower dominates life and work in London, always striking on time."
 bigben_construction:0 "Reconstruction of the Palace of Westminster"
 bigben_construction_desc:0 "The Palace of Westminster is being reconstructed and with it, a huge clock tower."
 eiffel_tower_construction:0 "Eiffel Tower Under Construction"
 eiffel_tower_construction_desc:0 "Our great nation is dedicating its resources and workers to build a magnificent tower."
 suez_canal_construction:0 "Suez Canal Under Construction"
 suez_canal_construction_desc:0 "Our nation is dedicating its resources to build a great Canal."
 kiel_canal_construction:0 "Kiel Canal Under Construction"
 kiel_canal_construction_desc:0 "Our nation is dedicating its resources to build a great Canal."
 panama_canal_construction:0 "Panama Canal Under Construction"
 panama_canal_construction_desc:0 "Our nation is dedicating its resources to build a great Canal."
 kinda_bad_badboy:0 "International Sanctions"
 kinda_bad_badboy_desc:0 "We have been declared a threat to global safety and international balance of power. Sanctions have been applied to our country and citizens and we have been warned that the great powers will worsen these sanctions in case we continue our aggressiveness."
 solano_lopez_industrialization:0 "Solano Lopez Industrialization"
 solano_lopez_industrialization_desc:0 "Following his rise to power, Carlos Solano Lopez started an aggressive program of industrialization and militarization of our country that included subsides to industry, minimum spending on military and a strong focus on productivity."
 bad_badboy:0 "International Isolation"
 bad_badboy_desc:0 "Our great nation has acquired many enemies and now most of the nations in the world see us as an international threat. They joined forces to isolate us in an attempt to bring us down."
 north_coalition:0 "Ejercito Grande"
 north_coalition_desc:0 "A huge army against Rosas is being gathered by General Urquiza of Entre-Rios, and some of our provinces have pledged to support him."
 organic_statute:0 "Organic Statute of Poland"
 organic_statute_desc:0 "The Organic Statute of the Kingdom of Poland was a constitution introduced in the Kingdom of Poland after the suppression of the Polish Uprising of 1830–31 to replace the Constitution of 1815. It was promulgated in St. Petersburg by Tsar Nicholas I on Feb. 14 (26), 1832. Although the Organic Statute abolished the Sejm and the Polish Army, it preserved such autonomous institutions as the vicegerency, the State Council, and the vicegerent’s Administrative Council."
 francia_utopia:0 "Francia's Utopia"
 francia_utopia_desc:0 "Dr. Francia, dictator for life of Paraguay, inspired by French revolutionary ideals sought to create a utopian state based on Rosseau's Social Contract. Although he strived for equality of the people, Francia ruthlessly destroyed any opposition and created a Police state, imprisoning all those he deemed seditious. An isolationist, he ran the country with almost no outside influence."
 colorado_sympathies:0 "Colorado Agitation"
 colorado_sympathies_desc:0 "This region is under Colorado influence and it's likely to cause trouble."
 blanco_sympathies:0 "Blanco Agitation"
 blanco_sympathies_desc:0 "This region is under Blanco influence and it's likely to cause trouble."
 rivera_reforms:0 "Rivera's Intervention"
 rivera_reforms_desc:0 "Fructuoso Rivera entered Montevideo victorious and assumed dictatorial powers while he called for elections. He made sure to use these powers well."
 prussia_disagrees:0 "Prussia upholds the Vienna Treaty"
 russia_disagrees:0 "Russia upholds the Vienna Treaty"
 krakow_uprising:0 "The Winger Hussars will ride once more."
 polish_spirit:0 "Polish Sentiment"
 polish_spirit_desc:0 "With the successful revolution in Krakow, Poles everywhere are clamouring for an independent and unified Poland again."
 official_nationality:0 "The Official Nationality Doctrine"
 official_nationality_desc:0 "Orthodoxy, Autocracy and Nationality, also known as Official Nationality was the dominant ideological doctrine of Russian emperor Nicholas I. The Tsar is currently trying to Russify our country, greatly disrupting our country organization but inciting nationality!"
 orthodoxy_autocracy_nationality:0 "Orthodoxy, Autocracy and Nationality!"
 orthodoxy_autocracy_nationality_desc:0 "The Official Nationality policy entered into effect and it's speeding up the assimilation of other cultures at the cost of some unrest."
 communists_ruling:0 "Down with the Capitalists!"
 communists_ruling_desc:0 "Our nation is now headed by the proletariat, capitalists have no place here!"
 soviet_agitation:0 "Tsarist Autocracy"
 soviet_agitation_desc:0 "The hardships of war, the technological backwardness of Russia and the tsar autocracy and repression are exhausting our people and our resources. Will we ever see an end to the Tsar autocracy?"
 white_desorganisation:0 "Leadership Disorganisation"
 white_desorganisation_desc:0 "The White Army in the Russian Civil War managed to make advances against the soviets, but disorganization in it's ranks severely hindered their efforts!"
 install_communist_gov_sov:0 "Install communism"
 install_communist_gov_sov_desc:0 "Install a communist government."
 install_communist_gov_sov_setup:0 "Install a communist government. If achieved, the country will be automatically added into our sphere and will become our satellite."
 install_communist_gov_sov_short:0 "Install communism"
 human_research_modifier:0 "Boosted Research"
 canadian_confederation:0 "The Canadian Confederation"
 canadian_confederation_short:0 "Canada will be confederated!"
 canadian_confederation_setup:0 "The arrayed provinces of the Dominion of Canada have been asking for independence. The movement, headed by Sir John A. Macdonald, may end up providing the British Empire with a steadfast and decentralized ally in North America."
 canadian_confederation_desc:0 "The arrayed provinces of the Dominion of Canada have been asking for independence. The movement, headed by Sir John A. Macdonald, may end up providing the British Empire with a steadfast and decentralized ally in North America."
 canadian_confederation_title:0 "The Canadian Confederation"
 australian_independence:0 "The Australian Constitution"
 australian_independence_short:0 "Australia federated into six separate states and gained its independence."
 australian_independence_setup:0 "The Australian independence movement has finally reached a head, and it's time that the British Empire finally allowed the island continent of Australia to move forward from its previous prison colony history into a new world of democracy."
 australian_independence_desc:0 "The Australian independence movement has finally reached a head, and it's time that the British Empire finally allowed the island continent of Australia to move forward from its previous prison colony history into a new world of democracy."
 australian_independence_title:0 "The Australian Constitution"
 kiwi_constitution:0 "The Dominion of New Zealand"
 kiwi_constitution_short:0 "New Zealand has been released!"
 kiwi_constitution_setup:0 "Following the independence of Australia, and the historic ties between Australia and New Zealand, a Kiwi movement has finally materialized, asking for a decentralized independence."
 kiwi_constitution_desc:0 "Following the independence of Australia, and the historic ties between Australia and New Zealand, a Kiwi movement has finally materialized, asking for a decentralized independence."
 kiwi_constitution_title:0 "The Dominion of New Zealand"
 first_riel_rebellion:0 "The First Riel Rebellion Aftermath"
 first_riel_rebellion_desc:0 "The First Riel Rebellion ended in blood and exile. The Metis have not forgotten, nor will the government let them."
 first_riel_rebellion_title:0 "The First Riel Rebellion Aftermath"
 metis_twilight:0 "The Twilight of the Metis"
 metis_twilight_desc:0 "The Second Riel Rebellion has ended in the worst possible way, and the Metis are now a marginalized people in Canada."
 metis_twilight_title:0 "The Twilight of the Metis"
 taras_shevchenko_local:0 "Taras Shevchenko"
 taras_shevchenko_local_desc:0 "Taras Shevchenko is gaining prominence and is affecting the Ukrainian peoples in their quest for independence and nation-building."
 taras_shevchenko_local_title:0 "Taras Shevchenko"
 taras_works_local:0 "Taras Shevchenko"
 taras_works_local_desc:0 "Taras Shevchenko is working hard after many life experiences, and is quickly becoming known as the father of the Ukrainian language and culture."
 taras_works_local_title:0 "Taras Shevchenko"
 slavery_timer:0 "Slavery"
 slavery_timer_desc:0 "Slavery in our nation continues on, making our country a bit less attractive as the world moves on."
 slavery_timer_title:0 "Continued Slavery"
 independence_of_norway:0 "The Independence of Norway"
 independence_of_norway_short:0 "The Independence of Norway"
 independence_of_norway_setup:0 "The Independence of Norway"
 independence_of_norway_desc:0 "The Personal Union between Sweden and Norway is on its last legs, and attempts to find common ground between the Swedes and Norwegians is failing rapidly. Releasing Norway seems like the only solution."
 independence_of_norway_title:0 "The Independence of Norway"
 restart_the_caucasian_war:0 "Restart the Caucasian War"
 restart_the_caucasian_war_short:0 "Restart the Caucasian War"
 restart_the_caucasian_war_setup:0 "Restart the Caucasian War"
 restart_the_caucasian_war_desc:0 "Although Russia put the Caucasian/Circassian War on hold during their wars with Persia and the Ottoman Empire, now Russia has a chance to save face and ensure its hegemony over the Caucasus. This is not a decision to be taken lightly, as the war has raged in one form or another since 1763."
 restart_the_caucasian_war_title:0 "Restart the Caucasian War"
 caucasian_war_local:0 "Caucasian War"
 caucasian_war_local_desc:0 "The ongoing Caucasian War is causing unrest and lack of productivity in these provinces."
 caucasian_war_local_title:0 "The Caucasian War"
 caucasian_truce_local:0 "Caucasian War - Truce"
 caucasian_truce_local_desc:0 "The Caucasian War is undergoing a truce, for now. The uneasy tension that the locals have with their Russian occupiers is a welcome break from the previous state of war, but it is an uneasy truce brokered by the blood of both sides."
 caucasian_truce_local_title:0 "The Caucasian War - Truce"
 SOV_communists:0 "Bolsheviks"
 SOV_communists_2:0 "Trotsky's Faction"
 kobu_gattai:0 "Kobu Gattai"
 kobu_gattai_desc:0 "This was a policy of the Tokugawa shogunate aiming at increasing political coordination between the bakufu and the Imperial Court, as well as appeasing opponents within the shogunate itself."
 sakoku:0 "Sakoku"
 sakoku_desc:0 "Meaning 'locked country',this is the policy under which no foreigner could enter Japan under pain of death. Maintained by the Tokugawa shogunate, it has kept the nation in enforced isolation since the 17th century."
 tozama_daimyo:0 "Tozama Daimyo"
 fudai_daimyo:0 "Fudai Daimyo"
 emperor_meiji:0 "Emperor Meiji"
 supports_imperial_edict:0 "Supports the Imperial edict against foreigners"
 angered_by_bakufu:0 "Angered by the bakufu"
 rangaku:0 "Rangaku"
 rangaku_desc:0 "Meaning 'dutch learning',this refers to the body of knowledge developed by Japan through its contacts with the Dutch enclave of Dejima, which allowed Japan to keep abreast of Western technology and medicine in the period when the country was closed to foreigners."
 ansei_purge:0 "Ansei Purge"
 meddled_in_foreign_affairs:0 "Meddled in Foreign Affairs"
 no_freedom:0 "Attempted Freedom"
 no_freedom_desc:0 "We attempted to free ourselves from foreign rule. We must wait until there is another opportunity, as for now they are watching us closely."
 demoralized_warriors:0 "Demoralized Warriors"
 demoralized_warriors_desc:0 "Many warriors are missing their children. They do not believe we made the right decision."
 kongo_missing_children:0 "Missing Children"
 kongo_missing_children_desc:0 "Many of our children have been shipped to Europe for an education."
 kongo_missionaries:0 "Catholic Missionaries"
 kongo_missionaries_desc:0 "Missionaries are working together with our literate people to educate the heathens among us."
 influx_of_ideas:0 "Influx of Ideas"
 influx_of_ideas_desc:0 "Our children have seen many things that most of our peoples have never heard of. Now they are teaching the rest of our population to modernize the country."
 recent_jihad:0 "Recent Jihad"
 recent_jihad_desc:0 "The extensive Jihad has caused serious hardships in this area, especially among the non-muslim populations."
 nomadic_confederation:0 "Nomadic Confederation"
 nomadic_confederation_desc:0 "Nomadic Confederations are highly decentralized states centered around the figure of a Khan, the warlord who reigns supreme over the 'left' (eastern) and 'right' (western) wings of the Khanate. Although this form of government has proven to be successful in the Steppes for millennia, the fact that the different nomadic clans that compose the Khanate are co-opted into providing military service limits the manpower the Khan can muster."
 flowers_of_ruin:0 "The New Iranian Intermezzo"
 flowers_of_ruin_desc:0 "From the ruins of the Timurtash Empire flourish Persian culture and economy as its successor states struggle for the title of Shahanshah."
 china_weisuo:0 "Weisuo System"
 china_weisuo_desc:0 "The old Weisuo sytem, introduced by the Yuan dynasty, preserveres into the present day. Military positions down to the rank and file are hereditary, leading to widespread neglect of duty and preventing proper moblisation of the Middle Kingdom's manpower."
 qeshm_trade:0 "The Qeshm Lease"
 qeshm_trade_desc:0 "With the island of Qeshm leased to a Western Power, trade links with India are bolstered and fresh ideas flow into the Persian Gulf."
 esfahan_opium_production:0 "Opium Production in Esfahan"
 esfahan_opium_production_desc:0 "Opium has become the major contribuitor to export economy in Esfahan, transported by caravan to Qeshm, and then onwards by ship to China and Europe."
 shekhbizin_tribal_army:0 "Tribal Domination of the Shekhbizin Army"
 shekhbizin_tribal_army_desc:0 "The Shekhbizin Army has been composed since its inception from tribal Lurish and Qashqai contingents. The tribal elite dominates the military sphere of the realm and would see the conscription of Persians into the army as an encroachment into their authority and privileges."
 lurish_administration:0 "Lurish Tribal Administration"
 lurish_administration_desc:0 "This province is part of the realm of the Lurish Ilkan, who dominates the economic life of the region and only nominally acknowledges the authority of the Shekhbizin Shah."
 qashqai_administration:0 "Qashqai Tribal Administration"
 qashqai_administration_desc:0 "This province is part of the realm of the Qashqai Ilbeg, who dominates the economic life of the region and only nominally acknowledges the authority of the Shekhbizin Shah."
 former_naib_land:0 "Land ripe for opportunity!"
 former_naib_land_desc:0 "Now that the naib's control over significant parts of our territory is broken, it is finally open for Armenian settlement and economic enterprise!"
 armenian_intellectual_diaspora:0 "Armenian Diaspora"
 armenian_intellectual_diaspora_desc:0 "The Armenian diaspora is returning from all over the world, bringing with them the old knowledge of our people and their experiences in the western world!"
 rasht_silk_trade:0 "Western Presence in Rasht"
 rasht_silk_trade_desc:0 "The Trade Silk, although currently in crisis, has traditionally attracted a large community of Western merchants to Rasht, bringing innovative ideas to Gilan."
 lahijan_tea_production:0 "Tea Plantations in Lahijan"
 lahijan_tea_production_desc:0 "The new tea plantations in Lahijan have supplanted the ailing silk trade, not only rekindling commerce with the West but also becoming a popular beverage throughout Iran."
 daylamite_mountaineers:0 "Daylamite Mountain Troops"
 daylamite_mountaineers_desc:0 "The establishment of the Daylamite Mountain Troops has yielded a unit of elite soldiers ready to fight on the rugged terrain of Iran, from the Zagros to the Kopet Dag."
 kar_kiya_land_redistribution:0 "Land Reform in Gilan-Mazandaran"
 kar_kiya_land_redistribution_desc:0 "The redistribution of the old Kar-Kiya crownlands to has breathed new life into the agricultural sector of our state."
 kalwatiya_forced_conversion:0 "Forced Conversion of the Ismaili and Twelver Communities"
 kalwatiya_forced_conversion_desc:0 "Through violence and a crippling tax burden, the Ismaili and Twelver communities are being forced to convert to Zaydism."
 gorgan_lease:0 "The Lease of Gorgan"
 gorgan_lease_desc:0 "We have leased Gorgan and the Caspian port of Bandar Torkaman to the Russians. In exchange, the Russians have sent military attachés to oversee the reform of our army into a capable fighting force."
 university_athens:0 "The University of Athens"
 university_athens_desc:0 "The first modern and the most prestigious institution of knowledge in Hellas."
 university_venice:0 "The University of Venice"
 university_venice_desc:0 "The first modern and the most prestigious institution of knowledge in Venice."
 thrace_boom:0 "Enosis"
 thrace_boom_desc:0 "The fulfillment of the Megali Idea has led to the installation of many settlers from the rest of Greece in areas 'left' by the Turkish inhabitants."
 enosis_modifier:0 "Enosis Achieved"
 enosis_modifier_desc:0 "Enosis is completed and the people living in our country are now being assimilated."
 federales_CLM_title:0 "Gendarmeria Federal"
 federales_CLM_desc:0 "Our gendarmeria is the pride of our police forces!"
 janissary_rule:0 "Janissary Rule"
 janissary_rule_desc:0 "The Janissaries have seized power over the state and installed a brutal dictatorship."
 janissary_system:0 "Janissary System"
 janissary_system_desc:0 "The victorious Janissaries have continued the old Ottoman policies of divide et impera in the Balkans, fostering interethnic conflict to weaken opposition and present the Turkish state as a benevolent arbiter."
 hellas_independence_war:0 "Hellas Fights for Freedom"
 hellas_independence_war_desc:0 "Hellas has risen up against the Venetokratía and is willing to sacrifice whatever it takes to obtain freedom."
 second_year_greek_war:0 "The Struggle Against Venice Continues"
 second_year_greek_war_desc:0 "As the war of Independence against Venice enters its second year, the Greeks remain determined to throw off the Latin yoke for good."
 hellinopoieisi:0 "Hellinopoieisi"
 hellinopoieisi_desc:0 "A Hellenisation programme is being implemented to coerce the Arvanites into shedding their ancestral language in favour of Greek."
 soyurghal_system:0 "The Soyurghal System"
 soyurghal_system_desc:0 "The Soyurghal appanage system grants the Dehqans almost complete autonomy in fiscal and judicial matters, severely limiting the ability of the Shahanshah to impose his will on his subjects."
 dehqan_autonomy:0 "Dehqan Appanage"
 dehqan_autonomy_desc:0 "Khorasan is fragmented into a mosaic of Soyurghals under the de-facto rule of a landed magnates, the Dehqans, responsible for collecting taxes and maintaining agriculture and infrastructure."
 idris_insolence:0 "Idris' Defiance"
 idris_insolence_desc:0 "The weakness of the Shahanshah, Firuz II, is apparent to all, including his brother Idris Timurtash, who for a few years has refused to pay the annual tribute as is due."
 limited_dehqan_autonomy:0 "Limited Dehqan Autonomy"
 limited_dehqan_autonomy_desc:0 "Although the Dehqans still enjoy ample fiscal and judicial autonomy under the Soyurghal system, the amirs that supervise the administration and the military of the appanage are now appointed by the Shahanshah, rather than the Dehqans themselves, severely limiting the ability of the appanage holders to disregard the authority from Herat."
 ismaili_education:0 "Ismaili Madrasas"
 ismaili_education_desc:0 "The Ismaili madrasas can now act freely throughout our realm, teaching not only theology but also secular subjects such as philosophy, mathematics and calligraphy."
 khorasan_irrigation:0 "Renovated Irrigation System in Khorasan"
 khorasan_irrigation_desc:0 "The repairing of the old irrigation system, combined with the building of brand-new canals, has allowed Khorasan to not only reach but overshoot the prewar figures for agricultural production."
 mosallamiyat_abolished:0 "Mosallamiyat Abolished"
 mosallamiyat_abolished_desc:0 "The hereditary tax immunities, the Mosallamiyat, that the officer corps of the army had been enjoying for decades has been abolished, giving the Imperial treasury further resources with which to modernise the state."
 madan_turquoise:0 "Nishapur Turquoise Mines"
 madan_turquoise_desc:0 "State investment in mining infrastructure has allowed a revitalisation of the turquoise-mining sector in Nishapur, allowing the export of high-quality gemstone."
 azarbaijan_reconstruction:0 "The Reconstruction of Azarbaijan"
 azarbaijan_reconstruction_desc:0 "The rehabilitation of Azarbayjan is underway, undoing the damage that both nature and man alike inflicted upon this province."
 investing_azarbaijan:0 "Investing in Azarbayjan"
 investing_azarbaijan_desc:0 "Part of the national budget is being invested into the reconstruction of Azarbayjan, tying up a significant amount of our financial means."
 forced_integration:0 "Forced Assimilation"
 forced_integration_desc:0 "Authorities are trying to uniformise the language spoken in this province, banning the local languages and shaming their users in an act of linguistic genocide."
 disbanded_guilds:0 "Guilds Abolished"
 disbanded_guilds_desc:0 "The disbanding of the Ottoman guilds has allowed the Kurdish state to remove archaic hindrances towards the modernisation of its economy."
 kuren_kurdistana_azad:0 "Kuren Kurdistana Azad"
 kuren_kurdistana_azad_desc:0 "The Kuren Kurdistana Azad are a group of freedom fighers - or brigands, depending on the perspective - who form the battle-hardened core of our armed forces, having had their baptism of fire in the Janissary Rebellions."
 hungarian_noble_privilege:0 "Overburdened Plebeians"
 hungarian_noble_privilege_desc:0 "The Nobility of Royal Hungary parasitically exploits the peasantry. Not only do the serfs owe free labour to their lords, but they are also forced to pay for the expenses of the Hungarian Diet which represents exclusively the rights of the Nobility."
 szekely_privilege:0 "The Székelyföld"
 szekely_privilege_desc:0 "The Szekely lands enjoy a degree of limited internal autonomy, having their own administrative system and charters preventing the transfer of land from the Székelyföld to non-Szekelys."
 koenigsboden:0 "The Königsboden"
 koenigsboden_desc:0 "The Transylvanian Saxons have lived under a system of autonomous self-administration since the times of King Andreas II, who issued the Golden Charter establishing the indivisibility and autonomy of the Saxon lands and the prevalence of Saxon law - the Eygenlandrecht - over Royal law in the Königsboden."
 szekely_tax_exemption:0 "Szekely Tax Exemptions"
 szekely_tax_exemption_desc:0 "The Szekely have enjoyed for centuries complete tax exemption in exchange for their military service, preventing the central government from tapping into a potentially large fiscal base."
 szekely_unrest:0 "Szekely Unrest"
 szekely_unrest_desc:0 "The decree abolishing the privileges of the Szekely people and the autonomy of the Székelyföld have been met with hostility, heralding trouble for years to come."
 vlach_unrest:0 "Vlach National Awakening"
 vlach_unrest_desc:0 "The Vlachs are at the bottom of the social ladder in Transylvania, being the only of the four peoples of the Principality to not have any recognised political rights, and are marginalised particularly in the Königsboden. A growing national consciousness and the popularisation of the Daco-Romanian continuity theory mean that the days where Vlachs accepted being treated as foreigners in their own homeland are counted."
 ADS_activity:0 "ADS Agitation"
 ADS_activity_desc:0 "The Allgemeiner Deutscher Schutzverband operates in this province, spreading anti-Magyar propaganda to turn the Saxons against the Hungarian government and promote pan-Germanism."
 transylvanian_revolution:0 "The Transylvanian Revolution"
 transylvanian_revolution_desc:0 "The opressive policies of the Hungarian government have united the three peoples of Transylvania in a common struggle to restore the independence of the Principality and preserve its unique customs and way of life."
 negotiations_moldavia:0 "Negotiations for Moldavia"
 negotiations_moldavia_desc:0 "Negotiations are ongoing with a neighbouring power over the transfer of Moldavia, which would serve as a compensation for our acquisitions elsewhere in the former Romanian lands."
 italian_mission_albania:0 "Italian Military Mission in Albania"
 italian_mission_albania_desc:0 "Italy has undertaken to modernise our army, supplying us with advanced weapons and sending officers to train our cadres in accord with Italian military theory."
 italian_investment_valona:0 "Italian Investment in Vlorë"
 institutionalised_sharia:0 "Institutionalised Shari'a"
 institutionalised_sharia_desc:0 "Shari'a has been institutionalised as our state's legal code, displacing the long tradition of Feqh-influenced secular jurisprudence."
 demographic_pressure_indian:0 "Demographic Pressure in the Indian Lands"
 henequen_boom:0 "Henequen Boom"
 criollo_ayuntamientos:0 "Criollo Ayuntamientos"
 begin_revolution:0 "Revolutionary Struggle"
 begin_revolution_desc:0 "The revolution has begun and every single citizen in our nation will have to make extraordinary sacrifices in order to see it through to a victorious end."
 drive_to_reunify:0 "Drive to Reunify"
 siete_patidas_abolished:0 "New Huastec Legal Code"
 siete_patidas_abolished_desc:0 "The derogation of the medieval Castilian code of jurisprudence, the Siete Partidas, confers greater economic and legal autonomy to women in our lands, facilitating their contribution to the progress of the Huastec nation."
 maya_city_rediscovered:0 "Rediscovered Maya City"
 emancipated_maya:0 "Emancipation of the Yucatecs"
 emancipated_maya_desc:0 "Indebted peonage has been abolished in Mayapan, releasing impoverished Maya from their Haciendas and bolstering the pool of potential recruits for the Army of Mayapan."
 bataab_office_abolished:0 "The End of the Batabo'ob"
 bataab_office_abolished_desc:0 "The corrupt system of Batab chiefdoms has been uprooted and replaced by modern bureaucracy, exempting the Maya peasantry from crushing feudal obligations."
 otomi_caciques_gone:0 "Expelled Caciques"
 otomi_caciques_gone_desc:0 "The ruthless caciques that terrorised the Otomi countryside have been forced to capitulate or flee into exile, thus relieving the peasantry of the vexating tax burdens hitherto imposed by the petty warlords."
 cargo_system:0 "The Cargo System"
 cargo_system_desc:0 "The traditional cargo system of hierarchic office-holding in villages is being exploited by the clergy to enrich themselves at the expense of the peasantry and maintain their privileged position at the top of the institutional pyramid."
 enedzaa_education:0 "Eneedzaa's Alphabetisation Programme"
 enedzaa_education_desc:0 "The cacique and Minister of Development, Aguilar Eneedzaa, has implemented an ambitious educational project aimed at increasing the literacy of the Mixe people and inducting them into notions of indigenism and patriotism."
 eneedzaa_plantations:0 "Eneedzaa's Coffee Plantations"
 union_mixe_farmers:0 "Union of Mixe Peasants"
 union_mixe_farmers_desc:0 "The sham Union of Mixe Peasants works against, rather than in defence of, the farmers of the coffee plantations promoted by the cacique Eneedzaa."
 eneedzaa_road:0 "Sierra Madre Press Gangs"
 social_defence_militia:0 "Social Defence Militia Terror"
 social_defence_militia_desc:0 "The Social Defence Militia established by cacique Eneedzaa are used as a weapon of terror to coerce the Mixe people into submission, resorting to rape, murder and arson to enforce his rule."
 zapotec_heritage:0 "Reclaimed Zapotec Heritage"
 zapotec_heritage_desc:0 "The ruins of Lyobaa have been rehabilitated to allow the world to admire the splendour of pre-conquest Zapotec mosaics and a research centre has been built in its environs to promote a renaissance of Zapotec culture."
 cochineal_dye:0 "Cochineal Carmine Dye"
 coo_yuu:0 "Coo Yuu"
 coo_yuu_desc:0 "The Coo Yuu system allows the use of otherwise barren valleys and ravines for Maize plantation in terraces, greatly boosting the productivity of the Mixtec lands."
 colombian_clergy_privilege:0 "Privileged Clergy"
 colombian_clergy_privilege_desc:0 "The clergy of Gran Colombia enjoys a privileged position within the country, protected by Fueros that establish their rights to be judged under clerical juristiction and the inviolability of Church land."
