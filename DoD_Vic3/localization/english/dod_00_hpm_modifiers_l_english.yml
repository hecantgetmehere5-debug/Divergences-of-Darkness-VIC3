 jewish_country:0 "Jewish Religion"
 yazidi_country:0 "Yazidi Religion"
 mahayana_country:0 "Mahayana Religion"
 gelugpa_country:0 "Gelugpa Religion"
 theravada_country:0 "Theravada Religion"
 hindu_country:0 "Hindu Religion"
