 create_iberia_title:0 "Become Iberia"
 create_iberia_desc:0 "We have proven our mettle and united the Iberian peninsula under our rule. Now the time has come for a new Iberian federation to be born, one that unites all of the peninsula's cultures under a single rule."
 create_iberia2_title:0 "Become Iberia"
 create_iberia2_desc:0 "We have proven our mettle and united the Iberian peninsula under our rule. Now the time has come for a new Iberian federation to be born, one that unites all of the peninsula's cultures under a single rule."
 end_of_iberia_spain_title:0 "Become Spain"
 end_of_iberia_spain_desc:0 "The Iberian union is no longer the truth. We must put aside the fiction and become Spain in truth."
 end_of_iberia_portugal_title:0 "Become Portugal"
 end_of_iberia_portugal_desc:0 "The Iberian union is no longer the truth. We must put aside the fiction and become Portugal in truth."
 form_caliphate_title:0 "Form the Islamic Caliphate"
 form_caliphate_desc:0 "The dream of a true muslim nation: unite the peoples of Islam under a single banner, one which could make the nations of the world shake before its might and cast fear into the hearts of men so used to treating our brethren as lesser beings."
 apply_sharia_law_title:0 "Apply Sharia Law"
 apply_sharia_law_desc:0 "Ours is a nation based on fundamental religious rule. Thus it is incumbent that Sharia law be applied to its fullest extent-- in the interest of keeping peace and order."
 repeal_sharia_law_title:0 "Repeal Sharia Law"
 repeal_sharia_law_desc:0 "Ours may be an Islamic union, but it is no longer a nation based on fundamental religious rule. We must repeal the strict Sharia laws which have held back our nation for so long."
 fsa_enact_anaconda_plan_desc:0 "Originally devised by General-in-chief Winfield Scott, the Anaconda plan was a plan for subduing the Free Americans by means of a massive naval blockade, and a military advance along the coast. By initiating blockades of FSA ports, we can increase their war exhaustion by denying them essential goods."
 form_hindustan2_title:0 "Form Hindustan"
 form_hindustan2_desc:0 "We must unite the people of Hindustan under a single flag, to better resist the Imperialists from incursions into India."
 form_marathas2_title:0 "Form Marathas"
 form_marathas2_desc:0 "The Maratha Empire was once the greatest force upon the Indian subcontinent. The time has come for it to rise once more!"
 claim_greater_bengal2_title:0 "Claim Greater Bengal"
 claim_greater_bengal2_desc:0 "The Bengal Empire once ruled over much of eastern India, and the time has come to once again restake our claim. We must strike a blow against the forces of imperialism!"
 form_dravidistan2_title:0 "Form Dravidistan"
 form_dravidistan2_desc:0 "We must unite the Dravidian people under a single flag, to better resist the Imperialists from incursions into India."
 move_capital_to_niamey_title:0 "Move Capital to Niamey"
 move_capital_to_niamey_desc:0 "Niamey provides a better capital for Niger-- we should move the government there at once."
 move_capital_to_bamako_title:0 "Move Capital to Bamako"
 move_capital_to_bamako_desc:0 "Niamey provides a better capital for Mali-- we should move the government there at once."
 move_capital_to_dar_es_salaam_title:0 "Move Capital to Dar-es-Salaam"
 move_capital_to_dar_es_salaam_desc:0 "Dar-es-Salaam provides a better capital for Tanganyika-- we should move the government there at once."
 become_mali_empire_title:0 "Restore the Mali Empire"
 become_mali_empire_desc:0 "The Mali Empire was once one of the greatest kingdoms in all of Africa. Under the ancient flag we can unite the peoples of the western Sahel, and challenge the might even of the Europeans!"
 invite_greece_to_YUG_title:0 "Invite Greece Into Yugoslavia"
 invite_greece_to_YUG_desc:0 "While the Greeks are not truly considered part of the Slavic culture and are noticeably reluctant to assent to any kind of greater union of the Balkans, perhaps with enough influence and good relations we can convince them to join us."
 embrace_greeks_YUG_title:0 "Embrace Greeks"
 embrace_greeks_YUG_desc:0 "The Greeks are not truly a Slavic culture, and notoriously at odds with the rest of the Slavs. With enough effort, however, it should not be impossible to integrate them more fully into the Yugoslav culture and government. Perhaps this might even mean a future of peace between our peoples."
 embrace_polish_minority_title:0 "Embrace the Polish Minority"
 embrace_polish_minority_desc:0 "We shall embrace our Polish citizens, and elevate them to the status shared by that of the Hungarians."
 demand_retreat_from_india:0 "Demand Retreat From India"
 demand_retreat_from_india_desc:0 "The majority of India has been wrested from British control. A choice is upon us: either demand their retreat from the sub-continent, freeing all their vassals and annexed lands, or continue our war and hope to achieve our current goals. A British retreat may result in chaos, and we certainly would not attain the war goals we have in play, but it would at least take the British out of the equation for the years to come."
 move_capital_to_delhi_title:0 "Move Capital to Delhi"
 move_capital_to_delhi_desc:0 "Now that India has unified, we should consider moving the capital to a more central-- and traditional-- city. Delhi: the heart of India."
 line_of_advantage:0 "Line of Advantage"
 line_of_advantage_desc:0 "The concept of riekisen, or the 'line of advantage', means that we must extend Japanese influence beyond our national borders in order to ensure our security. This means turning all of the Japanese military, and indeed our people, to the notion of foreign conquest and glory."
 no_line_of_advantage:0 "Path of Progress"
 no_line_of_advantage_desc:0 "Instead of focusing on military might and conquest, Japanese security must be provided by devotion to technological progress and reform. We must match the Western powers, and quickly, or they will surely take advantage and find Japan sorely unprepared."
 organize_bostwana_desc:0 "We should organize the African colonies to better reflect both a local structure, as well as set up the possibility for autonomous rule -- dominated by our benevolent colonial administrators, of course."
 move_capital_to_accra_title:0 "Move Capital to Accra"
 move_capital_to_accra_desc:0 "Accra provides a better capital for our nation-- we should move the government there at once."
 self_strengthening_movement:0 "Self-Strengthening Movement"
 move_capital_to_algiers_title:0 "Move Capital to Algiers"
 move_capital_to_algiers_desc:0 "Algiers now belongs to us. It is time to move our government back to its proper place!"
 chuang_guangdong_title:0 "Chuang Guandong"
 chuang_guangdong_desc:0 "Literally 'Crashing into Guandong', this was the a policy brought into place by the Qing government which brought down the barrier to non-Manchu settlement in the northeastern frontier. With the loss of Outer Manchuria, it is vital that the frontier be populated by settlers to prevent further expansion into Chinese territory."
 treaties_of_velasco:0 "Treaties of Velasco"
 treaties_of_velasco_desc:0 "The treaties may be worth less than the paper they're printed on, but they supposedly offer us a guarantee of independence from Mexico. We shall see if they last."
 recent_crisis:0 "Recent Crisis"
 recent_crisis_desc:0 "We have been the instigators in a recent crisis. Until memories fade, the world will likely tend to overlook any further demands we make for our territories."
 rebel_cell_discovered:0 "Rebel Cell Discovered"
 rebel_cell_discovered_desc:0 "With one rebel cell uncovered, it's only a matter of time before we discover the rest and stamp them out!"
