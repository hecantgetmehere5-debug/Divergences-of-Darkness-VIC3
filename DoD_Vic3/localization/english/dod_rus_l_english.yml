l_english:
 dod_form_russia:0 "Proclaim the Tsardom of All the Russias"
 dod_form_russia_desc:0 "Our domination of the Eastern Slavs is complete, and the time has come to proclaim a single state of all the Russians. The Great Bear has risen."
 dod_rus_west_focus:0 "Russian Ambitions in the West"
 dod_rus_west_focus_desc:0 "If Russia is to become a great empire, we must decide how to deal with our strong neighbours."
 dod_rus_wild_lands:0 "The Wild Lands"
 dod_rus_wild_lands_desc:0 "We have fought the Tatars for centuries along the Don and the Volga. The balance of power now favours us."
 dod_rus_siberia:0 "Go East, Young Man"
 dod_rus_siberia_desc:0 "Russian rulers have claimed the Siberian plains since the days of Atlasov. We must keep our word."
 dod_rus_mongolia:0 "The Mongolian Protectorate"
 dod_rus_mongolia_desc:0 "Our influence in Mongolia is such that we can pry it away from the Chinese."
 dod_rus_integrate:0 "Integrate Our Neighbours"
 dod_rus_integrate_desc:0 "The peoples of our borderlands deserve full rights within the empire: Ruthenians, Tatars, Georgians, Estonians, Latvians and Finns alike."
 dod_form_tatarstan:0 "Unite the Tatars"
 dod_form_tatarstan_desc:0 "The age of the steppe warriors is over, but uniting the khanates of the European steppe would be a fitting tribute to their legacy, and a counterweight to Russia."
 dod_tar_sedentarize:0 "Encourage the Sedentarisation of the Steppes"
 dod_tar_sedentarize_desc:0 "To survive as a nation, we Tatars must give up our nomadic ways and build towns and farms."
 dod_tar_krymchak:0 "Abolish the Baddal Tax"
 dod_tar_krymchak_desc:0 "The Krymchaks are our close cultural brethren. It is time to end the special tax they have paid for centuries."
 dod_cir_break_yoke:0 "Break the Tatar Yoke"
 dod_cir_break_yoke_desc:0 "Turkic nomads have always been the enemies of the settled Adyghe tribes. It is time to throw off Xacitarxan's rule."
 dod_cir_integrate:0 "Integrate the Peoples of the Caucasus"
 dod_cir_integrate_desc:0 "The Abkhaz and Karachai are our neighbours and kin. They should be full members of our state."
 dod_cir_inal:0 "The Legacy of Inal the Great"
 dod_cir_inal_desc:0 "The Adyghe never knew greater power than under Inal the Radiant in the fifteenth century. We can restore his realm."
 dod_geo_rebel:0 "Rebel against the Turkoman"
 dod_geo_rebel_desc:0 "The Shaki Turkoman are only the latest foreign rulers to claim the martyred lands of Georgia."
 dod_form_georgia:0 "Unify Georgia"
 dod_form_georgia_desc:0 "After four centuries of division, foreign invasion and subjugation, the ancient lands of Georgia can be united once more."
 dod_geo_tamar:0 "Reclaim Queen Tamar's Realm"
 dod_geo_tamar_desc:0 "The reign of Queen Tamar was the zenith of Georgian power in the thirteenth century, stretching from the Black Sea to the Caspian."
 dod_geo_armenians:0 "Integrate the Armenians"
 dod_geo_armenians_desc:0 "Georgians and Armenians share close cultural and religious ties, and have suffered together under foreign rule."
 dod_form_transcaucasia:0 "Unite Transcaucasia"
 dod_form_transcaucasia_desc:0 "The nations of the southern Caucasus must unite into a power strong enough to withstand Russian colonialism."
 dod_tca_north_caucasus:0 "Claim the Northern Caucasus"
 dod_tca_north_caucasus_desc:0 "By right, the northern Caucasus belongs to our country, as do its people."
 dod_tca_embrace:0 "Embrace the Peoples of the Northern Caucasus"
 dod_tca_embrace_desc:0 "Our domination of the Caucasus is complete. We should extend our enlightened administration to its many peoples."
 dod_form_kazakhstan:0 "Organise Kazakhstan"
 dod_form_kazakhstan_desc:0 "The peoples of Central Asia are scattered across vast lands in feuding tribes and khanates. It is time to bring them order."
 dod_form_kyrgyzstan:0 "Become Kyrgyzstan"
 dod_form_kyrgyzstan_desc:0 "We must unite the Kyrgyz into a single modern state with sovereignty over all our ancestral lands."
 dod_russian_unity:0 "Russian Unity"
 dod_russian_unity_desc:0 "Novgorod and Muscovy are one."
 dod_don_and_volga:0 "The Don and the Volga"
 dod_don_and_volga_desc:0 "The southern rivers are Russian."
 dod_steppe_mobilisation:0 "Steppe Mobilisation"
 dod_steppe_mobilisation_desc:0 "Every rider of the steppe has answered the call."
 dod_selim_rule:0 "The Rule of Selim"
 dod_selim_rule_desc:0 "Selim III rules Crimea in the old ways."
 dod_crimean_script:0 "Crimean Latin Script"
 dod_crimean_script_desc:0 "The Crimean Tatar language has been standardised."
 dod_raids_banned:0 "Raids Banned"
 dod_raids_banned_desc:0 "Crimea no longer raids its neighbours."
 dod_sedentarisation:0 "Sedentarisation"
 dod_sedentarisation_desc:0 "The Tatars are settling into towns and farms."
 dod_rus.1.t:0 "Our Motherland Calling"
 dod_rus.1.d:0 "The obstacles to the unification of the Russian people seemed too high. No longer: one of the Russian states has gathered enough power to proclaim the Tsardom of all the Russias, and it calls on us to join."
 dod_rus.1.f:0 "For the Motherland?"
 dod_rus.1.a:0 "For the Motherland! We join the Tsardom."
 dod_rus.1.b:0 "We will never bow to them!"
 dod_rus.6.t:0 "The Russian Holdouts"
 dod_rus.6.d:0 "One of the Russian states refuses to join the Tsardom."
 dod_rus.6.f:0 "Russia will be one and indivisible."
 dod_rus.6.a:0 "Russia will be one and indivisible!"
 dod_rus.6.b:0 "Let them be, for now."
 dod_rus.2.t:0 "Russian Unity"
 dod_rus.2.d:0 "Novgorod and Muscovy are at last united, and shall never be separated again!"
 dod_rus.2.f:0 "One and indivisible!"
 dod_rus.2.a:0 "One and indivisible!"
 dod_rus.3.t:0 "The Don and the Volga"
 dod_rus.3.d:0 "The banks of the southern rivers have been secured and are no longer Tatar. The steppe belongs to Russia."
 dod_rus.3.f:0 "One and indivisible!"
 dod_rus.3.a:0 "One and indivisible!"
 dod_rus.4.t:0 "The End of Novgorodian Autonomy"
 dod_rus.4.d:0 "Novgorod and Muscovy were sworn enemies from the day the Russian principalities threw off the Mongol yoke. The once-great Republic has dwindled to a vassal, and the time has come to end its autonomy."
 dod_rus.4.f:0 "The centuries-long struggle is finally over."
 dod_rus.4.a:0 "The centuries-long struggle is finally over."
 dod_rus.5.t:0 "Russian Ambitions in the West"
 dod_rus.5.d:0 "Now that the Russian people are united, there is debate over how to deal with the states on our western border. We could push for access to the Baltic, subjugate the steppes and reach the Black Sea, or embrace Pan-Slavism and gather our Slavic brothers."
 dod_rus.5.f:0 "Where shall the Bear turn?"
 dod_rus.5.a:0 "Focus on gaining access to the Baltic Sea."
 dod_rus.5.b:0 "Subjugate the steppes and expand towards the Black Sea."
 dod_rus.5.c:0 "We must embrace Pan-Slavism!"
 dod_rus.7.t:0 "The Russian Protectorate"
 dod_rus.7.d:0 "We are a nation caught between two powers that could crush us without a thought. A Russian diplomat has arrived, offering protection in return for our fealty."
 dod_rus.7.f:0 "Protection, at a price."
 dod_rus.7.a:0 "We accept their offer."
 dod_rus.7.b:0 "We shall not submit!"
 dod_rus.8.t:0 "Weakening Moscow"
 dod_rus.8.d:0 "Muscovy is our fiercest rival and has invaded us more times than we can remember. Now it has attacked the Tatar khanates. If Copenhagen backs us, this is our chance to strike."
 dod_rus.8.f:0 "Let us try our luck!"
 dod_rus.8.a:0 "Ask Scandinavia for support."
 dod_rus.8.b:0 "We should not attempt this..."
 dod_rus.9.t:0 "The Muscovite Threat"
 dod_rus.9.d:0 "Muscovy has been a thorn in our side for centuries. Novgorod, under our protection, asks for help in a punitive expedition to weaken Moscow."
 dod_rus.9.f:0 "Weaken Moscow?"
 dod_rus.9.a:0 "It is in our interest to weaken Moscow!"
 dod_rus.9.b:0 "No; let Moscow civilise the steppe for all we care."
 dod_rus.10.t:0 "Scandinavian Support"
 dod_rus.10.d:0 "Our protectors have pledged their support. The armies of the Republic shall march on Moscow!"
 dod_rus.10.f:0 "Copenhagen has always been there for us!"
 dod_rus.10.a:0 "Copenhagen has always been there for us!"
 dod_rus.11.t:0 "Scandinavian Refusal"
 dod_rus.11.d:0 "Copenhagen is not interested in our expedition and forbids us to attack Moscow."
 dod_rus.11.f:0 "Obey, or go alone?"
 dod_rus.11.a:0 "We don't have much choice..."
 dod_rus.11.b:0 "We will do without them!"
 dod_rus.12.t:0 "War in the Steppe"
 dod_rus.12.d:0 "The vicious Russians are upon us! We must mobilise every man to fight back and keep them out of the steppe!"
 dod_rus.12.f:0 "They won't take the steppe so easily!"
 dod_rus.12.a:0 "They won't take the steppe so easily!"
 dod_rus.13.t:0 "The Succession of Selim III"
 dod_rus.13.d:0 "The succession has plagued the steppe khanates since their founding, and even Crimea, the most civilised of them, is no exception. Prince Selim is plotting against his brother Murad, the renowned general and scholar."
 dod_rus.13.f:0 "Who shall inherit the Khanate?"
 dod_rus.13.a:0 "Selim's plot succeeds and Murad is executed."
 dod_rus.13.b:0 "Selim's plot backfires and Murad becomes heir."
 dod_rus.14.t:0 "Murad II"
 dod_rus.14.d:0 "The Khan is dead, long live the Khan! Murad II, renowned general and scholar, has exiled his brother and taken the throne, promising to end obscurantism in the Khanate and restore its glory."
 dod_rus.14.f:0 "A new era for Crimea!"
 dod_rus.14.a:0 "A new era for Crimea!"
 dod_rus.15.t:0 "The Latin Script"
 dod_rus.15.d:0 "Among Murad II's many reforms, the codification of the Crimean Tatar language may be his greatest legacy. Scholars have gathered to standardise it in a new Latin alphabet."
 dod_rus.15.f:0 "How do you read this?"
 dod_rus.15.a:0 "How do you read this?"
 dod_rus.16.t:0 "The End of the Raids"
 dod_rus.16.d:0 "For centuries raiding was Crimea's main trade, its warriors clashing with Poles, Moldavians, Russians and Cossacks across the open steppe. Murad II has banned the raids in the west."
 dod_rus.16.f:0 "That should secure our western borders!"
 dod_rus.16.a:0 "That should secure our western borders!"
 dod_rus.17.t:0 "The Unification of the Steppes?"
 dod_rus.17.d:0 "For too long the steppe warriors have fought each other instead of their common foes. Murad II is determined to end the decay of the old Great Horde, starting with Xacitarxan."
 dod_rus.17.f:0 "Time to unify the Tatars?"
 dod_rus.17.a:0 "Time to unify the Tatars!"
 dod_rus.17.b:0 "It's not the right time..."
 dod_rus.18.t:0 "The Conquest of the Nogai"
 dod_rus.18.d:0 "Xacitarxan has fallen, and only the Nogai Khanate still resists. It is time to end the division of the steppe peoples and create Tatarstan!"
 dod_rus.18.f:0 "We will finish what we began."
 dod_rus.18.a:0 "We will finish what we began."
 dod_rus.18.b:0 "It's not the right time..."
