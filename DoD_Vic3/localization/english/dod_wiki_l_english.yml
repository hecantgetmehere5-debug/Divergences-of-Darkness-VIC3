 dod_wiki.1.t:0 "Opa Stein"
 dod_wiki.1.d:0 "In the great square of Prague stands the stone statue of Wenceslas, the last true Emperor, whom the people call the Stone Emperor. Soldiers marching off to war toss coins, bullets and trinkets into its fountain, and ask 'Opa Stein', Grandpa Stone, to wake from his nap at last and lead them."
 dod_wiki.1.f:0 "Wake up, Grandpa Stone!"
 dod_wiki.1.a:0 "May he watch over our soldiers."
 dod_wiki.2.t:0 "A Century Since the Stone Emperor"
 dod_wiki.2.d:0 "A hundred years ago, Wenceslas died in Prague, the last Emperor to rule the Holy Roman Empire in more than name. Crowds have gathered at his statue, and old men tell their grandchildren of the Great German War."
 dod_wiki.2.f:0 "Opa Stein sleeps on."
 dod_wiki.2.a:0 "Lay a wreath at the statue."
 dod_wiki.3.t:0 "'Ein Deutschland'"
 dod_wiki.3.d:0 "A speculative history called 'Ein Deutschland' has become the sensation of the German bookshops. It imagines that the revolutionaries of 1790 won, founded a united German republic, and that Burgundy then shattered along ethnic lines. Critics call it absurd; students read it under their desks."
 dod_wiki.3.f:0 "What if?"
 dod_wiki.3.a:0 "Ban it as seditious."
 dod_wiki.3.b:0 "Let them dream."
 dod_wiki.4.t:0 "The Treaty of Rome Remembered"
 dod_wiki.4.d:0 "Three and a half centuries ago, the Treaty of Rome ended the French Wars of Succession: the Plantagenets were recognised as Kings of France, and the Valois left with the empty title of 'Kings in France'. In Toulon, the Valois still call it the great usurpation."
 dod_wiki.4.f:0 "Of France, or in France?"
 dod_wiki.4.a:0 "The Plantagenets are the rightful kings."
 dod_wiki.4.b:0 "We have not forgotten!"
 dod_wiki.5.t:0 "Four Centuries of the Burgundian Crown"
 dod_wiki.5.d:0 "In 1484 the Treaty of Frankfurt raised Burgundy to a kingdom, and Charles the Bold was crowned at Aachen by an Emperor who had refused him for years. Four hundred years later, Anvers celebrates the day Burgundy bowed to neither Paris nor Prague."
 dod_wiki.5.f:0 "Rex Burgundicum."
 dod_wiki.5.a:0 "Long live the King of Burgundy!"
 dod_wiki.6.t:0 "The Baudissin Incident"
 dod_wiki.6.d:0 "Vinlanders still curse the name of Alfred Baudissin, the diplomat who signed away Philippa and half of Carolina at Løfby in 1831, betrayed, they say, by their own Plantagenian allies. A new pamphlet demands that the lost lands be recovered."
 dod_wiki.6.f:0 "Never forget Løfby."
 dod_wiki.6.a:0 "Løfby will be avenged!"
 dod_wiki.6.b:0 "Let old wounds heal."
 dod_wiki.7.t:0 "Marshal Geloes-Randwijck"
 dod_wiki.7.d:0 "Louise Geloes-Randwijck, hero of Waldwisse and now Chancellor of the Belgian Confederacy, has retired from public life. The nation honours the soldier who saved the Seven Republics from the Double Alliance."
 dod_wiki.7.f:0 "The hero of Waldwisse."
 dod_wiki.7.a:0 "Raise a monument in Blegny."
 dod_wiki.8.t:0 "Four Centuries since Columbus of Bayonne"
 dod_wiki.8.d:0 "Four hundred years ago, Christophe Columbus of Bayonne, sailing for the Plantagenet King, landed at what is now Bourg-du-Roi and believed he had reached Japan. The New World has never been the same."
 dod_wiki.8.f:0 "The discovery of Arcadia."
 dod_wiki.8.a:0 "Celebrate the discoverer!"
 dod_wiki.9.t:0 "The Voyages of Zheng He"
 dod_wiki.9.d:0 "Five centuries ago, the great admiral Zheng He's fleet blundered into Sanbao Bay on the far side of the ocean. The cities of Dong Guo, and Qingqiu after them, were born from that accident. The Republic honours its founder."
 dod_wiki.9.f:0 "The treasure fleets."
 dod_wiki.9.a:0 "Honour the admiral."
 dod_wiki.10.t:0 "The Last Saadi Sultan"
 dod_wiki.10.d:0 "Abd al-Malik III, the last Saadi Sultan of Morocco, has died in exile in Paris, surrounded by what remains of his court. With him dies the last hope of the old dynasty; Spain's hold on Morocco seems secure."
 dod_wiki.10.f:0 "The end of a dynasty."
 dod_wiki.10.a:0 "Requiescat."
