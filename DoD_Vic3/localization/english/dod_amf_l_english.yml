 dod_amf.1.t:0 "The Neuwelt Hansa"
 dod_amf.1.d:0 "The Neuwelt Hansa, founded in 1669 from the wreckage of the old Hanseatic League, still binds the merchant towns of the Confederacy. Its guildhalls want a say in the tariffs of the Seven Republics."
 dod_amf.1.f:0 "The merchants of the New World."
 dod_amf.1.a:0 "Grant the Hansa a voice."
 dod_amf.1.b:0 "The Republics set the tariffs."
 dod_amf.2.t:0 "The Seven Republics Remember"
 dod_amf.2.d:0 "Every year the Confederacy celebrates the revolt of 1802, when the royalist garrisons of New Burgundy were overrun and the Seven Republics proclaimed while Burgundy's armies were bleeding in Germany."
 dod_amf.2.f:0 "Liberty, won while Anvers looked away."
 dod_amf.2.a:0 "Long live the Republics!"
 dod_amf.3.t:0 "Lars Dubenson"
 dod_amf.3.d:0 "Old General Lars Dubenson, who marched across Carolina in the War of the Double Alliance, has published his memoirs. He blames Plantagenia for everything that went wrong at Waldwisse."
 dod_amf.3.f:0 "An old soldier's grudge."
 dod_amf.3.a:0 "He speaks for Vinland."
 dod_amf.3.b:0 "Disown his memoirs."
 dod_amf.4.t:0 "The Treaty of Brest"
 dod_amf.4.d:0 "In 1771 the Treaty of Brest made Charles I Plantagenet King of an independent Plantagenia. In Nouvelle Orleans the anniversary is a day of parades, and of quiet reminders that Paris once called the King a rebel."
 dod_amf.4.f:0 "The kingdom of the cadet branch."
 dod_amf.4.a:0 "God save King Charles's heirs!"
 dod_amf.5.t:0 "The Iroquois Delegation"
 dod_amf.5.d:0 "Delegates of the Haudenosaunee have come to the capital to protest settlers crossing into their remaining lands, in breach of old treaties."
 dod_amf.5.f:0 "The Six Nations speak."
 dod_amf.5.a:0 "Honour the treaties."
 dod_amf.5.b:0 "The frontier must grow."
 dod_amf.6.t:0 "The Battle of Yongle"
 dod_amf.6.d:0 "Three centuries ago, the colonists of Dong Guo defeated the Spanish conquistadors at Yongle and saved their cities on the western coast. Qingqiu still celebrates the victory that made it possible."
 dod_amf.6.f:0 "The day the conquistadors fell."
 dod_amf.6.a:0 "Remember Yongle!"
 dod_amf.7.t:0 "The Bloodless War"
 dod_amf.7.d:0 "Twenty-five years ago, the northern city-states of Dong Guo were intimidated, without a shot fired, into joining the south in a federal republic. Some northern cities still grumble that the federation was forced on them."
 dod_amf.7.f:0 "A federation born of fear."
 dod_amf.7.a:0 "Grant the cities more autonomy."
 dod_amf.7.b:0 "The Republic is one."
 dod_amf.8.t:0 "The Penal Colony's Children"
 dod_amf.8.d:0 "Kita Kaigan was settled by convicts shipped from Japan in 1668. Their descendants have become proud frontier folk, and resent being called the children of criminals."
 dod_amf.8.f:0 "Not criminals, settlers."
 dod_amf.8.a:0 "We are Kaiganese, and proud."
 dod_amf.9.t:0 "The Seminole Wars Remembered"
 dod_amf.9.d:0 "Venice bought Athesia from the Dual Monarchy in 1716 and fought the Seminole for seventy years until the last tribe surrendered in 1785. The Seminole descendants still keep the memory alive."
 dod_amf.9.f:0 "A hard-won peninsula."
 dod_amf.9.a:0 "Raise a memorial to all who fell."
 dod_amf.9.b:0 "Celebrate the conquest."
 dod_amf.20.t:0 "The Death of Bolívar"
 dod_amf.20.d:0 "Simón Bolívar fell at Lima in 1830, at the moment of victory over the Incas. Since then the Alliance has been dominated by Mexico, and many in Granada and Quito say Bolívar's dream died with him."
 dod_amf.20.f:0 "The Liberator's shadow."
 dod_amf.20.a:0 "Honour the Liberator."
 dod_amf.20.b:0 "Mexico leads now."
 dod_amf.21.t:0 "The Havana Disaster"
 dod_amf.21.d:0 "The Alliance fleet that was meant to sweep the Europeans from the Americas lies at the bottom of the sea off Havana. The admiralty demands a new fleet; the treasury despairs."
 dod_amf.21.f:0 "Never again."
 dod_amf.21.a:0 "Rebuild the fleet."
 dod_amf.21.b:0 "The army will win this war."
 dod_amf.22.t:0 "The Silver Tribute"
 dod_amf.22.d:0 "Since the sixteenth century, the Sapa Inca has paid a yearly tribute of silver to the Plantagenets for their help against the conquistadors. The Dual Monarchy has long lost interest in the Americas, but the tribute is still paid."
 dod_amf.22.f:0 "Silver for old friends."
 dod_amf.22.a:0 "Keep paying; old friends are worth it."
 dod_amf.22.b:0 "End the tribute."
 dod_amf.23.t:0 "Huayna Capac IV"
 dod_amf.23.d:0 "The Sapa Inca who allied with Spain against the Colombian revolutionaries, and sued for peace after Lima, is criticised by nobles who say he gambled the empire for Arequipa and Quito."
 dod_amf.23.f:0 "The Sapa Inca's gamble."
 dod_amf.23.a:0 "The Sapa Inca is never wrong."
 dod_amf.23.b:0 "Let the council advise him."
 dod_amf.24.t:0 "The Mapuche of Purumauca"
 dod_amf.24.d:0 "The Mapuche of Purumauca have resisted every invader since their great victory at the Graham's River two centuries ago. They will not bow now."
 dod_amf.24.f:0 "The unconquered."
 dod_amf.24.a:0 "Respect their lands."
 dod_amf.24.b:0 "Push the frontier south."
 dod_amf.30.t:0 "Camelot"
 dod_amf.30.d:0 "Founded by the Anglican exiles in 1658, Camelot is a city out of a dream of old England: Saxon halls, a round table in the royal palace, and a King who calls himself King of England without owning a stone of it."
 dod_amf.30.f:0 "The England that never was."
 dod_amf.30.a:0 "Long live the King of England!"
 dod_amf.31.t:0 "The Loyalist Exiles"
 dod_amf.31.d:0 "The Lotharingian Loyalist Party fled to Beornia in 1817 when De Aigle seized power. They still plot their return from the halls of Camelot."
 dod_amf.31.f:0 "Guests, or a liability?"
 dod_amf.31.a:0 "Shelter them."
 dod_amf.31.b:0 "Ask them to leave."
 dod_amf.32.t:0 "De Aigle's Niece"
 dod_amf.32.d:0 "The marriage of the Beornian King to the niece of Denis d'Aigle in 1827 bound Beornia and Lotharingia together. The royal couple's visit to Fort Lothere has drawn great crowds."
 dod_amf.32.f:0 "Blood and alliance."
 dod_amf.32.a:0 "A bond that will last."
 dod_amf.33.t:0 "Fort Lothère"
 dod_amf.33.d:0 "Fort Lothère was founded in 1527, one of the first Burgundian colonies in Ameriga. Its old walls still stand over the river, a reminder that Lotharingia was once ruled from Anvers."
 dod_amf.33.f:0 "The oldest city of Lotharingia."
 dod_amf.33.a:0 "Restore the old walls."
 dod_amf.34.t:0 "The Amazonian Republic"
 dod_amf.34.d:0 "In 1825 the Dual Monarchy, tired of the New World, let Amazonie go without a war. Some in Amazonie call it a gift; others say Paris simply abandoned them."
 dod_amf.34.f:0 "Freedom without a fight."
 dod_amf.34.a:0 "We earned our freedom."
 dod_amf.34.b:0 "Thank Paris for its wisdom."
 dod_amf.35.t:0 "Sudurhafeyjar"
 dod_amf.35.d:0 "The Scandinavian colony on Galatia is unruly and costly. Some in Copenhagen say it should be sold, or set free."
 dod_amf.35.f:0 "A troublesome jewel."
 dod_amf.35.a:0 "Invest in the colony."
 dod_amf.35.b:0 "Let it drift."
