l_english:
 dod_amz.1.t:0 "The Para Question"
 dod_amz.1.d:0 "The region of Para, on the west bank of the Amazon, was nominally under our protection for decades. The Amazonian settlers took advantage of the wars to seize it. Some councillors want it back, others would settle for money."
 dod_amz.1.f:0 "The Para Question"
 dod_amz.1.a:0 "They can keep it if they pay us."
 dod_amz.1.b:0 "Send this message: Para or war."
 dod_amz.1.c:0 "Why bother with some inhospitable jungle?"
 dod_amz.2.t:0 "Reparations for Para"
 dod_amz.2.d:0 "Envoys from [SCOPE.sCountry('dod_amz_claimant').GetName] have approached us about Para. They will drop the matter if we pay them reparations over the coming years."
 dod_amz.2.f:0 "Reparations for Para"
 dod_amz.2.a:0 "Just some money? Take the deal."
 dod_amz.2.b:0 "And what will they do if we don't?"
 dod_amz.3.t:0 "Para or War"
 dod_amz.3.d:0 "[SCOPE.sCountry('dod_amz_claimant').GetName] has demanded that we give up Para. If we refuse, it means war."
 dod_amz.3.f:0 "Para or War"
 dod_amz.3.a:0 "We don't have a lot of choice..."
 dod_amz.3.b:0 "Let them come!"
 dod_amz.4.t:0 "Amazonie Refuses"
 dod_amz.4.d:0 "The Amazonians will neither pay nor leave Para. Only force will settle the matter now."
 dod_amz.4.f:0 "Amazonie Refuses"
 dod_amz.4.a:0 "They want war? They'll get war!"
 dod_amz.5.t:0 "Chaos in the Federation"
 dod_amz.5.d:0 "The loss of Atlantia has left deep distrust between the government and the army, which says it was betrayed when victory was near. A circle of officers is plotting to take power."
 dod_amz.5.f:0 "Chaos in the Federation"
 dod_amz.5.a:0 "The military take control of Parliament."
 dod_amz.5.b:0 "The government breaks the high command."
 dod_amz.6.t:0 "Secession in Equinoxia"
 dod_amz.6.d:0 "The Equinoxian republic was always the most democratic part of the Federation. The end of democracy in Amazonie has its patriots talking of secession, and the Cappadocian Revolution has begun."
 dod_amz.6.f:0 "Secession in Equinoxia"
 dod_amz.6.a:0 "We will crush them!"
 dod_amz.7.t:0 "The Return of the King?"
 dod_amz.7.d:0 "Many in the military favour a monarchy for Amazonie. Two candidates have been found: the Duke of Brittany in the Old World and the Duke of Leonie in the New."
 dod_amz.7.f:0 "The Return of the King?"
 dod_amz.7.a:0 "The Duke of Brittany will be king."
 dod_amz.7.b:0 "The Duke of Leonie will be king."
 dod_amz.7.c:0 "We are fine as we are, thank you."
 dod_amz.8.t:0 "The Cythere Iron Basin"
 dod_amz.8.d:0 "Large iron deposits in Cythere have been known since the early days of Anglois colonisation, but there was never the means to work them. Modern mining could change that."
 dod_amz.8.f:0 "The Cythere Iron Basin"
 dod_amz.8.a:0 "We shall not pass over this opportunity."
