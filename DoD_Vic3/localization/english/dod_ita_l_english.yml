l_english:
 je_dod_council_of_italy:0 "The Council of Italy"
 je_dod_council_of_italy_reason:0 "We have called the Italian states to council. Every state that supports unification brings us closer; when the year is out, the Council will decide the fate of Italy."
 je_dod_greek_question:0 "The Greek Question"
 je_dod_greek_question_reason:0 "The Serenissima rules mainland Greece, but Greek patriots dream of Hellas reborn. Keep their discontent in check, make the Greeks full citizens, or face the Council of Athens."
 je_dod_greek_war:0 "The Greek War of Independence"
 je_dod_greek_war_reason:0 "Greece has risen against Venice. Crush the rebels, or lose Hellas."
 dod_call_council_of_italy:0 "Call the Council of Italy"
 dod_call_council_of_italy_desc:0 "The time has come to gather the Italian states and decide the future of the peninsula together."
 dod_form_italy:0 "Avanti Italia!"
 dod_form_italy_desc:0 "Most of the Italian lands are under our flag. It is time to proclaim the Kingdom, or Republic, of Italy."
 dod_italia_irredenta:0 "Italia Irredenta"
 dod_italia_irredenta_desc:0 "Italian lands still languish under foreign rule. We claim them all."
 dod_proclaim_aragon_italy:0 "Proclaim the Kingdom of Aragon-Italy"
 dod_proclaim_aragon_italy_desc:0 "Merging the Crowns of Aragon and Italy has been our goal for centuries. The time has come."
 dod_end_north_italian_autonomy:0 "End North Italian Autonomy"
 dod_end_north_italian_autonomy_desc:0 "The North Italians have kept their own government for too long. Time to rule them directly, whatever the cost."
 dod_provencal_catalan_brotherhood:0 "The Provencal-Catalan Brotherhood"
 dod_provencal_catalan_brotherhood_desc:0 "The Provencaux and the Catalans share a language and a history. We shall be their protectors."
 dod_valois_restore_italy:0 "Restore Our Rule over Italy"
 dod_valois_restore_italy_desc:0 "Driven from France in the Hundred Years' War, the Valois made Provence their last stand and won Tuscany through marriage. Now we can claim the crown of all Italy."
 dod_valois_challenge_usurpers:0 "Challenge the Usurpers"
 dod_valois_challenge_usurpers_desc:0 "The dream of expelling the Plantagenets from our homeland is closer than ever. Let us be recognised as the true Kings of France. Montjoie Saint-Denis!"
 dod_valois_transalpina:0 "Creation of Transalpina"
 dod_valois_transalpina_desc:0 "France has been reclaimed. We cannot rule as kings of Italy alone, so like the Plantagenets we shall rule a Dual Monarchy of French and Italians. Long live Transalpina!"
 dod_form_greece:0 "Renew Greece"
 dod_form_greece_desc:0 "The Greek lands are ours. Hellas shall be reborn."
 dod_megali_idea:0 "Megali Idea"
 dod_megali_idea_desc:0 "Every land where Greeks live shall be part of Greece."
 dod_enosis_complete:0 "Megali Idea Completed"
 dod_enosis_complete_desc:0 "Every Greek land is united in one state."
 dod_italy_united:0 "Italy United"
 dod_italy_united_desc:0 "The Italian nation is one."
 dod_council_failed:0 "The Council Failed"
 dod_council_failed_desc:0 "The Council of Italy came to nothing."
 dod_carbonari_crackdown:0 "Carbonari Crackdown"
 dod_carbonari_crackdown_desc:0 "The government is hunting the Carbonari."
 dod_carbonari_concessions:0 "Carbonari Concessions"
 dod_carbonari_concessions_desc:0 "The government has made concessions to the liberals."
 dod_regional_investment:0 "Regional Investment"
 dod_regional_investment_desc:0 "The state is investing heavily in a neglected region."
 dod_regional_neglect:0 "Regional Neglect"
 dod_regional_neglect_desc:0 "A region feels abandoned by the state."
 dod_house_of_rome_falls:0 "The House of Rome Falls"
 dod_house_of_rome_falls_desc:0 "Northern Italy has been lost."
 dod_aragon_ascendant:0 "Aragon Ascendant"
 dod_aragon_ascendant_desc:0 "The Crown of Aragon rules all of Italy."
 dod_flight_into_exile:0 "Court in Exile"
 dod_flight_into_exile_desc:0 "The court has fled its ancient heartland."
 dod_greek_rebellion_crushed:0 "Greek Rebellion Crushed"
 dod_greek_rebellion_crushed_desc:0 "The Greek revolt was defeated."
 dod_greece_lost:0 "Greece Lost"
 dod_greece_lost_desc:0 "We were forced to recognise Greek independence."
 dod_greek_mobilisation:0 "Greek Mobilisation"
 dod_greek_mobilisation_desc:0 "The whole nation fights for Greek freedom."
 dod_burgundian_loan:0 "Burgundian Loan"
 dod_burgundian_loan_desc:0 "Burgundy is financing our war effort."
 dod_venice_biennale:0 "Venice Biennale"
 dod_venice_biennale_desc:0 "The world comes to Venice for its art."
 dod_venice_1500:0 "1500 Years of Venice"
 dod_venice_1500_desc:0 "The Serenissima celebrates fifteen centuries."
 dod_scuola_commercio:0 "Scuola di Commercio"
 dod_scuola_commercio_desc:0 "A new university trains our merchants."
 dod_enosis:0 "Enosis"
 dod_enosis_desc:0 "All Greeks are united in one state."
 dod_transalpina:0 "Transalpina"
 dod_transalpina_desc:0 "The Valois rule both France and Italy."
 dod_ita.2.t:0 "Monarchists Dominate the Debates"
 dod_ita.2.d:0 "The debates on Italy's future have been split from the start between republicans and monarchists. Lately the monarchist orators have outshone ours, and many delegates are wavering."
 dod_ita.2.f:0 "The kings have their champions too."
 dod_ita.2.a:0 "We will do without them..."
 dod_ita.3.t:0 "Our Orators Dominate the Debates"
 dod_ita.3.d:0 "The debates on Italy's future have been split from the start between republicans and monarchists. Lately our orators have carried the hall, and the delegates cheer every mention of a united Italy."
 dod_ita.3.f:0 "Magnifico!"
 dod_ita.3.a:0 "Magnifico!"
 dod_ita.4.t:0 "Papal Sanction for Unification"
 dod_ita.4.d:0 "The Pope commands wide respect among the faithful in Italy and abroad. So when he declared that the idea of Italian unity was pleasing to God, many hesitant delegates came over to our side."
 dod_ita.4.f:0 "Deus vult Italiam?"
 dod_ita.4.a:0 "Magnifico!"
 dod_ita.5.t:0 "Papal Hostility to the Council"
 dod_ita.5.d:0 "The Pope has issued an encyclical against the 'sins' of the Council and called on all good Christians to denounce it. Several Catholic delegates have already left Florence."
 dod_ita.5.f:0 "Curse him!"
 dod_ita.5.a:0 "Curse him!"
 dod_ita.6.t:0 "Our Greatness"
 dod_ita.6.d:0 "We are respected as a Great Power in Europe, and the delegates see us as the natural leader of the Risorgimento."
 dod_ita.6.f:0 "We are the only chance Italy has!"
 dod_ita.6.a:0 "We are the only chance Italy has!"
 dod_ita.7.t:0 "Critics of Our Leadership"
 dod_ita.7.d:0 "We are far from respected among the European powers, and it has been hard to present ourselves as the obvious leaders of the Italians."
 dod_ita.7.f:0 "It isn't that important, is it?"
 dod_ita.7.a:0 "It isn't that important, is it?"
 dod_ita.8.t:0 "Anglois Bribes"
 dod_ita.8.d:0 "The Dual Monarchy wants an Italy favourable to its interests, and we hear that several delegates have accepted Anglois gold in exchange for their votes."
 dod_ita.8.f:0 "Damn the Anglois!"
 dod_ita.8.a:0 "Damn the Anglois!"
 dod_ita.9.t:0 "Our Lands Strengthen Our Cause"
 dod_ita.9.d:0 "With so many former duchies and principalities already under our flag, we appear stronger than ever in the negotiations."
 dod_ita.9.f:0 "Our cause is strengthened!"
 dod_ita.9.a:0 "Our cause is strengthened!"
 dod_ita.10.t:0 "Call to the Council of Italy"
 dod_ita.10.d:0 "[global_var:dod_council_host.GetName] has called a council of the Italian states to further the cause of unification. Should we support it?"
 dod_ita.10.f:0 "Italy, or our crown?"
 dod_ita.10.a:0 "Push for unification."
 dod_ita.10.b:0 "Resist unification."
 dod_ita.15.t:0 "The Council of Italy Closes"
 dod_ita.15.d_success:0 "There has been enough support for unification for the Council of Italy to be declared a success. The states that answered our call join us in a single Italy. We must now watch how the Great Powers react, and invite the holdouts to reconsider."
 dod_ita.15.d_partial:0 "The Council has enlarged our state, as several Italian governments have chosen to join us, but it was not enough to create a true Italy. Still, the Italians now look to us."
 dod_ita.15.d_failure:0 "There was not enough support for unification, and the Council of Italy has failed. Only foreign intervention or a strong Italian state can give hope to the patriots now."
 dod_ita.15.f:0 "The Council has spoken."
 dod_ita.15.a:0 "Avanti Italia!"
 dod_ita.16.t:0 "Reconsidering Unification"
 dod_ita.16.d:0 "Italy has been proclaimed, and its new government asks us to reconsider joining. A refusal may well lead to war."
 dod_ita.16.f:0 "Join Italy, or stand alone?"
 dod_ita.16.a:0 "Join Italy."
 dod_ita.16.b:0 "Refuse the offer."
 dod_ita.17.t:0 "The Holdouts Refuse"
 dod_ita.17.d:0 "One of the Italian states has refused to join the new Italy."
 dod_ita.17.f:0 "Italy will be whole."
 dod_ita.17.a:0 "Italy will be whole!"
 dod_ita.17.b:0 "Let them be, for now."
 dod_ita.20.t:0 "The Carbonari"
 dod_ita.20.d:0 "The counter-revolution won in Italy through sheer numbers, but the spirit of the Revolution lives on. Many leaders of the old sister republics have fled to Florence, and the Carbonari circles count high officials in every Italian court."
 dod_ita.20.f:0 "Unione, Forza e Liberta!"
 dod_ita.20.a:0 "Activate our cells in Italy!"
 dod_ita.20.b:0 "It is too dangerous!"
 dod_ita.21.t:0 "Carbonari Uprising"
 dod_ita.21.d:0 "The Etrurians are causing trouble in Italy once more. Members of the Carbonari secret society have used their influence in the government and army to stir up unrest."
 dod_ita.21.f:0 "The Revolution has failed before, and will fail again!"
 dod_ita.21.a:0 "Crush them!"
 dod_ita.21.b:0 "Grant some concessions."
 dod_ita.22.t:0 "Andrea Doria"
 dod_ita.22.d:0 "The Doria family is one of the most powerful aristocratic houses of Genoa. Andrea Doria, once Consul of the short-lived Ligurian Republic, wants to return home and restore it. He asks for our blessing."
 dod_ita.22.f:0 "We hope for his success!"
 dod_ita.22.a:0 "We hope for his success!"
 dod_ita.23.t:0 "The Thousand Dorians"
 dod_ita.23.d_win:0 "Andrea Doria and his Thousand have entered Genoa to cheering crowds. The oligarchs have fled, and the Ligurian Republic is proclaimed anew, a sister to Etruria."
 dod_ita.23.d_lose:0 "The oligarchs turned the army on Doria's Thousand. He and his followers have been executed, and the crowds who came to cheer them were fired upon."
 dod_ita.23.f:0 "Genoa decides."
 dod_ita.23.a:0 "So be it."
 dod_ita.24.t:0 "Francesco Pepe"
 dod_ita.24.d:0 "Francesco Pepe, who led the Parthenopean Republic during the German Wars, has slipped back into Naples, where the Carbonari are preparing a rising against Aragon. He did not ask our leave, but his success would serve the Republic."
 dod_ita.24.f:0 "He should at least have asked us!"
 dod_ita.24.a:0 "He should at least have asked us!"
 dod_ita.25.t:0 "Rebellion in Naples!"
 dod_ita.25.d:0 "Rumours say that Francesco Pepe, the Neapolitan traitor of the German Wars, has returned and is stirring up rebellion. The Etrurians are surely behind this."
 dod_ita.25.f:0 "Damn the Carbonari!"
 dod_ita.25.a:0 "Hunt him down. Etruria will answer for this."
 dod_ita.25.b:0 "Let it pass."
 dod_ita.26.t:0 "Renewing the Etrurian Wars"
 dod_ita.26.d:0 "Etruria has become a threat to our leadership in Italy once more. Its agents have spread disorder throughout the peninsula and now in our own provinces. We must act."
 dod_ita.26.f:0 "We will take Tuscany, once and for all!"
 dod_ita.26.a:0 "We will take Tuscany, once and for all!"
 dod_ita.26.b:0 "We must not threaten the Italian order."
 dod_ita.30.t:0 "Risorgimento!"
 dod_ita.30.d:0 "The Italian nation is united, and it will never be divided again!"
 dod_ita.30.f:0 "Viva l'Italia!"
 dod_ita.30.a:0 "Viva l'Italia!"
 dod_ita.31.t:0 "La Questione Meridionale"
 dod_ita.31.d:0 "The Mezzogiorno is free, but the gulf between South and North remains vast. Industry flourishes in Lombardy while the South remains poor and rural, and many southerners feel forgotten by Rome."
 dod_ita.31.f:0 "One Italy, two worlds."
 dod_ita.31.a:0 "We will make them an offer they can't refuse."
 dod_ita.31.b:0 "We can spend a little, but it is not a priority."
 dod_ita.31.c:0 "Let them complain."
 dod_ita.32.t:0 "The Arborean Islands"
 dod_ita.32.d:0 "Sardinia and Corsica are the most troublesome provinces of Italy. Their isolation makes them hard to govern, and the islanders see little benefit in union."
 dod_ita.32.f:0 "Arborea is as Italian as Rome!"
 dod_ita.32.a:0 "We will make them an offer they can't refuse."
 dod_ita.32.b:0 "We can spend a little, but it is not a priority."
 dod_ita.32.c:0 "Let them complain."
 dod_ita.33.t:0 "Venetian Complaints"
 dod_ita.33.d:0 "The Venetians stayed largely neutral during unification and joined late. They now complain that the new state ignores their language and their glorious past."
 dod_ita.33.f:0 "The Lion of Saint Mark growls."
 dod_ita.33.a:0 "We will do everything to avoid their marginalisation!"
 dod_ita.33.b:0 "We can spend a little, but it is not a priority."
 dod_ita.33.c:0 "Let them complain."
 dod_ita.34.t:0 "The Greek Problem"
 dod_ita.34.d:0 "Greece was 'protected' by the Serenissima after the Ottoman collapse. We now hold these lands, and some suggest granting the Greeks autonomy."
 dod_ita.34.f:0 "What to do with Hellas?"
 dod_ita.34.a:0 "Greece shall be autonomous."
 dod_ita.34.b:0 "We will keep Greece, for now."
 dod_ita.34.c:0 "We will keep all of Greece!"
 dod_ita.35.t:0 "The Society for the Economic Development of Albania"
 dod_ita.35.d:0 "For centuries the Strait of Otranto has been a bridge between Italy and the Balkans. Investors propose a programme of generous loans to Albania, in exchange for recognition of our special interests there."
 dod_ita.35.f:0 "Money opens doors."
 dod_ita.35.a:0 "Propose the programme to the Albanians."
 dod_ita.35.b:0 "We can't afford such ventures."
 dod_ita.36.t:0 "Italy Proposes Investment"
 dod_ita.36.d:0 "Italian diplomats offer generous loans in exchange for recognising Italy's special interests in our country. The money is tempting, but the strings are plain to see."
 dod_ita.36.f:0 "Italian gold, Italian chains?"
 dod_ita.36.a:0 "Agree to the development pact."
 dod_ita.36.b:0 "We won't become puppets of the Italians."
 dod_ita.37.t:0 "The Albanians Refuse"
 dod_ita.37.d:0 "The Albanians have rejected our programme. Some in the government suggest a more direct approach: the Albanian King is due to sail to Brindisi for talks, and the sea is a dangerous place."
 dod_ita.37.f:0 "Albania descends into chaos?"
 dod_ita.37.a:0 "Restore order in Albania."
 dod_ita.37.b:0 "We won't tarnish our reputation over Albania."
 dod_ita.40.t:0 "The King of Aragon Proclaims Himself King of Italy"
 dod_ita.40.d:0 "The King of Aragon has been proclaimed king of a unified Aragon-Italy and has moved his court to Rome. The balance of the Mediterranean has been upended."
 dod_ita.40.f:0 "But does he have the might to match his ambitions?"
 dod_ita.40.a:0 "We will watch him closely."
 dod_ita.41.t:0 "The War over Italy"
 dod_ita.41.d:0 "Resentment of Aragonese rule in northern Italy has exploded into open rebellion, with bloody street battles from Milan to Turin. The Lombard rebels have proclaimed a republic."
 dod_ita.41.f:0 "A fight to the finish."
 dod_ita.41.a:0 "A fight to the finish!"
 dod_ita.41.b:0 "Let the North go."
 dod_ita.42.t:0 "The Fall of the House of Rome?"
 dod_ita.42.d:0 "Our armies have been beaten, unable to stop the Milanese rebels. What seemed a minor revolt has cost us all of northern Italy."
 dod_ita.42.f:0 "Renaixerem."
 dod_ita.42.a:0 "Renaixerem."
 dod_ita.43.t:0 "Aragon Ascendant"
 dod_ita.43.d:0 "As Aragonese troops march through the Porta Giovia in Milan, it is clear that the Lombard bid for freedom was nothing but a dream. The north is ours, and its people will now be full subjects of the Crown."
 dod_ita.43.f:0 "How could they even dream of freedom?"
 dod_ita.43.a:0 "How could they even dream of freedom?"
 dod_ita.44.t:0 "The Provencal-Catalan Union"
 dod_ita.44.d:0 "The Aragonese King has proclaimed himself protector of the Provencal people, and now claims part of our territory as his own!"
 dod_ita.44.f:0 "Those bloody bastards!"
 dod_ita.44.a:0 "Those bloody bastards!"
 dod_ita.45.t:0 "The Hafsid Protectorate"
 dod_ita.45.d:0 "The Hafsid Kingdom long threatened Aragonese dominance of the Mediterranean, until its ruler bowed before Aragon. The Hafsids keep their throne, but a border incident gives us the chance to finish what we started."
 dod_ita.45.f:0 "Time to end the Hafsids?"
 dod_ita.45.a:0 "Time to finish what we started!"
 dod_ita.45.b:0 "We have better things to do..."
 dod_ita.46.t:0 "The Aragonese Ultimatum"
 dod_ita.46.d:0 "Our independence has always been precarious, with Aragon ready to end our kingdom at the first misstep. Yesterday a border incident escalated, and Aragon now demands our submission."
 dod_ita.46.f:0 "Submit, or fight?"
 dod_ita.46.a:0 "We shall not surrender our independence!"
 dod_ita.46.b:0 "Give up; we can't fight them..."
 dod_ita.47.t:0 "Ultimatum Denied"
 dod_ita.47.d:0 "The Hafsids have decided to fight for their land, whatever the cost."
 dod_ita.47.f:0 "That makes no difference in the end."
 dod_ita.47.a:0 "That makes no difference in the end."
 dod_ita.48.t:0 "The Navarrans in Aragon"
 dod_ita.48.d:0 "Now that our rightful inheritance is secure, we shall grant the people of the Navarrese lands full citizenship."
 dod_ita.48.f:0 "Welcome."
 dod_ita.48.a:0 "Welcome."
 dod_ita.49.t:0 "Flight to Sicily"
 dod_ita.49.d:0 "Dark clouds loom over the Crown of Aragon as its Iberian heartland shrinks year after year. The ancient Crown Lands have fallen, and the court has no choice but to flee to its Italian domains."
 dod_ita.49.f:0 "I should go and pack."
 dod_ita.49.a:0 "I should go and pack."
 dod_ita.50.t:0 "Pre-eminence in Etruria"
 dod_ita.50.d:0 "The Duchy of Lucca has refused to accept our renewed role in Tuscany and proclaims itself free of any feudal tie to us. The claim is obscure, but we could press it."
 dod_ita.50.f:0 "Lucca will bow."
 dod_ita.50.a:0 "Press our claim on Lucca."
 dod_ita.50.b:0 "Leave Lucca be."
 dod_ita.51.t:0 "The Valois Demands"
 dod_ita.51.d:0 "The Valois threaten to press their claim on our duchy unless we bow to them. Many in Italy would help us if they invaded, and a new anti-Valois league is forming."
 dod_ita.51.f:0 "Feudalism is over!"
 dod_ita.51.a:0 "Feudalism is over! We will not submit!"
 dod_ita.51.b:0 "We welcome our Valois overlords."
 dod_ita.52.t:0 "The Luccan League"
 dod_ita.52.d:0 "The Duke of Lucca, threatened time and again by the Valois, asks us to join a league to defend Tuscany from them."
 dod_ita.52.f:0 "Italy for the Italians!"
 dod_ita.52.a:0 "We will help our Italian brothers against the Valois!"
 dod_ita.52.b:0 "Helping Lucca is not in our interest."
 dod_ita.53.t:0 "Response from Lucca"
 dod_ita.53.d:0 "The Duke of Lucca has refused our demands and is gathering the support of the Italian princes against us. We could try to force them all to bow, but it would be a hard war."
 dod_ita.53.f:0 "We will subdue all of them!"
 dod_ita.53.a:0 "We will subdue all of them!"
 dod_ita.53.b:0 "Lucca can keep its independence after all..."
 dod_ita.54.t:0 "The Restoration of Order in Etruria"
 dod_ita.54.d:0 "The Republic of Etruria is a threat to the Italian order. Aragon is reluctant to go to war, but we have not forgotten our right to the Grand Duchy of Tuscany."
 dod_ita.54.f:0 "Nous reprendrons nos droits!"
 dod_ita.54.a:0 "Nous reprendrons nos droits!"
 dod_ita.54.b:0 "The risk is too great..."
 dod_ita.55.t:0 "The Italian Crown"
 dod_ita.55.d:0 "Merging the Crowns of Italy and Aragon has been our goal for centuries. Now the Valois have claimed the Italian crown and stir up the south against us. If we want to remain a Great Power, we cannot allow it."
 dod_ita.55.f:0 "We won't allow a Valois Italy!"
 dod_ita.55.a:0 "We won't allow a Valois Italy!"
 dod_ita.55.b:0 "Italy is lost to us."
 dod_ita.56.t:0 "The Capital of Transalpina"
 dod_ita.56.d:0 "We have forged a new union that joins our claims on France and Italy. But where shall we rule? The revanchists of the royal family want Paris; others insist on eternal Rome."
 dod_ita.56.f:0 "Where does Transalpina's heart lie?"
 dod_ita.56.a:0 "Rome is eternal..."
 dod_ita.56.b:0 "Paris is the true capital!"
 dod_ita.56.c:0 "Compromise: Toulon it is."
 dod_ita.60.t:0 "Greek Nationalism"
 dod_ita.60.d:0 "Venice's hold on Greece has been fragile since the occupation began during the Ottoman collapse. With the spread of liberal ideas, Greek patriots now demand a national council in Athens to decide the future of Hellas."
 dod_ita.60.f:0 "Either freedom, or death."
 dod_ita.60.a:0 "Let them hold their council; what could go wrong?"
 dod_ita.60.b:0 "No council. Crush the agitators!"
 dod_ita.61.t:0 "The Council of Athens"
 dod_ita.61.d:0 "The Greek council has opened in Athens. Three great factions have formed: the Zimisceses, who demand full independence; the Exarchates, who seek home rule; and the Pireans, loyal to Venice in exchange for political rights."
 dod_ita.61.f:0 "Let us hear the results."
 dod_ita.61.a:0 "Let us hear the results."
 dod_ita.62.t:0 "The Zimisceses' Victory"
 dod_ita.62.d:0 "Konstantinos Zimisces and his faction have taken power and declared Greece independent. Every Greek province has risen."
 dod_ita.62.f:0 "Secession is not an option!"
 dod_ita.62.a:0 "Secession is not an option!"
 dod_ita.62.b:0 "If the Greeks want to go, we will let them go."
 dod_ita.63.t:0 "The Exarchates' Victory"
 dod_ita.63.d:0 "The Exarchates have won the most votes. They ask for a compromise: mainland Greece would govern itself under the protection of the Serenissima."
 dod_ita.63.f:0 "Home Rule, or war?"
 dod_ita.63.a:0 "We will grant them Home Rule."
 dod_ita.63.b:0 "Independence is not an option!"
 dod_ita.64.t:0 "The Pireans' Victory"
 dod_ita.64.d:0 "Unexpectedly, the loyalists have won the most votes. They will stay under Venetian rule, but only if the Greeks receive full political rights."
 dod_ita.64.f:0 "A Serenissima of two peoples?"
 dod_ita.64.a:0 "Venice will reform itself into a full republic."
 dod_ita.64.b:0 "Crown the Doge as King of the Venetians and the Greeks."
 dod_ita.64.c:0 "Political rights for Greeks? What madness is this?"
 dod_ita.65.t:0 "The Greek Rebellion Crushed!"
 dod_ita.65.d:0 "Venice has reclaimed every rebel province. Zimisces has been captured and executed in Athens."
 dod_ita.65.f:0 "Venice is here to stay!"
 dod_ita.65.a:0 "Venice is here to stay!"
 dod_ita.66.t:0 "The Treaty of Corfu"
 dod_ita.66.d:0 "The war with Greece is lost. Guaranteed by the Great Powers, Zimisces has forced a humiliating treaty on us: Venice must recognise Greek independence."
 dod_ita.66.f:0 "For the good of the Republic, we must retreat."
 dod_ita.66.a:0 "For the good of the Republic, we must retreat."
 dod_ita.67.t:0 "The Council of Delphi"
 dod_ita.67.d:0 "Greece has won its independence, but a new question arises. Zimisces held every power during the revolution, yet no constitution has been agreed. Greek representatives have gathered in Delphi to decide the shape of the new state."
 dod_ita.67.f:0 "What shall Hellas be?"
 dod_ita.67.a:0 "Crown Konstantinos Zimisces King of the Hellenes."
 dod_ita.67.b:0 "Offer the crown to the King of Macedonia."
 dod_ita.67.c:0 "The Hellenic Republic will be a beacon of democracy."
 dod_ita.68.t:0 "Fight for Freedom!"
 dod_ita.68.d:0 "We are at war with Venice for our freedom. Every village is sending its sons, and every church its bells to be melted into cannon."
 dod_ita.68.f:0 "Greece will be free!"
 dod_ita.68.a:0 "Greece will be free!"
 dod_ita.70.t:0 "The Greeks Request Financial Aid"
 dod_ita.70.d:0 "It has been months since the Greeks rose against their Venetian overlords, and the fighting shows no sign of ending. Greek diplomats ask us for loans and arms."
 dod_ita.70.f:0 "Help the Greeks, or keep Venice's trade?"
 dod_ita.70.a:0 "We will help the Greeks."
 dod_ita.70.b:0 "Venice is a more reliable trading partner."
 dod_ita.71.t:0 "Intervention in the Greek War?"
 dod_ita.71.d:0 "Diplomats of the unrecognised Hellenic Republic propose to lease us ports in exchange for military aid against Venice."
 dod_ita.71.f:0 "Desperta ferro?"
 dod_ita.71.a:0 "We will help Greece."
 dod_ita.71.b:0 "We don't need more trouble in Italy."
 dod_ita.72.t:0 "The Crown of Greece"
 dod_ita.72.d:0 "The Council of Delphi has offered us the crown of Greece. In exchange, the Greek liberals demand a constitution and political reforms."
 dod_ita.72.f:0 "Basileus of Hellas?"
 dod_ita.72.a:0 "We are a Greek state now!"
 dod_ita.72.b:0 "We will not accept a crown from the gutter!"
 dod_ita.73.t:0 "Flight to Greece"
 dod_ita.73.d:0 "The defeat is total. We have been driven from our lagoon by the Italian nationalists. But the Serenissima lives on in its Greek domains, and there we shall make our stand."
 dod_ita.73.f:0 "We are true Hellenes now."
 dod_ita.73.a:0 "We are true Hellenes now."
 dod_ita.74.t:0 "The Proclamation of the Republic of San Marco"
 dod_ita.74.d:0 "Our defeat by the Greek rebels has exposed our merchant oligarchy as unfit for the modern age. The people of Venice have proclaimed a new Republic of San Marco."
 dod_ita.74.f:0 "A new beginning for the Serenissima."
 dod_ita.74.a:0 "A new beginning for the Serenissima."
 dod_ita.75.t:0 "The Death of the Doge"
 dod_ita.75.d:0 "Silvestro Dandolo has died in the Doge's Palace at the honourable age of 81. The election of his successor has brought the Greek question into the open, with three men contending for the office."
 dod_ita.75.f:0 "Who shall be Doge?"
 dod_ita.75.a:0 "Daniele Manin, the nationalist, will be Doge."
 dod_ita.75.b:0 "Antonio Salviati, patron of the arts, is the new Doge."
 dod_ita.75.c:0 "Giovanni Albrizzi, friend of the Greeks, seems the best choice."
 dod_ita.76.t:0 "The Opening of the Venice Biennale"
 dod_ita.76.d:0 "After the great restoration of Venice, an international art exhibition has been organised in the city. Artists from across the world have come to compete for its prizes."
 dod_ita.76.f:0 "Who won the grand prize?"
 dod_ita.76.a:0 "Who won the grand prize?"
 dod_ita.77.t:0 "The 1500th Anniversary of Venice"
 dod_ita.77.d:0 "The 25th of March is the traditional date of the founding of our city, when Roman citizens fleeing the Goths and Huns took refuge in the lagoon. Fifteen centuries later, the Serenissima still stands."
 dod_ita.77.f:0 "The most serene of all republics!"
 dod_ita.77.a:0 "Our Republic is truly the most serene of all!"
 dod_ita.78.t:0 "The Scuola Superiore di Commercio"
 dod_ita.78.d:0 "The Great Council has set aside part of the budget for a new university to train the merchants and administrators of the Republic. Where shall it be built?"
 dod_ita.78.f:0 "Knowledge is the Republic's wealth."
 dod_ita.78.a:0 "In Venice: we will restore the old Ca' Foscari palace."
 dod_ita.78.b:0 "In Athens: a brand new university for our Greek subjects."
 dod_ita.79.t:0 "The Restoration of the Ecumenical Patriarchate"
 dod_ita.79.d:0 "With every Greek land united in one state, the Patriarchate of Constantinople has regained its power and prestige among the Orthodox faithful."
 dod_ita.79.f:0 "May it never change!"
 dod_ita.79.a:0 "May it never change!"
