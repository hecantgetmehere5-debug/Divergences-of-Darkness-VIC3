l_english:
 dod_seoul_treaty:0 "The Seoul Treaty"
 dod_seoul_treaty_desc:0 "Korea must be brought under our protection before the Chinese or the Europeans take it."
 dod_hawaii_offer:0 "Protection for Hawaii"
 dod_hawaii_offer_desc:0 "The Hawaiian islands would make an ideal outpost in the Pacific."
 dod_ainu_protectorate:0 "Annex the Ainu Protectorate"
 dod_ainu_protectorate_desc:0 "The Ainu lands of the north have been under our protection long enough."
 dod_integrate_kaiganese:0 "Integration of the Kaiganese"
 dod_integrate_kaiganese_desc:0 "The Japanese settlers of Kita Kaigan are our people."
 dod_unequal_treaty_decision:0 "Demand an Unequal Treaty"
 dod_unequal_treaty_decision_desc:0 "China is weak and divided. We can force it to open its ports to our trade."
 dod_zhourao_destiny:0 "Austral Destiny"
 dod_zhourao_destiny_desc:0 "The southern continent is vast and open. Zhourao will claim it."
 dod_zhourao_tributaries:0 "Harmonise All Under Heaven"
 dod_zhourao_tributaries_desc:0 "Our tributaries should become part of Zhourao itself."
 dod_indochina_old_borders:0 "Re-establish the Old Borders"
 dod_indochina_old_borders_desc:0 "Vietnam once ruled the Khmer and Lao lands."
 dod_khmer_peninsula:0 "The Khmer Peninsula"
 dod_khmer_peninsula_desc:0 "Siam must be the sole master of the peninsula."
 dod_form_nusantara:0 "Form Nusantara"
 dod_form_nusantara_desc:0 "The islands of the archipelago must be one nation."
 dod_greater_nusantara:0 "Spread the Name of Nusantara"
 dod_greater_nusantara_desc:0 "Every island of the archipelago belongs to Nusantara."
 dod_form_dravida:0 "Form Dravida"
 dod_form_dravida_desc:0 "The Dravidian peoples of the south must unite."
 dod_form_bharata:0 "Form Bharata"
 dod_form_bharata_desc:0 "The peoples of the Ganges must unite."
 dod_form_rajputana:0 "Form Rajputana"
 dod_form_rajputana_desc:0 "The Rajput princes must stand together."
 dod_gate_of_india:0 "The Gate of India"
 dod_gate_of_india_desc:0 "The Punjab and Sindh are the gateway to India."
 dod_organize_christiania:0 "Organise Christiania"
 dod_organize_christiania_desc:0 "Our Filipino colony could govern itself as a dominion."
 dod_rising_sun:0 "The Rising Sun"
 dod_rising_sun_desc:0 "Japan stands among the Great Powers."
 dod_loyalist_kaigan:0 "Loyalist Kaigan"
 dod_loyalist_kaigan_desc:0 "Kita Kaigan remains loyal to the Emperor."
 dod_unequal_treaty:0 "Unequal Treaty"
 dod_unequal_treaty_desc:0 "Foreign powers dictate terms to us."
 dod_china_trade:0 "China Trade"
 dod_china_trade_desc:0 "Our merchants trade freely in China."
 dod_weisuo_abolished:0 "Weisuo Abolished"
 dod_weisuo_abolished_desc:0 "A modern army replaces the old military colonies."
 dod_chinese_cotton:0 "Chinese Cotton Mills"
 dod_chinese_cotton_desc:0 "Cotton mills spread along the Yangzi."
 dod_dzungar_succession:0 "Dzungar Succession"
 dod_dzungar_succession_desc:0 "A new Khan rules the Dzungars."
 dod_urumqi_university:0 "University of Urumqi"
 dod_urumqi_university_desc:0 "A university brings learning to the steppe."
 dod_nusantara_ascendant:0 "Nusantara Ascendant"
 dod_nusantara_ascendant_desc:0 "The archipelago is united."
 dod_asi.1.t:0 "The Seoul Treaty"
 dod_asi.1.d:0 "Japanese envoys have arrived in Seoul with a treaty that would place Korea under Japanese protection. They promise to defend us from the Chinese; they do not say what happens if we refuse."
 dod_asi.1.f:0 "Protection, or defiance?"
 dod_asi.1.a:0 "Sign the treaty."
 dod_asi.1.b:0 "Korea will not bow to Japan!"
 dod_asi.2.t:0 "The Korean War"
 dod_asi.2.d:0 "Korea has refused the Seoul Treaty. The army is ready to cross the strait."
 dod_asi.2.f:0 "To Seoul!"
 dod_asi.2.a:0 "To Seoul!"
 dod_asi.2.b:0 "Not yet."
 dod_asi.3.t:0 "A New Power in the East"
 dod_asi.3.d:0 "Japan has modernised its army and navy and now stands among the Great Powers of the world. The Europeans can no longer ignore the Rising Sun."
 dod_asi.3.f:0 "The Rising Sun."
 dod_asi.3.a:0 "Banzai!"
 dod_asi.4.t:0 "Japan Offers Protection"
 dod_asi.4.d:0 "The Japanese offer to take our islands under their protection, as the Europeans circle the Pacific."
 dod_asi.4.f:0 "Japanese protection?"
 dod_asi.4.a:0 "Hawaii agrees."
 dod_asi.4.b:0 "Hawaii refuses!"
 dod_asi.5.t:0 "A State in Manchuria"
 dod_asi.5.d:0 "Our armies hold the Manchu homeland. Rather than rule it directly, we could set up a Manchu state under our protection."
 dod_asi.5.f:0 "Manchukuo?"
 dod_asi.5.a:0 "Create Manchukuo."
 dod_asi.5.b:0 "We will rule Manchuria ourselves."
 dod_asi.6.t:0 "The Kaiganese Independence Committee"
 dod_asi.6.d:0 "Japanese settlers in Kita Kaigan, across the Pacific in Arcadia, have formed an Independence Committee. They are tired of taking orders from Tokyo."
 dod_asi.6.f:0 "Independence, or loyalty?"
 dod_asi.6.a:0 "Declare independence!"
 dod_asi.6.b:0 "We remain loyal to the Emperor."
 dod_asi.7.t:0 "Nanshin-ron"
 dod_asi.7.d:0 "The 'Southern Expansion Doctrine' has many supporters in Tokyo: the islands of the south are rich, poorly defended and close at hand."
 dod_asi.7.f:0 "South, or north?"
 dod_asi.7.a:0 "Pursue the south!"
 dod_asi.7.b:0 "Claim the Pacific islands."
 dod_asi.7.c:0 "Our destiny lies elsewhere."
 dod_asi.10.t:0 "The Unequal Treaty"
 dod_asi.10.d:0 "A foreign power demands that we open our ports to its merchants, grant its citizens immunity from our laws, and pay for the 'insults' its traders have suffered. Refusal means war."
 dod_asi.10.f:0 "Bow to the barbarians?"
 dod_asi.10.a:0 "We have no choice. Sign it."
 dod_asi.10.b:0 "Never!"
 dod_asi.11.t:0 "They Refuse the Treaty"
 dod_asi.11.d:0 "The Chinese have refused our demands. Our gunboats are ready."
 dod_asi.11.f:0 "Gunboat diplomacy."
 dod_asi.11.a:0 "Send the gunboats!"
 dod_asi.11.b:0 "Not worth a war."
 dod_asi.12.t:0 "The End of the Weisuo System"
 dod_asi.12.d:0 "The weisuo, the hereditary military colonies that have guarded China for centuries, are hopelessly outdated. Reformers want to replace them with a modern standing army."
 dod_asi.12.f:0 "Reform the army?"
 dod_asi.12.a:0 "Abolish the weisuo."
 dod_asi.12.b:0 "Preserve the old system."
 dod_asi.13.t:0 "The Cotton Industry in China"
 dod_asi.13.d:0 "Mills are springing up along the Yangzi, spinning Chinese cotton for Chinese markets."
 dod_asi.13.f:0 "Industry comes to China."
 dod_asi.13.a:0 "Encourage the mills."
 dod_asi.20.t:0 "The Death of Galdan Khan"
 dod_asi.20.d:0 "Galdan Khan, who led the Dzungars for decades, has died. His sons and the great noyons are already gathering their riders."
 dod_asi.20.f:0 "The Khan is dead."
 dod_asi.20.a:0 "Long live the new Khan!"
 dod_asi.21.t:0 "The Legacy of Genghis"
 dod_asi.21.d:0 "The Dzungars are the last great power of the steppe. The Tarim, the Kazakh steppe and the Mongol lands all lie open to our riders."
 dod_asi.21.f:0 "Where shall the horde ride?"
 dod_asi.21.a:0 "Reclaim the Tarim Basin."
 dod_asi.21.b:0 "Gather the Mongols."
 dod_asi.21.c:0 "Submit the Kazakhs."
 dod_asi.22.t:0 "The Dalai Lama"
 dod_asi.22.d:0 "The Dalai Lama has asked for our protection against those who would interfere in Tibet."
 dod_asi.22.f:0 "Protector of the faith."
 dod_asi.22.a:0 "Tibet will be under our protection."
 dod_asi.22.b:0 "Tibet must fend for itself."
 dod_asi.23.t:0 "Submitting to the Dzungars"
 dod_asi.23.d:0 "The Dzungars offer to protect the Dalai Lama and Tibet."
 dod_asi.23.f:0 "Accept their protection?"
 dod_asi.23.a:0 "Accept."
 dod_asi.23.b:0 "Refuse."
 dod_asi.24.t:0 "The Modernisation of the Steppe"
 dod_asi.24.d:0 "Travellers returning from Europe bring tales of railways, rifles and universities. A university in Urumqi and a new script for our language are being debated."
 dod_asi.24.f:0 "The steppe meets the modern age."
 dod_asi.24.a:0 "Found the University of Urumqi."
 dod_asi.24.b:0 "Keep the old ways."
 dod_form_india:0 "Form Hindustan"
 dod_form_india_desc:0 "The peoples of the subcontinent have been divided since the decline of the Mughals. Whoever unites them can proclaim Hindustan."
