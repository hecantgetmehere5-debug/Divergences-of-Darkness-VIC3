l_english:
 je_dod_crown_of_st_stephen:0 "The Crown of Saint Stephen"
 je_dod_crown_of_st_stephen_reason:0 "The Holy Crown of Saint Stephen, without which no King of Hungary is truly crowned, sits in the treasury of Prague. Gabor I must win it back from Emperor Sigismund V, by diplomacy, humility or theft."
 je_dod_crown_of_st_stephen_completed_desc:0 "The Holy Crown has returned to Buda and Gabor I has been crowned King of Hungary."
 je_dod_crown_of_st_stephen_failed_desc:0 "Hungary has given up on the Crown. Its kings will rule without the blessing of Saint Stephen."
 je_dod_crown_of_st_stephen_timeout_desc:0 "Years have passed and the Crown is still in Prague."
 je_dod_crown_of_st_stephen_invalid_desc:0 "The question of the Crown no longer applies."
 je_dod_hungarian_centralisation:0 "The Centralisation of Hungary"
 je_dod_hungarian_centralisation_reason:0 "Three centuries of Ottoman rule left Hungary a patchwork of privileged nations, autonomous lands and seigneurial courts. Five great reforms would turn it into a modern kingdom governed from Buda."
 je_dod_hungarian_centralisation_completed_desc:0 "The reforms are complete. Hungary is governed from one capital, under one law."
 je_dod_hungarian_centralisation_invalid_desc:0 "Hungary's centralisation no longer applies."

 dod_hun.1.t:0 "The Crown of Saint Stephen"
 dod_hun.1.d:0 "The Holy Crown of Saint Stephen is the most important relic of Hungarian royalty. No Hungarian king can claim the sanctity of his rule until he has been crowned with it, and since the Great German War it has been held in Prague. Gabor I wants it back."
 dod_hun.1.f:0 "A crown is a piece of gold. This crown is a nation."
 dod_hun.1.a:0 "Send an envoy to Prague."
 dod_hun.1.b:0 "Our kings need no Bohemian relic."
 dod_hun.2.t:0 "A Hungarian Envoy"
 dod_hun.2.d:0 "An envoy from Buda has arrived at the castle of Prague. King Gabor I asks for the return of the Holy Crown of Saint Stephen, which he calls the soul of the Hungarian kingdom. The Emperor's council is divided on what to ask in return."
 dod_hun.2.f:0 "Every concession to Buda is a lesson to Vienna and Munich."
 dod_hun.2.a:0 "Give it to him. We want a good neighbour."
 dod_hun.2.b:0 "He may have it, if he kneels in Prague."
 dod_hun.2.c:0 "Ask him to restore the Duchy of Nitra."
 dod_hun.2.e:0 "The Crown is ours!"
 dod_hun.3.t:0 "Coronation of Gabor I"
 dod_hun.3.d:0 "Gabor I has been solemnly crowned in Buda by the Archbishop of Esztergom with the Holy Crown of Saint Stephen. Despite every difficulty, Hungary once again has a king crowned as its laws demand."
 dod_hun.3.f:0 "The bells of every church from Pozsony to Brasso rang at once."
 dod_hun.3.a:0 "Hungary is whole once more!"
 dod_hun.4.t:0 "The Bohemian Answer"
 dod_hun.4.d:0 "Our ambassador reports that Sigismund V will only give up the Crown if King Gabor I travels to Prague and kneels before the Emperor. The humiliation would be bitter, but the Crown would come home."
 dod_hun.4.f:0 "Pride or the Crown: Prague will not let us have both."
 dod_hun.4.a:0 "Kneel, for the good of Hungary."
 dod_hun.4.b:0 "We will recover it by other means."
 dod_hun.4.c:0 "We don't need it after all!"
 dod_hun.5.t:0 "The Bohemian Answer"
 dod_hun.5.d:0 "The Emperor asks that we restore the old Duchy of Nitra in the northern Carpathians as an autonomous land of the Slovaks, with Prague given the right to watch over their affairs. In return, the Crown would come home."
 dod_hun.5.f:0 "Nitra, the duchy whose Jagiellonian duke freed Hungary from the Turks."
 dod_hun.5.a:0 "Give in to their demands."
 dod_hun.5.b:0 "We'll find another way."
 dod_hun.5.c:0 "We don't need it after all!"
 dod_hun.6.t:0 "The Bohemian Answer"
 dod_hun.6.d:0 "The Emperor has refused any talk of returning the Crown of Saint Stephen. His ministers claim it has belonged to the Bohemian treasury since the Treaty of Paris and that the matter is closed."
 dod_hun.6.f:0 "They will not give it. Then perhaps it must be taken."
 dod_hun.6.a:0 "Recover it at all costs!"
 dod_hun.6.b:0 "It's hopeless..."
 dod_hun.7.t:0 "The Plot for the Crown"
 dod_hun.7.d:0 "A cell of Magyar nationalists, quietly funded by our government, is ready to break into the royal armoury of Prague Castle and bring the Holy Crown home to Buda. If it fails, the scandal will be ours."
 dod_hun.7.f:0 "They said it could not backfire."
 dod_hun.7.a:0 "Godspeed."
 dod_hun.8.t:0 "Prague Heist!"
 dod_hun.8.d:0 "Prague is in shock. A dozen Hungarian plotters bribed their way into the castle, killed the guards of the armoury and escaped with the Holy Crown of Saint Stephen. It is already in Buda."
 dod_hun.8.f:0 "The Emperor's guard will be asked hard questions."
 dod_hun.8.a:0 "This will not be forgotten."
 dod_hun.9.t:0 "Heist Failure"
 dod_hun.9.d:0 "The plot to steal the Crown from Prague has failed. The plotters were caught in the castle, and their confessions lead straight to our government. Europe is laughing at us."
 dod_hun.9.f:0 "The Crown stays in Prague, and our name is in every newspaper."
 dod_hun.9.a:0 "And they said it could not backfire."
 dod_hun.10.t:0 "Unrest in the Szekelyfold"
 dod_hun.10.d:0 "The decree abolishing the ancient rights of the Szekely people is meeting resistance in the Szekelyfold, where a Szekler National Council has been founded to defy Buda."
 dod_hun.10.f:0 "The border guards of the Carpathians do not forget their charters."
 dod_hun.10.a:0 "Send in the Honved."
 dod_hun.10.b:0 "We will have to weather the storm."
 dod_hun.11.t:0 "The Siculicidium"
 dod_hun.11.d:0 "The deployment of Honved troops to the Szekelyfold has ended in disaster. Soldiers resentful of the Szekelys' privileges opened fire on a crowd, and the dead are being counted in every village."
 dod_hun.11.f:0 "A black day for our nation."
 dod_hun.11.a:0 "A black day for our nation."
 dod_hun.12.t:0 "The Csikszentdomokos Copper Mine"
 dod_hun.12.d:0 "The end of the Szekely privileges has opened the land of the Szekelyfold to outside buyers, including the state. Engineers report rich copper seams at Csikszentdomokos that were never worked."
 dod_hun.12.f:0 "Under the old charters, no stranger could buy a furrow here."
 dod_hun.12.a:0 "We will renovate the infrastructure."
 dod_hun.12.b:0 "We won't disturb the local traditions."
 dod_hun.13.t:0 "Develop the Great Hungarian Plain"
 dod_hun.13.d:0 "To modernise the economy of the Alfold, the state will have to invest. Some ministers want to drain the marshes and modernise farming, others to open the mineral fields along its edges."
 dod_hun.13.f:0 "The plain was a frontier for three hundred years. It can be a granary."
 dod_hun.13.a:0 "Focus on intensive agriculture."
 dod_hun.13.b:0 "Focus on the extraction of minerals."
 dod_hun.13.c:0 "Invest in both."
 dod_hun.14.t:0 "The Situation of the Saxons"
 dod_hun.14.d:0 "With the Saxon University abolished, the Transylvanian Saxons fear for their schools, their churches and their language. Pamphlets about their plight are circulating as far as the German courts."
 dod_hun.14.f:0 "Seven hundred years of charters, ended by one decree."
 dod_hun.14.a:0 "Recognise the Saxon nation."
 dod_hun.14.b:0 "The Saxons will learn Magyar like everyone else."
 dod_hun.15.t:0 "Trouble in Transylvania"
 dod_hun.15.d:0 "Our centralisation has been bitterly resisted in Transylvania, the one Hungarian land that kept near-independence under the Ottomans. Its Diet speaks of the Union of the Three Nations and of a constitution of its own."
 dod_hun.15.f:0 "In Gyulafehervar they remember being a principality."
 dod_hun.15.a:0 "Outrageous! The Honved will restore order."
 dod_hun.15.b:0 "Let Transylvania keep its Diet."
 dod_hun.16.t:0 "The Sacaramb Gold Mines"
 dod_hun.16.d:0 "The gold, silver and tellurium deposits of Sacaramb, north of Deva, have been worked on a small scale since the Middle Ages. Modern methods could make them some of the richest in Europe."
 dod_hun.16.f:0 "The old dumps glitter in the rain."
 dod_hun.16.a:0 "Invest in the Sacaramb mines."
 dod_hun.16.b:0 "Local agriculture is more important."
 dod_hun.17.t:0 "The Magyar Debate"
 dod_hun.17.d:0 "Croatia has brought millions of non-Magyar subjects into the realm, and the Magyars are now a minority in their own kingdom. Parliament is divided: a nation of nations, or one Magyar nation?"
 dod_hun.17.f:0 "Every speech in the Diet is now about language."
 dod_hun.17.a:0 "Hungary will be a nation of nations."
 dod_hun.17.b:0 "We will push for Magyarisation."
 dod_hun.18.t:0 "Balkan Ambitions"
 dod_hun.18.d:0 "The success of centralisation has let a radical new idea flourish: Turanism, which preaches the exceptionality of the Magyars and their mission in the Balkans. Its followers look south, to Serbia and beyond."
 dod_hun.18.f:0 "From the Carpathians to the Adriatic, say the Turanists."
 dod_hun.18.a:0 "The Balkans will only be a burden."
 dod_hun.18.b:0 "Embrace Turanism."
 dod_hun.20.t:0 "The Founding of Budapest"
 dod_hun.20.d:0 "Ever since independence, men have spoken of merging Buda with Pest and Obuda across the Danube. With the reforms complete, the three towns are now one city: Budapest, capital of a centralised Hungary."
 dod_hun.20.f:0 "A metropolis on the Danube."
 dod_hun.20.a:0 "Budapest will be made a metropolis."

 dod_hun_abolish_szekely_privilege:0 "Abolish the Szekely Privilege"
 dod_hun_abolish_szekely_privilege_desc:0 "The Szekelys descend from military settlers granted land along the Carpathians to guard the border. Their privileges have outlived their purpose."
 dod_hun_end_cattle_barons:0 "End the Cattle Barons"
 dod_hun_end_cattle_barons_desc:0 "Under the Ottomans the great plain became a frontier ruled by cattle barons. Breaking their estates would open the Alfold to settlement."
 dod_hun_declare_equality_of_cults:0 "Declare the Equality of Cults"
 dod_hun_declare_equality_of_cults_desc:0 "Catholics, Protestants and the Muslim Kunok all live in Hungary. Declaring their equality before the law would end centuries of quarrels."
 dod_hun_limit_seigneurial_rights:0 "Limit the Seigneurial Rights"
 dod_hun_limit_seigneurial_rights_desc:0 "Hungarian nobles still hold privileges over their subjects that have barely changed since the Middle Ages."
 dod_hun_emancipate_peasantry:0 "Emancipate the Peasantry"
 dod_hun_emancipate_peasantry_desc:0 "Hungarian peasants live in practical serfdom, bound to the land of their lords. With serfdom abolished, the state can finish the work."
 dod_hun_abolish_saxon_university:0 "Abolish the Saxon University"
 dod_hun_abolish_saxon_university_desc:0 "The Saxon University governs the autonomous Saxon lands of Transylvania, the Konigsboden. It stands in the way of a single administration."
 dod_hun_magyarise_the_vlachs:0 "Magyarise the Vlachs"
 dod_hun_magyarise_the_vlachs_desc:0 "Vlach herders have settled Transylvania since the thirteenth century and are now its largest people. Magyar schools and Magyar names would bind them to the kingdom."
 dod_hun_integrate_the_vlachs:0 "Integrate the Vlachs"
 dod_hun_integrate_the_vlachs_desc:0 "The Vlachs were never recognised as one of the nations of Transylvania. Giving them a place in the kingdom would win their loyalty."
 dod_hun_reclaim_croatia:0 "Reclaim Croatia"
 dod_hun_reclaim_croatia_desc:0 "The Kingdom of Croatia was joined to Hungary in personal union for centuries. A crowned King of Hungary can claim its crown again."
 dod_hun_croatian_compromise:0 "The Croatian Compromise"
 dod_hun_croatian_compromise_desc:0 "The Croats enjoyed wide autonomy under the medieval union. Restoring it would reconcile them to Hungarian rule."
 dod_hun_ultimatum_for_oltenia:0 "Ultimatum for Oltenia"
 dod_hun_ultimatum_for_oltenia_desc:0 "The lands west of the Olt river were Hungarian once. A centralised Hungary can demand them back from Wallachia."
