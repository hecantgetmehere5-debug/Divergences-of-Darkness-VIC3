l_english:
 je_dod_ottoman_civil_war:0 "The Ottoman Civil War"
 je_dod_ottoman_civil_war_reason:0 "The war between Mustafa IV and Suleiman II has torn the Empire apart. Albania, Macedonia and Egypt have broken away, and our neighbours circle like hyenas. Bring the rebels back, or survive until the storm passes."
 dod_tanzimat_1:0 "Enact the Tanzimat Reforms"
 dod_tanzimat_1_desc:0 "The Tanzimat, the reorganisation of the Empire, seeks to modernise the state, secure its borders and win the loyalty of all its peoples."
 dod_tanzimat_2:0 "Extend the Tanzimat Reforms"
 dod_tanzimat_2_desc:0 "The first reforms have borne fruit. It is time to extend equal citizenship to every subject of the Sultan."
 dod_reclaim_macedonia:0 "Reclaim Greece and Bulgaria"
 dod_reclaim_macedonia_desc:0 "The Greek and Bulgarian lands are legitimately ours."
 dod_reclaim_illyria:0 "Reclaim the Bosna Eyalet"
 dod_reclaim_illyria_desc:0 "For centuries the Bosna Eyalet was the heart of Ottoman power in the Balkans, home to Muslims loyal to the House of Osman."
 dod_reclaim_madjaristan:0 "Reclaim Madjaristan"
 dod_reclaim_madjaristan_desc:0 "The conquest of Hungary was the crowning achievement of Suleiman the Magnificent and the high-water mark of Ottoman power in Europe."
 dod_reclaim_shirvan:0 "Reclaim the Shirvan and Tabriz Eyalets"
 dod_reclaim_shirvan_desc:0 "The Caucasian frontier has long been contested. It is time to restore it."
 dod_egyptian_levant:0 "The Egyptian Levant"
 dod_egyptian_levant_desc:0 "Since the Zahiri revolt, Egypt has become a beacon of the Arab world. With Al-Quds ours, we can proclaim our claim on the whole Levant."
 dod_form_yugoslavia:0 "Form Yugoslavia"
 dod_form_yugoslavia_desc:0 "The Slavic peoples of the Balkans must be united under a single banner: ours. It is the only way to stay free of the European powers."
 dod_yug_claim_albania:0 "Claim Albania"
 dod_yug_claim_albania_desc:0 "Albania was once part of the medieval Serbian state."
 dod_yug_claim_bulgaria:0 "Claim Bulgaria"
 dod_yug_claim_bulgaria_desc:0 "The Bulgarians are South Slavs too! What would Yugoslavia be without them?"
 dod_yug_claim_serbian_empire:0 "Reclaim the Lands of the Serbian Empire"
 dod_yug_claim_serbian_empire_desc:0 "In the fourteenth century Stefan Dusan was crowned Emperor of the Serbs and Greeks. We are his heirs."
 dod_mac_restore:0 "Restore Macedonian Rule over Greece"
 dod_mac_restore_desc:0 "In the classical age, Macedon ruled Greece. Now that we have reconquered what is ours, we can do so again."
 dod_mac_alexander:0 "Rebuild Alexander's Empire"
 dod_mac_alexander_desc:0 "Alexander conquered everything from Athens to India. Risen among the Great Powers, we can begin to rebuild his empire."
 dod_mac_align_yugoslavia:0 "Align with the Yugoslavs"
 dod_mac_align_yugoslavia_desc:0 "Thanks to our friendship with our northern neighbours, we can abandon our absurd Greek roots and join the future: South Slavia!"
 dod_mac_hegemonia:0 "Hegemonia"
 dod_mac_hegemonia_desc:0 "The Conference of Naples gave our King the assent of Greeks and Bulgarians to rule Macedonia, and many hoped Macedonia would free the rest of Greece too."
 dod_form_romania:0 "Unite the Principalities"
 dod_form_romania_desc:0 "For centuries we were caught between the rock and the hard place. Let us form the nation of the Romanians, heirs of the Dacians."
 dod_unite_with_romania:0 "Unite with Romania"
 dod_unite_with_romania_desc:0 "Romania has been formed. It is time to join the motherland."
 dod_janissaries_defeated:0 "Janissaries Defeated"
 dod_janissaries_defeated_desc:0 "The Janissary revolt has been crushed."
 dod_ottoman_province_lost:0 "Province Lost"
 dod_ottoman_province_lost_desc:0 "We were forced to recognise a rebel state."
 dod_ottoman_reconquest:0 "Reconquest"
 dod_ottoman_reconquest_desc:0 "Rebel lands have returned to the Sultan."
 dod_sunset_rebellions:0 "Sunset over the Rebellions"
 dod_sunset_rebellions_desc:0 "The Ottoman Civil War is over."
 dod_zahiri_victory:0 "Zahiri Victory"
 dod_zahiri_victory_desc:0 "Egypt has won its freedom from the Sultan."
 dod_misri_nahda:0 "Misri Al-Nahda"
 dod_misri_nahda_desc:0 "Egypt is a beacon of the Arab world."
 dod_magyar_repression:0 "Magyar Repression"
 dod_magyar_repression_desc:0 "We hold Madjaristan by force."
 dod_tanzimat:0 "Tanzimat"
 dod_tanzimat_desc:0 "The Empire is reorganising itself."
 dod_tanzimat_extended:0 "Extended Tanzimat"
 dod_tanzimat_extended_desc:0 "All subjects of the Sultan are equal citizens."
 dod_bal.1.t:0 "Defeat of the Janissaries"
 dod_bal.1.d:0 "The Janissaries who rose against you have been defeated! Unable to build on their Anatolian uprising, their movement has been routed, and the cities they held are returning to the Sultan's authority."
 dod_bal.1.f:0 "Long live the Sultan!"
 dod_bal.1.a:0 "Long live the Sultan!"
 dod_bal.2.t:0 "The Fall of Albania"
 dod_bal.2.d:0 "Our control over the Albanian lands has faded. Our armies have withdrawn, and we have had to recognise Albania as an independent state."
 dod_bal.2.f:0 "That is very unfortunate."
 dod_bal.2.a:0 "That is very unfortunate."
 dod_bal.12.t:0 "The Reconquest of Albania"
 dod_bal.12.d:0 "Sire! Thanks to the might of Your armies, we have reclaimed Albania, one of our ancestral lands."
 dod_bal.12.f:0 "For Allah!"
 dod_bal.12.a:0 "For Allah!"
 dod_bal.3.t:0 "The Fall of Macedonia"
 dod_bal.3.d:0 "Our control over the Macedonian lands has faded. Our armies have withdrawn, and we have had to recognise Macedonia as an independent state."
 dod_bal.3.f:0 "That is very unfortunate."
 dod_bal.3.a:0 "That is very unfortunate."
 dod_bal.13.t:0 "The Reconquest of Macedonia"
 dod_bal.13.d:0 "Sire! Thanks to the might of Your armies, we have reclaimed Macedonia, one of our ancestral lands."
 dod_bal.13.f:0 "For Allah!"
 dod_bal.13.a:0 "For Allah!"
 dod_bal.4.t:0 "The Fall of Egypt"
 dod_bal.4.d:0 "Our control over Egypt has faded. Our armies have withdrawn, and we have had to recognise the Zahiri regime in Cairo."
 dod_bal.4.f:0 "That is very unfortunate."
 dod_bal.4.a:0 "That is very unfortunate."
 dod_bal.14.t:0 "The Reconquest of Egypt"
 dod_bal.14.d:0 "Sire! Thanks to the might of Your armies, we have reclaimed Egypt, one of our ancestral lands."
 dod_bal.14.f:0 "For Allah!"
 dod_bal.14.a:0 "For Allah!"
 dod_bal.5.t:0 "Tales of Valour"
 dod_bal.5.d:0 "The Ottoman Empire lies in ashes. The Janissaries, crushed by Suleiman II in 1825, have risen again and threaten to set the whole region ablaze. The Sultan cannot hold everything: the Serbian lands are within our reach."
 dod_bal.5.f:0 "Hyenas, or heroes?"
 dod_bal.5.a:0 "Let them beg for mercy."
 dod_bal.5.b:0 "We are not hyenas."
 dod_bal.6.t:0 "Tales of Valour"
 dod_bal.6.d:0 "The Ottoman Empire lies in ashes. The Janissaries, crushed by Suleiman II in 1825, have risen again and threaten to set the whole region ablaze. The Sultan cannot hold everything: northern Serbia are within our reach."
 dod_bal.6.f:0 "Hyenas, or heroes?"
 dod_bal.6.a:0 "Let them beg for mercy."
 dod_bal.6.b:0 "We are not hyenas."
 dod_bal.7.t:0 "Tales of Valour"
 dod_bal.7.d:0 "The Ottoman Empire lies in ashes. The Janissaries, crushed by Suleiman II in 1825, have risen again and threaten to set the whole region ablaze. The Sultan cannot hold everything: the Dobrudja are within our reach."
 dod_bal.7.f:0 "Hyenas, or heroes?"
 dod_bal.7.a:0 "Let them beg for mercy."
 dod_bal.7.b:0 "We are not hyenas."
 dod_bal.8.t:0 "Tales of Valour"
 dod_bal.8.d:0 "The Ottoman Empire lies in ashes. The Janissaries, crushed by Suleiman II in 1825, have risen again and threaten to set the whole region ablaze. The Sultan cannot hold everything: the Azeri lands are within our reach."
 dod_bal.8.f:0 "Hyenas, or heroes?"
 dod_bal.8.a:0 "Let them beg for mercy."
 dod_bal.8.b:0 "We are not hyenas."
 dod_bal.20.t:0 "Sunset over the Rebellions"
 dod_bal.20.d_won:0 "The Ottoman Civil War lasted for decades, and now it is over. Every rebel province has been brought back under the Sultan's authority. The damage is done, but the Empire endures."
 dod_bal.20.d_lost:0 "The Ottoman Civil War lasted for decades, and now it is over. We have saved what we could, but the provinces we lost are gone for good. Will the Empire find its place in a new century?"
 dod_bal.20.f:0 "The Civil War is over."
 dod_bal.20.a:0 "Farewell, you traitors!"
 dod_bal.21.t:0 "The Zahiri Victory"
 dod_bal.21.d:0 "Muhammad Zahiri took a risky bet when he rose against the Sultan, and it has paid off. The Turks have been driven out of our ancestral lands, and Egypt is free."
 dod_bal.21.f:0 "I knew it!"
 dod_bal.21.a:0 "I knew it!"
 dod_bal.22.t:0 "Misri Al-Nahda"
 dod_bal.22.d:0 "Glory to the House of Zahiri! Not only have we driven the Turks from Egypt, but our troops hold Al-Quds, one of the Holy Cities. Egypt has become a beacon of light in the Arab world."
 dod_bal.22.f:0 "The Egyptian renaissance."
 dod_bal.22.a:0 "Glory to the House of Zahiri!"
 dod_bal.30.t:0 "Intervention in the Wallachian Election"
 dod_bal.30.d:0 "Wallachia freely elects its prince. With our influence secure among the Romanians, we could put forward our own Prince as a candidate and unite the two principalities."
 dod_bal.30.f:0 "One prince for two principalities?"
 dod_bal.30.a:0 "Propose the union to the Wallachians."
 dod_bal.30.b:0 "Not yet."
 dod_bal.31.t:0 "The Moldavian Candidate"
 dod_bal.31.d:0 "The Prince of Moldavia is standing in our election. Should he be named Domnitor of both principalities, or should we elect a local boyar?"
 dod_bal.31.f:0 "A united Romania?"
 dod_bal.31.a:0 "Elect the Prince of Moldavia."
 dod_bal.31.b:0 "Elect someone else; unification is only a dream."
 dod_bal.35.t:0 "The Magyar Crisis"
 dod_bal.35.d:0 "The conquest of Madjaristan crowns the long recovery from the Civil War. But the Magyars are restless, and holding them will cost dearly."
 dod_bal.35.f:0 "Autonomy, or the iron fist?"
 dod_bal.35.a:0 "We shall give the Magyars autonomy."
 dod_bal.35.b:0 "We shall hold Madjaristan at all costs."
 dod_bal.40.t:0 "Illyrian Brothers?"
 dod_bal.40.d:0 "The Ottoman Civil War presents us with a choice. We have recently won our independence from the Empire and become a beacon of hope for the South Slavs. The Serbs still suffer under the Sultan."
 dod_bal.40.f:0 "Free Serbia?"
 dod_bal.40.a:0 "We will free Serbia from the Ottomans!"
 dod_bal.40.b:0 "It is not the right time..."
 dod_bal.41.t:0 "The Liberation of Serbia"
 dod_bal.41.d:0 "Serbian lands are ours. We must now decide how our Slavic brothers will be governed."
 dod_bal.41.f:0 "Our brothers need protection."
 dod_bal.41.a:0 "Our brothers need to be protected."
 dod_bal.41.b:0 "Serbia will be ruled from Zagreb."
 dod_bal.42.t:0 "The End of the Personal Union"
 dod_bal.42.d:0 "Serbia has been ruled by our King since its liberation, while keeping its own internal affairs. The young King now wants a closer union of Croats and Serbs."
 dod_bal.42.f:0 "Send the message to Belgrade."
 dod_bal.42.a:0 "Send the message to Belgrade."
 dod_bal.43.t:0 "The Illyrian Ultimatum"
 dod_bal.43.d:0 "The Illyrian King asks for a closer union of Croats and Serbs. But can we really trust him?"
 dod_bal.43.f:0 "Union, or independence?"
 dod_bal.43.a:0 "Long live the Illyro-Serb union!"
 dod_bal.43.b:0 "Serbia will be independent!"
 dod_bal.44.t:0 "Intervention in Montenegro?"
 dod_bal.44.d:0 "Joseph Simic, claimant to the dukedom of Montenegro, has fled to our court. If we let him slip across the border into Kotor, he may rally the Montenegrins to our cause."
 dod_bal.44.f:0 "Send him across the border?"
 dod_bal.44.a:0 "Send him across the border."
 dod_bal.44.b:0 "Imprison him."
 dod_bal.45.t:0 "The Simic Rebellion"
 dod_bal.45.d:0 "The Illyrians have let Joseph Simic sneak into Kotor, where he is trying to rally the people to our heretic neighbours. We must find help, or give in."
 dod_bal.45.f:0 "Defend the Metropolitan?"
 dod_bal.45.a:0 "The Metropolitan will step down and accept Simic."
 dod_bal.45.b:0 "Ask Venice for help."
 dod_bal.45.c:0 "Ask Italy for help."
 dod_bal.45.opt_d:0 "Ask Aragon for help."
 dod_bal.46.t:0 "The Montenegrin Embassy"
 dod_bal.46.d:0 "The Illyrians threaten the Metropolitan of Montenegro, who asks for our protection."
 dod_bal.46.f:0 "Protect Montenegro?"
 dod_bal.46.a:0 "We will help Montenegro!"
 dod_bal.46.b:0 "It is not in our interest."
 dod_bal.47.t:0 "Montenegro Stands Alone"
 dod_bal.47.d:0 "The Metropolitan sought protection after expelling Simic, but nobody answered. Montenegro is ours for the taking."
 dod_bal.47.f:0 "Nothing stops the Yugoslavs!"
 dod_bal.47.a:0 "Nothing stops the Yugoslavs!"
 dod_bal.47.b:0 "Leave them be."
 dod_bal.48.t:0 "The Status of Belgrade"
 dod_bal.48.d:0 "During the Civil War, Hungary seized Belgrade while we were liberating Serbia. Their 'protection' has lasted long enough."
 dod_bal.48.f:0 "Belgrade belongs to the Serbs."
 dod_bal.48.a:0 "Send an ultimatum to Budapest."
 dod_bal.48.b:0 "Not now."
 dod_bal.49.t:0 "The Illyrian Ultimatum"
 dod_bal.49.d:0 "The Illyrian King demands that we give up the Serbian lands we took during the Civil War. The Serbs there have been restless for years."
 dod_bal.49.f:0 "Give up Belgrade?"
 dod_bal.49.a:0 "We'll withdraw from Serbia..."
 dod_bal.49.b:0 "As if we would give up Belgrade!"
 dod_bal.50.t:0 "The Hungarian Refusal"
 dod_bal.50.d:0 "Hungary has refused to return Belgrade to Serbia. It is our duty to free Serbia from the Magyars!"
 dod_bal.50.f:0 "We have no other choice!"
 dod_bal.50.a:0 "We have no other choice!"
 dod_bal.50.b:0 "Not yet."
