 freedom_of_womb_desc:0 "Slaves children are freed at birth and, in most cases, old slaves are also freed. The slave population stops growing. \nThis reform affects POP promotion chance - promotion will be slower, both globally and even more in slave states.\nPops in Slave states will be more conservative and less liberal. Immigrants are less likely to choose slave states.\nThe slave population will stop growing."
 movement_freedom_of_womb:0 "Freedom of Womb Campaign"
 no_slavery:0 "Outlawed"
 no_slavery_desc:0 "Slavery is forbidden."
 no_slavery_l:0 "Outlaw Slavery"
 citizens_rights:0 "Political Rights"
 primary_culture_only:0 "Restricted Rights"
 primary_culture_only_l:0 "Primary Culture Only Rights"
 primary_culture_only_desc:0 "Only the first class citizens of the country are allowed to participate in the political life, all the other groups are segregated. Becoming a first class citizen is hard and extremely limited."
 movement_primary_culture_only:0 "Pro Citizens Movement"
 culture_voting_only:0 "Cultural Rights"
 culture_voting_only_l:0 "Accepted Cultures Rights"
 culture_voting_only_desc:0 "Persons from the country's culture are allowed to participate in the political life of the country and citizenship is greatly facilitated for these people."
 movement_culture_voting_only:0 "Movement for Cultural Political Rights"
 all_voting_pops:0 "All Allowed Rights"
 all_voting_pops_l:0 "All Allowed Rights"
 all_voting_pops_desc:0 "All legal immigrants, regardless of the culture, are allowed to vote. Acquiring citizenship status is facilitated."
 movement_all_voting_pops:0 "The League for Universal Political Rights"
 border_policy:0 "Border Policy"
 closed_borders:0 "Closed Borders"
 closed_borders_l:0 "Closed Borders"
 closed_borders_desc:0 "People aren't allowed in or out of our country. The effectiveness of this policy is based on our administration and military spending. Some people might still emigrate illegally, either by crossing the border or hiding in ships. The veil of secrecy that shrouds our country makes other nations mistrust us."
 movement_closed_borders:0 "Movement for the Protection of the Country"
 quota_immigration:0 "Immigration Quotas"
 quota_immigration_l:0 "Immigration Quotas"
 quota_immigration_desc:0 "Foreign nationals are allowed to immigrate to our country, as long as they have a literacy above 60% and aren't citizens of countries that were recently or are currently at war with our country. There are no restrictions for emigration."
 movement_quota_immigration:0 "Movement for Immigration Quotas"
 open_borders:0 "Open Borders"
 open_borders_l:0 "Open Borders"
 open_borders_desc:0 "Our country is completly open for immigration and emigration, either by deliberate choice or because of the lack of appropriate border controls."
 movement_open_borders:0 "Pro Immigration Movement"
 unemployment_subsidies:0 "Unemployment"
 safety_regulations:0 "Safety Regulations"
 child_labor_illegal:0 "Child Labor Illegal"
 child_labor_illegal_l:0 "Child Labor Illegal"
 child_labor_illegal_desc:0 "Child Labor is viewed as immoral and is illegal."
 movement_child_labor_child_labor_illegal:0 "Campaign for the Legalization of Child Labor"
 child_labor_restricted:0 "Child Labor Restricted"
 child_labor_restricted_l:0 "Child Labor Restricted"
 child_labor_restricted_desc:0 "Children cannot work in certain dangerous professions."
 movement_child_labor_restricted:0 "Campaign for the Restriction of Child Labor"
 child_labor_legal:0 "Child Labor Legal"
 child_labor_legal_l:0 "Child Labor Legal"
 child_labor_legal_desc:0 "No child labor regulation exists."
 child_labor:0 "Child Labor"
 movement_child_labor_illegal:0 "Child Labor Abolition League"
 debt_law:0 "Debt Law"
 serfdom:0 "Serfdom"
 serfdom_l:0 "Serfdom"
 serfdom_desc:0 "Serfs are bound to the land and subject to the will of its owner and forced to work the fields under a feudal system.\nThis reform affects POP promotion chance - promotion will be slower.\nThis reform enables Serfs - poor POPs will demote to Serfs and won't come out of Serfdom until it's abolished."
 movement_serfdom:0 "Pro Serfdom League"
 peonage:0 "Peonage"
 peonage_l:0 "Peonage"
 peonage_desc:0 "Peonage is a debt system under which the debtor is forced to work off his debt. This often leads to a perpetual cycle of involuntary labor called peonage."
 movement_peonage:0 "Campaign for the Abolition of Serfdom"
 debtors_prisons:0 "Debtor's Prisons"
 debtors_prisons_l:0 "Debtor's Prisons"
 debtors_prisons_desc:0 "Debtors are confined to jail until such time as their debt is resolved.\nThis reform is neutral - no effects."
 movement_debtors_prisons:0 "Abolition of Peonage Movement"
 bankruptcy:0 "Bankruptcy"
 bankruptcy_l:0 "Bankruptcy"
 bankruptcy_desc:0 "Debtors are allowed to declare bankruptcy and have their previous debts declared null and void."
 movement_bankruptcy:0 "Debtor's Prisons Abolition Movement"
 capital_punishment:0 "Capital Punishment"
 capital_punishment_l:0 "Capital Punishment"
 capital_punishment_desc:0 "Convicts are killed for relatively minor crimes."
 movement_capital_punishment:0 "Pro Capital Punishment League"
 penal_system:0 "Penal System"
 penal_system_l:0 "Penal System"
 colonial_transportation:0 "Transportation"
 colonial_transportation_l:0 "Transportation"
 colonial_transportation_desc:0 "Prisoners are sent to either far away or inhospitable places in the mother-country or to its colonies. This, however, increases the load on the bureaucracy.\nThis reform will increase colonial migration but it will also increase the necessity of bureaucrats."
 movement_colonial_transportation:0 "Campaign for the Abolition of Capital Punishment"
 incarceration:0 "Incarceration"
 incarceration_l:0 "Incarceration"
 incarceration_desc:0 "Convicts are imprisoned with the intent of removing undesirables from society, though they aren't used for hard manual labor most of the times.\nThis reform is neutral - no effects."
 movement_incarceration:0 "Movement for the Abolition of Penal Colonies"
 rehabilitation:0 "Rehabilitation"
 rehabilitation_l:0 "Rehabilitation"
 rehabilitation_desc:0 "Convicts are imprisoned with the intent of reforming them and reintroducing them into society."
 movement_rehabilitation:0 "Rehabilitation of Prisoners Campaign"
 EVTNAME34608:0 "Child Labour Law Passed"
 EVTDESC34608:0 "Following Britain's lead, in $YEAR$ Prussia, under the influence of some religious and social figures, passed a law strictly regulating the amount of child labour that was possible during the year.  According to the new legislation, the Prussian government will lay down restrictions on child labor, with the following main points: children under the age of nine are banned from factory labor, children needed to have had at least three years of schooling before working, and children under the age of sixteen could work no more than ten hours per day. Other provisions included mandated rest times and a total ban on night work for children."
 EVTOPTA34608:0 "Those poor children!"
 EVTOPTB34608:0 "This isn't really necessary. Revoke the law."
 EVTNAME3700:0 "Chimney Sweepers"
 EVTDESC3700:0 "'A young boy arose from the inside of a chimney and gently sat down on the roof. His face and clothes were blackened by the soot from the chimney and showed that this was not the first chimney he had swept this day. Tired, he climbed down the roof and trotted off after receiving a penny from the house matron.' \n \n The hard work that the city's young chimney sweepers perform has outraged many, and a committee has been formed to tackle the rough working conditions."
 EVTOPTA3700:0 "We should consider legislation to end this."
 EVTOPTB3700:0 "Hard work is the foundation of a good moral character."
 EVTNAME370000002:0 "Long Work Hours"
 EVTDESC370000002:0 "'The factories extend their flanks of fouler brick one after another, bare, with shutterless windows, like economical and colossal prisons... and inside, lit by gas-jets and deafened by the uproar of their own labour, toil thousands of workmen, penned in, regimented, hands active, feet motionless, all day and every day, mechanically serving their machines...' \n The hard work that the city's workers perform has outraged many, and a committee has been formed to tackle the rough working conditions."
 EVTOPTA370000002:0 "We should consider legislation to change this."
 EVTOPTB370000002:0 "Hard work is the foundation of a good moral character."
