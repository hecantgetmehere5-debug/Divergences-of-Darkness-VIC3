 colonial_spending_policy_desc:0 "The government has a colonial policy towards its subjects and has no intention of spending any money on their welfare."
 no_state_interference:0 "Opposed"
 no_state_interference_l:0 "Opposed"
 no_state_interference_desc:0 "The government feels that welfare expenditures are unnecessary and that individuals should look after themselves."
 no_position_set:0 "No Official Policy"
 no_position_set_l:0 "No Official Policy"
 no_position_set_desc:0 "There's no official position on welfare policy and how much should the government spend on it, the amount being largely left for the ruler to decide."
 populist_welfare:0 "Paternalistic"
 populist_welfare_l:0 "Paternalistic"
 populist_welfare_desc:0 "The welfare system in this government has a paternalistic characteristic, with a minimum amount set to be spent in support of this oftentimes populist policy."
 welfare_state:0 "Full Welfare State"
 welfare_state_l:0 "Full Welfare State"
 welfare_state_desc:0 "This government feels that the welfare of the less fortunate is of the utmost importance and dedicates a piece of the budget to pursue this objective."
