 BUY_FROM_STOCKPILE_DESC:0 "Allow pops/factories to buy from country stockpile.\n\nNOTE: NEVER use this button while you are still buying or selling manually. ONLY use it with automatic trade ON for ALL goods. Failing to do so will cause economy crashes both locally and globally. Use it at your own risk."
