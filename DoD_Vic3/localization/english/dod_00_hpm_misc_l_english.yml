 army_military_political_decision_making:0 "Military-Political Decision-Making"
 army_military_political_decision_making_desc:0 "In wartime an influential Army that had lobbied for their cause for a long time could get full control not only over the execution of the war, but also over the resource management of the country. This could basically be called a Military Dictatorship governed by the General Staff."
