 indian_nationalists_desc:0 "Indian nationalists seek to unify the sub-continent into a free and independent nation-state, by any means necessary. This includes breaking free from foreign oppressors and uniting with their cultural kin."
 indian_nationalists_army:0 "Indian Nationalists"
 socialist_rebels_title:0 "Militant Socialist"
 socialist_rebels_name:0 "Militant Socialists"
 socialist_rebels_desc:0 "In a democracy, militant socialists will seek to enforce a socialist government. In any other country, they will seek to establish a democracy with a socialist government."
