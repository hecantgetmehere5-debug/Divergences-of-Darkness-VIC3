 dod_eur.1.t:0 "The Seats of Occitania"
 dod_eur.1.d:0 "In the Parliament of the Lords, Occitania holds only fifteen seats, a punishment for its Protestant rebellions of the last century. Provencal deputies demand that the old penalty be lifted."
 dod_eur.1.f:0 "Forgive the Midi?"
 dod_eur.1.a:0 "Restore Occitania's seats."
 dod_eur.1.b:0 "The penalty stands."
 dod_eur.2.t:0 "The Season in Londres"
 dod_eur.2.d:0 "Every year the court crosses the Channel for the season in Londres. This year the King has been asked to stay longer, to show the English that the Crown is theirs too."
 dod_eur.2.f:0 "Paris or Londres?"
 dod_eur.2.a:0 "Stay the whole summer in Londres."
 dod_eur.2.b:0 "Return early to Paris."
 dod_eur.3.t:0 "A Tunnel under the Channel"
 dod_eur.3.d:0 "An engineer has presented the Estates-General with plans for a railway tunnel beneath the Channel, joining Calais to Douvres. 'Two kingdoms, one crown, one railway,' says his pamphlet."
 dod_eur.3.f:0 "Under the sea."
 dod_eur.3.a:0 "Fund the survey!"
 dod_eur.3.b:0 "A fantasy."
 dod_eur.4.t:0 "The Lord Chancellor's Choice"
 dod_eur.4.d:0 "Since Cardinal Talleyrand, no churchman has been Lord Chancellor. The bishops in the Parliament of the Lords want the office back; the nobles will not hear of it."
 dod_eur.4.f:0 "Mitre or coronet?"
 dod_eur.4.a:0 "Appoint a nobleman."
 dod_eur.4.b:0 "Appoint an archbishop."
 dod_eur.10.t:0 "The Anvers Exchange"
 dod_eur.10.d:0 "The great Dutch and Flemish merchant houses that financed the Great German War now want their reward: a royal charter for a new exchange in Anvers, the greatest money market of Europe."
 dod_eur.10.f:0 "Money makes kingdoms."
 dod_eur.10.a:0 "Grant the charter."
 dod_eur.10.b:0 "The Crown owes them enough already."
 dod_eur.11.t:0 "The Zwinglian Synod"
 dod_eur.11.d:0 "The Reformed Church of Burgundy has gathered in synod at Anvers. Some ministers want to open communion to the Lutherans of Germany; others insist that Zwingli's teaching must stay pure."
 dod_eur.11.f:0 "Pure, or open?"
 dod_eur.11.a:0 "Reach out to the Lutherans."
 dod_eur.11.b:0 "Keep the faith pure."
 dod_eur.12.t:0 "Our Friends on the Rhine"
 dod_eur.12.d:0 "Since the Confederation of the Rhine was dissolved in 1820, the Rhenish states have kept a special relationship with Anvers. Their princes ask for Burgundian loans and officers."
 dod_eur.12.f:0 "Influence along the Rhine."
 dod_eur.12.a:0 "Lend them money and officers."
 dod_eur.12.b:0 "They must stand on their own."
 dod_eur.20.t:0 "The Sound Dues"
 dod_eur.20.d:0 "For four centuries, every ship passing the Øresund has paid toll to the Crown in Copenhagen. Merchants across Europe now call the Sound Dues an outrage against free trade."
 dod_eur.20.f:0 "The toll of the Sound."
 dod_eur.20.a:0 "Keep the Dues."
 dod_eur.20.b:0 "Abolish them for free trade."
 dod_eur.21.t:0 "Anglois Gold in Edinburgh"
 dod_eur.21.d:0 "Our agents report that the Dual Monarchy is courting Scottish nobles, hinting that the Stewart cause would be better served from Paris than from Copenhagen."
 dod_eur.21.f:0 "Intrigue in the Highlands."
 dod_eur.21.a:0 "Arrest the plotters."
 dod_eur.21.b:0 "Win the nobles back with honours."
 dod_eur.22.t:0 "The Riksdag Debates"
 dod_eur.22.d:0 "The Riksdag is split between those who want to turn east, towards the Baltic and Russia, and those who look south to Germany, where the Bohemians still dream of empire."
 dod_eur.22.f:0 "East, or south?"
 dod_eur.22.a:0 "The Baltic is our destiny."
 dod_eur.22.b:0 "Watch the Bohemians."
 dod_eur.30.t:0 "The Ceremonial Reichstag"
 dod_eur.30.d:0 "Since 1820 the Reichstag has been an empty ceremony, its seats hereditary and its powers gone. Yet the princes still gather in their robes each year, and the King of the Germans still opens the session."
 dod_eur.30.f:0 "A shadow of empire."
 dod_eur.30.a:0 "Use the session to press our claims."
 dod_eur.30.b:0 "Keep it short."
 dod_eur.31.t:0 "The Ghosts of 1605"
 dod_eur.31.d:0 "In Berlin, students have marked the anniversary of 1605, when a crowd threw the Bohemian governor from the window and began the Imperial Religious War. The Brandenburgers have never loved Prague."
 dod_eur.31.f:0 "Berlin remembers."
 dod_eur.31.a:0 "Garrison Berlin."
 dod_eur.31.b:0 "Grant Brandenburg new privileges."
 dod_eur.32.t:0 "Freedom of Worship"
 dod_eur.32.d:0 "The Treaty of Paris placed religious freedom in Germany under international law. Catholic hardliners at court want the Protestant churches of Saxony watched more closely."
 dod_eur.32.f:0 "The faith of the Jagiellons."
 dod_eur.32.a:0 "Respect the treaty."
 dod_eur.32.b:0 "Tighten the watch."
 dod_eur.33.t:0 "A Lesson from 1820"
 dod_eur.33.d:0 "On the anniversary of the Treaty of Paris, the people celebrate their independence from the Holy Roman Empire. Yet the loss of Salzburg and Tyrol still stings."
 dod_eur.33.f:0 "Free, but smaller."
 dod_eur.33.a:0 "Celebrate our freedom!"
 dod_eur.33.b:0 "Remember what was lost."
 dod_eur.40.t:0 "The Liberum Veto"
 dod_eur.40.d:0 "Once again a single deputy has shouted 'Nie pozwalam!' and dissolved the Sejm, killing a year's legislation. Reformers say the Commonwealth will die of its own freedom."
 dod_eur.40.f:0 "I do not allow!"
 dod_eur.40.a:0 "Defend the golden liberty."
 dod_eur.40.b:0 "This must end."
 dod_eur.41.t:0 "The Veche Bell"
 dod_eur.41.d:0 "The great bell of Novgorod still calls the citizens to the veche, the assembly that has governed the republic for centuries. Muscovites mock it; Novgorodians would die for it."
 dod_eur.41.f:0 "Lord Novgorod the Great."
 dod_eur.41.a:0 "Ring the bell!"
 dod_eur.50.t:0 "Barcelona and Venice"
 dod_eur.50.d:0 "The merchants of Barcelona have outbid the Venetians for the Levant trade once again. Since the sixteenth century, Barcelona has rivalled Venice and Istanbul as queen of the Mediterranean."
 dod_eur.50.f:0 "Queen of the sea."
 dod_eur.50.a:0 "Celebrate our merchants."
 dod_eur.50.b:0 "Do not provoke Venice."
 dod_eur.51.t:0 "The Reformists of Savoy"
 dod_eur.51.d:0 "In 1567 Savoy expelled its Reformist population, and their descendants live in exile in Burgundy and Provence. Some now petition to return to the valleys of their ancestors."
 dod_eur.51.f:0 "Let them come home?"
 dod_eur.51.a:0 "Welcome them back."
 dod_eur.51.b:0 "Savoy is Catholic."
 dod_eur.52.t:0 "The Festival of the Republic"
 dod_eur.52.d:0 "Etruria remembers the revolution that drove out the Valois-Medici and created sister republics across Italy. Florence is decked in tricolours, and the Carbonari toast absent friends."
 dod_eur.52.f:0 "Unione, Forza e Libertà!"
 dod_eur.52.a:0 "Viva la Repubblica!"
 dod_eur.53.t:0 "The Pope and the Zwinglians"
 dod_eur.53.d:0 "The Holy Father has issued an encyclical against the Zwinglian heresy, three centuries after Zwingli was burned at Avignon. Protestant Europe is outraged; Catholic courts applaud."
 dod_eur.53.f:0 "Rome speaks."
 dod_eur.53.a:0 "Rome speaks; the matter is closed."
 dod_eur.54.t:0 "The Bourbons of Navarre"
 dod_eur.54.d:0 "The last Bourbons still rule in Pamplona, caught between Aragon, which holds them as subjects, and the Dual Monarchy, which covets their mountains."
 dod_eur.54.f:0 "A small kingdom, a great house."
 dod_eur.54.a:0 "We bow to no one in our hearts."
 dod_eur.60.t:0 "The Crown of Saint Stephen"
 dod_eur.60.d:0 "Hungary has been free since 1820, but the Crown of Saint Stephen still sits in the shadow of the Ottoman wars. Nobles call for a grand coronation to show the world that the kingdom has risen again."
 dod_eur.60.f:0 "A kingdom reborn."
 dod_eur.60.a:0 "Hold the coronation!"
 dod_eur.60.b:0 "We cannot afford it."
 dod_eur.61.t:0 "Swiss Neutrality"
 dod_eur.61.d:0 "Burgundy and the Bohemians both court the Swiss cantons. The Diet has reaffirmed that the Confederation will take no side."
 dod_eur.61.f:0 "Armed neutrality."
 dod_eur.61.a:0 "Neutral, and armed."
