l_english:
 organize_central_asia_title:0 "Hegemony in Central Asia"
 organize_central_asia_desc:0 "Our domination over the steppes is now uncontested: it is time we organize the area to better serve our needs."
 conquest_of_red_water_title:0 "Conquest of the coast"
 conquest_of_red_water_desc:0 "Our control over the Turkmenia region is now complete enough that we can make our move towards the Caspian Sea by conquering the area known as Kyzyl-Su, the Red Water, before anyone else cut us there."
 claim_artois_title:0 "Claim Artois"
 claim_artois_desc:0 "The comté d'Artois has traditionally been part of the Low Countries. Only during the era of foreign rule by Habsburg scum was it snatched by the King of France. As such, it is our duty to reclaim those lands back into our glorious realm, put their people to work and profit from their land!"
 rename_artois_NET_title:0 "Artois is ours!"
 rename_artois_NET_desc:0 "The region of Artois is finally back in $COUNTRY_ADJ$ hands! The area has been part of our rightful historical realm and this should reflect on the world's maps."
 rename_artois_FRA_title:0 "Artois is ours!"
 rename_artois_FRA_desc:0 "The region of Artois is finally back in $COUNTRY_ADJ$ hands! The area has been part of our rightful historical realm and this should reflect on the world's maps."
 build_neuschwanstein_title:0 "The Neuschwanstein Castle"
 build_neuschwanstein_desc:0 "The Neuschwanstein Castle is a nineteenth-century Romanesque Revival palace on a rugged hill above the village of Hohenschwangau. The palace was commissioned paid out of his personal fortune by Ludwig II of Bavaria, 'The Swan King', as a retreat and as a homage to Richard Wagner. The palace was intended as a personal refuge for the reclusive sovereign: it is said that from his bedroom in Hohenschwangau, Ludwig trained a telescope on a ridge to keep an eye on Neuschwanstein as it was being constructed."
 EVTNAME110082:0 "Smuggle Tea to $COUNTRY$"
 EVTDESC110082:0 "After a failed attempt to cultivate tea in $COUNTRY$ in 1882 with seeds from India, Prince Mohammad Mirza known as 'Kashef Al Saltaneh' who was born in Lahijan, imported Indian tea and started its cultivation in Lahijan. Kashef, who was the first mayor of Tehran and an Iranian ambassador to India under British rule, knew that the British would not allow him to learn about the secrets of tea production, as it was it is their biggest business in India. So being fluent in French, the prince pretended to be a French laborer and started to work in the tea plantations and factories to learn how to produce tea. Ultimately his plan was to take back some samples of this tea to $COUNTRY$ to cultivate. He was successful in this endeavor only because of his diplomatic immunity which stopped the British from searching his secretly stashed sample. At the time, Kashef brought 3000 saplings into his country from the Northern part of India, Kangra and he started the cultivation in the region Gilan, south of the Caspian Sea. The climate there was well suited for tea cultivation, and the tea industry quickly expanded in Gilan and Mazanderan region."
 EVT110082OPTA:0 "A wonderful initiative!"
 EVT110082OPTB:0 "No thanks."
 EVTNAME110083:0 "A Trip To Europe"
 EVTDESC110083:0 "Numerous suzerains of so-called 'uncivilized' nations have made the decision to travel to Europe in order to support westernization policies. From Nasser al-Din Shah Qajar of Persia to Chulalongkorn of Siam and the many princes of India, the experience proved successful in enlightening rulers throughout the world. While this could help our country enter modernity, it will surely anger our more traditional elites..."
 EVT110083OPTA:0 "We could learn a lot."
 EVT110083OPTB:0 "A king's place is in his country."
 EVTNAME110084:0 "The Treaty of Erzurum of $YEAR$"
 EVTDESC110084:0 "Tensions have risen again between the Ottoman Empire and Qajar Persia after order has been restored in the Kurdish areas. Border conflicts are now a common occurrence, driving up jingoist sentiment in both courts. Wishing to protect their interests in the region, the United Kingdom and Russia have intervened to find a diplomatic solution to the issues that plagued the area. The proposed treaty includes nine articles treating various issues, from territorial compromises to the status of pilgrims, forever establishing the western concepts of nation and borders in the region."
 EVT110084OPTA:0 "This seems fair."
 EVT110084OPTB:0 "We will resolve the issue our own way!"
 EVTNAME110085:0 "A Rise To Power"
 EVTDESC110085:0 "Amir Kabir has gained more and more power in our country. He now cumulates the positions of Chief Minister and Chief of the Army: this situation could be dangerous especially while the Shah remains young. His popularity is still low, both in court and abroad many despise him. Some whisper in our ear that it could be our only opportunity to stop him before it's too late..."
 EVT110085OPTA:0 "The Shah demands his head."
 EVT110085OPTB:0 "His life is safe: exile him."
 EVT110085OPTC:0 "He is our friend and advisor."
 EVTNAME110086:0 "Amir Kabir assassinated!"
 EVTDESC110086:0 "In $YEAR$ Amir Kabir Mirza Taghi Khan Farahani was murdered while traveling to Kashan, an obviously political move. Some are pointing fingers at the disgruntled nobles, including the Queen Mother. Others are blaming foreign powers. With him, many believe, died the prospect of an independent Iran led by meritocracy rather than nepotism."
 EVT110086OPTA:0 "We mourn his loss."
 EVT110086OPTB:0 "We shall find whoever is guilty!"
 EVTNAME110087:0 "The Swan King"
 EVTDESC110087:0 "Crown Prince Ludwig had just turned 18 when his father died after a three-day illness, and he ascended the Bavarian throne. Although he was not prepared for high office, his youth and brooding good looks made him popular in Bavaria and elsewhere. Rather than live with the frustrations of a modern constitution and a feisty parliament reining him in, he spent his years lost in Romantic literature and operas, most notably by summoning Wagner at his court or by funding the construction of the Neuschwanstein Castle."
 EVT110087OPTA:0 "Long may he reign!"
 EVTNAME110088:0 "Landel de Moura"
 EVTDESC110088:0 "Father Roberto Landel de Moura was ordained to the priesthood in 1886 in Rome, where he also studied the physical sciences. A famous local inventor, he got recognized by his broadcast of a human voice over 8km around Sao Paulo - a technological feet of note! He then secured multiple patents, both Brazilian and American, for Wireless Telephone and Wireless Telegraph. His subsequent requests to the Brazilian government for assistance in developing his invention were denied, and his efforts then languished."
 EVT110088OPTA:0 "Support his effort!"
 EVT110088OPTB:0 "Give him an official acknowledgment."
 EVT110088OPTC:0 "Interesting I'm sure..."
 EVTNAME110089:0 "The Sudtirol Compromise."
 EVTDESC110089:0 "Ever since we established our control of the Sudtirol area there has been discontent. Nationalist troubles agitate the region and riots are more and more common. In a spirit of appeasement, some advisors think it could be wise to cede part of the land... for a price. We'd agree to relish our claims on their share as they would for ours. A German north and an Italian south. Let's hope this resolves tensions amongst our nations."
 EVT110089OPTA:0 "The land is rightfully theirs."
 EVT110089OPTB:0 "The land is rightfully ours."
 EVTNAME110090:0 "The Trentino Compromise."
 EVTDESC110090:0 "Ever since we established our control of the Trentino area there has been discontent. Nationalist troubles agitate the region and riots are more and more common. In a spirit of appeasement, some advisors think it could be wise to cede part of the land... for a price. We'd agree to relish our claims on their share as they would for ours. A German north and an Italian south. Let's hope this resolves tensions amongst our nations."
 EVT110090OPTA:0 "The land is rightfully theirs."
 EVT110090OPTB:0 "The land is rightfully ours."
 EVTNAME110091:0 "The Allahdad"
 EVTDESC110091:0 "In $YEAR$, violent riots and forced conversions started taking place against the Jews of Mashhad. It is still unclear what started it: some blame a Jewish doctor who offended the clergy on the month of Muharram, others claim it was due to a financial conflict between the community an a local Sayyid. The city's ruler wish to order his men to enter Jewish homes and mobs attacked the Jewish community, burning down the synagogues while foreign elements are outraged at how their brethen are being treated. What should we do?"
 EVT110091OPTA:0 "It is the will of Allah."
 EVT110091OPTB:0 "They are also our subjects."
 EVTNAME110092:0 "Race Riots"
 EVTDESC110092:0 "The situation in $PROVINCE$ has degraded lately: due to poverty, unemployment and the post-war tensions riots have taken place against some of our national minorities. Looting, lynching and pillaging took place by a mass of furious protesters. This will be a black mark in our history..."
 EVT110092OPTA:0 "A sad state of affair..."
 amir_kabir:0 "Amir Kabir"
 desc_amir_kabir:0 "Amir Kabir Mirza Taghi Khan Farahani is overseeing great works of reform in our country, to the anger of some."
 racial_tensions:0 "Racial tensions"
 desc_racial_tensions:0 "Following racial riots targeting minorities, tension and hatred are high in the local community."
