l_english:
 dod_bridge_over_salzach:0 "The Bridge over Salzach"
 dod_bridge_over_salzach_desc:0 "The ambassadors of the King of the Dual Thrones and of the Emperor in Prague could meet in Salzburg to discuss a pact against the Most Serene Republic: Venice's mainland for the Empire's friends, the Italian question for Paris."
 dod_partition_of_venice:0 "The Partition of Venice"
 dod_partition_of_venice_desc:0 "The fate of the Republic of Venice was decided at Salzburg. Now we only have to carry out the treaty."
 dod_meddle_in_italy:0 "Announce Our Interest in Italy"
 dod_meddle_in_italy_desc:0 "With the House of Valois finally defeated, we have room to make our influence felt in Italy."
 dod_the_question_of_italy:0 "The Question of Italy"
 dod_the_question_of_italy_desc:0 "La Serenissima has been beaten by the Imperial forces. Under the Treaty of Salzach, Austria should take the Republic's lands, but Paris has its own interests in Italy."
