l_english:
 dod_congress_host:0 "Congress Host"
 dod_congress_host_desc:0 "We hosted the great Congress that restored the balance of power."
 dod_cong.1.t:0 "The Congress of Our Capital"
 dod_cong.1.d_hre:0 "The submission of the German princes to the Emperor has upended the balance of Europe. Feeling threatened by the new Imperial power, the Great Powers have gathered in our capital at our invitation, putting aside their grudges for a time to restore the balance of power."
 dod_cong.1.d_danubian:0 "The creation of the Danubian Confederation has swept away the German order left by the Great German War. Fearing a new war in Germany, the Great Powers have gathered in our capital at our invitation, putting aside their grudges for a time to restore the balance of power."
 dod_cong.1.d_elbian:0 "Bohemia's Confederation on the Elbe has made it the first power of Central Europe. Alarmed, the Great Powers have gathered in our capital at our invitation, putting aside their grudges for a time to restore the balance of power."
 dod_cong.1.d_aragon_italy:0 "The Kings of Aragon have united Italy with their other crowns, creating a power that may rule the Mediterranean. Concerned, the Great Powers have gathered in our capital at our invitation, putting aside their grudges for a time to restore the balance of power."
 dod_cong.1.d_commonwealth:0 "The Polish-Lithuanian Commonwealth has overcome its troubles and threatens Scandinavian, Russian and Bohemian interests alike. Wary, the Great Powers have gathered in our capital at our invitation, putting aside their grudges for a time to restore the balance of power."
 dod_cong.1.d_russia:0 "A united Russia now threatens the powers of Central Europe. Worried, the Great Powers have gathered in our capital at our invitation, putting aside their grudges for a time to restore the balance of power."
 dod_cong.1.d_iberia:0 "Spain has absorbed Catalonia and rules all of Iberia, and now looks to the Mediterranean. Uneasy, the Great Powers have gathered in our capital at our invitation, putting aside their grudges for a time to restore the balance of power."
 dod_cong.1.d_nordtyskland:0 "Scandinavia has brought most of the Elbian people under Copenhagen. Troubled, the Great Powers have gathered in our capital at our invitation, putting aside their grudges for a time to restore the balance of power."
 dod_cong.1.d_valois_italy:0 "The Valois have taken Rome and formed a united Italy, and seem unlikely to stop there. Anxious, the Great Powers have gathered in our capital at our invitation, putting aside their grudges for a time to restore the balance of power."
 dod_cong.1.d_anglois:0 "Against all odds, the Dual Monarchy has united its peoples, and its power is now without equal. Fearful, the Great Powers have gathered in our capital at our invitation, putting aside their grudges for a time to restore the balance of power."
 dod_cong.1.d_england:0 "England has won its freedom from the Dual Monarchy, redrawing the map of Western Europe. Unsettled, the Great Powers have gathered in our capital at our invitation, putting aside their grudges for a time to restore the balance of power."
 dod_cong.1.f:0 "A new era of diplomacy begins."
 dod_cong.1.a:0 "A new era of diplomacy begins."
