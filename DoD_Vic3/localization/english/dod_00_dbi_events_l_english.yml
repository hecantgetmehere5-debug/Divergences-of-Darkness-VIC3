l_english:
 EVTNAME190401:0 "The Mycenaean Excavations"
 EVTDESC190401:0 "$FROMCOUNTRY$ has requested excavation rights to look for the ruins of Mycenaean Greece. While we ourselves do not have the know how or money to fund a serious excavation of the area, and allowing a foreign contractor might be good for that reason, it might also be best to let the secrets of Egyptian history lie undisturbed until such a time when we ourselves can find them. Turning down a foreign power will spoil our relations and reduce their prestige, though."
 EVTOPTA190401:0 "Go for it!"
 EVTOPTB190401:0 "This is a violation of $COUNTRY_ADJ$ sovereignty"
 EVTNAME19041:0 "$FROMCOUNTRY$ Grants Excavation Permit"
 EVTDESC190411:0 "The government of $FROMCOUNTRY$ has granted us the right to excavate and investigate ancient ruins in Myceanean Greece. The potential discoveries there will prove an enormous opportunity for us to increase our scientific renown in the world."
 EVTNAME19042:0 "$FROMCOUNTRY$ Refuses Excavation Permit"
 EVTDESC190421:0 "The government of $FROMCOUNTRY$ has refused to allow us excavation rights in Myceanean Greece. Our international prestige has been lowered as a result, and relations with $FROMCOUNTRY$ have soured."
 EVTOPTA19042:0 "Bah!"
 EVTNAME190431:0 "Myceanean Excavation Legal Issues"
 EVTDESC190431:0 "There's been some unfortunate allegations in Greece about certain actions of the $COUNTRY_ADJ$ excavation team..."
 EVTOPTA190431:0 "A little money may help?"
 EVTOPTB190431:0 "Bring them home."
