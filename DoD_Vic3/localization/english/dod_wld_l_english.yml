 dod_wld.1.t:0 "A Nobel Prize for Our Nation"
 dod_wld.1.d_physics:0 "The Nobel Committee in Stockholm has awarded this year's Prize in Physics to one of our scientists, for research that is changing how we understand matter and energy."
 dod_wld.1.d_chemistry:0 "One of our chemists has received the Nobel Prize in Chemistry. The universities are jubilant, and our industries hope to profit from the discovery."
 dod_wld.1.d_medicine:0 "The Nobel Prize in Medicine has gone to one of our physicians, whose work promises to save countless lives."
 dod_wld.1.d_literature:0 "One of our writers has won the Nobel Prize in Literature. Their books are being translated into every language of the civilised world."
 dod_wld.1.d_peace:0 "The Nobel Peace Prize has been awarded to one of our statesmen for their efforts to settle the quarrels of nations without war."
 dod_wld.1.f:0 "A laureate of our own!"
 dod_wld.1.a:0 "A triumph for our science and letters!"
 dod_wld.2.t:0 "Shall We Host the Olympic Games?"
 dod_wld.2.d:0 "The International Olympic Committee is looking for a host for the next Games. Hosting would cost a fortune, but the eyes of the world would be on our capital."
 dod_wld.2.f:0 "Citius, Altius, Fortius."
 dod_wld.2.a:0 "We will host the Games!"
 dod_wld.2.b:0 "Let someone else pay for it."
 dod_wld.3.t:0 "Our Athletes Are Victorious!"
 dod_wld.3.d:0 "Our athletes have returned from the Olympic Games laden with medals. The whole nation celebrates."
 dod_wld.3.f:0 "Gold, silver and bronze!"
 dod_wld.3.a:0 "Hurrah for our athletes!"
 dod_wld.4.t:0 "A World's Fair?"
 dod_wld.4.d:0 "Our industrialists propose a grand exhibition of the arts and industries of all nations, with pavilions, machines and wonders from every corner of the globe."
 dod_wld.4.f:0 "The marvels of the age."
 dod_wld.4.a:0 "Hold a World's Fair!"
 dod_wld.4.b:0 "Too expensive."
 dod_wld.5.t:0 "A Sporting Craze"
 dod_wld.5.d:0 "Football, cricket and ice hockey have become the passion of the working classes. Every town has a club, and every Sunday the crowds pour into the grounds."
 dod_wld.5.f:0 "The beautiful game."
 dod_wld.5.a:0 "Let them play!"
 dod_wld.10.t:0 "A Royal Wedding"
 dod_wld.10.d:0 "The heir to the throne is to be married. Should the bride be a princess of a foreign royal house, or a daughter of our own nobility?"
 dod_wld.10.f:0 "Wedding bells."
 dod_wld.10.a:0 "A foreign princess: an alliance of crowns."
 dod_wld.10.b:0 "One of our own: the people will love her."
 dod_wld.11.t:0 "An Heir Is Born!"
 dod_wld.11.d:0 "Cannons fire across the capital: a healthy heir has been born to the royal family. The succession is secure."
 dod_wld.11.f:0 "Long live the prince!"
 dod_wld.11.a:0 "Long live the prince!"
 dod_wld.12.t:0 "Questioning the Monarchy"
 dod_wld.12.d:0 "Newspapers and pamphlets increasingly question why a single family should rule the nation by birth alone. Republican clubs are meeting openly in the capital."
 dod_wld.12.f:0 "Crown, or republic?"
 dod_wld.12.a:0 "Arrest the agitators."
 dod_wld.12.b:0 "Let them talk; the Crown is secure."
 dod_wld.20.t:0 "The Suffragette Movement"
 dod_wld.20.d:0 "Women across the nation are organising to demand the vote. Their meetings fill the town halls, and their pamphlets are everywhere."
 dod_wld.20.f:0 "Votes for women!"
 dod_wld.20.a:0 "A cause whose time has come."
 dod_wld.20.b:0 "A woman's place is in the home."
 dod_wld.21.t:0 "The Mud March"
 dod_wld.21.d:0 "Thousands of women marched through the capital in pouring rain, their skirts caked with mud, to demand the vote. Even their critics admit the sight was impressive."
 dod_wld.21.f:0 "Through rain and mud."
 dod_wld.21.a:0 "Their courage is admirable."
 dod_wld.22.t:0 "Suffragette Hunger Strike!"
 dod_wld.22.d:0 "Imprisoned suffragettes have gone on hunger strike. The prison authorities are force-feeding them, and the public is horrified."
 dod_wld.22.f:0 "Cat and mouse."
 dod_wld.22.a:0 "Release them when they weaken, re-arrest them when they recover."
 dod_wld.22.b:0 "Release them."
 dod_wld.23.t:0 "Education for Women"
 dod_wld.23.d:0 "Reformers propose opening the universities to women. The professors are divided."
 dod_wld.23.f:0 "Knowledge for all."
 dod_wld.23.a:0 "Open the universities."
 dod_wld.23.b:0 "Not yet."
 dod_wld.30.t:0 "The Temperance League"
 dod_wld.30.d:0 "A temperance league has been founded to fight the evils of drink. Its members blame alcohol for poverty, crime and broken families."
 dod_wld.30.f:0 "The demon drink."
 dod_wld.30.a:0 "A noble cause."
 dod_wld.30.b:0 "A man's drink is his own business."
 dod_wld.31.t:0 "Drunken Riots"
 dod_wld.31.d:0 "A night of heavy drinking ended in riots in the poorer districts of the capital. Several taverns were burned."
 dod_wld.31.f:0 "The morning after."
 dod_wld.31.a:0 "Close the taverns early."
 dod_wld.31.b:0 "Send in the police."
 dod_wld.32.t:0 "Prohibition?"
 dod_wld.32.d:0 "The temperance movement now demands a total ban on the production and sale of alcohol."
 dod_wld.32.f:0 "Dry, or wet?"
 dod_wld.32.a:0 "Ban alcohol!"
 dod_wld.32.b:0 "Never!"
 dod_wld.33.t:0 "Moonshine and Gin Runners"
 dod_wld.33.d:0 "Smugglers and illegal distillers are making fortunes, and the police are bribed to look the other way."
 dod_wld.33.f:0 "Bathtub gin."
 dod_wld.33.a:0 "Crack down on the bootleggers."
 dod_wld.40.t:0 "The Springtime of Nations"
 dod_wld.40.d:0 "Revolution has swept Europe! In capital after capital, crowds demand constitutions, free presses and national rights. Our own streets are filling with protesters."
 dod_wld.40.f:0 "1848."
 dod_wld.40.a:0 "Grant a constitution."
 dod_wld.40.b:0 "Crush the revolutionaries."
 dod_wld.41.t:0 "The Potato Blight"
 dod_wld.41.d:0 "A blight has struck the potato crop, and famine stalks the countryside. Hundreds of thousands face starvation."
 dod_wld.41.f:0 "Hunger."
 dod_wld.41.a:0 "Organise relief."
 dod_wld.41.b:0 "The market will provide."
 dod_wld.42.t:0 "The Chartist Society"
 dod_wld.42.d:0 "Workers have founded a society demanding a People's Charter: votes for every man, secret ballots and paid members of parliament."
 dod_wld.42.f:0 "The People's Charter."
 dod_wld.42.a:0 "Hear their petition."
 dod_wld.42.b:0 "Disperse their meetings."
 dod_wld.43.t:0 "A Luddite Mob"
 dod_wld.43.d:0 "Weavers thrown out of work by the new machines have stormed a mill and smashed its looms."
 dod_wld.43.f:0 "Down with the machines!"
 dod_wld.43.a:0 "Protect the factories."
 dod_wld.43.b:0 "Help the weavers find work."
 dod_wld.50.t:0 "A Boy Shot by Police"
 dod_wld.50.d:0 "During a demonstration of a national minority, a policeman shot dead a young boy. His funeral has become a mass protest."
 dod_wld.50.f:0 "A martyr is born."
 dod_wld.50.a:0 "Punish the policeman."
 dod_wld.50.b:0 "The police acted correctly."
 dod_wld.51.t:0 "A National Poet"
 dod_wld.51.d:0 "A poet writing in a minority language has become wildly popular, and his verses about a lost homeland are sung in every tavern."
 dod_wld.51.f:0 "Words are weapons."
 dod_wld.51.a:0 "Ban his books."
 dod_wld.51.b:0 "Let him write."
 dod_wld.52.t:0 "Kulturkampf"
 dod_wld.52.d:0 "The government and the Church are locked in a struggle over schools, marriages and the appointment of priests."
 dod_wld.52.f:0 "Church against state."
 dod_wld.52.a:0 "The state must control education."
 dod_wld.52.b:0 "Leave the schools to the Church."
 dod_wld.60.t:0 "Capital Punishment"
 dod_wld.60.d:0 "Reformers are campaigning to abolish the death penalty, calling it a relic of a barbarous age."
 dod_wld.60.f:0 "The gallows."
 dod_wld.60.a:0 "Abolish it."
 dod_wld.60.b:0 "Justice demands it."
 dod_wld.61.t:0 "Foul Murder!"
 dod_wld.61.d:0 "A series of gruesome murders has terrified the capital. The newspapers sell out every edition, and the police seem helpless."
 dod_wld.61.f:0 "Who is the killer?"
 dod_wld.61.a:0 "Expand the police force."
 dod_wld.62.t:0 "Debtors' Prison"
 dod_wld.62.d:0 "Thousands of people languish in prison for debts they cannot pay, while their families starve."
 dod_wld.62.f:0 "Abolish the debtors' prisons?"
 dod_wld.62.a:0 "Abolish them."
 dod_wld.62.b:0 "Debts must be paid."
 dod_wld.70.t:0 "Colliery Disaster!"
 dod_wld.70.d:0 "An explosion has ripped through a coal mine, killing dozens of miners. Their families demand to know why the safety rules were ignored."
 dod_wld.70.f:0 "Black damp."
 dod_wld.70.a:0 "Appoint a Mines Commission."
 dod_wld.70.b:0 "Accidents happen."
 dod_wld.71.t:0 "Boiler Explodes!"
 dod_wld.71.d:0 "A boiler has exploded in a crowded factory, killing and maiming workers. Inspectors find it was decades old."
 dod_wld.71.f:0 "Steam and blood."
 dod_wld.71.a:0 "Introduce factory inspections."
 dod_wld.71.b:0 "A tragic accident."
 dod_wld.72.t:0 "A Cure!"
 dod_wld.72.d:0 "Our doctors have developed a treatment for a disease that has killed thousands of workers every year."
 dod_wld.72.f:0 "Medicine triumphs."
 dod_wld.72.a:0 "A triumph of science!"
 dod_wld.80.t:0 "Immigrant Riots"
 dod_wld.80.d:0 "Clashes have broken out between newly arrived immigrants and locals who accuse them of stealing jobs and lowering wages."
 dod_wld.80.f:0 "Strangers in our land."
 dod_wld.80.a:0 "Protect the immigrants."
 dod_wld.80.b:0 "Restrict immigration."
 dod_wld.81.t:0 "Foreign Cuisine"
 dod_wld.81.d:0 "Immigrant restaurants have become fashionable, and the capital's elite now dine on dishes from the other side of the world."
 dod_wld.81.f:0 "A taste of elsewhere."
 dod_wld.81.a:0 "Delicious!"
 dod_wld.90.t:0 "Cholera!"
 dod_wld.90.d:0 "Cholera has broken out in one of our cities. The hospitals are overwhelmed, and the dead are buried in mass graves."
 dod_wld.90.f:0 "The blue death."
 dod_wld.90.a:0 "Quarantine the city."
 dod_wld.91.t:0 "Outbreak of Tuberculosis!"
 dod_wld.91.d:0 "Consumption is spreading through the crowded tenements of our cities."
 dod_wld.91.f:0 "The white plague."
 dod_wld.91.a:0 "Build sanatoriums."
 dod_wld.92.t:0 "The Flu Pandemic"
 dod_wld.92.d:0 "A deadly influenza is sweeping the globe, killing the young and healthy as readily as the old."
 dod_wld.92.f:0 "The great influenza."
 dod_wld.92.a:0 "Close the schools and theatres."
 dod_wld.93.t:0 "Krakatoa Explodes!"
 dod_wld.93.d:0 "The volcano of Krakatoa has erupted with a blast heard thousands of miles away. Tidal waves have devastated the coasts, and ash darkens the skies of the whole world."
 dod_wld.93.f:0 "The loudest sound in history."
 dod_wld.93.a:0 "Send relief."
 dod_wld.94.t:0 "Meteor Strikes Tunguska!"
 dod_wld.94.d:0 "A tremendous explosion has flattened millions of trees in the Siberian taiga. Witnesses speak of a ball of fire falling from the sky."
 dod_wld.94.f:0 "Fire from heaven."
 dod_wld.94.a:0 "Send scientists to investigate."
 dod_wld.95.t:0 "Zeppelin Explodes!"
 dod_wld.95.d:0 "A great airship has burst into flames while landing, killing many of its passengers. Confidence in air travel has been shaken."
 dod_wld.95.f:0 "Oh, the humanity!"
 dod_wld.95.a:0 "A terrible tragedy."
 dod_wld.100.t:0 "Stock Market Crash!"
 dod_wld.100.d:0 "Panic has struck the stock exchange. Fortunes have vanished overnight, banks are failing and factories are closing."
 dod_wld.100.f:0 "Black Thursday."
 dod_wld.100.a:0 "Shore up the banks."
 dod_wld.100.b:0 "Let the weak fail."
 dod_wld.101.t:0 "Economic Boom"
 dod_wld.101.d:0 "Business is booming! New companies are founded every day, and the stock exchange reaches new heights."
 dod_wld.101.f:0 "The good times."
 dod_wld.101.a:0 "Prosperity for all!"
 dod_wld.102.t:0 "A Railroad Trust Exposed!"
 dod_wld.102.d:0 "Journalists have revealed that the great railway companies secretly agreed to fix prices and bribed members of parliament."
 dod_wld.102.f:0 "Corruption on the rails."
 dod_wld.102.a:0 "Prosecute the directors."
 dod_wld.102.b:0 "Hush it up."
 dod_wld.110.t:0 "A Monument Destroyed"
 dod_wld.110.d:0 "Revolutionaries have torn down one of the great monuments of the capital, a symbol of the old regime. Some cheer; others weep."
 dod_wld.110.f:0 "Down with the old order!"
 dod_wld.110.a:0 "Rebuild it."
 dod_wld.110.b:0 "Let it lie as a lesson."
