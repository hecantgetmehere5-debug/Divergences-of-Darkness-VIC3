l_english:
 je_dod_anglois_dilemma:0 "The Anglois Dilemma"
 je_dod_anglois_dilemma_reason:0 "The Plantagenet Crown rules over the French, the English and the Provencaux, and every choice it makes favours one at the expense of the others. Keep both English and French unrest below the breaking point until the Anglois ideal is accepted."
 je_dod_dua_revolution_war:0 "The Wars of Revolution"
 je_dod_dua_revolution_war_reason:0 "The rebels have proclaimed their own states. Crush them, or the Anglois dream dies with them."
 dod_dua.1.t:0 "The Anglois Dilemma"
 dod_dua.1.d:0 "Ever since the Treaty of Rome in 1498, the Dual Monarchy has walked a fine line, careful never to favour one of its peoples over the others. The latest census shows that the English and the French each make up only a fraction of our subjects, while the Anglois elite in Paris rules over both. The King must decide where the Crown's future lies."
 dod_dua.1.f:0 "Kings of France, or kings of England?"
 dod_dua.1.a:0 "Lean towards the French."
 dod_dua.1.b:0 "Lean towards the English."
 dod_dua.1.c:0 "We are kings of France AND England."
 dod_dua.2.t:0 "The Saint Louis Speech"
 dod_dua.2.d:0 "The King has held a great ceremony across the cities of France in honour of his ancestor Louis, the sainted King of France. In every speech he stressed the Treaty of Paris and the French roots of the Plantagenet crown. The French cheered; in England, few were listening."
 dod_dua.2.f:0 "Je vous ai compris!"
 dod_dua.2.a:0 "Je vous ai compris!"
 dod_dua.3.t:0 "The Great Royal Travel"
 dod_dua.3.d_france:0 "To strengthen his presence, the King has travelled across France. In Normandy he praised his ancestor William, who sailed to conquer England; in Brittany, a land long tied to the Plantagenets, he was greeted by cheering crowds. The French have seen their King."
 dod_dua.3.d_england:0 "To strengthen his presence, the King has travelled across England. He landed near Hastings, where his ancestor William won the English crown, then went on to London to pray in Westminster. The English have seen their King."
 dod_dua.3.f:0 "The Plantagenets are truly our kings!"
 dod_dua.3.a:0 "Long live the King!"
 dod_dua.4.t:0 "The Sons of Harold"
 dod_dua.4.d:0 "A wave of protest has swept England against the King's French turn. The English feel absent from his speeches, and many are looking for alternatives. A professor named John Tolsmith has founded the Sons of Harold, a society devoted to the English language and the memory of the last Saxon king."
 dod_dua.4.f:0 "We shall watch these Englishmen..."
 dod_dua.4.a:0 "We shall watch these Englishmen."
 dod_dua.4.b:0 "Ban the society."
 dod_dua.5.t:0 "Is English a Language?"
 dod_dua.5.d:0 "A dispute has broken out at the Sorbonne between two scholars over whether English is a true language, fit for the halls of government. It may look like a philological quarrel, but the whole kingdom is following it."
 dod_dua.5.f:0 "A quarrel of scholars, or of nations?"
 dod_dua.5.a:0 "Some noises made by peasants are not a language!"
 dod_dua.5.b:0 "English is as good as French."
 dod_dua.5.c:0 "The Crown takes no part in philological debates."
 dod_dua.6.t:0 "The Shakespeare Festival"
 dod_dua.6.d:0 "The English have organised a festival in Stratford-upon-Avon to honour a playwright named William Shakespeare. Rediscovered by the Sons of Harold, this forgotten author wrote many plays in English, some of which openly mock the Anglois court."
 dod_dua.6.f:0 "What could possibly happen?"
 dod_dua.6.a:0 "Let them have their festival."
 dod_dua.6.b:0 "Allow it, under heavy guard."
 dod_dua.6.c:0 "Forbid it!"
 dod_dua.7.t:0 "The Infernal Machine!"
 dod_dua.7.d_english:0 "While visiting Liverpool, the heir to the Dual Monarchy and his family were attacked by English radicals. The Prince, his wife and their son were killed, along with dozens of bystanders. In his grief, the King has ordered a crackdown on every radical society in England."
 dod_dua.7.d_french:0 "While visiting Orleans, the heir to the Dual Monarchy and his family were killed by a bomb planted by French nationalists. The explosion also took the lives of seventy bystanders. In his grief, the King has issued decrees restricting public meetings across the kingdom."
 dod_dua.7.f:0 "A sad day for the two kingdoms."
 dod_dua.7.a:0 "Restrict public meetings."
 dod_dua.7.b:0 "They are not all to blame."
 dod_dua.8.t:0 "The Sons of Saint Louis"
 dod_dua.8.d:0 "A French nationalist society has been founded in La Rochelle by the historian Francois Guizot. It aims to awaken the national consciousness of the French and Provencal peoples, who feel abandoned by a Crown that looks ever more across the Channel."
 dod_dua.8.f:0 "We shall watch these 'patriots'..."
 dod_dua.8.a:0 "We shall watch these patriots."
 dod_dua.8.b:0 "Ban the society."
 dod_dua.9.t:0 "Romanticism"
 dod_dua.9.d:0 "A new school has appeared in the arts. The Romantics defy the classical rules laid down in Paris, and they are especially successful in England, where Tolsmith and Lord Byron publish to great acclaim."
 dod_dua.9.f:0 "The rules of Paris, or the passions of England?"
 dod_dua.9.a:0 "Support the movement!"
 dod_dua.9.b:0 "Classical poetry is best!"
 dod_dua.10.t:0 "The Death of King Henri X"
 dod_dua.10.d_elisabeth:0 "King Henri X has died without an heir, and the Estates-General have chosen Elisabeth, daughter of the King's brother, as Queen. Her claim was the strongest, but her pro-Anglois ties worry the French."
 dod_dua.10.d_edouard:0 "King Henri X has died without an heir. After several rounds of voting, the Estates-General have chosen Edouard, Duke of York. England rejoices, while France fears what is to come."
 dod_dua.10.d_gascony:0 "King Henri X has died without an heir, and to the shock of many the Estates-General have chosen Henri, Duke of Gascony. The South rejoices, but England is in uproar."
 dod_dua.10.d_natural:0 "Henri X has died in Paris at the venerable age of 76, after nearly thirty years on the throne. He pushed for the centralisation of the Plantagenet lands to the very end. He is succeeded by his only son, Henri XI."
 dod_dua.10.f:0 "The Estates-General have spoken."
 dod_dua.10.a:0 "Long live the new monarch!"
 dod_dua.11.t:0 "Choosing a Patron"
 dod_dua.11.d:0 "The King is to honour a great historical figure in the coming months. Alfred the Great, the old Saxon king, is admired across the Channel; Saint Louis is seen as a benevolent figure by the French and Provencaux; and Edouard IV, the conqueror, is the hero of the Anglois elite."
 dod_dua.11.f:0 "Whose memory shall the Crown honour?"
 dod_dua.11.a:0 "Saint Louis is worthy of our recognition."
 dod_dua.11.b:0 "Alfred the Great is worthy of our recognition."
 dod_dua.11.c:0 "Edouard IV is worthy of our recognition."
 dod_dua.12.t:0 "Liberal Agitations"
 dod_dua.12.d:0 "Liberals and nationalists on both sides of the Channel have formed societies to spread their ideas. If we allow them, the Sons of Harold and the Sons of Saint Louis will surely cause trouble; banning them could provoke even worse."
 dod_dua.12.f:0 "Watch them, or silence them?"
 dod_dua.12.a:0 "These organisations must be watched closely."
 dod_dua.12.b:0 "Ban both of them!"
 dod_dua.13.t:0 "A History of France"
 dod_dua.13.d:0 "The historian Pierre Guizot has published a new history of France, praised by French scholars for its thoroughness. But its portrayal of the English and of the early Plantagenets is troubling, to say the least."
 dod_dua.13.f:0 "History is written by Frenchmen."
 dod_dua.13.a:0 "He makes some interesting points..."
 dod_dua.13.b:0 "And he calls this history?"
 dod_dua.14.t:0 "Saxon Poetry"
 dod_dua.14.d:0 "The Sons of Harold have published an anthology of English poetry in Cambridge. It is widely applauded in England, but many Parisian scholars consider it a complete waste of paper."
 dod_dua.14.f:0 "Is English fit for poetry?"
 dod_dua.14.a:0 "A truly wonderful piece of art!"
 dod_dua.14.b:0 "As I said before, English is not fit for poetry."
 dod_dua.15.t:0 "The Travels of the Dauphin"
 dod_dua.15.d:0 "The King has grown too frail to travel far from Paris. The duty now falls to his son, Dauphin of France and Prince of Wales. Where shall he go first?"
 dod_dua.15.f:0 "The Crown must be seen."
 dod_dua.15.a:0 "The Dauphin will travel through France."
 dod_dua.15.b:0 "It has been a long time since a royal went north of England..."
 dod_dua.15.c:0 "The Anglois heartlands are safer."
 dod_dua.16.t:0 "A Night at the Theatre"
 dod_dua.16.d:0 "Paris is bursting with creativity, and three plays draw the crowds: an adaptation of Shakespeare's 'Alfred the Great', a Moliere comedy, and Racine's 'Joan the Mad'. The King's attendance will be noticed."
 dod_dua.16.f:0 "All of Paris is watching the royal box."
 dod_dua.16.a:0 "I hear this Shakespeare is quite entertaining..."
 dod_dua.16.b:0 "A Moliere comedy will be best!"
 dod_dua.16.c:0 "'Joan the Mad' will remind us of our glorious history."
 dod_dua.17.t:0 "Les Immortels"
 dod_dua.17.d:0 "The Royal Academy, founded in the seventeenth century to host the kingdom's greatest literary minds, also codifies the official language of the monarchy. A seat among the Immortals has fallen vacant, and the King's choice will be read as a statement."
 dod_dua.17.f:0 "Who shall join the Immortals?"
 dod_dua.17.a:0 "Tolsmith could give us another perspective..."
 dod_dua.17.b:0 "The Occitan poet Jasmin will remind us of the sunny Midi!"
 dod_dua.17.c:0 "Nominate the proud Anglois grammarian Morel."
 dod_dua.18.t:0 "A New Minister"
 dod_dua.18.d:0 "Our prime minister has died in office, and it falls to the monarch to choose his successor. Three candidates have the favour of Parliament: the Duke of Richelieu, close to the Young French; the Duke of Rohan, a pillar of the Anglois establishment; and the Duke of Devonshire, champion of the English."
 dod_dua.18.f:0 "The King must choose."
 dod_dua.18.a:0 "Richelieu shall be Prime Minister."
 dod_dua.18.b:0 "Rohan shall be Prime Minister."
 dod_dua.18.c:0 "Devonshire shall be Prime Minister."
 dod_dua.20.t:0 "The Glorious Revolution"
 dod_dua.20.d:0 "Tensions in our English lands have reached the boiling point, and every attempt to placate the nationalists has failed. It began with the Liverpool garrison declaring the authority of Paris void, and within weeks the whole of England has risen. An English government has been proclaimed in London."
 dod_dua.20.f:0 "England rises."
 dod_dua.20.a:0 "The English will be taught how to behave!"
 dod_dua.20.b:0 "Let England go."
 dod_dua.21.t:0 "The English Constitution"
 dod_dua.21.d:0 "England is free, but what form of government shall it take?"
 dod_dua.21.f:0 "A new England."
 dod_dua.21.a:0 "We will crown a noble King of England."
 dod_dua.21.b:0 "We need no king!"
 dod_dua.25.t:0 "The Midi Revolution"
 dod_dua.25.d:0 "The Crown's English turn has alienated the southern French lands. The Occitans, Protestant at heart and long loyal to the Valois kings, have always been the most rebellious of our subjects. Now they have risen and proclaimed their own state in Toulouse."
 dod_dua.25.f:0 "The South rises."
 dod_dua.25.a:0 "The Occitans will regret this!"
 dod_dua.25.b:0 "Let the Midi go."
 dod_dua.26.t:0 "Choosing the Government"
 dod_dua.26.d:0 "The Occitan state must now decide what it shall be: will it welcome the Valois pretender from Provence, or proclaim a free republic?"
 dod_dua.26.f:0 "Valois, or Republic?"
 dod_dua.26.a:0 "We welcome the true Kings of France!"
 dod_dua.26.b:0 "We don't need petty kings!"
 dod_dua.27.t:0 "The New Hundred Years' War"
 dod_dua.27.d:0 "Provence has taken control of our rebellious provinces and swears not to stop until Paris! We must put an end to the War of the French Throne once and for all."
 dod_dua.27.f:0 "It is the last time the Valois deny our rights!"
 dod_dua.27.a:0 "It is the last time the Valois deny our rights!"
 dod_dua.27.b:0 "We cannot fight them now."
 dod_dua.29.t:0 "The Franco-English Revolution"
 dod_dua.29.d:0 "Tensions have been growing for decades in a Dual Monarchy that could never satisfy both continentals and islanders. Now revolutionaries swarm the streets of its great cities on a scale never seen before. England and the Midi have both proclaimed their independence."
 dod_dua.29.f:0 "All is crumbling!"
 dod_dua.29.a:0 "We will fight on both fronts!"
 dod_dua.29.b:0 "The end of the Angevin legacy."
 dod_dua.31.t:0 "The End of the Anglois Dream"
 dod_dua.31.d:0 "The rebels have secured their independence. Our claim to rule over both France and England has been shattered, and the Crown must look for a new destiny."
 dod_dua.31.f:0 "It is but a flesh wound!"
 dod_dua.31.a:0 "It is but a flesh wound!"
 dod_dua.32.t:0 "The Pacification of the Realm"
 dod_dua.32.d:0 "Against all odds we have defeated the revolutionaries, and our hold on every Plantagenet land is stronger for it. The great question of the Crown's identity, however, remains."
 dod_dua.32.f:0 "Pesky rebels..."
 dod_dua.32.a:0 "We continue as we always have."
 dod_dua.40.t:0 "The Crown Prevails"
 dod_dua.40.d_french:0 "After the trials of recent years, the monarchy has affirmed its French character. Rooted in Paris, the Crown has won the loyalty of the French people and their leaders."
 dod_dua.40.d_english:0 "Despite the troubles of recent years, the monarchy has asserted its English roots. With London weighing as much as Paris in the affairs of state, the Crown has won the loyalty of the English people."
 dod_dua.40.d_anglois:0 "The Plantagenet throne has endured! Despite radicals, nationalists and foreign powers, all its peoples stand ready to serve. Who can stand against the combined might of France and England?"
 dod_dua.40.f:0 "Eventually, we prevail!"
 dod_dua.40.a:0 "Dieu et mon droit!"
 dod_dua.41.t:0 "The Dominion of Ireland?"
 dod_dua.41.d:0 "The Irish Confederation has won nearly every Irish election for years. The Irish problem, as many call it, cannot be stopped peacefully. Either we grant Home Rule, or Ireland stays part of the realm, whatever the cost."
 dod_dua.41.f:0 "Home Rule, or the Crown?"
 dod_dua.41.a:0 "Home Rule is the answer to Irish demands."
 dod_dua.41.b:0 "Ireland has been part of the realm for centuries and will stay so."
 dod_dua.42.t:0 "The Irish Rising"
 dod_dua.42.d:0 "The Irish Republican Brotherhood has launched a general uprising. Their control over the island is almost complete, and the Irish flag now flies from Cork to Belfast."
 dod_dua.42.f:0 "Damn the Irish!"
 dod_dua.42.a:0 "The Irish will be taught the true power of the Dual Monarchy!"
 dod_dua.42.b:0 "Leave the Gaels to themselves."
 dod_dua.45.t:0 "Young Scotland"
 dod_dua.45.d:0 "With the success of the English Revolution in the south, the idea of independence has spread to Scotland. The most important nationalist group, Young Scotland, is led by the son of the famous writer Walter Scott."
 dod_dua.45.f:0 "Scotland stirs."
 dod_dua.45.a:0 "Banish Scott and his supporters."
 dod_dua.45.b:0 "Let them agitate; an independent Scotland is impossible."
 dod_dua.47.t:0 "The Young Scotland Committee"
 dod_dua.47.d:0 "The Scottish nationalist leaders, banished from Edinburgh, have found shelter with us. Walter Scott Jr. has asked Parliament for weapons and officers to free his homeland from Scandinavia."
 dod_dua.47.f:0 "It could serve our interests..."
 dod_dua.47.a:0 "It could serve our interests..."
 dod_dua.47.b:0 "Scotland is only a source of trouble for England."
 dod_dua.46.t:0 "The Scottish Revolution!"
 dod_dua.46.d:0 "Walter Scott and his followers have returned to Scotland and started an open insurrection. A Scottish Republic has been proclaimed in Edinburgh."
 dod_dua.46.f:0 "How dare they?!"
 dod_dua.46.a:0 "Scandinavia will reconquer Scotland!"
 dod_dua.46.b:0 "Let the Scots have their republic."
 dod_dua.50.t:0 "The End of the Valois"
 dod_dua.50.d:0 "Provence has lived long enough, or so Paris thinks. Diplomatically isolated, the little state that still defies the Plantagenets will be crushed. For Saint Denis and Saint George, the Hundred Years' War will finally end!"
 dod_dua.50.f:0 "For Saint Denis and Saint George!"
 dod_dua.50.a:0 "Of course we'll annex them."
 dod_dua.50.b:0 "It is the end for the Valois!"
 dod_dua.50.c:0 "Leave them be."
