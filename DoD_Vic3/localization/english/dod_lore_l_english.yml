l_english:
 dod_lore.100.t:0 "History of the Dual-Monarchy (1/8)"
 dod_lore.100.d:0 "The execution of Joan of Arc would come to mark the beginning of the end for the French Wars of Succession (1337-1498), as the Armagnac Party would never again rise to what it once was. The Valois and their allies would fight on for another seventy years, but with the victory of Edward the Red Prince at Vichy the future of a Dual Monarchy of France and England was secured, only being confirmed with the 1498 Treaty of Rome. The threat of encirclement with the Marriage of Anne of Brittany with Jean III of Burgundy, led to the breakdown of the Anglo-Burgundian alliance in 1490 when, unable to challenge the marriage, invaded Brittany during the Anglo-Franco-Breton War (1490-1492). Burgundy, unable to provide support against France due to rebellion fermented by the House of Lorraine, forced Brittany's surrender. While it was too late to annul the marriage, with Jean having consummated it, the Treaty of Le Verger effectively saw Brittany annexed into the French crown."
 dod_lore.101.t:0 "History of the Dual-Monarchy (2/8)"
 dod_lore.101.d:0 "The Reformation presented new challenges to the unity of the thrones. The deep involvement of the Valois in aiding Zwingli's escape from Papal and Imperial imprisonment was too good a pretext to end any alternate succession, causing the Languedoc War (1532), and ending with the conquest of Languedoc & Auvergne, leaving only a rump Provencal state in the Azure Coast and in Rhone. In addition to the affairs of Provence, it also engaged in what became known as the Great Game with the Kingdom of Burgundy and the Crown of Aragon. The subject of these wars of influence came about with Navarre (which saw the conquest of the County of Foix & Bearn in 1516), the Italian Peninsula (which ended largely as a victory for the Aragonese, as most of the Peninsula, save Savoy, Genoa, Milan, and the Emilian Dukedoms fell under their influence, compared to only Savoy for the Dual Monarchy), and even the County of Provence (which easily fell into the Aragonese camp to save them from being destroyed by the Plantagenets.)"
 dod_lore.102.t:0 "History of the Dual-Monarchy (3/8)"
 dod_lore.102.d:0 "While aggressively fighting heresy abroad the Kings of Both Thrones were initially tolerant of Protestants. King Francois I was torn between dynastic links to the firmly Catholic Jagiellons of Bohemia and a large portion of his populace firm in their new faith. Further strife in England and in Aquitaine combined with the growing threat of Burgundy (long the champion of the Protestant cause) tipped the balance leading first to the Anglo-French Wars of Religion (1598-1614) both within the Kingdom and among its neighbors, and later after the defeat of the Protestants, the Exodus of the Protestant Huguenots to Burgundy, Scandinavia and Colonial New Burgundy (now the Seven Republics) and the Anglican Father Pilgrim and their followers to what they would call New England (now Beornia)."
 dod_lore.103.t:0 "History of the Dual-Monarchy (4/8)"
 dod_lore.103.d:0 "While England was briefly a viceroyalty under the Dukes of Gloucester, the throne would be forever undivided following the dissolution of the English Parliament by Henry VII in 1537, and its merging into the Estates General. The nobility with the exception of some distant provinces converged increasingly to Paris as French, became the official language throughout both kingdoms. This led to the gradual Francification of England as once English names were increasingly replaced by French. By the turn of the 19th century, French has become the primary common language in the Southern parts of England. The concept of a centralized Parliamentary body was revolutionary for its time, and, almost ironically, would influence the future legislative bodies of the Burgundian Estates-General, the Savoyard Subalpine Senate, the Aragonese Cortes and the Scandinavian Riksdag, among other European states."
 dod_lore.104.t:0 "History of the Dual-Monarchy (5/8)"
 dod_lore.104.d:0 "The Anglo-French history in Ireland was also something of a peculiar moment. During the French Wars of Succession, English, and later Anglo-French control of the Island was left in the hands of the House of Fitzgerald, the Earls of Kildare as much time was spent in building a new administrative apparatus for both England and France. Because of this, the Kildares, along with the House of Desmond, both began to rule Ireland as if it was their own Kingdom. The issues, which had been building up during the twilight years of the reign of Henri VIII culminated in the three Irish Wars (1573-1579, 1583-1594 and the Nine Years’ War, 1598-1607). Which gradually saw Ireland pacified, the rebel Irish Lords killed and the King of England and France reaffirmed as Lord of Ireland."
 dod_lore.105.t:0 "History of the Dual-Monarchy (6/8)"
 dod_lore.105.d:0 "With the unexpected ascension of James IV of Scotland to the Throne of the North in 1500 the Plantagenêts faced the threat of encirclement by the alliance of Burgundy and the former. The exodus of the early 17th century was compounded by wars against Burgundy and Scandinavia pushing emigration to the colonies of Plantagenia and Amazonie. However the pushing towards these colonies were not without strife there as well, as conflicts were rife between Colonial Vinland and New Burgundy, as well as against the Cherokee and Creek, among other First Nation Tribes."
 dod_lore.106.t:0 "History of the Dual-Monarchy (7/8)"
 dod_lore.106.d:0 "Eventually, the Dual Monarchy secured its position as the unquestioned power in Western Europe amid the gradual decline of Spain. A period of relative peace in Europe allowed the Dual Monarchy to expand its influences abroad. The Dual Monarchy established trading posts along the coast of Sierra Lionne, allowed them to trade European goods for slaves to be sent to the New World. A series of wars with the Kingdom of Kandy (1696-1703, 1705-1715, 1716-1717) saw the entirety of Ceylon becoming an Anglo-French crown colony, allowing access to the Indian Ocean Trade through good relations with the Nasirid Sultans of Bengal. At the same time there was a great degree of expansion in the Anglo-French colonies in the New World, as colonial conflicts with Scandinavia, Burgundy and Spain, reinforced its mother country’s position. This period of colonial expansion was broken with the War of the Anglo-French Succession, leading to the independence of Plantagenia under a cadet branch of the House of Plantagenêt."
 dod_lore.107.t:0 "History of the Dual-Monarchy (8/8)"
 dod_lore.107.d:0 "Remaining largely aloof during the opening stages of the Great German Wars allowed the industrial revolution to take hold and the Dual Monarchy seemed set to dominate this new realm as well. But the battles of the later war quickly demonstrated that the old rival Burgundy was again on the rise as even beaten and battered it remained victorious, losing only its other colony Amazonie to independence. The Dual Monarchy enters the middle of the 19th century as the ultimate global power, but for the first time in over a century its position does not appear unassailable in Anvers and courts beyond."
 dod_lore.113.t:0 "History of Burgundy (1/6)"
 dod_lore.113.d:0 "Following the Congress of Arras, Philip of Burgundy swore fealty to Henry VI but extracted a high price. While still obligated to come to his liege's aid in time of war Philip secured for himself and his heirs full exemption from taxation and full command of his own vassals and levies. Hence began Burgundy's rise to true independence. English actions over the following decades continued to jeopardize the relationship as Burgundy felt it bore a disproportionate cost in the war, while the English took its aid for granted."
 dod_lore.114.t:0 "History of Burgundy (2/6)"
 dod_lore.114.d:0 "'With the death of Philip, his son Charles would pursue an aggressive and independent policy greatly expanding his realm earning him the epithet 'the Bold'. Through campaigns across southern France and up and down the Rhine, by his death he would secure the addition of the entirety of the Low Countries, Alsace, Lorraine, and the northern Rhine including Cologne, Trier, Mainz, and the Palatinate, as well as the crown and title Rex Burgundicum. While much of the realm remained officially in the Empire or in fief to France, never again would a Burgundian bow to Paris or Prague. To secure this new throne the Burgundians began to quietly back their distant relatives the Valois against their former lieges the Plantagenets.'"
 dod_lore.115.t:0 "History of Burgundy (3/6)"
 dod_lore.115.d:0 "Zwingli proved popular in much of the realm and the kingdom welcomed a stream of refugees as the Dual Monarchy dismantled much of the Valois’ remnants in the Languedoc War (1532). The burning of Zwingli at the stake in 1527 sent Burgundy firmly down the path of Protestantism as it confronted its newly confirmed enemies the Jagiellons and Plantagenets. The accession of Philippe IV to the Burgundian throne in 1528 saw ties to the former Duchy are cut as he moved the capital from Dijon to Anvers in the Low Countries. The new King also began pursuing a policy of aggressive defense of Protestantism in the Empire, becoming its champion with support from the Stuarts of Scandinavia. Explicitly ignoring the Treaty of Pamplona, Burgundian settlements are established in both Ameriga and Arcadia."
 dod_lore.116.t:0 "History of Burgundy (4/6)"
 dod_lore.116.d:0 "The Wars of Religion begin to kick off in earnest amid Burgundy's new policy of supporting any Protestant monarch in defense of his throne (often interpreted where convenient to include lesser claimants). While maintaining a level of civility with the Dual Monarchy, Burgundy pursues a series of proxy wars in northwestern Italy which, although lost, serve to further confirm Burgundian supremacy in arms if not local politics. Open warfare against the Emperors in Central Germany made Burgundy the recognized leader of the central German Protestants while her close ally Scandinavia dominated in the north. Caught between the Turks and Protestants, Bohemia and her allies slowly lost ground on both fronts in a series of wars through the 16th and early 17th century, much to Burgundy's benefit. Burgundy's armies exhausted by decades of constant fighting began to give way, and despite the inability to dominate Germany, they were able to secure religious freedom and thus, they hoped, a long peace."
 dod_lore.117.t:0 "History of Burgundy (5/6)"
 dod_lore.117.d:0 "The enrichment of the Dutch and Flemish merchant houses through loans to the government and monopolies on Atlantic trade brought great benefits. It financed unparalleled technological development at home and led to the first trade ventures east securing the first Burgundian footholds in the Indian Ocean. With several decades of peace Burgundy looked inward for the most part though trade ventures secured footholds on the Cape and in Southeast Asia. Increasingly overshadowed by her neighbor the Dual Monarchy, Burgundy sought to shore up her support in the Empire."
 dod_lore.118.t:0 "History of Burgundy (6/6)"
 dod_lore.118.d:0 "The unexpected events of the Revolution in Frankfurt forced Burgundy into the unusual position of backing the Emperor in his crackdown as the rebels turned on the aristocracy at large. But as the Catholic League showed its intent to abuse the support to secure its position, Burgundy started the defining war of the time, the Great German War (1796-1820). As armies marched across the Empire new states rose and fell through the decades as the unprecedented bloodshed continued and all Europe was drawn in. Nationalism's dread rise threatened the integrity of Burgundy as a state, but ultimately it emerged victorious above the other European powers with its territory intact at the head of a new alliance of western Imperial states set to march proudly into the 19th century.?"
 dod_lore.124.t:0 "History of Gran Colombia (1/10)"
 dod_lore.124.d:0 "Spanish Colonization of the Americas did not begin in earnest until the accession of Alfonso XII, when the first outpost would be established in 1496 in the Island of Cuba, named Santiago after the Mythological Saint James the Moor-slayer. By the end of the first quarter of the 16th century, the Spanish had already established a series of colonial holdings in Cuba. The first expedition into the mainland of the New World came in 1517, when Cuban governor Diego Velázquez commissioned a small Spanish fleet to explore the Yucatan Peninsula (the future Captaincy General of Mayapan), led by Bernal Dávila. There they would meet the local natives of the Mayan city of Cape Catoche."
 dod_lore.125.t:0 "History of Gran Colombia (2/10)"
 dod_lore.125.d:0 "The Spaniards read to them the Requirement of 1513 to them, which offered the natives the protection under the King of Spain should they submit to them. However they were refused and caused a great incident to occur, which saw many a Spaniard killed or forced to flee. Two years later a second attempt to explore the mainland came in 1519, this time it was a larger force that landed in Central Mexico. This force would find themselves allied with various natives, in what the latter saw was a great opportunity to overthrow the oppressive and brutal Aztec Triple Alliance. The Spanish Conquistador force, led by Diego de Quirós, would join with various Mesoamerigan tribes such as the Tarascans and the Tlaxcalans in battle, defeating the Aztecs in Otumba and sacking the Aztec capital of Tenochtitlan, razing it to the ground and building a new capital, Mexico City, which would become the seat of the Viceroyalty of New Spain."
 dod_lore.126.t:0 "History of Gran Colombia (3/10)"
 dod_lore.126.d:0 "From the conquest and subjugation of the Aztecs followed further conquests, first of former allies in Mesoameriga, then of the Mayans, who of which resisted for much of the 16th century, despite being largely under Spanish control by the late 1520’s, and even down into what would be Granada. Ultimately, they would be stopped by two formidable forces. To the south was the Empire of Tawantinsuyu, whom, despite having to deal with a Civil War, was able to repulse and humiliate the Spaniards, a feat further strained due to official support from the Dong Guo City-States as well as the Dual Monarchy of England-France. Attempts at expansion northwards was also met with dismal failure, first by the Dong-Guo City States, who humiliated the Spanish at the Battle of Yongle in 1544, and was further reined in by the Anglo-French encroachment deeper into the Arcadian continent as the Viceroyalty of Plantagenia."
 dod_lore.127.t:0 "History of Gran Colombia (4/10)"
 dod_lore.127.d:0 "Colonial life saw Gran Colombian society divided into a series of castes. At the top were the Peninsulares, the peoples born in Spain.. Under them were the Criollos, citizens born in the colonies to full Peninsularies and Creole families. Between the two were the colonial government dominated by, with respect to the King of Spain. Below them are the Mestizos and Mulattos, who are citizens of mixed Spanish and Native American/African ancestry, and finally at the bottom are the Native peoples and African slaves."
 dod_lore.128.t:0 "History of Gran Colombia (5/10)"
 dod_lore.128.d:0 "The Viceroyalty was originally established with control over the entire territory from Lusitania to Cusco. This would change with the Beja Reforms instituted in the late 18th century during the reign of King Manuel and King Jose. These reforms saw an attempt to centralize the Spanish Empire to the person of the Absolutist King of Spain. This included partitioning the Viceroyalty of New Spain into four, Lusitania in the North, San Salvador in Mesoameriga, Granada in Ameriga, and a rump Viceroyalty of New Spain in control of Mexico and Cuba. The government would be ruled exclusively by peninsulaires, who in theory would be disinterested, these peninsulaires being military men who had long records of military service. Clergymen, audencia judges and governor-generals were also staffed by peninsulaires."
 dod_lore.129.t:0 "History of Gran Colombia (6/10)"
 dod_lore.129.d:0 "This disenfranchisement by the King, coupled with economic forms working against the colonials, among other issues led to ideas of independence and self-government to spread. The tip off was the renegade priest Manuel Aldama’s Cry of Dolores speech, which would kick off what would eventually become the Spanish American Wars of Independence or the Spanish-Colombian War (1815, 1818- ) The conflict brought many peoples together in attempting to remove the Spanish, culminating in the founding of the Colombian Alliance in 1819 under Mexican General Víctor Bocanegra. Over the course of the three year campaign, the revolutionaries were able to successfully liberate Mexico (the Second Mexican Republic, the First having been crushed immediately after its founding in 1815), and Lusitania (The Lusitanian Republic) before being decisively defeated in the Battle of San Salvador on 16 September 1822, ultimately leading to the first armistice, signed in Veracruz at the end of the month."
 dod_lore.130.t:0 "History of Gran Colombia (7/10)"
 dod_lore.130.d:0 "Meanwhile in Ameriga, a group of revolutionaries seized control of the New Granadan Viceregal capital of Cartagena, and declared the creation of the Republic of Granada (the precursor to Santandera). Led by Jacinto de Gravina, the new Republic began its own waves of conquest, incorporated the Governor-Generalate of Quito and Arequipa in the Andes. This coupled with the restarting of the Mexican advance into Guatemala, saw the rebirth of the Colombian Alliance, now with the Amerigan Republics added to this group. By the end of 1828, the Spanish were now reduced to their holdings in Cuba, Nueva Castilla & Essequibo."
 dod_lore.131.t:0 "History of Gran Colombia (8/10)"
 dod_lore.131.d:0 "Desperate, the colonial governor of Granada called upon the support of the Inca under their leader, Huayna Capac IV. This Inca Intervention (1829-1832), initially tipped the battle in Spain’s favor, as Peru was coming under siege. But they were decisively defeated as Lima, seeing the death of Jacinto de Gravina as a result. The Inca continued their conflict under the new Colombian Supreme Leader, and de Gravina’s protege, Jose María Santander, but the latter’s death upon the removal of the Inca from Peru saw the Alliance become centralized and dominated by Granadan general Federico de las Casas. However, to reassure the peoples of Mexico, Lusitania and Mesoameriga, de las Casas established a Tetrarchy, bringing in Juan Manuel Santos to represent Mesoameriga, Tomás Villa to represent Mexico and Manuel Luis de Madeira to represent Lusitania, however Tomás Villa would still hold the most power out of the four members."
 dod_lore.132.t:0 "History of Gran Colombia (9/10)"
 dod_lore.132.d:0 "Under the coalition of de las Casas and Santos in 1832, Gran Colombia launched a full-scale assault on Castilla and Essequibo, successfully removing Spanish presence there by 1834. De las Casas, now determined to remove the Spanish completely from the Americas, began construction of a Navy, utilized all the naval shipyards the alliance had to offer. This hastily assembled fleet was to carry their army to conquer Cuba, but this move was intercepted by a Large Spanish fleet that had recently arrived at port in Havana. The Battle of Havana, fought on 21 April 1835, was the decisive battle that saw the Colombian Navy smashed and half it’s men going down with their ships."
 dod_lore.133.t:0 "History of Gran Colombia (10/10)"
 dod_lore.133.d:0 "The battle would be followed up by summer with a massive invasion against the Colombian rebels, seeing Lusitania, the Yucatan and Granada being invaded by the Spanish in a determined effort to end the Colombian independence movement. De las Casas, either to better coordinate the alliance, or out of strengthening his power, abolished the republics and united them into a Federal Republic centralized in Mexico City. Despite being corrupted by a power-hungry general, the dream of Independence for the Spanish-speaking peoples of the New World still lingers for those who wish to fight for it. But do the people wish to fight for their freedom, or would they wish to once again be forced under the yoke of Spanish domination??"
 dod_lore.139.t:0 "History of Qingqiu (1/9)"
 dod_lore.139.d:0 "The Origin of Qingqiu (Chinese for Clear Autumn) can be traced back to the voyages of Zheng He that was sponsored by the Yongle (1404-1424) and Hongxi (1424-1435) Emperors of Ming China, all of which highlighted the power of the Scholar-Bureaucratic Faction over the Eunuchs. Zheng He would be tasked by the Xuande Emperor to launch an expedition to explore further east after the successful fifth expedition leading to the discovery of Zhourao (OTL Australia). As such in 1430, the expedition would set sail. The journey, which took roughly eight months to achieve, would come to an end when they landed in what would later become known as Sanbao Bay.After leaving some of the peoples there behind, Zheng He would make a return trip to China to report his findings, leaving Lei Shoushan and several troops behind to settle and live in this new world. A second voyage would occur in 1433-1434, bringing more soldiers, but also farmers and miners to Qingqiu."
 dod_lore.140.t:0 "History of Qingqiu (2/9)"
 dod_lore.140.d:0 "During the trek there, Zheng He decided that something dramatic needed to be done to appease the unhappy passengers to avoid some kind of disaster. He arranged for the fleet to stop and allow people to visit ships other than their own, in an attempt to abate their cabin fever. These became regular events, almost celebrations"
 dod_lore.141.t:0 "History of Qingqiu (3/9)"
 dod_lore.141.d:0 "About two years after the Second Landing, more ships arrived from China. They carried no passengers, however – in fact, they carried barely any soldiers. They had come to deliver a message: the Hongxi Emperor had died and his son now ruled as the Xuande Emperor. The new emperor was uninterested in continuing to devote so many financial and military resources to such a distant colony, and ordered the troops to return. His Majesty had disavowed any interest in Qingqiu, and declared that anyone who remained there would no longer be under his protection."
 dod_lore.142.t:0 "History of Qingqiu (4/9)"
 dod_lore.142.d:0 "This caused an uproar in Sanbao, and Lei Shoushan, now leader of the city, sent messages to the other Dong Guo City States, instead of discussing the order of returning to China, instead to demand they swear fealty to him, as the new Emperor of Dong Guo. But neither the other cities, nor even Sanbao, wanted an Emperor, and before any ceremony took place, a coup occurred in Sanbao, killing Lei and forcing the Ming messenger to leave, the latter convinced that their time living in the wilderness had driven them into lunacy. The city-states would come under the administration of the military governors until the 1470’s and 1480’s, when wealthy and influential men took the reigns in power, forming City Councils, with a representative from each city forming what would ultimately become the Council of Twenty."
 dod_lore.143.t:0 "History of Qingqiu (5/9)"
 dod_lore.143.d:0 "During the late 15th century, Dongese explorers sailed south beyond the lands of Mexico and discovered Twanitsuyu. These explorers would meet with and establish a long-standing trade network with the Incan people, bringing untold wealth to the city-states (most especially the southern-most city Yongle) in exchange for weaponry and arms to the Inca. These proved instrumental in the Inca Civil War (1529-1532) and the subsequent Spanish-Incan War (1532-1537), where the Incans, supported by the Dongese, defeated the Spanish. Spanish attempts to subjugate the city-states directly led to the former’s defeat at the Battle of Yongle, forcing Spain to accept the borders between the city states and New Spain."
 dod_lore.144.t:0 "History of Qingqiu (6/9)"
 dod_lore.144.d:0 "Although Qingqiu was safe from any invasion by the sheer expanse of the continent, the powers of Europe viewed the city-states as weak and quizzically outdated. The relationship quickly shifted from trading partners to one of a more exploitative nature. Wealthy businessmen from the colonies were able to buy considerable influence in the courts of individual cities. The period from 1709 to 1762 (often called the Bloody Age) saw Qingqiu mired in conflict as cities were convinced to go to war with each other to benefit easterners thousands of miles away. A company in New Burgundy might convince one city to blockade another favored by Scandinavian merchants, leading the two to go to war while the company profited from the fallout. A Plantegenian aristocrat might arrange for one city state to raid another and pay for “laborers” taken from the captives."
 dod_lore.145.t:0 "History of Qingqiu (7/9)"
 dod_lore.145.d:0 "By the latter half of the 18th century, the people of Qingqiu were exhausted. The endless, pointless wars had taken their toll and many simply refused the call to arms. Sanbao, and especially Yongle, had been strong enough to resist most outside influence. In 1760 a coalition of European corporations attempted to rally the northern city states to force their interests on the two southern strong-holds. Sanbao and Yongle formed an alliance, defeating several of their neighbors in battle and encouraging rebellions in the farther cities. In the end, the corrupted leaders were deposed, and the city-states signed the treaty of the Brother’s Peace"
 dod_lore.146.t:0 "History of Qingqiu (8/9)"
 dod_lore.146.d:0 "It is often said that this marks the beginning of a unified Qingqiu. However, conservative elements in the victorious cities wanted to preserve the city-state system. Thus, the settlements remained independent, though in the wake of the Bloody Age the populace began to see a common identity linking them to their neighbors.During the Great German War (1795-1820) and the various Wars of Independence fought across the Western Hemisphere, the Qingquiren people were shocked at the developments of which the nations were becoming independent, even more disconcerting when their direct neighbor to the south, Mexico declared its independence from Spain. Lan Weisheng, a Qingquiren educated in the Western way saw these movements as a reason for the Dongese city states to unite into one united state."
 dod_lore.147.t:0 "History of Qingqiu (9/9)"
 dod_lore.147.d:0 "While the move was supported by Sanbao (at the time ruled by Weisheng’s father, Lan Biao), Yongle and other city states in the south, it was hotly opposed by the Council of Twenty and the Northern city states, thus leading to what would lead to a brief, bloodless conflict (1811-1812) which ultimately saw the Northern City-States frightened into union due to the increasing encroachment of Vinlandic settlers westward, and the Council of Twenty dissolved in favor of a Federalized government loyal to Sanbao.As the Dongese Cities, now centralized into the Qingqiu Federation, marches forward into the 19th century, one must come to wonder what the future would hold for them. But for those brave sons of Zheng He’s legacy, they hope that they will march for and lead in this brave new world...?"
 dod_lore.153.t:0 "History of Bohemia (1/7)"
 dod_lore.153.d:0 "The end of the Hussite Wars (1419-1434) left Bohemia in ruins. Albert von Habsburg died a year after his coronation in 1438 and the kingdom was inherited by his son Ladislas Postumus. One of the Hussite Bohemian nobles George von Podiebrad gathered an army and took the capital by power and declared himself the Lord Regent. Catholic nobles rose against him and a civil war broke out but George swiftly won. Ladislas was elected in 1453 but died four years after. George was elected as the king. After a long series of negotiating he reached an agreement with the Pope and Bohemia returned back to the Catholic Church. After 14 years, in 1471, George died but before his death he had elected Ladislas II of the Jagiellonian dynasty as a new king."
 dod_lore.154.t:0 "History of Bohemia (2/7)"
 dod_lore.154.d:0 "In 1480 the Duke of Burgundy, Charles the Bold started his campaign against the Empire. Frederick III von Habsburg was defeated and the Empire turned to Ladislas. He entered the war with the forces of the Kingdom united with those of the Empire. After a Pyrrhic victory in Bohemia's favor at Nieder-Olm in 1483, the peace is signed. Even though the Empire lost the war, Ladislas was seen as a savior of the Germans, and in the Imperial Election of 1486 he decisively defeated Maximilian of Austria. At that moment the Jagiellonian Dynasty ruled in Germany, Poland, Lithuania, Bohemia and Hungary."
 dod_lore.155.t:0 "History of Bohemia (3/7)"
 dod_lore.155.d:0 "In 1516 he was succeeded in all his domains by his son Louis. Eight years passed and Suleiman the Magnificent, Emperor of the House of Osman invaded the Middle Europe in a grand campaign. Louis sent a portion of his army to face the Ottoman threat but he underestimated the enemy and in 1526 the combined Bohemian and Hungarian forces were defeated in the Battle of Mohacs and Hungary fell under direct Ottoman control. The aggression turned to a huge threat to the Christendom and Louis rallied a Holy League of Germany, Bohemia, Austria and Poland-Lithuania. They managed to lift the Siege of Brno and reconquer small piece of Royal Hungary. With both sides exhausted the peace is signed in 1530 and the Ottoman hegemony over Hungary would last almost 300 years. Sigismund, second son of Louis, is given the title of the Margrave of Nitra."
 dod_lore.156.t:0 "History of Bohemia (4/7)"
 dod_lore.156.d:0 "Meanwhile in Zurich Zwingli proposed his 95 theses and Louis tried to arrest him at the Diet of Worms but Zwingli managed to escape with the help of the Burgundians. The Protestant started to spread through the Empire as a disease. Louis in response declared himself the Most Catholic King and started to root out the heresy in massive acts of Re-Catholicism and counter-reformation. In 1547 Louis was succeeded as the King of Bohemian Lands and the Emperor of the Holy Roman Empire by his son Ottokar III who, thanks to his marriage to Elizabeth of Brandenburg - the only heiress of Joachim von Hohenzollern, inherited the Margraviate in 1550. As a true Catholic he began to fought the Protestantism there by supporting Jesuits and the Inquisition. The religious conflicts inside the Empire reached its climax in 1605 when an angry crowd executed the Bohemian-appointed governor of Berlin and declared Brandenburg free. Ottokar IV quickly responded by sending his army to reconquer the Margraviate and restore order."
 dod_lore.157.t:0 "History of Bohemia (5/7)"
 dod_lore.157.d:0 "But the events had already begun to move. An alliance of North German Protestant lords declared themselves the Protestant League. They sought support in both Scandinavia and Burgundy - two major Protestant powers. Scandinavia responded with attack on Pomerania. As a reaction the Catholic league of Bohemia, Austria, Bavaria and Poland was formed. In 1615 in the battle of Neubrandenburg are the Bohemian armies almost annihilated and Scandinavians started their advance to the south. The war seemed lost. But thanks to successful negotiations with then King of the Dual Monarchy, Francis I, England-France entered the war in 1616. The Burgundians sued for peace. Nordic forces were decisively defeated in 1619 in the Battle of Melnik. But the northern naval blockade of the Empire was crippling the trade and so in 1621 the peace was signed in Hamburg"
 dod_lore.158.t:0 "History of Bohemia (6/7)"
 dod_lore.158.d:0 "Scandinavia annexed Pomerania and abolished the Hansa and Bohemia regained control of Brandenburg and added the Duchy of Saxony to its possessions. The freedom of religion was declared in the Empire. Thanks to the laws accepted in Frankfurt in 1484 the Lands of the Bohemian Crown were excluded from this treaty. Relative stability was reached and the Jagiellonians ruled peacefully for another 150 years. Their dominance in the Empire is threatened only by Burgundy."
 dod_lore.159.t:0 "History of Bohemia (7/7)"
 dod_lore.159.d:0 "'In 1790 the German revolution began but the revolutionaries are defeated by the Imperial Army 5 years after. Wenceslas VIII felt that his position was strong enough to centralize the Empire and achieve the Middle European hegemony. The Scandinavians and Burgundians responded with the declaration of war and starting the Great German War. Military success on the part of Wenceslas VIII, dubbed the 'Lion of the North,' saw many military victories over the Burgundians and Scandinavians. However, after three decades, Wenceslas VIII was forced to realize that he was unable to achieve Central European hegemony and sued for peace, signed in Frankfurt. The Reichstag was reduced and the Imperial Electorates were dissolved but Bohemian Kings would continue to call themselves the Emperors of the German Nation, and retain hegemony over the remaining Eastern German states. Wenceslas would be murdered the following year and would be succeeded by his son, Sigismund V.'"
 dod_lore.165.t:0 "History of Belgium (1/7)"
 dod_lore.165.d:0 "Burgundian exploration in the New World began as an enterprise to circumvent both the Anglo-French, whose alliance was terminated with their conquest of Brittany in 1492, as well as the Spanish, who had already begun establishing outposts in Cuba. Through contacts and royal support of Dutch and Flemish mercantile and banking clans, beginning with Jean III, and continuing with Philippe IV, there were several exploration projects, discovering the territories around the Northeast Arcadia and Northeast Ameriga. Arcadia in particular would not see settlement by Burgundian and Flemish colonists until the founding of Philippa in 1529. This would be followed with the founding of Nouvelle Bruges and Port Valois in 1535 and 1547, respectively."
 dod_lore.166.t:0 "History of Belgium (2/7)"
 dod_lore.166.d:0 "The first trial of the colonization of New Burgundy came with the Italian Religious Wars (1567-1584), a series of direct and indirect conflicts between the Dual Monarchy (who had already established its colonial holdings and centralized them as the Viceroyalty of New France.) Although most of the fighting was restricted to Northwest Italy and Provence, there were a number of engagements at sea, where both Burgundian and Neo Burgundian ships fought to keep the Anglo-French from capturing the nascent Burgundian colonies, which would only be confirmed in the Treaty of Saint-Denis in 1584."
 dod_lore.167.t:0 "History of Belgium (3/7)"
 dod_lore.167.d:0 "The Treaty of Hamburg that ended the Imperial Wars of Religion (1605-1621), saw Scandinavia ultimately dismantle the Hanseatic League, which was already in decline due to the Scandinavian policy of “Dominium Maris Baltici.” The result of this saw a number of German merchant clans immigrating to Burgundy, and some even to the colonies of New Burgundy and Vinland. These Germano-Septimans would utilize this opportunity, transforming the Burgundian West India Compny into the Neuwelt Hansa (Hanse du Nouveau-Monde in French) in 1669. This move would become the precursor to the federalized nature that would become the Seven Republics."
 dod_lore.168.t:0 "History of Belgium (4/7)"
 dod_lore.168.d:0 "During the Great German War (1795-1820), the Burgundians saw fit to raise taxes and tariffs in their colonies (a matter that was also done by ally Scandinavia and Spain.) Discontent over taxation without being formally represented in the Burgundian Estates-General led initially to a revolt for greater rights, which ultimately became a conflict over the right to become its own nation. The Neo-Burgundian War of Independence (1802-1805) was decisive, primarily because of Burgundy being trapped in conflict with Bohemia, as colonials quickly swept away Loyalist garrisons. The Treaty of Ghent confirmed this fait accompli, and thus New Burgundy gained independence as the Seven Republics of New Burgundy."
 dod_lore.169.t:0 "History of Belgium (5/7)"
 dod_lore.169.d:0 "The new nation differed from most other nations. Taking the model of the New Hanseatic League, the state of New Burgundy was divided into seven confederal Republics as per the name, each ruled by a Grand Pensionary, who would serve as its governor, and serves a subsidiary role to the Stadtholder (Stathouder in French), who would be responsible for the policies affecting all states as well as New Burgundy’s foreign policies. Debates ensued to decide of the name of the new state. The hero of the Independence War and first Stadhoudter coined the term of Belgian Confederacy, taking the name after the antic area from where a lot of the colonists came."
 dod_lore.170.t:0 "History of Belgium (6/7)"
 dod_lore.170.d:0 "Originally ruled under the National Liberals (Parti National Libéral), power shifted to the more jingoistic Moderate Party (Parti Modéré). It was Stadtholder Damien Collet who gave rise to the popular idea of Arcadianism, the idea that all of Arcadia should be united under one government “Par la Raison ou la Force!” (By Reason or By Force!). These jingoistic attitudes led to Vinalnd (who gained independence in 1808) and Plantagenia (who gained independence in 1771) to declare war on the Confederacy.The War of the Double Alliance (1819-1821) was a long and drawn out conflict, that would see war heroes like Jacques Lahure (nicknamed “the Hannibal of the West”) and Willem Le Cocq fight glorious battles against their Vinlandic and Plantagenian rivals."
 dod_lore.171.t:0 "History of Belgium (7/7)"
 dod_lore.171.d:0 "Septiman military dominance, confirmed by the industrialization of New Burgundy over its rivals to the North and south, ensured that the Treaty of Erikshavn was in their favor, securing Basse-Leonie and various border provinces along the Plantagenian and Vinlandic borders would be in their hands.  However it also brought about a completely new vice, the concept of Slavery, which, despite being restricted to its southernmost Republics, began the debate over the legality of slavery, especially through its claims into slaveholding Plantagenia. The Seven Republics emerged as the most industrialized power in Arcadia, and with it the ideals of Arcadianism could very well be within their grasp...?"
 dod_lore.177.t:0 "History of Scandinavia (1/10)"
 dod_lore.177.d:0 "The Legacy of the Nordic Crowns stem from the personal union of Margaret, Queen and Regent of Denmark and through her son Olaf (who passed in 1387) and victory over the Swedish Magnates, ruler of Norway and Sweden. Thus she became known as the Mother of Scandinavia, beloved by her people. Such successes however would not be shared by her immediate successors. Eric of Pomerania continuously incited conflicts against Schleswig, Holstein, Mecklenburg, and even against various Pomeranian Principalities in his attempt to unite all these lands. This sentiment was not shared by the Swedes, who often traded with these various duchies. In addition, Danish centralization was something not supported by the Swedish Riksdag, including the imposition of the Sound Dues to increase income at the expense of the Hanseatic League, which led to the Danish-Hanseatic War (1426-1435). However he was also credited with the foundation of Copenhagen as the capital for Denmark, and ultimately of the Kalmar Union itself."
 dod_lore.178.t:0 "History of Scandinavia (2/10)"
 dod_lore.178.d:0 "It was not to last however, revolts across Scandinavia broke out, in Sweden by the farmers, and later the nobility against his practices, forcing him to yield to Holstein and the Hansa, in Norway a peasant revolt broke out and successfully took Oslo, finally, in Denmark, the Danish magnates refusal to crown Bogislaw IX, the Duke of Pomerania as Eric’s heir caused the King to retreat to Visborg in Gotland, which would later lead to his abdication by all three kingdoms. He would be succeeded by his nephew, Christopher of Bavaria, who put down many of the rebellions in Denmark. Unfortunately he proved to be an ineffective ruler, unable to challenge Eric of Pomerania’s piracy, as well as gain acceptance in Sweden, so much so, and also out of a desire to regain independence, chose its own King, Charles VIII rather than go with Christian I upon Christopher III’s death in 1448."
 dod_lore.179.t:0 "History of Scandinavia (3/10)"
 dod_lore.179.d:0 "Christian I and Charles VIII initiated a rivalry over the Norwegian throne, ultimately leading to a war which later historians would call the Scandinavian Civil War (1451-1465). Charles VIII successfully resisted all forces sent to depose him, led by the Oxenstierna and Vasa families, and ruled with power shared by the Riksdag until his death in 1470. But Christians troubles did not subside upon becoming King of Sweden, having to deal with various parts of his realm trying to govern themselves locally. Christian was credited with the founding of the University of Copenhagen in 1478. Another credit was the peace made between the Kalmar Union and Scotland, with the betrothal and later marriage of Margaret of Denmark, the daughter of Christopher of Bavaria to James III of Scotland."
 dod_lore.180.t:0 "History of Scandinavia (4/10)"
 dod_lore.180.d:0 "His successor, John I, was the first monarch to balance the interests of the powers involved, attempting to weaken the power of Swedish magnate Sten Sturre and of the Hansa through the support of Novgorod, something which was arranged to best protect them against the forces of the Muscovites under Ivan III. (The Novgorod-Muscovite War of 1496, 1496-1499). The first permanent Danish, later Scandinavian Navy would be founded under his rule, while a brief war with the Swedes (1497) led to Sturre being forced to surrender to John I, and the subsequent creation of the title, Kings of the North. Unfortunately, in an attempt to conquer Dithmarshen in the Battle of Hemmingstedt (17 February 1500), the Dithmarsians trapped John, his son and crown prince Christian, and the mercenaries in a flooded dyke, drowning all involved, opening Scandinavia to the reality of being torn asunder."
 dod_lore.181.t:0 "History of Scandinavia (5/10)"
 dod_lore.181.d:0 "It would be later that year that Danish magnates, as well as various Norwegian magnates came to bring a relative of John I, his nephew, King James IV of Scotland to become King of the North, a title he would assume as Jacob I. Jacob was the typical renaissance prince, sponsoring Scandinavia’s first printing press, establishing gun foundries in Copenhagen as well as his old home in Edinburgh, and brought renaissance art and science to the Scandinavian nation. He was also responsible for finally subjugating the Swedish rebels under Gustav Vasa (who attempted to crown himself Gustav I). In true renaissance fashion, James IV being the polygot that he was, carried out a reform of the Danish language, utilizing rules and stipulations from the nascent Norwegian and Swedish languages in order to streamline administration throughout Scandinavia."
 dod_lore.182.t:0 "History of Scandinavia (6/10)"
 dod_lore.182.d:0 "Military reforms were also carried out as well, establishing a united Kalmar Army, which would be put to use in supporting Novgorod in conflicts with Muscovy, as well as bringing Pskov into the fold when anti-Kalmari Novgoroders gained power in the Merchant republic, bringing about the Livonian War (1558-1585) as Scandinavia fought Novgorod & Poland-Lithuania for control over the remnant Livonian Order (later secularized into the Duchy of Courland-Semigalia.His son, James II, and his successor, James III, would be responsible for the establishment of Protestantism in Scandinavia, James II, upon his coronation charter on 7 August 1523, he was made the protector of the Catholic Church of Denmark, Norway and Sweden, and in that role he took an opprotunistic approach in weakening the power of Catholic nobles and clergy. But James III was more overt in his views of Protestantism, having been one of the royals to attend the Diet of Worms and was influenced by the doctrines of Huldrych Zwingli."
 dod_lore.183.t:0 "History of Scandinavia (7/10)"
 dod_lore.183.d:0 "On 30 October 1536, he formally established the Scandinavian Zwinglian Church as the national church of Scandinavia, following the example of the Burgundian monarchs. A brief war with the Holy Roman Empire (1542-1544) prevented the restoration of Catholicism in Scandinavia in support of James III’s brother, Matthew.John III would later be credited with the sponsoring of the first explorations of Scandinavia into the New World, shortly after Burgundy did the same some years earlier. Through his expeditions he would see about the creation of Colonial Vinland, though it would be his son and successor, Eric VIII who would continue and expand such funding, establishing more cities along the Vinlandic coast and even made expeditions into the Caribbean, successfully snatching away the Anglo-French colony of Galatia in what would eventually become Sudurhafeyjar."
 dod_lore.184.t:0 "History of Scandinavia (8/10)"
 dod_lore.184.d:0 "His successors would also be responsible for its colonial policies in East Asia, gaining access, along with Burgundy, over the Malaccan spice trade, carving out a niche of outposts and colonies in India, the Tondolese Kingdom (later renamed Christiania after Christian II, who was monarch at the time of the colonial acquisition of the Christianian Islands). In addition, outposts and colonies were established in Africa as well, holding control over Mocambike between Zanzibar and Burgundian South Africa, overall, Scandinavia became the second largest colonial power in the Eastern Hemisphere, behind that of the Burgundians."
 dod_lore.185.t:0 "History of Scandinavia (9/10)"
 dod_lore.185.d:0 "Eric VIII would also be responsible for the restarting of the Scandinavian-Bohemian rivalry over the religious affairs of Germany, as well as the Scandinavian desire for Dominium Maris Baltici (Baltic Sea Dominion), the desire for all of the Baltic Sea to eventually become a Scandinavian lake. Despite Eric’s failure for a dominant role in Northern Germany he was able to acquire Pomerania, and directly threaten Jagiellon Poland-Lithuania, the final key to true dominance in the Baltic. However such plans would be laid to waste over the following decades, as Pomerania and Prussia became a battleground, all the while keeping Russia divided in order to ensure its ascendency."
 dod_lore.186.t:0 "History of Scandinavia (10/10)"
 dod_lore.186.d:0 "This became crucial in the Great German War where Holy Roman Emperor Wenceslaus V, directly threatened the interests of Scandinavia and its ally Burgundy by threatening to unite and centralize the Holy Roman Empire. Despite the martial nature of Scandinavia, the Lion of Europe scored key victories, even retaking Pomerania from the Scandinavians, and even directly threatening to bring Denmark into the fold. But the various Protestant Princes, not wanting to be destroyed by the major Catholic power brought their resources to bear, and under the leadership of Burgundy and Scandinavia, was able to force Wenceslaus to the negotiating table."
 dod_lore.192.t:0 "History of Beornia (1/10)"
 dod_lore.192.d:0 "Following the French Wars of Succession, the Kingdom of England emerged as the greatest power in Europe during the early modern era. But that did not mean that the English citizens became members of the ruling class. With the majority of the post-Norman English nobility being Francophone, it was not long before further alienation of the upper class from the ordinary Englishmen and the moving of the court of the Dual Thrones to the mainland with England becoming once again just a province of a Romance realm.While portions of the English population, especially in the more populated cities in the South, embraced the French supremacy willingly, abandoning their Germanic roots in the process, the inhabitants of northern England did not give up so easily. As it usually happens in large heterogeneous realms, those on the outskirts felt neglected and discriminated."
 dod_lore.193.t:0 "History of Beornia (2/10)"
 dod_lore.193.d:0 "As such, the North developed quite a grudge against the Plantagenet monarchy, fuelled by Scandinavians who became united with the Scottish Crown in the early 16th century. Hoping to sow a seed of discontent in the Anglo-French dominion, Scandinavians spread the idea of a Church free from Rome and, by extension, from Paris. The notion of Protestantism was seen by local political elites as a powerful means to gain a degree of autonomy and was wholeheartedly accepted by the common folk who felt detached from the incomprehensible world of Latin liturgy. And thus, the Reformed Anglican Church was born.The Dual Monarchy was initially tolerant to the various branches of Protestantism spreading throughout her realm. Fearing a possible rebellion in England which would most definitely prove costly and difficult for the Court in Paris while having his eyes firmly set on the affairs on the mainland, Édouard V issued the Edict of Cantorbéry in 1553, legalising the Reformed Church."
 dod_lore.194.t:0 "History of Beornia (3/10)"
 dod_lore.194.d:0 "This document also granted the English nobility a large degree of freedom in their local matters - together with the Irish autonomy, the beginning of the second half of the 16th century saw a major decline of Plantagenet control over the Isles, even though the English Parliament was officially abolished by Édouard's father in 1537. This changed quickly, though. The Irish independence was systematically destroyed during the three Irish Wars and at the dawn of the 17th century the line of appeasement kings ended with François I who aggressively challenged the breakup of the religious unity and stood firm against Burgundy, the champion of the Protestant faith. The Catholic forces eventually emerged victorious in the Anglo-French Wars of Religion, both externally and internally."
 dod_lore.195.t:0 "History of Beornia (4/10)"
 dod_lore.195.d:0 "Securing the outer border, François decided to finish the 'Insular Problem' once and for all and while he deployed forces in the Nine Years' War against the Irish, he also abolished the Edict of Canterbéry and began a massive re-catholisation of the English lands. While the nobles, often fearing the loss of their holdings mostly surrendered to the Catholic king, the lower classes did not share the same sentiment. With the lands of Ameriga being gradually discovered by Anglo-French and Burgundian navigators, the desperate Anglicans saw them as the new Promised Land where they shall be granted freedom and independence. And so, similarly to the French Huguenots, large groups of Englishmen refusing to accept the Catholic faith fled to the harbours in the Lowlands from which they set sail towards the New World."
 dod_lore.196.t:0 "History of Beornia (5/10)"
 dod_lore.196.d:0 "Seeking escape from the French domination, the Father Pilgrims (as they will be later named) arrived after facing the difficulties of the Trans-Atlantic voyage at the coast of Neo Anglia, a land even deeper in the south than the Burgundian colony of Nouvelle Amsterdam. Neo Anglia was unofficially claimed by England-France which even established several settlements there, especially near the Riviere de l’Argent. But the Dual Monarchy's zones of interest were wide and so the Court of Paris had to abandon some of its endeavours every now and then. Seeing that Neo Anglia was subject of the influx of Anglican settlers supported by the Burgundians, the Plantagenet administration quickly decided to abandon this potential powder keg which would most probably simply drain the valuable resources of the realm and relocated its focus elsewhere. And so the Kingdom of England-in-exile slowly started to emerge, first independent settler state in the New World."
 dod_lore.197.t:0 "History of Beornia (6/10)"
 dod_lore.197.d:0 "The Anglicans, obviously carrying much hatred against Romance languages in general, swiftly started changing remaining Anglo-French names to more suitable ones. Being a mixture of English patriots and fierce Anglicans, the land was designated accordingly - hence you can now visit Seaxburgh and New Jerusalem, Eoferwic and Æthelwulf, all in one country. So in the 1630s, the English settlements started quickly developing with more and more people arriving from Albion, hearing news about the Eden on Earth. A desire for unity began to grow and in 1657 the representatives of important communes arrived at the place where it all began, at the isthmus of the Silver River, eager to build a united country. Fierciely believing in the concept of royal majesty and overall bound by the 17th century mentality, they decided to establish a Kingdom, maintaining the English Crown in exile in South Ameriga."
 dod_lore.198.t:0 "History of Beornia (7/10)"
 dod_lore.198.d:0 "With almost no important nobles being among them, John Cavendish, being a renegade son of the Duke of Newcastle and one of the ship captains who led the first Father Pilgrims in the 1620s was chosen to be the new realm's leader. Cavendish, being industrious and having already scouted the land before during his services as a Burgundian privateer saw the opportunity of carving a power base for himself in the New World and settled soon in the lands of Avalon (the formerly occupied Neo Anglia) and further sponsored the efforts of Anglicans to bring more fellow countrymen to Ameriga. As such, he became a well-known and respected member of the society during the first half of the 17th century. And so John Cavendish, being well in his sixties, became the first King of the new Kingdom in 1658, stylising himself as Edward I. The nation's capital was founded at the Silver River which proved to be an important source of wealth for the Anglicans."
 dod_lore.199.t:0 "History of Beornia (8/10)"
 dod_lore.199.d:0 "In tradition of mixing Anglo-Saxon, Anglican and Briton heritage, the city was named Camelot and the Kingdom changed from England-in-exile to Beornicia honouring old Anglo-Saxon settlers with the name soon corrupted to Beornia by popular use. John Cavendish, now Edward I, thus founded the House of Beornia, essentially claiming the Crown of England. But truth be told, no one really cared. Beornia was distant and sparselypopulated and after the initial Anglican influx, the flow of immigrants almost stopped. Devout to Puritanism, with a weird language and even weirder customs, New England quickly isolated itself from the outside world, only dealing with the Burgundian governors from time to time. But even despite that the Kingdom grew. Expanding as far as the Lake Ginosar and even beyond, the Beornian colonists soon came to contact with the Incas in the late 17th century. The massives of Andes proved to be a solid border and no real conflict with the Empire emerged."
 dod_lore.200.t:0 "History of Beornia (9/10)"
 dod_lore.200.d:0 "The 18th century was quite peaceful throughout the Beornian lands, aside of some petty feudal squabbles and battles with natives. The only event worth mentioning was the short-lived war of succession when Henry, the Duke of Godwinson, rose against his infant cousin Harold and the appointed regent Sir Peter Bryne in 1757, seizing Camelot in 1758 only to be ousted by loyalists during the same year, defeated in 1760 and executed the same year. His estates were then appropriated by Sir Bryne who became the new Duke of Godwinson. Eventually, the 19th century and the modern era creeped in, even in Ameriga. The citizens of European colonies started to doubt the oversea governance and one after another started anti-European actions. In 1805, the Burgundian colony of Lotharingia began her own quest for independence and Beornians were quite keen on helping."
 dod_lore.201.t:0 "History of Beornia (10/10)"
 dod_lore.201.d:0 "Arthur III of Beornia, being one of the more enlightened Kings who had his children educated in Europe, believed in the ideals of freedom and hoped that the Lotharians would become another free New World country. He even attended the ceremony in Charlemagne officially celebrating the birth of the Lotharian Republic. Talks over the end of the firm feudal regime and birth of a Beornian constitution ended abruptly, though, in 1817 when Edward IV became King, returning from Europe enchanted by the notion of Bohemian absolutism. Camelot's alliance with Lotharingia held, despite that, more specifically the alliance with the authoritarian elements, especially the would-be dictator De Aigle. With Beornian help, De Aigle was in spite of several major setbacks able to restore order in the newborn republic which was in the middle of a downward spiral. He was a person to Edward's liking, even marrying his niece in 1827, the King dreaming to spread the true English nobility throughout the new post-colonial states."
 dod_lore.207.t:0 "History of Aragon (1/10)"
 dod_lore.207.d:0 "The Crown of Aragon’s genesis came from the personal union of Queen Petronilla, Queen of Aragon and one of the last of the Jimena Dynasty, to the Count of Barcelona, Raymond Berengar IV in 1162. Since then, the Aragonese crown grew under successive monarchs, all while maintaining the composite monarchical structure with the incorporation of Valencia, Majorca, Sardinia and finally Sicily, achieved with the death of King Martin of Sicily, son of King Martin I of Aragon in 1409. However such victory was short lived with the former’s death the following year, throwing the Aragonese monarchy into chaos for the next two years."
 dod_lore.208.t:0 "History of Aragon (2/10)"
 dod_lore.208.d:0 "Ferran’s son and successor, Alfons V oversaw the reunification, if only temporary, of the full Kingdom of Sicily, in 1442 in the Neapolitan War of Succession (1432-1442), and successfully vassalized the Principality of Albania as it was fighting a war with the Ottoman Empire. Alfons believed himself the inheritor of the destiny of Charles d’Anjou, to re-create the Latin Empire of Constantinople, a Maritime Empire stretching from Aragon to Greece. Alfons’ dream, as it became known by successive Aragonese Kings, would be passed down through each monarch since him. After Alfons’ death, the thrones were split, Aragon going to his younger brother John II, while Naples passed to Alfons’ illegitimate son Ferrante."
 dod_lore.209.t:0 "History of Aragon (3/10)"
 dod_lore.209.d:0 "John II, who also served as de facto King of Navarre, spent his reign trying to incorporate Navarre into the Aragonese domain, a conflict that would dominate Aragonese foreign policy during the reigns of his successors Ferdinand II and John III. The Navarrese who opposed him, led first by his eldest son Charles IV, Prince of Viana, and later his daughter Blanche II, led to a sharp rebuke, even among the Aragonese, who’s support for the Prince of Viana ultimately led to the Catalonian Civil War (1462-1472), which saw various claimants, first Charles IV, then later to Enrique IV of Castile, and later Pedro, Constable of Portugal and Rene, Duke of Anjou and Count of Provence. All times John rose to the occassion, and although he lost influence over Navarre, John was able to secure his monarchy for himself and his chosen heir Ferdinand II."
 dod_lore.210.t:0 "History of Aragon (4/10)"
 dod_lore.210.d:0 "Under Ferdinand II, Aragon continued in its battle for the Navarrese, first by supporting the Agramont-backed candidate John de Foix or the throne (even going as far as marrying John’s youngest sister Leonor de Foix), then later after John’s death, utilizing Leonor’s claim to try and bring Navarre into the crown. However this action provoked the newly established Dual Monarchy, provoking the First Navarrese War (1512-1516). This conflict, which saw the Navarrese Kingdom divided between two halves saw the Anglo-French annexation of the Counties of Foix & Bearn on the Northern half of the Pyrenees, while Navarre became a satellite state of the Aragonese Crown."
 dod_lore.211.t:0 "History of Aragon (5/10)"
 dod_lore.211.d:0 "Another achievement made by Ferdinand II was his actions towards the Barbary Pirates. During his reign, Ferdinand expanded the Naval Shipyards at Valencia and Barcelona and built fleets of ships to counter the Barbary Pirates, but he did more than this, after Barbary raids at Palma in the Balearic Islands and in Sardinia, Ferdinand decided to move against one of the Barbary bases, namely Oran and Algiers, held by the Zayyanid Kingdom of Tlemcen. The Aragonese-Algierian War (1500-1512) was the first major conflict Aragon launched against an African power, and the first major conflict since the end of the Reconquista in 1492 (the Spanish conquest of Melilla in 1497 notwithstanding) The twelve year long conflict saw the entirety of the Algerian Coast gained for Aragon, the single largest takeover of Muslim land since Ferdinand III’s conquest of much of Spain. The final expansion of Aragonese North Africa would not be made complete until the Conquest of Tunis, now Carthage, by John III in 1535."
 dod_lore.212.t:0 "History of Aragon (6/10)"
 dod_lore.212.d:0 "John III, known as the “Constable” was known for instituting major reforms to his new domains. Among his reforms, he Chartered Merchant Companies, aimed towards breaking the power of the many Italian Trading families, and reducing internal competition. Workhouses were built for orphans of fallen soldiers, allowing them greater access to careers towards the state and military. But one of the greatest reforms was the centralization of the varying disparate Cortes, bringing together the Parliamentary bodies of Aragon (Zaragoza), Catalonia (Barcelona), Valencia (Valencia), Sardinia (Cagliari) & Sicily (Palermo) into one united Cortes General. Naples would be added to this domain in 1550 with the death of Ferrante III of Naples, thus restoring the patrimony of Alfons V."
 dod_lore.213.t:0 "History of Aragon (7/10)"
 dod_lore.213.d:0 "John III was no slouch in the affairs of diplomacy and war either, as evidenced in the War of the League of Naples (1519-1526). The conflict, pitting the Valois Coalition of Provence, Genoa, Tuscany & Ferrara against the Aragonese-led League of Naples (Aragon, Naples, Papal States, Milan & Modena) saw back and force conflict up and down the peninsula. Ultimately culminating in a Neapolitan League Victory at Bologna in 1525, thus removing all Valois Influence from Italy. Much of Aragon’s succeeding monarchs spent their time dealing with the Threat of the Ottoman Empire, who backed the surviving Barbary Pirates from their bases in the Hafsid Kingdom (or at times against the Ottoman Navy itself from the Balkans) or dealing with tensions against the Trastamaras of Spain or the Plantagenets of Anglo-France. In addition, the Aragonese, especially after the gaining of Naples, cultivated their influence in Italy and Venice in preparation of their Imperial Ambitions."
 dod_lore.214.t:0 "History of Aragon (8/10)"
 dod_lore.214.d:0 "Thus it was all the more surprising when the Tuscans killed the Provencal Viceroy in Florence and declared the Etrurian Republic. The threat of a revolutionary republic in Italy was too great for Aragon, especially when it spread its influence across the peninsula by warfare (1807-1814), even directly taking control of much of Naples and threatening their other Italian possessions before finally being overturned. Disaster continued to plague Aragon, as a weakening economy, further support in its foreign policy goals (supporting the Venetian reconquest of the Peloponnese and Attica, and supporting and even supplying an illegitimate son of John IV to the Macedonian throne) and a King who was unable to sire an heir led to a crisis over succession. Enter Josep Serna."
 dod_lore.215.t:0 "History of Aragon (9/10)"
 dod_lore.215.d:0 "Serna was another illegitimate child of the womanizing King John IV, and like his half-brother, the King of Macedon, was legitimized according to the King’s will when John died in 1799. Josep had a storied career as a military officer who took part in many battles against the Djezairid Sultanate of Algeria and during the Italian Revolutionary War. When Alfons VI died in September 1835, the Aragonese Succession Crisis began. The original heir, Ferran VI was crowned later that month, but died within 44 days of his reign, with the throne left to his daughter, Maria. Maria was known for her luxury taste, frivolous spending and a notorious streak of having many lovers. Josep, with the support of the people across the realm went to Barcelona with his fellow soldiers. The Aragonese Parliament, not wanting to go against the will of the people, summoned Josep to the Parliament where he was crowned as King."
 dod_lore.216.t:0 "History of Aragon (10/10)"
 dod_lore.216.d:0 "Thus the House of Serna was born as a Royal Family, to continue the legacy of Alfons V. For the Aragonese desire to create a Mediterranean Lake, a dream shared by the Romans and the Latin Empire of which they claim descent. With the rapidly declining Ottomans and with Italy in their pocket, their dream of such an empire may very well come soon.?"
 dod_lore.222.t:0 "History of the Incan Empire (1/10)"
 dod_lore.222.d:0 "The Origins of the Empire of Tawantinsuyu (Quecha for the Four Regions), known among Europeans as the Inca Empire, started with the rise of the Kingdom of Cusco. Pachacuti, transformed his Kingdom to an Empire with the conquest of the Chanca, and the incorporation of various Andean Kingdoms into this new Empire. Unlike the other preeminent power of the New World, the Aztec Triple Alliance, the Inca would achieve its expansion through diplomacy and intrigue, scouting out prospective kingdoms in terms of political organization, military strength and wealth, and sending messengers convincing leaders the benefits of joining the Empire. Once these Kingdoms were peacefully integrated, the ruler’s children would be sent to Cusco to be taught in Quecha and in Incan administrative systems. Inter-marriages between the Cuscan elite and these children helped further integrate these Kingdoms into the Empire."
 dod_lore.223.t:0 "History of the Incan Empire (2/10)"
 dod_lore.223.d:0 "The only serious military campaigns prior to contact with the Chinese, were against their chief rival, the Kingdom of Chimor (also known as Chimu) and against the Mapuche (1470-1493). The former would be subjugated in 1470, while the latter would prove resilient to Inca invasion.During the late 15th century, the Inca would be greeted by traders hailing from Dong Guo City-State of Yongle. This first contact proved very beneficial for the Incans, as it introduced to them horses, gunpoweder weaponry and more importantly, advisors that helped to reform the Incan administrative system, derived from a combination of Incan and Chinese models. This centralized structure helped the Incans in the trials ahead."
 dod_lore.224.t:0 "History of the Incan Empire (3/10)"
 dod_lore.224.d:0 "The death of Huayna Capac I and his son and heir Ninan Cuyochi in 1527 would leave the Inca in turmoil as his two youngest sons, Huáscar and Atahualpa would come to blows against each other in the Inca Civil War (1529-1532) after the former arrested and killed the latter’s supporters. Huáscar would take the reigns, supported by the aristocracy and the religious authorities. However his control was restricted to the southern parts of the Empire, while Atahualpa was well supported by the Northern Aristocrats for his more liberal views of thinking. However he was also supported by the Yongle traders, and with his large reserve of gold and silver, he was able to buy the services of some 500 Dongese soldiers to serve him. Despite being few in number, their weaponry, professionalism and thick armor proved to be one of the deciding factors."
 dod_lore.225.t:0 "History of the Incan Empire (4/10)"
 dod_lore.225.d:0 "The other factor was disease, spread by the recent Spanish colonization and exploration of Mesoameriga, these diseases were ravaging the Incan Empire, this was recognized by Atahualpa, who through the Dongese merchants, procured of the knowledge of variolation, a preventative measure used in China for several centuries. These combined factors, and Atahualpa’s ability to reform and solve these problems, helped to change the tide, defeating and killing Huáscar, and winning the war. The Dongese soldiers that served him would go on to become the Chinu Guard, Chinu being the Quecha word for Chinese)."
 dod_lore.226.t:0 "History of the Incan Empire (5/10)"
 dod_lore.226.d:0 "Atahualpa set off for Cusco to be crowned as Sapa Inca, however along the way his party was ambushed by the Spanish expedition led by Francisco Pizarro. Many of the Incan troops were killed, and the survivors - several Yongle soldiers among them - were taken hostage. Atahualpa arranged to pay the Spaniards an exorbitant amount of gold and silver for his release. However, when the payment was made, the Spanish simply took it and kept their prisoners. They intended to depose of Atahualpa and Francisco would be proclaimed the new Sapa Inca. News of the deception spread, enraging Atahualpa’s generals as well as the Chinu Guard. Quizquiz, an Incan general, gathered the remains of the Incan army, and together with new soldiers hired from the Dongese City-States, marched to expel the Spanish and free their emperor."
 dod_lore.227.t:0 "History of the Incan Empire (6/10)"
 dod_lore.227.d:0 "The Spanish, whose original expedition was quite small (just 168 men, 27 horses, and a single cannon), had nonetheless gathered an army from various populations that wanted to see an end to Incan rule. They expected to crush the ‘savages’ easily. Although the Chinese technology was not at the same level as the European military, it was enough to rout the indigenous army loyal to the conquistador, and the elite Spanish troops were overwhelmed by numbers. Pizarro planned to threaten to kill Atahualpa to force Quizquiz to surrender"
 dod_lore.228.t:0 "History of the Incan Empire (7/10)"
 dod_lore.228.d:0 "Historians argue over why Atahualpa accepted the treaty. Some believe that due to mistranslation, or even deliberate deception on the part of the Spanish, that the emperor thought the Spanish were actually submitting to him and asking to join his empire. Others say that Atahualpa knew he could not defeat the true Spanish army, and that he made concessions to prevent the conquest of his empire. The latter would prove true when the Spanish launched a second invasion in 1572 (lasting to 1576), shortly after the accession of Paullu as Sapa Inca, which saw the Incan court moved from Cusco to Chuquisaca, which would serve as the Court of the Inca to the modern day. It would not be until the end of the century that the Inca would find another protector, the Dual Monarchy of England and France. Although the Plantagenets failed in converting the Quecha people to Catholicism, they were able to gain a tributary state, exchanging gold and silver from the mines of Potosi for the continued foreign protection from Spain."
 dod_lore.229.t:0 "History of the Incan Empire (8/10)"
 dod_lore.229.d:0 "The beginning of the Westernization of the Incan Empire began mid-way into the reign of Túpac Amaru II, utilizing traders and support from not only their traditional friends, the Dongese City States (later the Qingqiu Federation) but also from their protectors the Dual Monarchy of England and France. The progress would be slow, as attempts at reform met with sharp reaction by the conservative elite. The utilization of foreign-born officers, weapons and schooling had been some of the steps implemented by during the years of Túpac Amaru prior to his death. These reforms would be slowed down during the reign of his successors Huáscar III and Huayna Capac IV, yet continued in an attempt to keep their independence possible. The Incan Administration began to be reformed under the European (specifically Anglo-French model), while Financal reform saw the tradition Incan currency being replaced with paper currency, the Liwru (a Quechua term for Livre)."
 dod_lore.230.t:0 "History of the Incan Empire (9/10)"
 dod_lore.230.d:0 "During the Spanish-American Wars of Independence, Spain, desperate to put an end to the rebellious Columbian Alliance, asked for an alliance with the Inca in 1828, offering them the Captaincy-Generals of Arequipa & Quito in exchange for military support. Seeing this as an opportunity to test the combat capability of the new westernized Incan Army, Huayna Capac IV accepted. The Incan Intervention (1828-1832) saw the Incans achieve military success during the early parts of the conflict, reconquering their former capital, Cusco and bringing the Catholicized Quecha to the fold throughout the Central Andes, proceeding to advance towards the titular capital of the Captaincy-General of Quito. This would culminate in the Battle of Lima in July 1830. The Battle was was one that could have gone either way, as it saw the Colombian leader Jacinto de Gravina killed in the battle. However, it was the Columbians who won the field."
 dod_lore.231.t:0 "History of the Incan Empire (10/10)"
 dod_lore.231.d:0 "and after two years of little successes and great drawbacks, Huayna Capac IV sued for peace, paying reparations, and relinquishing their hold on Arequipa & Quito. The defeat inflicted upon the Inca convinced the Sapa Inca and many in the leadership that further reforms would be needed, but with Huayna Capac growing old and soon to be dying, the task would soon fall to his son, the Prince-Apparent, Usco. Usco, who wishes to become as great as the great founder of Tawantinsuyu, Pachacuti, wishes to take on the mantle of dragging the Empire into the 19th century, but can he succeed, with hostile Europeans surrounding this great nation?"
 dod_lore.237.t:0 "History of Provence (1/8)"
 dod_lore.237.d:0 "The French Wars of Succession was nothing short of a disaster for the Valois dynasty. The combination of unlucky factors, such as the death of Jeanne d’Arc in 1431, the Burgundians remaining with the Plantagenets with the Treaty of Arras in 1435 and the disastrous defeat at Vichy in 1471 helped contribute to the total annihilation of the Armagnac party. Reduced to its holdings in Languedoc, Auvergne (ruled by the powerful House of La Tour d’Auvergne since 1437) and Provence (inherited from Charles III upon the latter's death in 1481), Charles VIII was forced to sign the Treaty of Rome in 1498, confirming his current domains and the title of “King in France” and Duke of Provence (as Charles IV) in exchange for recognizing the Plantagenets as Kings of France."
 dod_lore.238.t:0 "History of Provence (2/8)"
 dod_lore.238.d:0 "The next significant development in the history the Valois was their Italian policy, which began in 1494 with the marriage of Charles IV to Contessina Beatrice de Medici, a daughter of the last Gonfaloniere and first Duke of Florence, Lorenzo I de Medici. Over the course of the reign of Charles IV and his successor François I, they would conduct an effective marriage policy featuring members of the extended Valois family to notable Italian families. Their connections helping to spread the Renaissance culture and style to Provence, as well as helping to contribute Italian words,mixed with the French and local Occitan to what would become the Provençal Language."
 dod_lore.239.t:0 "History of Provence (3/8)"
 dod_lore.239.d:0 "Unfortunately, this marriage policy would only garner an enemy in the form of the pro-Papal Guleph faction, the pro-Imperial Ghibelline faction, and the Aragonese, who had their own designs of controlling Italy. This would ultimately culminate in the War of the League of Naples (1519-1526) fought between the Valois Coalition (Provence, Genoa, Tuscany & Ferrara) and the titular League of Naples (Aragon, the Papal States, Milan, Modena and Naples). The war culminated in the League’s decisive victory in the Battle of Bologna in 1525, which saw the capture of François I, and the signing of the Treaty of Barcelona, which saw Provence’s Italian holdings (predominantly that of Reggio and Ferrara, with which was held in Personal Union) lost to the various members of the League and the expulsion of Provençal notables from the Peninsula in exchange for his release."
 dod_lore.240.t:0 "History of Provence (4/8)"
 dod_lore.240.d:0 "Provence’s luck further deteriorated when François, supporting in hiding Huldrych Zwingli in Aix-en-Provence led to the First Provençal War (1522-1525) which saw the Anglo-French annexation of Auvergne (after the mysterious death of the last Duchess of Auvergne, Anne de La Tour d’Auvergne). Open support for Protestantism, as well as François’ continued interference in Italy had led to his excommunication by Pope Adrian VI and a call for Crusade against them. It would be the Avignon Massacre, the slaughter of all clergymen during François’ conquest of that Papal holding that brought both Bohemia and the Dual Monarchy to invade in the Languedoc War of 1532, the second wanting to ensure his title of King of France went undisputed. Burgundian & Aragonese support against the two helped to bring together the Treaty of Nice. François was removed from the Provençal throne, and would be replaced by his nephew, Philip II/VIII. At the same time, the Dual Monarchy would annex the Languedoc region."
 dod_lore.241.t:0 "History of Provence (5/8)"
 dod_lore.241.d:0 "Protestantism would rear it’s head again during the War of the Provençal Succession (1568-1576) which pitted the Catholic and pro-Anglo-French Duke Charles V/IX against his cousin, the pro-Burgundian and Protestant Louis, Count of Venaissin (styled Louis V/XI). It was around during the war that Aix-en-Provence, the traditional seat of the Dukes of Provence were captured by Protestant forces in 1572, on the Feast Day of Saint Bartholomew. As a result, Charles was forced to move his court to Toulon which would become the Provençal capital to this day. Ultimately, the Count of Venaissin was captured and exiled to Burgundy, and Charles would be confirmed as Duke of Provence. Though it would not be until the Treaty of Saint Denis in 1584 that officially ended formal support for Provençal Protestants."
 dod_lore.242.t:0 "History of Provence (6/8)"
 dod_lore.242.d:0 "Philip III/IX, his successor would prove the ultimate irony however in proclaiming the Edict of Avignon in 1616, which solved the issue of religion by making Catholicism and Protestantism legal throughout the Duchy, the first such nation in Europe that provided freedom of religion for Christians."
 dod_lore.243.t:0 "History of Provence (7/8)"
 dod_lore.243.d:0 "The events of the second half of the 16th century and the beginning of the 17th century would see Provence falling into the influence of Aragon. On the other hand, the newly found religious tolerance combined with the Aragonese desire to eliminate all remaining Imperial and Anglo-French influence on the Apennine Peninsula allowed Provençal rulers to normalise their relations with the Italian rulers and consequently to resurrect their Italian ambitions, though now mostly under the baton of Barcelona. The Valois diplomatic efforts would finally come to fruition in 1708, when Louis V/XI of France would marry his only child, Anne, to Giovanni Battista Gastone de Medici, the heir to the Grand Duchy of Tuscany. When Louis died in 1710, Giovanni ascended to the Tuscan throne as Jean I/III of Valois-Medici. His inheriting of the Grand Duchy in 1723 would mark the true beginning of the Tuscan-Provençal personal union and an age of prosperity for the realm."
 dod_lore.244.t:0 "History of Provence (8/8)"
 dod_lore.244.d:0 "During the Great German War (1795-1820), Provence would be one of the major combatants in the conflict against the revolutionary Republic of Etruria, who through revolution terminated the personal union in favor of a republic. Although they were successful in helping to contain the Republic to Tuscany, they were unable to restore the personal union. With the dawn of the post-Wenceslausian era, the Valois of Provence are now divided on their intentions. Do they continue the fight against the Plantagenets to reclaim their birthright? Or do they go against their masters and seek to unite the Italian Peninsula as successors to the legacy of Charles d’Anjou and Lorenzo de’ Medici. For Provence, despite a long string of bad luck, perhaps they may still rise again.?"
 dod_lore.250.t:0 "History of Plantagenia (1/6)"
 dod_lore.250.d:0 "Anglo-French colonization of the New World began shortly after its discovery and the founding of Fort St. Francis in 1490 in what is now the Province of Leonie. The Treaty of Pamplona, signed three years later would confirm that lands North of the Cape Verde Islands would belong to them, a fact that was flagrantly violated by not only the Spanish, but also the Burgundians and Scandinavians. Despite this, fact, the colonization of the Southeastern Arcadian mainland proceeded smoothly, with the founding of other outposts, including Talahasi in modern Alibamon province (a French corruption of the original Seminole name, Talahassee) in 1538, and the founding of Nouvelle Orléans in modern Nouvelle France Province. (named after then Duke of Orléans, Francis de Plantagenêt) in 1545."
 dod_lore.251.t:0 "History of Plantagenia (2/6)"
 dod_lore.251.d:0 "Unlike the Spaniards, who incorporated the Aztec and other tribal ruling classes into the colonial elite, the Anglo-French elite were predominantly those who immigrated from the mainland. Many of the Native Arcadian populace, such as the Seminole, Creek, Chickasaw and Shawnee tribes. Only the Cherokee remained largely resistant to Assimilation, fiercely maintaining their culture, despite being incorporated into colonial rule in the mid 18th century.(the Cherokee language would not see significant reform until 1821 under Sequoyah.)"
 dod_lore.252.t:0 "History of Plantagenia (3/6)"
 dod_lore.252.d:0 "The Anglo-French colonist also saw significant challenges from rival colonial powers. Despite the traditional Anglo-Franco-Spanish alliance, there were border incidents between the Crown Colony of Plantagenia (as their Arcadian colony was known) and the Viceroyalty of New Spain (and later Viceroyalty of Lusitania) that put a strain on their relationship. This also showed in the hostile relationships with New Burgundy and Vinland, and the various wars fought in the mainland reverberated in the colonies as well."
 dod_lore.253.t:0 "History of Plantagenia (4/6)"
 dod_lore.253.d:0 "The road to Plantagenia’s independence from the Dual Monarchy was in a sense, unintentional. It began with the death of King Édouard VI and the subsequent self-exile of Prince Charles to Nouvelle Orléans, where he would serve as the de facto Viceroy of the colony. During his stay there, he reformed the colonial army, transforming it from a series of separate militias into a professional fighting force. It was these reforms that made Charles secure enough to proclaim himself the rightful King of England and France, triggering the Anglo-French War of Succession (1767-1771)"
 dod_lore.254.t:0 "History of Plantagenia (5/6)"
 dod_lore.254.d:0 "The Plantagenian Army challenged the Dual Monarchy to battle, and because of their superior knowledge in terrain, the use of militia to serve as skirmishers, the support of Scandinavia to supply arms and ships, and the half-hearted support of the Conservatives in power, saw the systematic conquest of Plantagenia for Charles by 1770. However, despite a successful landing in Brittany, the Army of King Charles was decisively defeated in the Battle of Rennes, subsequent battles saw any possibility of maintaining their hold in Brittany unfeasible, and because of the Dual Monarchy’s inability to regain their former colony, both sides agreed to peace. The Treaty of Brest confirmed Henri IX as King of England and France, and Prince Charles as King of Plantagenia as King Charles I, with both sides relinquishing claims on the others’ throne."
 dod_lore.255.t:0 "History of Plantagenia (6/6)"
 dod_lore.255.d:0 "Plantagenia enjoyed a great period of peace since independence, maintaining its culture and its rights (slavery still being legal and widespread throughout all parts of the Kingdom), however the threat of Arcadianism espoused by the Seven Republics of New Burgundy was both a curse, in form of its disastrous defeat by their hand in the War of the Double Alliance, and a blessing, as these ideas gave rise to the concept of Plantagenia, not the Seven Republics, being the one to lead a united Arcadia to a brighter future. And so, Plantagenia, convinced of its new destiny, marches forth in the name of enlightenment and King.?"
 dod_lore.261.t:0 "History of Vinland (1/12)"
 dod_lore.261.d:0 "Scandinavian tradition of colonization can be traced back as early as the Viking Age. Norwegian settlers for the most part sailed West, discovering Faroe Islands and colonizing them. Then it was the turn of Iceland from where Erik the Red, whose father was exiled from Norway and who himself was banned from Iceland, sailed to Greenland. His son Leif would then become the first European to reach Arcadia, calling the land where he landed “Vinland”, “land of the grapes” for savage grapes were found in this place. The Norse settlement was however abandoned after encroachments with the “Skraelings”, the name given to the indigenous population. For 5 centuries, Vinland was abandoned and forgotten while Greenland soon became isolated from Iceland and thus Europe."
 dod_lore.262.t:0 "History of Vinland (2/12)"
 dod_lore.262.d:0 "However, to avoid losing in the course for the colonies, the Stuart monarchy became suddenly interested in sailing West in the end of the 16th century. After the foundation of what would become Plantagenia and the Seven Republics, Hans III, the King of the North desired his share of the cake. The Icelandic explorer Christian Eriksson was hired and went on exploring the coasts of what is now Vinland. Referring to the old sagas, he identified several regions as the ones of the sagas and popularized the use of Vinland as a name for the region upon his return in Copenhagen. His numerous expeditions would lead him to fund several towns, the most famous being Erikshavn (1570), “Erik's port” named after the heir to the Kalmar Union, which would become over the years the most important city of the Nordic colony."
 dod_lore.263.t:0 "History of Vinland (3/12)"
 dod_lore.263.d:0 "Vinland was the last European colony to be founded in the New-World and the low Scandinavian population made it also the less populated of the continent. The colony was based on the trade of furs, mainly beavers which were highly wanted in 17th century Europe and many settlers were only interested in this trade, making money and coming back to the homeland where they enjoyed a new position. The Religious Conflicts and the first border conflicts with New Burgundy led the Scandinavians to soon take measures to encourage immigration in the area. The end of the Imperial War of Religion would see an important emigration of Germans from Pomerania to Vinland where they would soon form an important part of the population. The seizure of Galatia (Sudurhafeyjar) in the same war would however divert many potential colonists to the rich waters of the Caribbean."
 dod_lore.264.t:0 "History of Vinland (4/12)"
 dod_lore.264.d:0 "With a low population whose main concern was trade, Vinland experimented a very different relation with the natives than New-Burgundy or Plantagenia. Diplomatic relations were soon established between Scandinavia and the Iroquois, the Inuit and the Cree nations. The subsequent treaties which were signed guaranteed the land of the tribes (after some “rectifications” by the Vinlandic settlers) in exchange of the submission to the Nordic throne and a commercial monopoly for Scandinavia. This would lead to a rise of the trade of furs and also influence of Scandinavia which soon ruled over all the Great Lakes. The Nordic explorers would also often embark on travels inland which would lead to the mapping of most of North Arcadia by 1750 and the emergence of the Rohnst people."
 dod_lore.265.t:0 "History of Vinland (5/12)"
 dod_lore.265.d:0 "However the rise of the settler population provoked a clash between the Crown and her colony. Reclaiming more lands and more rights the settlers would often ask for renegotiating the treaties with the “Skraelings”, a move the crown was not keen to do because of the influence she exerted over Arcadia because of the same treaties. The situation would tense over the years, the final blow being the new taxes for financing the German Wars leading to the Vinlandic War of Independence in 1808. The Loyalists were soon crushed and the tribes were forced to negotiate new treaties in favour of the settlers."
 dod_lore.266.t:0 "History of Vinland (6/12)"
 dod_lore.266.d:0 "However the Iroquois Confederation would ask for the protection of the newly independent Belgium, giving the Septimen an access to the Great Lakes. This would mark the first step of hostilities between Vinland and the Seven Republics. Initially, a Treaty signed in neutral Talahasi in 1809 would see the Iroquois Confederate boundary split, with two-thirds going to Vinland and the remainder staying with the Seven Republics. But tensions continued as the rise of the concept of Arcadianism grew stronger. Finally, the threat of the Seven Republics grew too big to simply deal with by diplomacy. Securing an alliance with the Kingdom of Plantagenia, they declared war on the Seven Republics, triggering the War of the Double Alliance (1819-1821). The War was seen as nothing short of a disaster. The lack of population from Vinland proved to be the crucial factor in its defeat and loss of territory stipulated by the Treaty of Erikshavn."
 dod_lore.267.t:0 "History of Vinland (7/12)"
 dod_lore.267.d:0 "Now Vinland stands at a crossroad. It is the biggest nation in Arcadia but also the less populated and both Plantagonian and Septimen are interested to get their share of the Great Lakes. The debate on the Natives situation has grown stronger over the years, stimulated by the opening of the colonization of the inner and northern parts of Arcadia and it may be time for Vinland to eventually choose the fate of the Skraelings. Adding to this situation, the emigration of Iroquois from Septimen territory preferring Vinlandic rule than Septiman exploitation. Moreover Arcadianism has spread to the ideological spheres of Vinland and some are already advocating the idea of Vinland spreading from one ocean to the other and becoming the sole great power of Arcadia.?"
 dod_lore.268.t:0 "History of Vinland (8/12)"
 dod_lore.268.d:0 "Amazonie was first explored by Spanish explorers during the expeditions of Amerigo Vespucci and was amongst the lands reserved for the Spanish with the treaty of Pamplona. However the violations of the treaty by the Spanish, made the Anglo-French feel not bind by it. The first colony founded was St-George in what was called France Equinoxiale (because near the Equator, days and nights barely last around the same time). The settlements were scarce and the area was clearly void of any occupation outside of the coastal ports of St-George and Bethléem. By 1574, the Spanish and French agreed on a new border on the Amazon River with all East and South territories left to Anglo-French colonisation."
 dod_lore.269.t:0 "History of Vinland (9/12)"
 dod_lore.269.d:0 "The Antarctiqual colonisation was sponsored by “La Compagnie de l’Antarctique” founded in St-Malo by Breton and Guyennese merchants. Decided to put to use the vast territories void of human presence, they bought many lands in the colony, creating grand domains using slaves workforce and settling there many settlers. Contrary to the Jewel of the Crown which was Plantagenia, Amazonia would see a predominantly French and Breton colonisation and almost no English settlers, the Puritans attracting the people who fled the Dual-Monarchy. Slavery was the main motor of the expansion of the colony becoming the first sugar producer in the whole world after 1700. Conflicts would often erupt on the southern border with Lotharian settlers although the whole Atlantian area became a city of exchange between the Burgundian and Anglo-French colony."
 dod_lore.270.t:0 "History of Vinland (10/12)"
 dod_lore.270.d:0 "Penetration of the interior was hard because of the climate and it is only by 1790 that most of Amazonie was fully claimed and colonized. The settlers of the East took control of Gouas and Monts-Diamants while Equinoxian settlers would settle Vaura. The War of Succession caused no real change for the colony with only Equinoxia taking a side during the war and sending men to Charles. This act was punished after the war by the reunion of the two vice-royalties into Amazonie, administered in Port-Liberté. The little freedom Equinoxia had was lost and Equinoxian became bitter with the rule of the monarchy."
 dod_lore.271.t:0 "History of Vinland (11/12)"
 dod_lore.271.d:0 "The ideas of the German Wars erupted in Amazonia but caused no real riot except in St-Georges where Equinoxian were ready to take up arms against the oppressor. The governor of the colony dialogated with revolters but was ultimately forced to leave in 1825. The success of the Lotharian Independence and the ongoing Spanish-Colombian Wars had only strengthened the revolutionary party. An assembly was called in Port-Liberté to choose the new Constitution of the country. In the end, the Amazonian Federation was declared with the constituent republics of Equinoxie and Antarctique being equals in the terms of power and jurisdiction. However the size and the population of the Eastern Part soon allowed the politics to not mind the Equinoxian inhabitants. Thus slavery was only abolished in the Western Parts while the Eastern planters retained their workforce."
 dod_lore.272.t:0 "History of Vinland (12/12)"
 dod_lore.272.d:0 "Profiting from the Lotharingian Civil War, the Amazonian government moved its army to Atlantia and integrated it in the Federation although the claim is still unrecognized by the Lotharingian government and by the local population. Amazonia stands now at a crucial point in its history: Equinoxian are looking west, up the Amazon to settle new lands but who knows what effects it could have with Gran Colombia? The Antarctic people are now looking south and a similar idea to Arcadianism has spread over some politics, the “Amerigan Ideal”. The balance in the country is already shaking and with potential enemies in the North and a revanchist dictatorship in the South, who knows what awaits the only democracy of the Amerigan continent?"
 dod_lore.278.t:0 "History of Amazonie (1/1)"
 dod_lore.278.d:0 "A new movement of colonisation began in the 1610. Attracted by the riches of the “Tribute” Fleet from Peru, many settlers installed on the northeastern tip of Ameriga in what was called “France Antarctique” (Antarctic France meaning the opposite of the Arctic Climate). The immigration there, strengthened by the Atlantic Trade would be unregulated for years, Port Liberté being founded by a Breton pirate around 1640 and only integrated in the viceroyalty of France Antarctique after the construction of a royal fort in the bay. The area would prove to be a pirates’ nest for the whole century, culminating in what some people called the “Golden Age of Piracy” debuting during the Imperial War and continuing with various successes for the rest of the century and ending with the elimination of the last “true pirate”, Bartholomew Roberts in a fight with his old friend Olivier Levasseur."
