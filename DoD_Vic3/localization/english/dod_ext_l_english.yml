l_english:
 je_dod_plantagenian_slavery:0 "The Slavery Debate"
 je_dod_plantagenian_slavery_reason:0 "Plantagenia's wealth rests on its plantations, and its plantations rest on slavery. Abolitionists grow louder every year, while the planters grow more defiant. Abolish slavery before the planters' resistance boils over."
 je_dod_cowboy_king:0 "The Cowboy King"
 je_dod_cowboy_king_reason:0 "The King of Plantagenia would rather ride the frontier than sit on his throne. His antics delight the people and horrify the court. Will he become the people's King, or a national embarrassment?"
 je_dod_arcadian_hegemony:0 "The Arcadian Hegemony"
 je_dod_arcadian_hegemony_reason:0 "Pan-Arcadianism has triumphed in spirit. Now it must triumph in fact: every Arcadian people under one flag, and the Union recognised as a Great Power."
 je_dod_beornian_communion:0 "The Communion of Camelot"
 je_dod_beornian_communion_reason:0 "Beornia was founded by Anglican exiles fleeing persecution, but its Church is divided: the High Church loyal to the King, the Presbyterians demanding elected elders, and the Parishers who would let every parish rule itself. Bring the Communion together before it tears the kingdom apart."
 je_dod_savoyard_succession:0 "The Savoyard Succession"
 je_dod_savoyard_succession_reason:0 "Duke Vittorio Luigi is young, dissolute and deep in debt to Aragonese bankers. His cousin Amedeo, a soldier, is everything he is not. Savoy, caught between Paris and Barcelona, needs a capable ruler."
 dod_beornian_lotharian_union:0 "The Beornian-Lotharian Union"
 dod_beornian_lotharian_union_desc:0 "Since the Beornian King married the niece of De Aigle, our two nations have been bound by blood. It is time to bind them by crown as well."
 dod_crown_amedeo:0 "Crown Amedeo"
 dod_crown_amedeo_desc:0 "Persuade Vittorio Luigi to abdicate in favour of his cousin Amedeo."
 dod_italian_confederation:0 "Propose an Italian Confederation"
 dod_italian_confederation_desc:0 "A league of free Italian states under Savoyard leadership would keep the peninsula out of foreign hands."
 dod_unite_confederation:0 "Unite the Confederation"
 dod_unite_confederation_desc:0 "The Confederation has proven itself. Its members should become one state."
 dod_new_italian_wars:0 "Declare New Italian Wars"
 dod_new_italian_wars_desc:0 "Aragon and the Anglois have carved up Italy for centuries. Savoy will drive them out."
