 dod_ext.1.t:0 "An Abolitionist Pamphlet"
 dod_ext.1.d:0 "A pamphlet describing the cruelties of the plantations of the Basse Valoisie is being passed from hand to hand in Nouvelle Orleans. Its anonymous author calls slavery a stain on the house of Charles I."
 dod_ext.1.f:0 "Ink against the whip."
 dod_ext.1.a:0 "Let it circulate."
 dod_ext.1.b:0 "Seize every copy."
 dod_ext.2.t:0 "The Road North"
 dod_ext.2.d:0 "Escaped slaves are fleeing north across the border into the Belgian Confederacy, where the Septiman courts refuse to send them back. The planters demand that the King protest to Chancellor Geloes-Randwijck."
 dod_ext.2.f:0 "Freedom lies north."
 dod_ext.2.a:0 "Protest to the Confederacy."
 dod_ext.2.b:0 "Let them go."
 dod_ext.3.t:0 "The Planters' Convention"
 dod_ext.3.d:0 "The great planter families have gathered in convention and declared that any attack on their 'property' is an attack on the liberties of Plantagenia itself."
 dod_ext.3.f:0 "King Cotton speaks."
 dod_ext.3.a:0 "Reassure them."
 dod_ext.3.b:0 "The Crown is not their servant."
 dod_ext.4.t:0 "The King's Conscience"
 dod_ext.4.d:0 "The King has been seen visiting a plantation incognito. The court whispers that what he saw there has shaken him."
 dod_ext.4.f:0 "A troubled crown."
 dod_ext.4.a:0 "The King speaks out against slavery."
 dod_ext.4.b:0 "The King keeps his counsel."
 dod_ext.5.t:0 "Emancipation"
 dod_ext.5.d:0 "Slavery is abolished in Plantagenia. In Nouvelle Orleans the bells ring all day, while on the plantations the old masters wonder who will pick their cotton."
 dod_ext.5.f:0 "Free at last."
 dod_ext.5.a:0 "A new Plantagenia."
 dod_ext.6.t:0 "The Planters' Fronde"
 dod_ext.6.d:0 "The planters have taken up arms. Their militias hold the plantation country, and they swear they will never give up their 'property'."
 dod_ext.6.f:0 "Concede, or crush?"
 dod_ext.6.a:0 "Concede: slavery stays."
 dod_ext.6.b:0 "Crush the Fronde and abolish slavery."
 dod_ext.10.t:0 "A King on Horseback"
 dod_ext.10.d:0 "The new King of Plantagenia is unlike his forebears. He prefers the saddle to the throne, the frontier to the court, and the company of trappers and cattlemen to that of courtiers. The people adore him; the ministers are terrified."
 dod_ext.10.f:0 "The Cowboy King."
 dod_ext.10.a:0 "Long live the King!"
 dod_ext.11.t:0 "A Rodeo at Court"
 dod_ext.11.d:0 "The King has turned the palace gardens into a rodeo ring. The diplomatic corps is scandalised; the crowds outside the gates cheer themselves hoarse."
 dod_ext.11.f:0 "The Cowboy King."
 dod_ext.11.a:0 "Let the people in!"
 dod_ext.11.b:0 "Close the gates."
 dod_ext.12.t:0 "The King's Duel"
 dod_ext.12.d:0 "Insulted by a planter's son, the King challenged him to a duel at dawn and shot the pistol out of his hand. The tale is told in every saloon."
 dod_ext.12.f:0 "The Cowboy King."
 dod_ext.12.a:0 "A legend is born."
 dod_ext.12.b:0 "Hush it up."
 dod_ext.13.t:0 "Riding with the Rangers"
 dod_ext.13.d:0 "The King has ridden out with the frontier rangers to chase raiders along the western border, leaving the cabinet to govern without him for months."
 dod_ext.13.f:0 "The Cowboy King."
 dod_ext.13.a:0 "He leads from the front!"
 dod_ext.13.b:0 "Recall him to the capital."
 dod_ext.14.t:0 "A Royal Scandal"
 dod_ext.14.d:0 "The King has been seen gambling away a fortune in a riverboat casino, with a saloon singer on his arm."
 dod_ext.14.f:0 "The Cowboy King."
 dod_ext.14.a:0 "Kings will be kings."
 dod_ext.14.b:0 "Pay off the newspapers."
 dod_ext.15.t:0 "The Cattle Drive"
 dod_ext.15.d:0 "The King has personally led a great cattle drive from the plains to the railheads, proving the new trails can feed the cities."
 dod_ext.15.f:0 "The Cowboy King."
 dod_ext.15.a:0 "A triumph!"
 dod_ext.16.t:0 "The People's King"
 dod_ext.16.d:0 "Against all expectations, the Cowboy King has won the hearts of Plantagenia. Frontiersmen, townsfolk and even some planters now speak of him with pride."
 dod_ext.16.f:0 "Long may he ride."
 dod_ext.16.a:0 "Long may he ride!"
 dod_ext.17.t:0 "The Crown Humbled"
 dod_ext.17.d:0 "The King's antics have become a national embarrassment. Parliament has forced him to accept a council of ministers that will govern in his name."
 dod_ext.17.f:0 "The saddle, not the throne."
 dod_ext.17.a:0 "So be it."
 dod_ext.20.t:0 "The Arcadian Union"
 dod_ext.20.d:0 "From the frozen north of Vinland to the bayous of Nouvelle Orleans, all the peoples of eastern Arcadia stand under one flag. The colonisers have been driven out, and a new power has risen in the New World: a City on the Hill for all who seek liberty."
 dod_ext.20.f:0 "A new star rises."
 dod_ext.20.a:0 "The Union is eternal!"
 dod_ext.30.t:0 "The Bishop of Camelot"
 dod_ext.30.d:0 "The Bishop of Camelot preaches that the Anglican Church of Beornia is the last true Church of England, and that the King is its Supreme Governor by the grace of God. The High Church faction rallies behind him."
 dod_ext.30.f:0 "Church and Crown."
 dod_ext.30.a:0 "The King is Supreme Governor."
 dod_ext.30.b:0 "The Church must listen to its flock."
 dod_ext.31.t:0 "The Presbyterian Synod"
 dod_ext.31.d:0 "Descendants of Scottish exiles have gathered in synod, demanding that the Church be governed by elected elders, not bishops appointed by the King."
 dod_ext.31.f:0 "Elders, not bishops."
 dod_ext.31.a:0 "Grant the synod a voice."
 dod_ext.31.b:0 "Bishops rule the Church."
 dod_ext.32.t:0 "The Parisher Preacher"
 dod_ext.32.d:0 "A fiery preacher of the Parisher movement tours the pampas, teaching that every parish should govern itself, choose its own minister and answer to no bishop and no King."
 dod_ext.32.f:0 "Every parish its own church."
 dod_ext.32.a:0 "Tolerate the Parishers."
 dod_ext.32.b:0 "Arrest the preacher."
 dod_ext.33.t:0 "King Charles Arrested!"
 dod_ext.33.d:0 "Parisher militiamen have stopped the royal carriage on the road to Camelot and placed King Charles under 'protective custody', demanding that he swear to respect the liberties of the parishes."
 dod_ext.33.f:0 "The King in chains!"
 dod_ext.33.a:0 "Swear the oath."
 dod_ext.33.b:0 "Send the army to free him."
 dod_ext.34.t:0 "The Communion Settled"
 dod_ext.34.d:0 "After years of quarrels, a settlement has been reached: bishops, elders and parishes each have their place in the Anglican Communion of Beornia. The exiles' Church, born in persecution, has found peace."
 dod_ext.34.f:0 "One Church, many voices."
 dod_ext.34.a:0 "Thanks be to God."
 dod_ext.35.t:0 "The Communion Breaks"
 dod_ext.35.d:0 "The Church of Beornia has split. High Churchmen, Presbyterians and Parishers now worship apart and curse each other from their pulpits."
 dod_ext.35.f:0 "A house divided."
 dod_ext.35.a:0 "A sad day."
 dod_ext.36.t:0 "Raids across the Pampas"
 dod_ext.36.d:0 "Beornian cattlemen and Incan herders have clashed again along the southern frontier. Each side accuses the other of raiding, and the borderlands are burning."
 dod_ext.36.f:0 "Trouble on the frontier."
 dod_ext.36.a:0 "Punish the Incas."
 dod_ext.36.b:0 "Send envoys to calm the frontier."
 dod_ext.37.t:0 "Lotharian Separatism"
 dod_ext.37.d:0 "Many Lotharians resent the union with Beornia, calling it a Beornian conquest by marriage. Demonstrations fill the streets of Fort Lothere."
 dod_ext.37.f:0 "Union, or independence?"
 dod_ext.37.a:0 "The union holds."
 dod_ext.37.b:0 "Break the union!"
 dod_ext.40.t:0 "The Duke's Debts"
 dod_ext.40.d:0 "Duke Vittorio Luigi has lost another fortune at the card tables of Turin. His creditors are Aragonese bankers, and they are asking for more than money."
 dod_ext.40.f:0 "The Duke's folly."
 dod_ext.40.a:0 "Pay them from the treasury."
 dod_ext.40.b:0 "Force the Duke to economise."
 dod_ext.41.t:0 "A Reform at Last"
 dod_ext.41.d:0 "To everyone's surprise, Vittorio Luigi has signed a reform of the Savoyard administration drawn up by his ministers, and even read it first."
 dod_ext.41.f:0 "Perhaps there is hope."
 dod_ext.41.a:0 "Praise the Duke."
 dod_ext.42.t:0 "Amedeo's Victories"
 dod_ext.42.d:0 "The Duke's cousin Amedeo, a soldier beloved by the army, has won glory on the frontier. In the taverns of Turin, men drink to 'the Duke we should have had'."
 dod_ext.42.f:0 "The soldier prince."
 dod_ext.42.a:0 "Honour Amedeo."
 dod_ext.42.b:0 "Send Amedeo far away."
 dod_ext.43.t:0 "The Anglois Ambassador"
 dod_ext.43.d:0 "The ambassador of the Dual Monarchy, Savoy's old protector, has hinted that Paris would welcome a 'more capable' Duke. The Aragonese are said to favour Vittorio Luigi, who owes them so much."
 dod_ext.43.f:0 "Caught between Paris and Barcelona."
 dod_ext.43.a:0 "Lean on Paris."
 dod_ext.43.b:0 "Lean on Barcelona."
 dod_ext.44.t:0 "Vittorio Luigi Reformed"
 dod_ext.44.d:0 "The dissolute young Duke has grown into his crown. Turin, which once mocked him, now calls him 'the Wise'."
 dod_ext.44.f:0 "Better late than never."
 dod_ext.44.a:0 "Long live the Duke!"
 dod_ext.45.t:0 "Duke Amedeo"
 dod_ext.45.d:0 "Vittorio Luigi has been persuaded to abdicate, and his cousin Amedeo has been proclaimed Duke of Savoy to the cheers of the army."
 dod_ext.45.f:0 "The soldier Duke."
 dod_ext.45.a:0 "Long live Duke Amedeo!"
 dod_ext.46.t:0 "The Italian Confederation"
 dod_ext.46.d:0 "Savoy proposes an Italian Confederation: a league of free Italian states under Savoyard leadership, to keep the peninsula out of Aragonese and Anglois hands."
 dod_ext.46.f:0 "Italy for the Italians?"
 dod_ext.46.a:0 "Join the Confederation."
 dod_ext.46.b:0 "We remain independent."
