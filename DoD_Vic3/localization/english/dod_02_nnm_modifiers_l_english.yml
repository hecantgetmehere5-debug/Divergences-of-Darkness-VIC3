l_english:
 state_of_emergency_modifier:0 "State of Emergency"
 state_of_emergency_modifier_desc:0 "State of Emergency or State of Exception means that the government can suspend and/or change some functions of the executive, the legislative and/or the judiciary during this period of time. It alerts citizens to change their normal behavior and orders government agencies to implement emergency plans. A government can declare a state of emergency during a time of natural or human-made disaster, during a period of civil unrest, or following a declaration of war or situation of international/internal armed conflict."
 ANY_ALL:0 "Any province"
 HAS_NOT_GOODS:0 "produces"
 TRIGMOD_HEADER:0 "The $MONARCHTITLE$ reports that"
 TRIGMODLOST_HEADER:0 "The $MONARCHTITLE$ reports that"
 TRIGGER_CIV_PROGRESS_LESS:0 "Civilization progress: 50%"
 had_liberal_revolution:0 "Liberal Revolution has ended"
 attending_berlin_congress:0 "Attending the Congress"
 oriental_crisis_support_OE:0 "Supports the Ottomans"
 oriental_crisis_support_Egypt:0 "Supports the Egyptians"
 MAJORITY_IS_NOT:0 "Majority of the population is not"
 crimean_surrender:0 "the Ottomans have surrendered"
 colonial_chaos:0 "Colonial Chaos"
 colonial_chaos_desc:0 "Our colony is in chaos, and we are in danger of losing it utterly if order is not restored soon!"
 loss_of_control:0 "Loss of Control"
 loss_of_control_desc:0 "We have lost control over the colony."
 nationalist_agitation:0 "Nationalist Agitation"
 nationalist_agitation_desc:0 "Nationalists are active in the province, stirring up trouble with random acts of violence. If left unchecked, they may rise in rebellion against us."
 patriot_uprising:0 "Patriot Uprising"
 patriot_uprising_desc:0 "Foreign patriots have taken control of the province."
 the_ikhwan:0 "The Ikhwan"
 the_ikhwan_desc:0 "An alliance has been made with the Bedouin Wahhabists. Islam shall remain pure in our nation, in exchange for their military support."
 mandate:0 "Mandate of Heaven"
 holy_city:0 "The Holy City"
 holy_city_desc:0 "Mecca is the center of all Islam. To hold it is to stand above all others, and prove to them that the fate of all Islam lies in our hands."
 drive_to_reunify_desc:0 "We must reunite the country, at any cost!"
 taiping_draft:0 "Emergency Draft"
 the_female_shortage:0 "The Female Shortage"
 the_female_shortage_desc:0 "A populational deficit means that there are more men than women in China, slowing down population growth and upsetting the mass of single males that will never form a family."
 christian_pamphlets:0 "Christian Pamphlets"
 chinese_floods:0 "Chinese Floods"
 small_country_draft:0 "Emergency Draft"
 small_country_draft_desc:0 "We must recruit all able-bodied men to fight!"
 daimyo_draft:0 "Emergency Draft"
 daimyo_draft_desc:0 "We must recruit all able-bodied men to fight!"
 sons_of_liberty:0 "Sons of Liberty"
 sons_of_liberty_desc:0 "A militia of pro-democracy liberals, determined to either see the United States returned to its democratic tradition or secede their state from the union."
 peasant_revolt:0 "Open Revolt"
 peasant_revolt_desc:0 "There is increased agitation within the province, including riots and random violence which the local government has had difficulty putting down."
 shastar_vidya:0 "Shastar Vidiya"
 shastar_vidya_desc:0 "The renowned Sikh fighting style, it is a martial art involving sword play... and has made the Sikhs into fearsome combatants."
 force_publique:0 "Force Publique"
 force_publique_title:0 "Form the Force Publique"
 force_publique_desc:0 "The Force Publique was the official armed force of the Belgian-controlled Congo Free State. Though ostensibly formed to combat Arab Slavers, the soldiers were often used to enforce economic quotas with brutal punishment."
 rcmp:0 "R.C.M.P."
 rcmp_desc:0 "The Royal Canadian Mounted Police was formed to patrol the newly-acquired North-West Territories, eventually uniting with the Dominion Police to keep order throughout all Canadian provinces."
 national_instability:0 "National Instability"
 national_instability_desc:0 "The country is in a state of turmoil, and is in danger of rebellions."
 home_of_the_mormons:0 "Home of the Mormons"
 home_of_the_mormons_desc:0 "the Mormons believe in polygamy, the taking of many wives, and encourage their followers to have large families."
 gateway_to_america:0 "Gateway to America"
 gateway_to_america_desc:0 "Many immigrants from Europe will pass through the gates of Ellis Island, and a great number of them will remain in New York City."
 carlist_sympathies:0 "Carlist Sympathies"
 carlist_sympathies_desc:0 "A Carlist cell is at work in the province, and is quickly gaining sympathy for the rebels that wish to topple the Spanish government."
 christino_sympathies:0 "Christino Sympathies"
 christino_sympathies_desc:0 "A Christino cell is at work in the province, and is quickly gaining sympathy for the rebels that wish to topple the Spanish government."
 war_torn:0 "War Torn"
 war_torn_desc:0 "This province has been devastated by the rebellion."
 boxer_rebellion:0 "Boxer Rebellion"
 boxer_rebellion_desc:0 "The province is currently held by the Boxer rebels, and is in great disarray."
 new_country:0 "Newly-Established Country"
 new_country_desc:0 "This country has just been established, and its citizens are willing to work harder to keep it running… for the time being."
 jewish_diaspora:0 "Jewish Diaspora"
 jewish_diaspora_desc:0 "The Jewish community is organizing in reaction to the creation of Israel."
 declaration_of_the_rights_of_man:0 "Declaration of the Rights of Man"
 declaration_of_the_rights_of_man_desc:0 "The Declaration of the Rights of Man and of the Citizen, a fundamental document of the French Revolution, defined the individual and collective rights of all the estates of the realm as universal."
 caste_privileges:0 "Caste Privilege"
 caste_privileges_desc:0 "An early goal of British Imperialists in India was to create a class of local elites in their own image. They were successful, forming a new caste of wealthy Indians who rose to prominence within the colony."
 sati_abolished:0 "Abolishment of Sati"
 sati_abolished_desc:0 "The abolishment of Sati funeral practices, where a recent widow immolated herself on her husband's grave, was incredibly unpopular in some parts of India."
 pig_fat_cartridges:0 "Pig Fat Cartridges"
 pig_fat_cartridges_desc:0 "The issuing of gunpowder cartridges which were believed to be greased with pig fat was considered an incredible insult by Sepoy soldiers, and further evidence of the growing cultural rift between Indians and colonial powers."
 carlism:0 "Carlism"
 carlism_desc:0 "Carlism is a traditionalist and legitimist political movement in Spain seeking the establishment of a separate line of the Bourbon family on the Spanish throne. This line descended from Infante Carlos, Count of Molina, and was founded due to dispute over the succession laws and widespread dissatisfaction with the Alfonsine line of the House of Bourbon."
 spirit_of_freedom:0 "The Spirit of Freedom"
 spirit_of_freedom_desc:0 "For some cultures, the notion of democracy and individual freedom is rooted in their very psyche."
 national_identity:0 "National Identity"
 national_identity_desc:0 "The concept of nationhood began taking hold in the late 19th century, as people began to identify more with the country they lived in rather than a particular region. Nationalism quickly gave rise to rebels who sought independence from foreign rule, or to rejoin their homeland."
 anti_jacobin_movement:0 "Anti-Jacobin"
 anti_jacobin_movement_desc:0 "A reaction to the Jacobins and the struggle for democracy, reactionary elements in countries became very entrenched against democracy as a concept-- calling it 'inherently flawed' and misguided, as well as a source of chaos, rather than holding the possibility of anything useful or good."
 sharia_law:0 "Sharia Law"
 sharia_law_desc:0 "Sharia is the strict moral code and religious law of Islam, considered the infallible law of God-- interpreted by Islamic judges who have responsibilities to religious leaders."
 ottoman_oppression:0 "Christian Oppression"
 ottoman_oppression_desc:0 "A number of Ottoman policies regarding Christians within the Empire, such as the Jizya tax and restrictions on work and movement, set the stage for issues in the Balkans for years to come. These policies were not revoked until the Tanzimat Reforms which began in 1839."
 ottomanism_reform:0 "Imperial Reform Edict"
 ottomanism_reform_desc:0 "The Hatt-i Hümayun has established religious equality among the Empire's minorities, and gone a long way towards assuaging some of the concerns of nationalists within our borders."
 great_statesman:0 "Great Statesman"
 great_statesman_desc:0 "Our leader is an able speaker and a fine statesman, respected by other world leaders."
 zemene_mesafint:0 "Zemene Mesafint"
 zemene_mesafint_desc:0 "The Zemene Mesafint was a period in Ethiopian history when the country was rent by conflicts."
 irish_integration:0 "Irish Integration"
 irish_oppression:0 "Irish Destitution"
 irish_oppression_desc:0 "The system of absentee landownership has left Ireland a model of inefficiency, and left the Irish continually struggling and rebelling against British rule for centuries."
 land_of_opportunity:0 "Land of Opportunity"
 swiss_banking:0 "Swiss Banking"
 swiss_banking_desc:0 "The Swiss run an efficient and internationally recognized banking system. The rich from all over the world come to Switzerland for their banking needs."
 anynomous_investor_business:0 "Anonymous Investor Business"
 anynomous_investor_business_desc:0 "This style of business culture meant that the owners treated the business as an investment. Ownership was not about producing and selling things. Instead the only reason for being the owner was to see the business ratios rise. This practice was professional, but lacked commitment and was intensely risk-aversive."
 boer_republic:0 "Boer Republic"
 integration_refusal:0 "No Integration"
 integration_refusal_desc:0 "The province is not being integrated into the rest of the country, and being allowed to maintain its separate identity."
 core_integration:0 "Core Integration"
 core_integration_desc:0 "The province is being integrated into the rest of the country, a slow process that may cause problems here."
 national_assimilation_complete:0 "National Assimilation Complete"
 national_assimilation:0 "National Assimilation"
 national_assimilation_desc:0 "This province is undergoing assimilation to remove the claims that other countries have upon it."
 national_assimilation_rejection:0 "Assimilation Rejection"
 national_assimilation_rejection_desc:0 "The minorities in this province have rejected the policies of national assimilation."
 national_assimilation_acceptance:0 "Assimilation Acceptance"
 national_assimilation_acceptance_desc:0 "The minorities in this province have accepted the policies of national assimilation."
 christian_repression:0 "Christian Repression"
 christian_repression_desc:0 "Taiping missionaries are being actively repressed in this province."
 anti_manchu_sentiment:0 "Anti-Manchu Sentiment"
 anti_manchu_sentiment_desc:0 "There is a great deal of bitterness against the Qing Dynasty's rulers in this province."
 louis_napoleon_iii:0 "Louis-Napoléon Bonaparte"
 louis_napoleon_iii_desc:0 "Nephew and heir of Napoleon I, he is a man of the people and carries with him a legacy that makes him seemingly invincible-- even if, at times, his decisions are reckless and of questionable military value."
 begin_disunited_states:0 "Disunited States"
 begin_disunited_states_desc:0 "With the transition of the United States away from democracy, the Sons of Liberty have arisen in an effort fight what they call tyranny. It will take time for this resistance to calm, and until it does there shall be much talk of secession and even open revolt."
 election_cooldown:0 "Ongoing Elections"
 desc_election_cooldown:0 "Our voters are currently debating and discussing all important issues."
 violent_elections:0 "Violent Elections"
 desc_violent_elections:0 "The current elections turned out have a quite violent undertone in the ongoing campaigns."
 social_reform_movement:0 "Social Reform Movement"
 desc_social_reform_movement:0 "Socialists and communists have initiated a countrywide agenda for better living conditions."
 wartime_elections:0 "War-time Elections"
 wartime_elections_desc:0 "The elections are taking place in a time of war, an event which has taken center stage in the debates."
 loss_of_support:0 "Loss of Support"
 loss_of_support_desc:0 "The ruling party has lost support in this area."
 support_the_government:0 "Government Support"
 support_the_government_desc:0 "The ruling party has extra support in this area."
 nothing_stops_progress:0 "Nothing Stops Progress"
 nothing_stops_progress_desc:0 "We are arresting the reactionary agitators and proceeding with reforms as planned."
 slow_down_progress:0 "Reform Restrictions"
 slow_down_progress_desc:0 "Perhaps it is best if we apply brakes to the rate of reforms. We must allow our people to catch up!"
 ruling_party_scandal:0 "National Scandal"
 ruling_party_scandal_desc:0 "A recent scandal has rocked the government and eroded support for the ruling party."
 party_scandal_evidence:0 "Major National Scandal"
 party_scandal_evidence_desc:0 "Evidence has come to light which has only worsened the national scandal, putting the government at dire risk if it should come to an election."
 border_incident:0 "Recent Border Incident"
 border_incident_desc:0 "We have recently had a border incident, stirring up trouble with a Great Power."
 the_british_raj:0 "The Indian Raj"
 the_british_raj_desc:0 "Greatest of the jewels in our nation's crown is the Indian Raj."
 dutch_east_india:0 "East India Company"
 dutch_east_india_desc:0 "Greatest of the jewels in our nation's crown is the East Indies colony."
 vassal_nation:0 "Vassal Nation"
 vassal_nation_desc:0 "As a vassal nation to a foreign power, we will always be seen as a lesser country in the eyes of the rest of the world."
 coup_risk:0 "Coup D'etat Risk"
 coup_risk_desc:0 "There is dissension within the nation's military, one that is leading to a breakdown of order not only within the ranks but within the country itself. Some fear the army will rise up and take over the government."
 military_strife:0 "Military Strife"
 military_strife_desc:0 "We are battling with our own army to prevent them from taking over the government. Purges are not infrequent, and the chances of soldiers defecting to join rebel causes raises with every passing day."
 vangaurd_party:0 "Vanguard Party"
 mixed_economy_desc:0 "Mixed economy is an economic system in which both the state and private sector direct the economy, reflecting characteristics of both market economies and planned economies. Most mixed economies can be described as market economies with strong regulatory oversight, and many mixed economies feature a variety of government-run enterprises and governmental provision of public goods."
 the_dark_continent:0 "The Dark Continent"
 the_dark_continent_desc:0 "A common name for Africa prior to its exploration, 'the Dark Continent' referred to the deep interior where few men had ever seen much less knew anything about. These deep jungles and desolate wastes were a no-man's-land, populated primarily by natives who had little contact with civilization. With the increase of exploration brought on by colonialism, suddenly the ability to colonize the areas previously denied to us has become possible."
 fight_the_power:0 "Government Resistance"
 fight_the_power_desc:0 "There is rising dissension against the government, both among the people and within the military. We will have difficulty keeping order until this passes."
 national_confusion:0 "National Confusion"
 national_confusion_desc:0 "There has been a great deal of change in our country. It will take some time to sort things out, before business as usual can resume."
 neutrality:0 "Political Neutrality"
 neutrality_desc:0 "Our country deliberately takes no sides. We do not go to war, even against those the world universally reviles, and thus expect that no one shall go to war against us. This means we will likely never achieve recognition as a 'mover and shaker', but it also protects us. We shall not abandon our principles for the sake of power and influence."
 apache_raiders:0 "Apache Raiders"
 irish_potato_blight:0 "Potato Blight"
 irish_potato_blight_desc:0 "Famine spreads as crops lie, dead and rotting, in our fields."
 irish_republicans:0 "Irish Republicans"
 irish_republicans_desc:0 "Down with the monarchy! An Irish Free State is the only solution!"
 irish_unionists:0 "Irish Unionists"
 irish_unionists_desc:0 "Ireland is a part of the United Kingdom, now and forever more! We will not turn our back on the monarchy!"
 power_vacuum:0 "Power Vacuum"
 power_vacuum_desc:0 "The government is in a state of transition as it struggles to find its new leader… or fall in the process."
 chinese_substate:0 "Qing Oppression"
 chinese_substate_desc:0 "The oppression by the Qing Emperor has left our nation in disarray."
 switched_production:0 "Switched Production"
 switched_production_desc:0 "The province has just switched its major production, and locals are still acclimatizing to the change."
 new_production:0 "New Plantation"
 new_production_desc:0 "A new plantation has been started in this province, moving production over to cash crops rather than than the traditional farming which has been done here by the natives."
 emergency_tax_measures1:0 "Emergency Measures"
 emergency_tax_measures1_desc:0 "Our financial situation has forced us to adopt draconian, and very unpopular, tax measures."
 emergency_tax_measures2:0 "Extreme Measures"
 emergency_tax_measures2_desc:0 "Our financial situation has forced us to adopt draconian, and very unpopular, tax measures."
 boxer_presence:0 "Boxer Presence"
 boxer_presence_desc:0 "The Righteous Harmony Society is present in this province, disrupting regular trade as they act against foreign influence."
 boxer_agitation:0 "Boxer Agitation"
 boxer_agitation_desc:0 "Our efforts to suppress the Boxers in this province has angered them, turning these nationalists against our government."
 gateway_to_harbor:0 "Gateway to a New Land"
 gateway_to_harbor_desc:0 "Many immigrants from around the world will pass through our great harbor, and a great number of them will remain in the city."
 may_day:0 "May Day"
 may_day_desc:0 "Our nation celebrates socialism. Let the greedy capitalists of the land shake in their boots!"
 militant_trade_union:0 "Militant Trade Union"
 dissatisfied_workers:0 "Dissatisfied Workers"
 worker_revolt:0 "Worker Revolt"
