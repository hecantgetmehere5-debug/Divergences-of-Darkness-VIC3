l_english:
 dod_tp_pearl_river:0 "The Pearl River Ports"
 dod_tp_pearl_river_desc:0 "Macao, Hong Kong and Kwangchowan guard the riches of Guangdong and southern China. A treaty port there would open the region to our trade."
 dod_tp_shanghai:0 "The Shanghai Treaty Port"
 dod_tp_shanghai_desc:0 "Shanghai's harbour on the Yangtze delta could make it the greatest port in Asia. A treaty port there would open the region to our trade."
 dod_tp_shandong:0 "The Shandong Treaty Ports"
 dod_tp_shandong_desc:0 "Qingdao and Weihaiwei guard the Bohai Gulf and the approaches to Beijing. A treaty port there would open the region to our trade."
 dod_tp_lushun:0 "The Lushun Treaty Port"
 dod_tp_lushun_desc:0 "Lushun, Port Arthur, sits at the neck of the Liaodong peninsula, guarding the Bohai Sea. A treaty port there would open the region to our trade."
 dod_tp_ningbo:0 "The Zhejiang Treaty Ports"
 dod_tp_ningbo_desc:0 "Ningbo and Jiaxing, the home of silk, are among China's oldest trading cities. A treaty port there would open the region to our trade."
 dod_tp_taiwan:0 "The Taiwan Concession"
 dod_tp_taiwan_desc:0 "Tamsui and the Taipei basin are booming on the overseas trade in tea and camphor. A treaty port there would open the region to our trade."
 dod_tp_tsushima:0 "The Tsushima Treaty Port"
 dod_tp_tsushima_desc:0 "Tsushima lies between Korea and Japan: small, poor and strategically priceless. A treaty port there would open the region to our trade."
 dod_tp_cheju:0 "The Cheju Concession"
 dod_tp_cheju_desc:0 "Cheju island in the Korea Strait is a natural base for any fleet in these waters. A treaty port there would open the region to our trade."
 dod_tp_gwadar:0 "The Gwadar Treaty Port"
 dod_tp_gwadar_desc:0 "Gwadar, the gateway of the wind, is a warm-water port on the Arabian Sea. A treaty port there would open the region to our trade."
 dod_tp_qeshm:0 "The Qeshm Treaty Port"
 dod_tp_qeshm_desc:0 "Qeshm sits in the Strait of Hormuz, the key to the Persian Gulf. A treaty port there would open the region to our trade."
 dod_tp_zanzibar:0 "The Zanzibar Concession"
 dod_tp_zanzibar_desc:0 "Zanzibar is the market of the whole East African coast. A treaty port there would open the region to our trade."
 dod_tp_socotra:0 "The Socotra Concession"
 dod_tp_socotra_desc:0 "Socotra guards the mouth of the Gulf of Aden. A treaty port there would open the region to our trade."
 dod_tp_ifni:0 "The Ifni Treaty Port"
 dod_tp_ifni_desc:0 "Ifni's tribes trade between the Europeans and the trans-Saharan caravans. A treaty port there would open the region to our trade."
 dod_tp_fredensborg:0 "The Fredensborg Treaty Port"
 dod_tp_fredensborg_desc:0 "Fredensborg was Scandinavian until the Ashanti wars spilled over in 1817. A treaty port there would open the region to our trade."
