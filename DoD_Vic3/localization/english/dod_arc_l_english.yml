l_english:
 je_dod_excavation:0 "Archaeological Expedition"
 je_dod_excavation_reason:0 "Our archaeologists are digging for the secrets of a lost civilisation. Every find brings them closer; every setback costs months. When the expedition reaches its goal, a great discovery awaits."
 dod_archaeological_society:0 "Found an Archaeological Society"
 dod_archaeological_society_desc:0 "Our intelligentsia have taken a passion for antiquities and lost civilisations. A national society would fund expeditions and give us a museum to rival any in the world."
 dod_dig_maya:0 "The Mysterious Ruins of Yucatan"
 dod_dig_maya_desc:0 "The jungles of Yucatan hide the cities of the Maya."
 dod_dig_mesopotamia:0 "The Cradle of Civilisation"
 dod_dig_mesopotamia_desc:0 "Mesopotamia, home of Babylon, Akkad and Assyria, holds great promise for discovery."
 dod_dig_mycenae:0 "The Mycenaean Excavations"
 dod_dig_mycenae_desc:0 "Interest has been growing in the Aegean civilisations. The secrets of Mycenae await us."
 dod_dig_knossos:0 "The Minoan Excavations"
 dod_dig_knossos_desc:0 "The secrets of the ancient Minoans of Crete await us."
 dod_dig_troy:0 "The Search for Troy"
 dod_dig_troy_desc:0 "Was Troy a legend, or a real city? Only the spade can tell."
 dod_archaeology_society_mod:0 "Archaeological Society"
 dod_archaeology_society_mod_desc:0 "Our scholars study the ancient world."
 dod_dig_expenses:0 "Expedition Expenses"
 dod_dig_expenses_desc:0 "The expedition is draining funds."
 dod_dig_scandal:0 "Excavation Scandal"
 dod_dig_scandal_desc:0 "Our archaeologists are accused of looting and fraud."
 dod_great_discovery:0 "Great Discovery"
 dod_great_discovery_desc:0 "Our archaeologists have made a world-famous discovery."
 dod_respected_scholars:0 "Respected Scholars"
 dod_respected_scholars_desc:0 "Our archaeologists respect the heritage of other nations."
 dod_archaeology_exhibition:0 "Archaeological Exhibition"
 dod_archaeology_exhibition_desc:0 "Our museum is the envy of the world."
 dod_backward_science:0 "Backward Science"
 dod_backward_science_desc:0 "Our scholars are mocked abroad."
 dod_ancient_man:0 "Ancient Man"
 dod_ancient_man_desc:0 "The bones of our ancestors fascinate the world."
 dod_arc.1.t:0 "A Request for Excavation Rights"
 dod_arc.1.d_main:0 "A foreign power has asked for the right to excavate ancient ruins on our soil. We have neither the money nor the expertise to dig ourselves, and the expedition would bring scholars and attention. But the finds would surely end up in a foreign museum."
 dod_arc.1.f:0 "Science, or sovereignty?"
 dod_arc.1.a:0 "Grant the permit."
 dod_arc.1.b:0 "These are our ancestors' treasures. Refuse."
 dod_arc.2.t:0 "Excavation Permit Refused"
 dod_arc.2.d:0 "The local government has refused our archaeologists access to the site. Our international prestige suffers, unless we decide that science matters more than diplomatic niceties."
 dod_arc.2.f:0 "Forced excavation?"
 dod_arc.2.a:0 "Dig anyway. For science!"
 dod_arc.2.b:0 "Abandon the expedition."
 dod_arc.10.t:0 "A Promising Find"
 dod_arc.10.d:0 "Our archaeologists have uncovered pottery, tools and inscriptions that confirm they are digging in the right place."
 dod_arc.10.f:0 "We are close."
 dod_arc.10.a:0 "Press on!"
 dod_arc.11.t:0 "The Expedition Falters"
 dod_arc.11.d:0 "The site was miscalculated, the funds are running low, and fever has struck half the team. Months of work have been lost."
 dod_arc.11.f:0 "A setback."
 dod_arc.11.a:0 "Send more money."
 dod_arc.11.b:0 "We will start over."
 dod_arc.12.t:0 "Expedition Members Eaten by Dinosaurs?"
 dod_arc.12.d:0 "The survivors of our last foray into the jungle have returned emaciated, pale and covered in scratches, raving about giant lizards. The newspapers are delighted."
 dod_arc.12.f:0 "Surely not dinosaurs."
 dod_arc.12.a:0 "Surely not dinosaurs."
 dod_arc.13.t:0 "The Idol"
 dod_arc.13.d:0 "Deep inside a Maya pyramid, our chief archaeologist stands before a golden idol on an altar. Every archaeologist knows the trick: replace it with a bag of the same weight. He reaches for his bag..."
 dod_arc.13.f:0 "Fortune and glory."
 dod_arc.13.a:0 "Swap the idol!"
 dod_arc.13.b:0 "Leave it. It's a trap."
 dod_arc.14.t:0 "An Evil Frenchman"
 dod_arc.14.d:0 "Our archaeologist escaped the rolling boulder with the idol in hand, only to be cornered at the pyramid's exit by a rival archaeologist and his hired guards. 'Again we see there is nothing you can possess which I cannot take away.'"
 dod_arc.14.f:0 "Not again!"
 dod_arc.14.a:0 "Run for the plane!"
 dod_arc.15.t:0 "Cuneiform Tablets"
 dod_arc.15.d:0 "Our archaeologists have unearthed a whole archive of clay tablets, covered in cuneiform script."
 dod_arc.15.f:0 "The library of the ancients."
 dod_arc.15.a:0 "Translate them!"
 dod_arc.16.t:0 "Accusations of Fraud"
 dod_arc.16.d:0 "Some of the jewellery our excavators found is of questionable authenticity, and the local press accuses our team of looting and forgery."
 dod_arc.16.f:0 "Scandal at the dig."
 dod_arc.16.a:0 "Deny everything."
 dod_arc.20.t:0 "A Great Discovery"
 dod_arc.20.d_maya:0 "Ruins stretch up from the jungle as far as the eye can see. These structures are older than anything known in the Maya world. El Mirador, a lost city of the ancient Maya, has been found."
 dod_arc.20.d_mesopotamia:0 "Meticulous research leaves no doubt: Babylon, once a legend of power and decadence from Biblical tales, is now an established fact. Our archaeologists have found the foundations of the great ziggurat, the Tower of Babel."
 dod_arc.20.d_mycenae:0 "As we pulled the golden mask from the body, our chief archaeologist declared: 'I have gazed upon the face of Agamemnon.' The royal tombs of Mycenae have been found."
 dod_arc.20.d_knossos:0 "A vast palace has been uncovered at Knossos: hundreds of rooms, corridors and stairways, painted with bulls and dolphins. The handiwork of Daedalus, built to hold the Minotaur."
 dod_arc.20.d_troy:0 "Digging beside the walls of the ancient city, our archaeologist came upon a hoard of gold, silver and copper. Troy is real, and the treasure of King Priam has been found."
 dod_arc.20.f:0 "An archaeological sensation!"
 dod_arc.20.a:0 "Put it in our National Museum."
 dod_arc.20.b:0 "Leave the finds in their homeland."
 dod_arc.21.t:0 "An Archaeological Exhibition"
 dod_arc.21.d:0 "We have become a leader in the field of archaeology. Our scientists routinely dig in far-off lands, and our National Museum is the envy of the world. A grand exhibition will show off our treasures."
 dod_arc.21.f:0 "The world comes to see."
 dod_arc.21.a:0 "Open the exhibition!"
 dod_arc.22.t:0 "A Backward Country?"
 dod_arc.22.d:0 "A foreign archaeological exhibition has become the talk of the world, and our scholars are mocked as backward. Without excavations of our own, our science looks provincial."
 dod_arc.22.f:0 "We must catch up."
 dod_arc.22.a:0 "Fund an archaeological society!"
 dod_arc.30.t:0 "Homo Neanderthalensis Discovered!"
 dod_arc.30.d:0 "Quarrymen near Dusseldorf have found the bones of an ancient, primitive man. Scholars across Europe are debating what it means for the history of mankind."
 dod_arc.30.f:0 "Our oldest ancestor?"
 dod_arc.30.a:0 "Fascinating!"
 dod_arc.31.t:0 "Homo Erectus Discovered!"
 dod_arc.31.d:0 "The bones of a primitive ancient man have been found in Java, older than anything found before."
 dod_arc.31.f:0 "The missing link?"
 dod_arc.31.a:0 "Fascinating!"
 dod_arc.32.t:0 "Tutankhamun's Tomb Discovered"
 dod_arc.32.d:0 "The intact tomb of a boy pharaoh has been found in the Valley of the Kings, filled with gold and treasures. The world is spellbound."
 dod_arc.32.f:0 "Wonderful things."
 dod_arc.32.a:0 "Wonderful things!"
 dod_arc.33.t:0 "The Golden Andes"
 dod_arc.33.d:0 "A traveller in the Andes has stumbled upon an entire Inca city, forgotten by the outside world for centuries."
 dod_arc.33.f:0 "The city in the clouds."
 dod_arc.33.a:0 "Magnificent!"
