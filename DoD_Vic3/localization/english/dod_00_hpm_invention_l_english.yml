l_english:
 post_napoleonic_army_doctrine:0 "Post-Wenceslian Army Doctrine"
 post_napoleonic_army_doctrine_desc:0 "'The German Revolution and the Wenceslian Wars that followed revolutionized military strategy. With the advent of cheap small arms and the rise of the drafted citizen soldier, armies grew rapidly in size to become massed formations. This necessitated dividing the army first into divisions and later into corps. Along with divisions came divisional artillery"
