l_english:
 je_dod_colombian_independence:0 "The Colombian War of Independence"
 je_dod_colombian_independence_reason:0 "In 1835 the Columbian Alliance fleet was smashed off Havana, and Spain has invaded the mainland once more. Mexico has seized control of the Alliance and proclaimed Gran Colombia. Drive the Spanish from the mainland and make peace."
 je_dod_congress_of_mexico:0 "The Congress of Mexico"
 je_dod_congress_of_mexico_reason:0 "Delegates from every province of Gran Colombia are debating the constitution. Every compromise holds the federation together; every quarrel pushes the provinces apart. In a year, the Congress will decide."
 dod_declare_colombian_independence:0 "Expel the Spanish"
 dod_declare_colombian_independence_desc:0 "Every Colombian land still held by Spain, from the mainland to Cuba, must be liberated."
 dod_treaty_of_habana:0 "The Treaty of Habana"
 dod_treaty_of_habana_desc:0 "Gran Colombia is lost. Recognising its independence would at least restore our trade."
 dod_colombian_empire:0 "Form the Colombian Empire"
 dod_colombian_empire_desc:0 "The republic has failed us. A Colombian Emperor will hold the nation together."
 dod_colombian_claims:0 "Restore Gran Colombia"
 dod_colombian_claims_desc:0 "Mesoameriga, Lusitania and Granada were all part of Gran Colombia. They must return."
 dod_colombian_unity_congress:0 "Embrace Colombian Unity"
 dod_colombian_unity_congress_desc:0 "The successor states of Gran Colombia should come together again in a second Congress."
 dod_form_mexico:0 "Force Our Rule over Mexico City"
 dod_form_mexico_desc:0 "Whoever holds Mexico City holds Mexico."
 dod_form_usca:0 "Form the United Provinces of Mesoameriga"
 dod_form_usca_desc:0 "The Central American provinces must unite."
 dod_form_granada:0 "Form Granada"
 dod_form_granada_desc:0 "We have united the former Spanish colonies of the south. We can proclaim the state of Granada."
 dod_reclaim_granada:0 "Reclaim Granada from the Incas"
 dod_reclaim_granada_desc:0 "The Incas have conquered half of Granada. It is time to beat them back."
 dod_aztec_legacy:0 "The Legacy of the Aztec Empire"
 dod_aztec_legacy_desc:0 "Tenochtitlan once ruled all of Anahuac. Its heirs can do so again."
 dod_league_of_mayapan:0 "Reform the League of Mayapan"
 dod_league_of_mayapan_desc:0 "The Maya city-states once stood together. They can again."
 dod_zapotec_heritage:0 "Reclaim the Zapotec Heritage"
 dod_zapotec_heritage_desc:0 "From Lyobaa to Monte Alban, the Zapotec heritage is ours."
 dod_mesoamerican_unity:0 "Reform the League of Cemanahuac"
 dod_mesoamerican_unity_desc:0 "The peoples of Anahuac must stand together against the Mexicanos."
 dod_inca_empire:0 "An Empire of the Sun God"
 dod_inca_empire_desc:0 "Tawantinsuyu once stretched from Quito to the Maule. It shall do so again."
 dod_inca_mining:0 "The Riches of Our Earth"
 dod_inca_mining_desc:0 "The silver and gold of the Andes must serve the children of the Sun."
 dod_colombian_mobilisation:0 "Colombian Mobilisation"
 dod_colombian_mobilisation_desc:0 "The whole nation fights for independence."
 dod_colombian_unity:0 "Colombian Unity"
 dod_colombian_unity_desc:0 "Gran Colombia stands united."
 dod_colombia_divided:0 "Colombia Divided"
 dod_colombia_divided_desc:0 "The federation has broken apart."
 dod_villa_arrested:0 "Villa Arrested"
 dod_villa_arrested_desc:0 "The coup was stopped in time."
 dod_military_regime:0 "Military Regime"
 dod_military_regime_desc:0 "The generals rule."
 dod_colombian_repression:0 "Repression"
 dod_colombian_repression_desc:0 "The revolution was crushed."
 dod_almasi_victory:0 "Almasi Victory"
 dod_almasi_victory_desc:0 "The slaves have won their freedom."
 dod_almasi_crushed:0 "Almasi Crushed"
 dod_almasi_crushed_desc:0 "The slave revolt was crushed."
 dod_chapultepec:0 "Chapultepec"
 dod_chapultepec_desc:0 "The restored castle symbolises the nation."
 dod_maya_cities:0 "Lost Maya Cities"
 dod_maya_cities_desc:0 "The ruins of the Maya astonish the world."
 dod_cargo_respected:0 "Cargo System"
 dod_cargo_respected_desc:0 "Village traditions are respected."
 dod_cargo_abolished:0 "Cargo System Disempowered"
 dod_cargo_abolished_desc:0 "The old village hierarchy is broken."
 dod_mixe_coffee:0 "Mixe Coffee"
 dod_mixe_coffee_desc:0 "Coffee plantations spread in the highlands."
 dod_vanilla_decline:0 "Vanilla Decline"
 dod_vanilla_decline_desc:0 "The vanilla trade is collapsing."
 dod_inca_schools:0 "Incan Schools"
 dod_inca_schools_desc:0 "Schools teach the children of the Sun."
 dod_inca_riches:0 "Riches of the Andes"
 dod_inca_riches_desc:0 "The mines of the Andes enrich the empire."
 dod_clm.1.t:0 "Fight for Freedom!"
 dod_clm.1.d:0 "The Spanish have landed again, hoping to crush Gran Colombia before it can stand on its own. From Mexico to Granada, every province is called to arms."
 dod_clm.1.f:0 "Libertad!"
 dod_clm.1.a:0 "Libertad!"
 dod_clm.2.t:0 "The End of the Colonial War"
 dod_clm.2.d:0 "The Spanish armies have withdrawn, and Gran Colombia is free. Now the hardest question begins: what kind of nation will we be? Delegates from every province are gathering in Mexico to decide."
 dod_clm.2.f:0 "A nation is born."
 dod_clm.2.a:0 "Open the Congress of Mexico."
 dod_clm.10.t:0 "The Conditions of the Church"
 dod_clm.10.d:0 "The Church owns vast estates and runs every school in the land. Liberals want its privileges abolished; conservatives warn that the faithful will rise."
 dod_clm.10.f:0 "The Congress debates."
 dod_clm.10.a:0 "Keep the Church's privileges."
 dod_clm.10.b:0 "Abolish its privileges."
 dod_clm.11.t:0 "The Colombian Army"
 dod_clm.11.d:0 "The generals who won independence expect a voice in government. The provinces fear a central army that could crush them."
 dod_clm.11.f:0 "The Congress debates."
 dod_clm.11.a:0 "A strong national army."
 dod_clm.11.b:0 "Provincial militias."
 dod_clm.12.t:0 "The Status of the Indios"
 dod_clm.12.d:0 "The native peoples fought on both sides of the war. Should they become full citizens, or keep their separate republics and tribute?"
 dod_clm.12.f:0 "The Congress debates."
 dod_clm.12.a:0 "Equal citizenship for all."
 dod_clm.12.b:0 "Keep the Indian republics."
 dod_clm.13.t:0 "The Abolition of Slavery"
 dod_clm.13.d:0 "Abolitionists demand an end to slavery in the new republic. The plantation provinces threaten to walk out if it passes."
 dod_clm.13.f:0 "The Congress debates."
 dod_clm.13.a:0 "Abolish slavery."
 dod_clm.13.b:0 "Leave it to the provinces."
 dod_clm.14.t:0 "Riots in the Capital"
 dod_clm.14.d:0 "Riots have broken out between federalists and centralists in the streets around the Congress."
 dod_clm.14.f:0 "The Congress debates."
 dod_clm.14.a:0 "Restore order."
 dod_clm.14.b:0 "Let the people speak."
 dod_clm.15.t:0 "The Congress of Mexico Closes"
 dod_clm.15.d_united:0 "The Congress of Mexico has done the impossible: the provinces have agreed on a constitution for a united Gran Colombia, from the Rio Grande to the Andes."
 dod_clm.15.d_partial:0 "The Congress has held most of the federation together, but the Central American provinces have walked out and proclaimed the United Provinces of Salvador."
 dod_clm.15.d_failure:0 "The Congress has collapsed. Mesoameriga, Granada and Lusitania have each gone their own way, and what remains is no longer Gran Colombia but Mexico."
 dod_clm.15.f:0 "The fate of Gran Colombia."
 dod_clm.15.a:0 "So be it."
 dod_clm.20.t:0 "The Military-Clergy Alliance"
 dod_clm.20.d:0 "The generals and the bishops have found common cause against the liberal government. General Tomás Villa is said to be preparing a coup."
 dod_clm.20.f:0 "Coup, or constitution?"
 dod_clm.20.a:0 "Arrest Villa before he moves."
 dod_clm.20.b:0 "The army has saved the nation before."
 dod_clm.21.t:0 "La Revolución Gloriosa!"
 dod_clm.21.d:0 "The people of Mexico have risen against the military regime. Barricades fill the streets of the capital, and the regiments are refusing to fire on the crowds."
 dod_clm.21.f:0 "The end of the dictatorship?"
 dod_clm.21.a:0 "Restore the constitution!"
 dod_clm.21.b:0 "Crush the revolution!"
 dod_clm.22.t:0 "The New African Messiah"
 dod_clm.22.d:0 "In the plantations of the coast, a former slave called Father Ibrahima preaches the coming of a Day of the Lord, when the slaves will be free. Thousands flock to hear him."
 dod_clm.22.f:0 "The Almasi stir."
 dod_clm.22.a:0 "Abolish slavery before it is too late."
 dod_clm.22.b:0 "Send the troops to the plantations."
 dod_clm.23.t:0 "The Almasi Revolt"
 dod_clm.23.d_won:0 "The Almasi revolt has swept the coast. The government has had no choice but to abolish slavery, and Father Ibrahima is hailed as a liberator."
 dod_clm.23.d_lost:0 "The slave revolt has been crushed. Father Ibrahima is dead, and the plantations are quiet, for now."
 dod_clm.23.f:0 "The Day of the Lord."
 dod_clm.23.a:0 "So be it."
 dod_clm.24.t:0 "The Caste War"
 dod_clm.24.d:0 "Demographic pressure, the conscription of the Indios and the end of the Indian republics have pushed the native peoples to revolt. The League of Cemanahuac has been proclaimed in the Nahua lands."
 dod_clm.24.f:0 "Emancipation, or repression?"
 dod_clm.24.a:0 "Emancipate the Indios."
 dod_clm.24.b:0 "Crush the uprising."
 dod_clm.25.t:0 "The Castle of Chapultepec"
 dod_clm.25.d:0 "The old viceregal castle on the hill of Chapultepec has been restored as the residence of the head of state, a symbol of the new nation's grandeur."
 dod_clm.25.f:0 "A palace for the nation."
 dod_clm.25.a:0 "Magnificent."
 dod_clm.30.t:0 "The Rediscovery of the Maya Cities"
 dod_clm.30.d:0 "Explorers hacking through the jungle of Yucatan have uncovered the ruins of Uxmal, Chichen Itza and Mayapan. The Maya are proud; the world is astonished."
 dod_clm.30.f:0 "The cities of the ancestors."
 dod_clm.30.a:0 "Fund the expeditions."
 dod_clm.31.t:0 "The Cargo System"
 dod_clm.31.d:0 "In the Mixe and Zapotec villages, the cargo system binds every family to serve the community and the saints. It keeps the villages together, but also keeps them poor."
 dod_clm.31.f:0 "Tradition, or progress?"
 dod_clm.31.a:0 "Respect the cargo system."
 dod_clm.31.b:0 "Disempower it."
 dod_clm.32.t:0 "Coffee in the Mixe Lands"
 dod_clm.32.d:0 "Coffee plantations are spreading through the Mixe highlands, enriching some families and dispossessing others."
 dod_clm.32.f:0 "Green gold."
 dod_clm.32.a:0 "Encourage the plantations."
 dod_clm.32.b:0 "Protect the communal lands."
 dod_clm.33.t:0 "The Decline of the Vanilla Trade"
 dod_clm.33.d:0 "Synthetic vanilla is ruining the Totonac growers who supplied the world for centuries."
 dod_clm.33.f:0 "Beyond vanilla."
 dod_clm.33.a:0 "We must find new trades."
 dod_clm.40.t:0 "The Inauguration of Pachacuti II"
 dod_clm.40.d:0 "The new Sapa Inca, Pachacuti II, has taken the throne with grand ambitions: to modernise Tawantinsuyu and gather all the Quechua under the Sun."
 dod_clm.40.f:0 "A new Pachacuti."
 dod_clm.40.a:0 "Hail the Sapa Inca!"
 dod_clm.41.t:0 "Pachacuti II's Educational Reforms"
 dod_clm.41.d:0 "Schools are being built across the Andes, teaching in both Quechua and Spanish."
 dod_clm.41.f:0 "Knowledge for the children of the Sun."
 dod_clm.41.a:0 "A wise policy."
 dod_clm.42.t:0 "Our Brothers in Cusco"
 dod_clm.42.d:0 "Many Quechua still live under foreign rule. Pachacuti II has declared that all the children of the Sun must be free."
 dod_clm.42.f:0 "All the Quechua under the Sun."
 dod_clm.42.a:0 "Claim the Quechua lands!"
 dod_clm.42.b:0 "Not yet."
 dod_clm.50.t:0 "The Question of Pará"
 dod_clm.50.d:0 "The left bank of the Amazon, around Pará, is claimed by both Amazonie and its Hispanic neighbours. The dispute is poisoning relations."
 dod_clm.50.f:0 "Who owns the river?"
 dod_clm.50.a:0 "Press our claim."
 dod_clm.50.b:0 "Let the matter rest."
 dod_clm.16.t:0 "The Second Congress of Colombian Unity"
 dod_clm.16.d:0 "The successor states of Gran Colombia have gathered for a second Congress, and Gran Colombia has been proclaimed anew. Its delegates invite us to rejoin the federation."
 dod_clm.16.f:0 "One Colombia, again?"
 dod_clm.16.a:0 "Viva Colombia! We rejoin the federation."
 dod_clm.16.b:0 "We will keep our independence."
