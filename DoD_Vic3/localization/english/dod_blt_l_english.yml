l_english:
 dod_abolish_courland:0 "Abolish the Duchy of Courland"
 dod_abolish_courland_desc:0 "Courland became a vassal of the Scandinavian Crown after the conquest of Livland and the withdrawal of the Commonwealth. It is time to end its autonomy."
 dod_annex_kurland:0 "The Annexation of Courland"
 dod_annex_kurland_desc:0 "The last obstacle to our domination of the Baltic is the little state of Courland. We have let it pursue its own policy for too long."
 dod_dominium_maris_baltici:0 "Dominium Maris Baltici"
 dod_dominium_maris_baltici_desc:0 "The greatest ambition of the Kalmar Union has always been complete control of the Baltic Sea."
 dod_take_lithuania:0 "Take Control of Lithuania"
 dod_take_lithuania_desc:0 "With the rest of the Baltic coast in our hands, it is time to take Lithuania from the Poles."
 dod_nordtyskland:0 "Nordtyskland"
 dod_nordtyskland_desc:0 "Despite all their efforts, the Bohemians could not stop us. We hold much of northern Germany, and it is our duty to accept the Elbian people as full members of the Union."
 dod_plc_act_of_union:0 "The New Act of Union"
 dod_plc_act_of_union_desc:0 "The Commonwealth has decayed for a century: a paralysed Sejm, foreign meddling and weak government nearly broke it apart. A new Union of Lublin can save it."
 dod_plc_baltic_peoples:0 "The Baltic Peoples"
 dod_plc_baltic_peoples_desc:0 "The Livonians and Estonians never knew independence, fought over by the Commonwealth and Scandinavia. Unlike the Scandinavians, we will treat them as equals."
 dod_plc_hadiach:0 "The Treaty of Hadiach"
 dod_plc_hadiach_desc:0 "The Ruthenians are the largest people of the Commonwealth after the Poles. It is time to make them a third nation of the Union."
 dod_romanian_transnistria:0 "Romanian Transnistria"
 dod_romanian_transnistria_desc:0 "The Dniester was never a fixed border for the Romanian people. Many Moldavians crossed it to settle beyond."
 dod_rus_cossacks:0 "Negotiate with the Cossacks"
 dod_rus_cossacks_desc:0 "The Cossacks hold vast lands in the Commonwealth and obey Warsaw only on paper. We can use our influence to win them over."
 dod_rus_annex_ruthenia:0 "Annexation of Ruthenia"
 dod_rus_annex_ruthenia_desc:0 "An independent Ruthenia does not serve Mother Russia. It is time to integrate it fully."
 dod_livonian_confederation:0 "The Livonian Confederation"
 dod_livonian_confederation_desc:0 "After centuries of foreign oppression, the Baltic peoples are united under our flag. Let us proclaim a state for all Baltic citizens."
 dod_reform_grand_duchy:0 "Reform the Grand Duchy"
 dod_reform_grand_duchy_desc:0 "The Grand Duchy of Lithuania was one of the mightiest nations of Eastern Europe before it joined the Commonwealth. With the Commonwealth fallen, it can rise again."
 dod_commonwealth_dissolved:0 "Commonwealth Dissolved"
 dod_commonwealth_dissolved_desc:0 "The peoples of the Commonwealth have gone their own way."
 dod_lublin_renewed:0 "Union of Lublin Renewed"
 dod_lublin_renewed_desc:0 "The Commonwealth has reformed itself."
 dod_baltic_dominion:0 "Dominium Maris Baltici"
 dod_baltic_dominion_desc:0 "The Baltic is a Scandinavian sea."
 dod_grand_duchy_reformed:0 "Grand Duchy Reformed"
 dod_grand_duchy_reformed_desc:0 "Lithuania has risen again."
 dod_blt.2.t:0 "Crimean Lands to Kiev"
 dod_blt.2.d:0 "To better defend our new southern lands from Turkish, Tatar or Russian invasion, we will place them under the authority of the Cossack Hetmanate in Kiev."
 dod_blt.2.f:0 "Seems legit."
 dod_blt.2.a:0 "Seems legit."
 dod_blt.3.t:0 "Russian Overtures"
 dod_blt.3.d:0 "Russia has been courting the Cossack host for years, and now offers its protection if we break with Warsaw. The Commonwealth has rarely been able to defend us."
 dod_blt.3.f:0 "Moscow, or Warsaw?"
 dod_blt.3.a:0 "If only the Commonwealth could defend us... Accept."
 dod_blt.3.b:0 "We stay loyal to the Commonwealth."
 dod_blt.5.t:0 "The Dissolution of the Commonwealth"
 dod_blt.5.d:0 "The Commonwealth's failure to reform has fed the rise of nationalist movements. Lithuanians, Cossacks and Ruthenians have all proclaimed their own governments, and Warsaw no longer has the strength to stop them."
 dod_blt.5.f:0 "Why does this always happen to Poland..."
 dod_blt.5.a:0 "Why does this always happen to Poland..."
 dod_blt.6.t:0 "Ruthenian Unification?"
 dod_blt.6.d:0 "The collapse of the Commonwealth gives the Ruthenian people a chance, but only if we stand united against the Polish threat."
 dod_blt.6.f:0 "United we stand."
 dod_blt.6.a:0 "We'll negotiate with the Byelorussians."
 dod_blt.6.b:0 "Not now."
 dod_blt.7.t:0 "The Cossack Proposal"
 dod_blt.7.d:0 "The Hetman of the Cossacks wants us to rally to his government in Kiev to protect Ruthenian liberties from the Polish jingoists. But it could cost us our own voice."
 dod_blt.7.f:0 "Unite with the Cossacks?"
 dod_blt.7.a:0 "We must unite with the Cossacks!"
 dod_blt.7.b:0 "We are better on our own!"
 dod_blt.8.t:0 "Flight from Copenhagen"
 dod_blt.8.d:0 "Our glorious capital is in a desperate position, and the Danish heartland is lost. The court must look to its other lands."
 dod_blt.8.f:0 "It is just a temporary setback..."
 dod_blt.8.a:0 "It is just a temporary setback..."
