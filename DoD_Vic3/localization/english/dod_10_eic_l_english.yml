l_english:
 EIC:0 "East India Company"
 EIC_ADJ:0 "Company"
 UTI:0 "Territory Exchange"
 EVTDESC9990001:0 "Our recently conquered territory has been fully integrated into our administration."
 EVTDESC9990002:0 "The unfortunate rebellion has left our administration in the gutter in Parliament's mind and a bill has recently passed liquidating the company, they now seek to seize all of our holdings for the Crown."
 EVTDESC9990004:0 "The East India Company, in a rare show of good sense has agreed to step away from India, what's theirs is now ours and a glorious day for the Empire has dawned."
 EVTDESC9990005:0 "The British armies have been sent packing and we are now free to do with India as we see fit, our shareholders have moved to Calcutta and all of our affairs our strictly our own. Long live the East India Company!"
 EVTDESC9990007:0 "Recent events in Calcutta have undermined the East India Company's loyalty to the Crown in matters of trade and the British monopoly on Indian goods is in danger, swift action must be taken to mend this."
 EVTDESC9990008:0 "Parliament is understandably displeased with our recent change in policy and they now seek to undermine our rights and liquidate the company, clearly it is time for us to reevaluate our loyalties."
 EVTDESC9990009:0 "A Ship has arrived in Calcutta today carrying some delightful fruits of British ingenuity, we must put it to use straight away."
 government_of_india_act:0 "Government of India Act"
 government_of_india_act_title:0 "Government of India Act"
 government_of_india_act_desc:0 "The recent rebellion in India has exposed structural weaknesses and inefficiencies in Company rule, for the good of the Indians and Empire we must liquidate the East India Company and bring their holdings under Crown rule."
 mughal_declaration_eic_title:0 "Declare a Jihad Against the British"
 mughal_declaration_eic_desc:0 "Unrest dominates the territory of the former Mughal Empire, now controlled by the British. There are calls for jihad by Muslim leaders like Maulana Fazl-e-Haq Khairabadi and the millenarian Ahmedullah Shah, which were taken up by Muslims, particularly artisans, which caused the British to think that the Muslims were the main force behind this unrest. The Mughal emperor, Bahadur Shah, resisted these calls for jihad because, it has been suggested, he feared outbreaks of communal violence. By abiding to these calls, expelling the British from Delhi and declaring a Jihad, by shaking off the British influence and dominance, the Shah can be acclaimed Emperor of India, his rightful title."
