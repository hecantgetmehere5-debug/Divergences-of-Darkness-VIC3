l_english:
 dod_boer_unification:0 "Boer Unification"
 dod_boer_unification_desc:0 "The Boer republics must unite to survive."
 dod_form_south_africa:0 "Form South Africa"
 dod_form_south_africa_desc:0 "From the Cape to the Limpopo, South Africa must be one."
 dod_bastaard_question:0 "The Bastaard Question"
 dod_bastaard_question_desc:0 "The mixed-race Bastaard communities should be full citizens."
 dod_greater_griqualand:0 "Establish Greater Griqualand"
 dod_greater_griqualand_desc:0 "The Griqua can carve out a greater homeland."
 dod_kongo_missionaries:0 "Invite Catholic Missionaries"
 dod_kongo_missionaries_desc:0 "Kongo has been Catholic for centuries. New missionaries would bring schools and learning."
 dod_kongo_empire:0 "Proclaim the Kongo Empire"
 dod_kongo_empire_desc:0 "The Kongo must be united again."
 dod_kongo_integrate:0 "Integrate Our Brothers"
 dod_kongo_integrate_desc:0 "The peoples of the Congo basin are our brothers."
 dod_dahomey_independence:0 "Refuse Status as Tributary"
 dod_dahomey_independence_desc:0 "Dahomey will pay tribute to no one."
 dod_dahomey_expansion:0 "Expand into the Ewe Lands"
 dod_dahomey_expansion_desc:0 "The Ewe and Akan lands lie open to Dahomey."
 dod_dahomey_schools:0 "Establish New Schools"
 dod_dahomey_schools_desc:0 "Dahomey needs educated officials."
 dod_forge_caliphate:0 "Forge the Caliphate"
 dod_forge_caliphate_desc:0 "The Fulbe and Hausa lands must unite under the Caliph of Sokoto."
 dod_restore_solomonic:0 "Restore the Solomonic Dynasty"
 dod_restore_solomonic_desc:0 "The heirs of Solomon must rule all Ethiopia again."
 dod_ethiopia_imperial_lands:0 "Reclaim the Imperial Lands"
 dod_ethiopia_imperial_lands_desc:0 "Every land once ruled by the Emperors shall return."
 dod_liberate_nubia:0 "Liberate the Kingdom of Nubia"
 dod_liberate_nubia_desc:0 "The Christian kingdoms of Nubia were our brothers."
 dod_greater_adal:0 "The Greater Sultanate of Adal"
 dod_greater_adal_desc:0 "The Somali, Afar and Harari peoples must stand together."
 dod_proclaim_abyssinia:0 "Proclaim Abyssinia"
 dod_proclaim_abyssinia_desc:0 "The Horn of Africa shall be one empire."
 dod_organize_new_zealand:0 "Organise New Zealand"
 dod_organize_new_zealand_desc:0 "The settler colonies of the south can govern themselves as a dominion."
 dod_accept_maoris:0 "Accept the Maori"
 dod_accept_maoris_desc:0 "The Maori should be full citizens."
 dod_form_polynesia:0 "Unite the Polynesians"
 dod_form_polynesia_desc:0 "The islands of Polynesia must be one nation."
 dod_polynesia_micronesians:0 "Embrace the Micronesians"
 dod_polynesia_micronesians_desc:0 "The Micronesian and Melanesian islands belong with Polynesia."
 dod_organize_maghreb:0 "Organise the Maghreb"
 dod_organize_maghreb_desc:0 "Our North African colonies could govern themselves as dominions."
 dod_vereeniging:0 "Treaty of Vereeniging"
 dod_vereeniging_desc:0 "Peace has come to South Africa."
 dod_highland_forts:0 "Highland Forts"
 dod_highland_forts_desc:0 "The highlands are fortified against raids."
 dod_oromo_war:0 "Oromo War"
 dod_oromo_war_desc:0 "The Oromo uprising drags on."
 dod_adal_fallen:0 "Adal Fallen"
 dod_adal_fallen_desc:0 "Ethiopia's ancient enemy is no more."
 dod_kongo_revival:0 "Kongo Revival"
 dod_kongo_revival_desc:0 "Kongo dreams of its old glory."
 dod_african_schools:0 "New Schools"
 dod_african_schools_desc:0 "Schools train a new class of officials."
 dod_catholic_missions:0 "Catholic Missions"
 dod_catholic_missions_desc:0 "Missionaries bring schools and learning."
 dod_afr.1.t:0 "The Burgundian Menace"
 dod_afr.1.d:0 "The Boers have trekked beyond the reach of the Cape and founded their own republics. Burgundy considers them rebels, and the Boer states are a thorn in the side of its African empire."
 dod_afr.1.f:0 "Bring the Boers to heel?"
 dod_afr.1.a:0 "Send an ultimatum to the Boer republics."
 dod_afr.1.b:0 "Let them be."
 dod_afr.2.t:0 "The Burgundian Ultimatum"
 dod_afr.2.d:0 "Burgundy demands that we accept its authority. Our fathers trekked into the wilderness to escape Antwerp's rule."
 dod_afr.2.f:0 "Submit, or fight?"
 dod_afr.2.a:0 "We will fight!"
 dod_afr.2.b:0 "We cannot resist Burgundy."
 dod_afr.3.t:0 "A Negative Answer"
 dod_afr.3.d:0 "The Boers have refused our authority."
 dod_afr.3.f:0 "Then we will take it."
 dod_afr.3.a:0 "Then we will take it."
 dod_afr.3.b:0 "Let them go."
 dod_afr.4.t:0 "The Xhosa and Zulu Tribes"
 dod_afr.4.d:0 "Beyond our frontier live the Xhosa and the mighty Zulu. Our trekkers covet their grazing lands."
 dod_afr.4.f:0 "The frontier calls."
 dod_afr.4.a:0 "Claim their lands."
 dod_afr.4.b:0 "Live in peace with them."
 dod_afr.5.t:0 "The Treaty of Vereeniging"
 dod_afr.5.d:0 "The war between Burgundy and the Boers is over. A treaty has been signed at Vereeniging that will shape South Africa for generations."
 dod_afr.5.f:0 "Peace in South Africa."
 dod_afr.5.a:0 "Peace at last."
 dod_afr.10.t:0 "The Amatsa"
 dod_afr.10.d:0 "The Amatsa, the raids of the Adal Sultanate into the Ethiopian highlands, have resumed. The Sultan's horsemen burn churches and carry off captives."
 dod_afr.10.f:0 "The old enemy returns."
 dod_afr.10.a:0 "Drive them back!"
 dod_afr.10.b:0 "Fortify the highlands."
 dod_afr.11.t:0 "The Oromo Uprising"
 dod_afr.11.d:0 "The Oromo, long caught between the Ethiopian Emperor and the Adal Sultan, have risen against both."
 dod_afr.11.f:0 "The Oromo rise."
 dod_afr.11.a:0 "Crush the uprising."
 dod_afr.11.b:0 "Grant the Oromo a place in the realm."
 dod_afr.12.t:0 "The Fall of the Adal Sultanate"
 dod_afr.12.d:0 "The Adal Sultanate, Ethiopia's ancient enemy, is no more. The Horn of Africa is ours."
 dod_afr.12.f:0 "The Amatsa are over."
 dod_afr.12.a:0 "Glory to the Emperor!"
 dod_afr.20.t:0 "El Hadj Umar Tall"
 dod_afr.20.d:0 "El Hadj Umar Tall, a Tukulor scholar returned from Mecca, preaches a jihad to purify the faith and unite the peoples of the upper Niger."
 dod_afr.20.f:0 "The jihad of the Tukulor."
 dod_afr.20.a:0 "Join the jihad!"
 dod_afr.20.b:0 "This preacher is dangerous."
 dod_afr.21.t:0 "The Fate of Our Future"
 dod_afr.21.d:0 "Kongo was once the greatest kingdom of Central Africa. Civil wars and the slave trade have broken it apart, but some at court dream of restoring its glory."
 dod_afr.21.f:0 "The Manikongo's dream."
 dod_afr.21.a:0 "Kongo will rise again!"
 dod_afr.22.t:0 "The Question of Faith"
 dod_afr.22.d:0 "Missionaries of every creed are competing for the soul of Dahomey. The King must choose."
 dod_afr.22.f:0 "Which faith for Dahomey?"
 dod_afr.22.a:0 "Embrace Islam."
 dod_afr.22.b:0 "Embrace Catholicism."
 dod_afr.22.c:0 "Embrace Protestantism."
 dod_afr.22.opt_d:0 "Keep the faith of our ancestors."
 dod_afr.30.t:0 "The Treaty of Waitangi"
 dod_afr.30.d:0 "The Maori chiefs have been asked to sign a treaty recognising European sovereignty, in exchange for guarantees over their lands, forests and fisheries. The Maori and European versions of the treaty say very different things."
 dod_afr.30.f:0 "What exactly did we sign?"
 dod_afr.30.a:0 "Sign the treaty."
 dod_afr.30.b:0 "The land is not for sale."
