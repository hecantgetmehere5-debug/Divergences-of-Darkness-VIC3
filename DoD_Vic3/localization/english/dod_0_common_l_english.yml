 pan_nationalist_rebels_name:0 "$UNION_ADJ$ Pan-Nationalists"
 pan_nationalist_rebels_desc:0 "Pan-nationalist rebels seek to unify, in a free and independent nation-state, with their perceived cultural kin. Driven by the ideals of the romantic nationalist movement, their sense of belonging to the land for which they fight makes them determined and tenacious threats to peace and order."
