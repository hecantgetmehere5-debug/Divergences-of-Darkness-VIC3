 anarcho_liberal:0 "Anarcho Liberal"
 anarcho_liberal_uh:0 "Anarcho-Liberals want to see social reforms rolled back, and will never support further reforms of any kind."
 social_liberal:0 "Social Liberal"
 social_liberal_uh:0 "The 'New Liberals', as they are sometimes called, are a new breed of liberals who are in favor of both political as well as social reform."
 minor_group:0 "Minor parties"
 separatist:0 "Separatist"
 separatist_uh:0 "Separatists have abandoned all attempts at national improvement. They only want independence, and will vote against all reforms."
 subordinate:0 "Subordinate"
 subordinate_uh:0 "These are slaves who are compliant and willing to work with the system. They are unlikely to rebel, but contribute nothing to the country's political system."
