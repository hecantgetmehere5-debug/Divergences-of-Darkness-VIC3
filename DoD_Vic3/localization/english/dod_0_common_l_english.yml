 integration_venice:0 "Integrating Venice"
 integration_venice_desc:0 "We are currently integrating the Venetians."
 stroganov_romanov:0 "Roman Stroganov-Romanov"
 stroganov_romanov_desc:0 "Roman Stroganov-Romanov, nicknamed the Steppe Baron ought to transform the Steppes to avoid that they end up destroyed by the Western World. He is ruthless but admired by the common folk"
 dahomey_amazons:0 "The Dahomey Amazons"
 dahomey_amazons_desc:0 "The Dahomey Amazons are now an official, female corp that fights in the army."
