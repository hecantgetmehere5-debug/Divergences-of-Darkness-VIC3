 GC_DESC:0 "Ever since the end of the Great German War, the ideals of freedom and nationhood cherished by the German rebels seem buried. In England, Holland or Brandenburg, the authority of foreign kings is uncontested. But the calm over Europe since the end of the war is an illusion: throughout the continent, the beginnings of industrialisation, the spread of new knowledge and a growing discontent amongst the population hints at changes to come. In Arcadia and Ameriga, young powers are emerging to challenge those in the old world, and in supposedly sleeping Asia, old nations are reinventing themselves..."
 REMOVE_GC_DESC:0 "The dust has settled on the fields of Waterloo, where the ideals of the French Revolution were believed to have met their final demise at the hands of the Ancien Régimes of Europe. After the tribulations of Napoleon's wars, the consensus established at the Congress of Vienna has restored a tentative calm to a troubled continent. While the flames of revolution may have been put out for now, the ideas of human liberty, nationalism and liberalism will soon prove themselves more alive than ever. In the Americas, those same ideas threaten to plunge a young republic into the devastation of a civil war. Princess Victoria is 16 years old, and will soon ascend to the throne of Great Britain, the greatest industrial empire ever to span the globe. Her acension, to a long and prosperous reign, marks the beginning of an age that is to last all the way up until the First World War. In this new era of unprecedented technological progress, doubts will be cast on certainties that have stood since time immemorial, and new dogmas will rise in their place. Far away, across the briny foam, the riches of Asia and Africa, and The Heart of Darkness, beckon that their songs may also be heard, in the Concert of Europe. Maestro, choose your instrument, and let the music play."
