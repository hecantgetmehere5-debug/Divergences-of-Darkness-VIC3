l_english:
 aeroplane_factory:0 "Aeroplane Factory"
 barrel_factory:0 "Barrel Factory"
 automobile_factory:0 "Automobile Factory"
 radio_factory:0 "Radio Factory"
 telephone_factory:0 "Telephone Factory"
 electric_gear_factory:0 "Electric Gear Factory"
 machine_parts_factory:0 "Machine Parts Factory"
 steamer_shipyard:0 "Steamer Shipyard"
 clipper_shipyard:0 "Clipper Shipyard"
 artillery_factory:0 "Steel Artillery Factory"
 small_arms_factory:0 "Small Arms Factory"
 explosives_factory:0 "Explosives Factory"
 ammunition_factory:0 "Ammunition Factory"
 paper_mill:0 "Paper Mill"
 cement_factory:0 "Cement Factory"
 glass_factory:0 "Glass Factory"
 fertilizer_factory:0 "Fertilizer Factory"
 luxury_clothes_factory:0 "Luxury Clothes Factory"
 luxury_furniture_factory:0 "Luxury Furniture Factory"
 furniture_factory:0 "Furniture Factory"
 winery:0 "Winery"
 bank:0 "Bank"
 bank_desc:0 "Banking institutions are financial intermediaries that accept deposits and channel those deposits into lending activities, either directly or through capital markets."
 stock_exchange:0 "Stock Exchange"
 stock_exchange_desc:0 "Stock exchanges provide a market for the brokerage and trade of stocks and secrities. They generally offer a wide range of different financial securities."
 Petrolium-based_powerplant:0 "Petroleum-Based Power Plant"
 Petrolium-based_powerplant_desc:0 "As coal can be burned in a power plant to produce electricity, so can petroleum."
 fort:0 "Fort"
 naval_base:0 "Naval Base"
 railroad:0 "Railroad"
 Coal-fired_powerplant:0 "Coal-Fired Power Plant"
 Coal-fired_powerplant_desc:0 "Most of the world's electricity is produced by burning coal in boilers, producing steam which drives the turbines that generate electricity."
 Cigar_factory:0 "Cigar Factory"
 Cigar_factory_desc:0 "Cigars still remain as a sign of luxury and stature since the discovery of tobacco in the Americas."
 Cigarette_factory:0 "Cigarette Factory"
 Cigarette_factory_desc:0 "Since cigars are expensive to manufacture, cigarettes have sprung up as a cheaper alternative for the masses."
 shoe_factory:0 "Shoe Factory"
 shoe_factory_desc:0 "With the Industrial Revolution, even age-old industries such as shoemaking have to secure a foothold in these turbulent times through standardization and assembly lines."
 boot_factory:0 "Boot Factory"
 boot_factory_desc:0 "This factory turns leather and iron fittings into boots, which are prized by the rich as a luxury."
 wool_mill:0 "Wool Mill"
 wool_mill_desc:0 "Wool was the traditional source of fabric until cotton was discovered during the Age of Sail. Despite this, wool is still widely used by the textile industry."
 fish_cannery:0 "Fish Cannery"
 fish_cannery_desc:0 "Fish was a extremely perishable foodstuff until the advent of the Industrial Revolution and its preserving techniques. When the first fish canneries began production, fish became a more accessible and long-lasting commodity."
 bakery:0 "Bakery"
 bakery_desc:0 "Bakeries have been the foundation of cities since time immemorial"
 stables:0 "Stables"
 stables_desc:0 "Cavalry remains the majority of any modern nation's army. Thus methods of raising horses that are capable of being used in war is of vital importance."
 pharmaceutical_plant:0 "Pharmaceutical Plant"
 pharmaceutical_plant_desc:0 "A plant in which modern medicines are created, must using opiates from eastern nations."
 rum_distillery:0 "Rum Distillery"
 rum_distillery_desc:0 "A distillery used to turn sugar into rum, first created in the New World but which quickly spread to other countries as sugar became more prevalent."
 gunpowder_factory:0 "Gunpowder Factory"
 gunpowder_factory_desc:0 "A factory used to create gunpowder for use in early firearms."
 bronze_artillery_factory:0 "Bronze Artillery Factory"
 bronze_artillery_factory_desc:0 "An upgraded factory creating the most modern designs of bronze artillery."
 iron_artillery_factory:0 "Iron Artillery Factory"
 iron_artillery_factory_desc:0 "An upgraded factory creating the most modern designs of iron artillery."
 fruit_cannery:0 "Fruit Cannery"
 fruit_cannery_desc:0 "A factory in which fruit is preserved and canned for consumption elsewhere."
 bronze_factory:0 "Bronze Factory"
 bronze_factory_desc:0 "A factory creating bronze alloy, most commonly used in artillery but also having applications in many other industries."
 early_small_arms_factory:0 "Early Small Arms Factory"
 early_small_arms_factory_desc:0 "An upgraded factory creating the most modern designs of small arms."
 late_small_arms_factory:0 "Late Small Arms Factory"
 late_small_arms_factory_desc:0 "An upgraded factory creating the most modern designs of small arms."
 advanced_machine_parts_factory:0 "Advanced Machine Parts Factory"
 advanced_machine_parts_factory_desc:0 "Machinery has become increasingly more sophisticated, and thus only specialized factories are able to produce the parts that are highly in demand."
 synthetic_rubber_factory:0 "Synthetic Rubber Plant"
 synthetic_rubber_factory_desc:0 "A plant in which artificial rubber is produced, reducing the nation's reliance on natural sources."
 tropical_lumber_mill:0 "Tropical Lumber Mill"
 tropical_lumber_mill_desc:0 "Harvesting lumber from tropical forest is a more complicated process, but results in a much wider variety of wood such as teak and mahogany."
 rubber_boot_factory:0 "Rubber Boot Factory"
 rubber_boot_factory_desc:0 "Not merely making boots,' these plants are used to produce a variety of clothing such as jackets, footwear and industrial protective gear."
 advanced_luxury_clothes_factory:0 "Advanced Luxury Clothes Factory"
 advanced_luxury_clothes_factory_desc:0 "A more advanced version of the regular luxury clothes factory, able to produce more complex clothes from a wider variety of exotic materials."
 advanced_luxury_furniture_factory:0 "Advanced Luxury Furniture Factory"
 advanced_luxury_furniture_factory_desc:0 "A more advanced version of the regular luxury furniture factory, able to produce more complex furniture from a wider variety of exotic materials."
 synthetic_fabric_factory:0 "Synthetic Fabric Factory"
 synthetic_fabric_factory_desc:0 "The development of new, durable synthetic fabrics has opened up a whole new industry to satisfy the demands of clothing manufacturers."
 sugar_beet_refinery:0 "Sugar Refinery"
 sugar_beet_refinery_desc:0 "The process of refining sugar beets into raw sugar has rapidly expanded the industry."
 newspaper:0 "Printing Press"
 newspaper_desc:0 "The availability of cheap paper and advances in printing press technology have spawned the creation of newsprint, bringing news and culture to a literate audience both locally and abroad. To many, this is the vehicle upon which propaganda and public awareness will be based in the years to come."
 synthetic_silk_factory:0 "Synthetic Silk Factory"
 synthetic_silk_factory_desc:0 "The creation of synthetic silk has reduced the reliance of textile factories upon natural sources, as well as reduced the cost of luxury clothing across the world."
 iron_machine_parts_factory:0 "Iron Machine Parts Factory"
 iron_machine_parts_factory_desc:0 "Machine parts are very important tools for every industrial plant. Iron and Coal are required to produce them."
 steel_machine_parts_factory:0 "Steel Machine Parts Factory"
 steel_machine_parts_factory_desc:0 "Machine parts are very important tools for every industrial plant. Steel and Coal are required to produce them."
 anarchic_bomb_throwers:0 "Anarchic Bomb Throwers"
 desc_anarchic_bomb_throwers:0 "Less money for crime fighting results in lowered ability to respond to security threats like anarchist uprisings."
 citizen_guard:0 "Citizen Guard"
 desc_citizen_guard:0 "Less money for crime fighting results in lowered ability to respond to security threats like battling street gangs."
 immoral_business:0 "Immoral Business"
 desc_immoral_business:0 "With rising crime rates and less government control, businessmen would become more and more centred on their own profits. This results in a higher risk of collapse for the entire system, as everybody strives for personal interests."
 mafia:0 "Mafia"
 desc_mafia:0 "If the crime fighting institutions in a province become overstretched, organized crime in form of a mafia would develop. Such organizations resulted in lowered productivity in the province."
 rotten_boroughs:0 "Rotten Boroughs"
 desc_rotten_boroughs:0 "The system of rotten boroughs was a system to create such small voting districts that a certain victory could be won through plain bribery."
 terrorist_cells:0 "Terrorist Cells"
 desc_terrorist_cells:0 "With less security personnel around in the province, terrorists have an easier time hiding and waiting for opportunities to strike."
 government_sanitarium:0 "Sanitarium"
 desc_government_sanitarium:0 "The Government operates a sanitarium for tuberculosis patients in this province."
 academic_confusion:0 "Academic Confusion"
 academic_confusion_desc:0 "Our academia is in a state of disarray, following a paradigm shift within our academic establishment. Our prestige and research will be hampered while the effect lasts."
 liberal_agitation:0 "Liberal Agitation"
 desc_liberal_agitation:0 "Firebrands are arguing the cause of liberalism and revolution."
 springtime_of_nations:0 "The Springtime of Nations!"
 springtime_of_nations_desc:0 "The slumbering nations of Europe awake to throw of the spectres of despotism and tyranny"
 global_liberal_agitation:0 "Liberal Agitation"
 desc_global_liberal_agitation:0 "Firebrands are arguing the cause of liberalism and revolution."
 potato_blight:0 "Potato Blight"
 desc_potato_blight:0 "Famine spreads as crops lie, dead and rotting, in our fields."
 anti_jacobin_tract:0 "Anti-Jacobin Tract"
 desc_anti_jacobin_tract:0 "A tract arguing the causes of counter-revolution, order, religion and monarchy has recieved widespread circulation in our country."
 cholera_epidemic_small:0 "Outbreak of Cholera"
 desc_cholera_epidemic_small:0 "Cholera has broken out in this province, and threatens to spread."
 cholera_epidemic_big:0 "Cholera Epidemic"
 desc_cholera_epidemic_big:0 "Cholera has broken out in this province, and threatens to spread."
 conservative_reaction:0 "Conservative Opposition"
 desc_conservative_reaction:0 "Conservatives in parliment are dissatisfied."
 liberal_reaction:0 "Liberal Opposition"
 desc_liberal_reaction:0 "Liberals in parliment are dissatisfied."
 national_tragedy:0 "National Tragedy"
 desc_national_tragedy:0 "Our nation mourns another young girl lost to the coal fields."
 western_influences:0 "Western Influences"
 desc_western_influences:0 "Our government pursues a policy of active encouragment of Western Influences."
 uncivilized_isolationism:0 "Isolationism"
 desc_uncivilized_isolationism:0 "Our country has closed its ports and borders to foreigners."
 western_presence:0 "Western Presence"
 desc_western_presence:0 "An expatriate community of foreigners, from various European countries and Great Powers, has formed here."
 foreign_smugglers:0 "Foreign Smugglers"
 desc_foreign_smugglers:0 "A smuggling ring run by foreigners operates in this province."
 foreign_trading_post:0 "Foreign Trading Post"
 desc_foreign_trading_post:0 "A separate class of our citizens, kept apart from the general populace, administer a trading post for foreigners in this province."
 silk_famine:0 "Silk Famine"
 desc_silk_famine:0 "A local outbreak of Pébrine prevents local silk farms from operating at full capacity"
 trade_restrictions:0 "Trade Restrictions"
 desc_trade_restrictions:0 "Our country has a policy of regulating and banning certain imports and exports."
 colonial_dry_spell:0 "Dry Spell"
 colonial_dry_spell_desc:0 "Very little rain has fallen in this province during the summer, and farms are suffering."
 colonial_exploitation:0 "Colonial Exploitation"
 colonial_exploitation_desc:0 "We are milking this province for all that it is worth."
 colonial_mismanagement:0 "Colonial Mismanagement"
 colonial_mismanagement_desc:0 "The small sums afforded the Colonial Office (Administration Spending) has meant that this colony has fallen into a state of bureaucratic disrepair."
 colonial_recruitment:0 "Land! Liberty! Labour!"
 colonial_recruitment_desc:0 "A government campaign is attracting immigrants to this province with promises of land and opportunities."
 baby_boom:0 "Baby Boom"
 loyal_askaris:0 "Gurkhas, Askaris & Tirailleurs"
 loyal_askaris_desc:0 "The people in this province are generally supportive of our rule, and several of them serve, or are willing to serve, in colonial military regiments"
 female_suffrage:0 "Woman's Suffrage"
 female_suffrage_desc:0 "Our country accords women legal equality with men, and the right to vote in general elections."
 labor_union:0 "Labor Union"
 desc_labor_union:0 "Workers have joined forces and created a labor union in your province."
 worker_union:0 "Worker's Union"
 strike_solution:0 "Strike Solution"
 desc_strike_solution:0 "Your generosity have stopped the strike."
 province_strike:0 "Province Strike"
 desc_province_strike:0 "Workers have gone on strike in your province."
 black_shirts:0 "Blackshirts"
 desc_black_shirts:0 "Blackshirts are provoking the residents in the province."
 free_corps:0 "Free Corps"
 desc_free_corps:0 "Inspired by the Blackshirts, the Free Corps are a nuisance in your province."
 the_massacre:0 "The Massacre"
 desc_the_massacre:0 "A group of people consisting of socicialists and liberals have been murdered."
 fascist_welfare:0 "Fascist Welfare"
 desc_fascist_welfare:0 ""
 beer_hall_putsch:0 "Beer Hall Putsch"
 desc_beer_hall_putsch:0 ""
 local_opium_habit:0 "Opium Problem"
 desc_local_opium_habit:0 "Our subjects in this province have taken to opium eating on an epidemic scale."
 sayings_of_the_dutch:0 "Sayings of The Dutch"
 desc_sayings_of_the_dutch:0 "We have translated a large amount of western literature and incorporated it fully into our national body of knowledge, boosting our scientific research."
 european_military_mission:0 "Military Mission"
 desc_european_military_mission:0 "A Great Power has established a military mission in this province."
 extraterritoriality_granted:0 "Extraterritoriality Granted"
 desc_extraterritoriality_granted:0 "Our country has granted extraterritoriality to citizens of the Great Powers."
 military_reform:0 "Military Reform"
 desc_military_reform:0 "We are in the process of reforming our army to European standards"
 educational_reform:0 "Educational Reform"
 desc_educational_reform:0 "We have reformed our educational system. While this helps our research, it is also highly unpopular among the traditionalists."
 legation_quarter:0 "Legation Quarter"
 kettler_denkmal:0 "Memorial to Foreign Diplomat"
 desc_kettler_denkmal:0 "This memorial to a foreign diplomat stands as a permanent reminder to our people that our independence is being sold short by our government."
 local_economic_downturn:0 "Local Economic Downturn"
 desc_local_economic_downturn:0 "This province has taken a temporary economic hit, but should recover within a few years."
 free_staters:0 "Free-Staters"
 desc_free_staters:0 "Free-Staters are active in this province, working to ensure its accession into the Union as a free state."
 border_ruffians:0 "Border Ruffians"
 desc_border_ruffians:0 "Border Ruffians is souring the quality of life for people in this province."
 underground_railroad:0 "Underground Railroad"
 desc_underground_railroad:0 "An Underground Railroad operates in this province, bringing slaves to freedom."
 knights_of_the_golden_circle:0 "Knights of The Golden Circle"
 desc_knights_of_the_golden_circle:0 "A secret society dedicated to the advancment of slavery operates in this province."
 american_anti_slavery_society:0 "American Anti-Slavery Society"
 desc_american_anti_slavery_society:0 "A society dedicated to the abolition of slavery operates in this province."
 copperhead_democrats:0 "Copperhead Democrats"
 desc_copperhead_democrats:0 "Pro-secessionist Democrats are active in this province"
 the_homestead_act:0 "The Idea of Panarcadianism"
 desc_the_homestead_act:0 "With the people of Arcadia fully accepting the rule of the Union, our country stands unified and glorious as never before. With peace ruling on our continent, weary citizens of the Old World look upon our country with hopes never equaled before…"
 the_homestead_act2:0 "The Amerigan Ideal"
 desc_the_homestead_act2:0 "The Amerigan continent stands united, its various people united around one ideal: one of peace and prosperity. From the Falklands to Cartagena our banner stands. With peace ruling on our continent, weary citizens of the Old World look upon our country with hopes never equaled before…"
 the_slavery_debate:0 "The Slavery Debate"
 desc_the_slavery_debate:0 "The debate over slavery is alive in The United States, and popular consciousness over the issue is rising every day. If the Upper House ever has 30 percent or more Liberal representation, the South might very well decide to secede."
 blood_and_iron_mine:0 "Blood & Iron Mine"
 desc_blood_and_iron_mine:0 "A rich, but dangerous and difficult, lode of iron ore is being mined in this province."
 libertine_culture:0 "Libertine Culture"
 desc_libertine_culture:0 "Our nation takes a libertine approach to the use of alcohol. Eleven bottles of beer on the wall, yo-ho-ho and a bottle of rum."
 temperance_league:0 "Temperance League"
 desc_temperance_league:0 "Our nation has a strong and prominent temperance league with a fair amount of traction even within government circles."
 beer_halls:0 "Beer Halls"
 desc_beer_halls:0 "This province has a Beer Hall, a Saloon or a Bar for every occasion, and the citizens spend a fair amount of their time in them."
 destitution_and_poverty:0 "Destitution & Poverty"
 desc_destitution_and_poverty:0 "The consumption of alcohol is fast becoming a major social problem in this province"
 liquor_prohibition:0 "Liquor Prohibition"
 desc_liquor_prohibition:0 "The sale, possession and use of alcoholic beverages is prohibited in our country."
 minority_building_restrictions:0 "Minority Building Restrictions"
 desc_minority_building_restrictions:0 "Our country enforces policies that prevent minorities from constructing permanent buildings, even on land they own."
 dryzymalas_wagon:0 "Dryzymala's Wagon"
 desc_dryzymalas_wagon:0 "Old man Dryzymala avoids the building ban by living in a wagon"
 discriminatory_school_system:0 "Discriminatory School System"
 desc_discriminatory_school_system:0 "Our school system discriminates against citizens who are not of our national culture."
 flying_university:0 "Flying University"
 desc_flying_university:0 "An underground organisation provides higher education in a minority language"
 organic_work:0 "Organic Work"
 desc_organic_work:0 "A movement dedicated to work as a form of resistance operates in this province."
 egyptian_excavations:0 "Egyptian Excavations"
 egyptian_excavations_desc:0 "Our country is spearheading archeological excavations in The Valley of the Kings."
 trek_boers:0 "Trek Boers"
 desc_trek_boers:0 "Boers from the Cape Colony are migrating to this province. A small trickle in the stream that what will later be known as 'The Great Trek'."
 gold_rush:0 "Gold Rush"
 desc_gold_rush:0 "This province is booming due to the discovery of gold"
 witwatersrand_gold_rush:0 "Witwatersrand Gold Rush"
 desc_witwatersrand_gold_rush:0 "A Gold Rush in the Witwatersrand is making us known internationally."
 local_tractors:0 "Tractors"
 desc_local_tractors:0 "Mechanized farming has arrived in this province in the form of tractors, increasing the efficiency, and reducing the labour intensity, of local farming."
 local_electricity:0 "Electrical Lighting"
 desc_local_electricity:0 "Electrical Lights have been put up on the streets in this province, increasing the efficiency of all local production, as workers work in new and well lit environs."
 local_nitroglycerin:0 "Nitroglycerin"
 desc_local_nitroglycerin:0 "Knowledge of the use of modern explosives has spread to this province, aiding local mining ventures."
 local_distribution_channels:0 "Commercial Retailers"
 desc_local_distribution_channels:0 "New and efficient modes and structures for the selling and reselling of goods have been implemented in this province, leaving farmers free to tend their fields."
 local_machine_tools:0 "Mechanized Mining"
 desc_local_machine_tools:0 "The mining process in this province is carried out with new and mechanized tools, increasing the efficiency of local mining operations."
 pandemic_influenza:0 "Pandemic Influenza"
 desc_pandemic_influenza:0 "A Pandemic influenza has broken out in our country, killing thousands. We can only hope that it spreads to our enemies as well."
 tuberculosis:0 "Tubercolosis Outbreak"
 tuberculosis_desc:0 "Consumption has swept across the province, spreading the wasting sickness in its wake."
 typhoid:0 "Typhoid Outbreak"
 typhoid_desc:0 "Typhoid is caused by the contamination of drinking water, and an outbreak of the sickness is currently ravaging the province."
 smallpox:0 "Smallpox Outbreak"
 smallpox_desc:0 "Smallpox is currently ravaging the people in this province."
 economic_trend:0 "Economic Trend"
 economic_trend_desc:0 "Our nation's economy is currently in flux."
 trustee_system:0 "The Trusty System"
 trustee_system_desc:0 "Inmates police other inmates in this state's prisons, and production is better off for it."
 penal_colonies:0 "Penal Colonies"
 penal_colonies_desc:0 "Scattered around our Empire lie several penal colonies, of varying size and shape, to which we banish our worst criminals."
 stock_market_crash:0 "Stock Market Crash"
 stock_market_crash_desc:0 "Our country is feeling the effects of a stock market crash."
 great_depression:0 "Great Depression"
 central_bank_established:0 "Central Bank"
 central_bank_established_desc:0 "Our government's central bank maintains a strict monopoly on the issuance of currency."
 local_stock_exchange:0 "Stock Exchange"
 local_stock_exchange_desc:0 "A local Stock Exchange operates in this province, increasing local production output."
 economic_boom:0 "Economic Boom"
 economic_boom_desc:0 "Our economy is booming thanks to our investment banks and a long period of low unemployment."
 recession:0 "Economic Recession"
 recession_desc:0 "The economy is in a recession, leading to a downturn in production and a fear among the population that bad times lay ahead."
 Bull_market:0 "Bull Market"
 Bull_market_desc:0 "We are experiencing an economic boom, with factories enjoying greater production and the people readily buying what luxuries they can while times are good."
 building_suez_canal:0 "Building the Suez Canal"
 building_suez_canal_desc:0 "The Suez Canal is currently under construction. After each completed phase an event will fire to keep you informed of the progress. Construction will take approximately 10 years."
 building_suez_canal_revolt:0 "Worker revolt at the Suez Canal"
 building_suez_canal_revolt_desc:0 "Construction off the Suez Canal has halted until the revolt is over."
 suez_canal:0 "Suez Canal"
 suez_canal_dividend:0 "Suez Canal Dividend"
 suez_canal_dividend_desc:0 "We are currently processing the receipts for ships having passed through the Suez canal."
 suez_canal_treaty:0 "Suez Canal Treaty"
 suez_canal_treaty_desc:0 "In $YEAR$ the Suez Canal Treaty was signed exchanging canal rights for a financial reimbursement of 10,0,000 plus an annuity of 250,000."
 suez_canal_treaty_annuity:0 "Suez Canal Treaty Annuity"
 suez_canal_treaty_annuity_desc:0 "We are currently processing the payments from the Suez Canal Treaty."
 building_panama_canal:0 "Building the Andagoya Canal"
 building_panama_canal_desc:0 "The Andagoya Canal is currently under construction. After each completed phase an event will fire to keep you informed of the progress. Construction will take approximately 12.5 years."
 panama_canal:0 "Andagoya Canal"
 panama_canal_dividend:0 "Andagoya Canal Dividend"
 panama_canal_dividend_desc:0 "We are currently processing the receipts for ships having passed through the Andagoya canal."
 panama_canal_treaty:0 "Hay-Bunau-Varilla treaty"
 panama_canal_treaty_desc:0 "The Hay-Bunau-Varilla treaty was an agreement between the USA and the Andagoya granting exclusive canal rights to the USA across the isthmus of Andagoya in exchange for a financial reimbursement of 10,0,000 plus an annuity of 250,000."
 panama_canal_treaty_annuity:0 "Andagoya Canal Treaty Annuity"
 panama_canal_treaty_annuity_desc:0 "We are currently processing the payments from the Andagoya Canal Treaty."
 building_panama_canal_scandal:0 "Andagoya Canal Scandal"
 building_panama_canal_scandal_desc:0 "Until the memory of the disastrous construction attempt of the Andagoya Canal has faded enough we can't resume construction."
 building_kiel_canal:0 "Building the Kiel Canal"
 building_kiel_canal_desc:0 "The Kiel Canal is currently under construction. After each completed phase an event will fire to keep you informed of the progress. Construction will take approximately 8 years."
 kiel_canal:0 "Kiel Canal"
 kiel_canal_dividend:0 "Kiel Canal Dividend"
 kiel_canal_dividend_desc:0 "We are currently processing the receipts for ships having passed through the Kiel canal."
 underground_newspaper:0 "Revolutionary Newspaper"
 freedom_talks:0 "Dangerous Ideas"
 freedom_talks_desc:0 "Dangerous ideas are spreading. People begin to realise that our current form of government may be not the best"
 growing_unrest:0 "Growing Unrest"
 growing_unrest_desc:0 "People are losing faith in their government and may even resort to armed revolution"
 revolutionary_society:0 "Revolutionary Society"
 revolutionary_society_desc:0 "A revolutionary society has emerged in our country planning to overthrow current government"
 nv_tradition_modifier:0 "National Value - Tradition"
 nv_enlightenment_modifier:0 "National Value - Enlightenment"
 nv_progress_modifier:0 "National Value - Progress"
 nv_loyalty_modifier:0 "National Value - Loyalty"
 nv_independence_modifier:0 "National Value - Independence"
 nv_liberty_modifier:0 "National Value - Liberty"
 nv_equality_modifier:0 "National Value - Equality"
 nv_might_modifier:0 "National Value - Might"
 nv_order_modifier:0 "National Value - Order"
 nv_freedom_modifier:0 "National Value - Freedom"
 nv_fraternity_modifier:0 "National Value - Fraternity"
 nv_unity_modifier:0 "National Value - Unity"
 nv_supremacy_modifier:0 "National Value - Supremacy"
 nv_prosperity_modifier:0 "National Value - Prosperity"
 nv_productivity_modifier:0 "National Value - Productivity"
 nv_glory_modifier:0 "National Value - Glory"
 nv_dominion_modifier:0 "National Value - Dominion"
 the_open_door:0 "The Open Door"
 citizenship_tests:0 "Citizenship Tests"
 passports:0 "Passports"
 five_year_plan:0 "Five Year Plan"
 purge:0 "Purge the Traitors"
 purge_desc:0 "The proletarian state has many enemies, ones that do not see the larger plan and how it benefits us all. We must locate them and keep them from harming our nation."
 just_civilized:0 "Just Civilized"
 desc_just_civilized:0 "The Westernization of our country led to enormous changes in our political and social structure, this period also saw our country change from being a feudal society to having a capitalist economy and left us with a lingering Western influence."
 the_rights_of_man:0 "The Rights of Man"
 political_ideology:0 "The New Ideology"
 of_state_n_government:0 "Of State & Government"
 dreams_of_empire:0 "Dreams of Empire"
 the_means_of_production:0 "The Means of Production"
 the_flaws_of_democracy:0 "The Flaws of Democracy"
 workshop_of_the_world:0 "Workshop of the World"
 workshop_of_the_world_desc:0 "Our nation lies at the heart of the Industrial Revolution. Nowhere else is the growth of industry more prevalent and had more impact."
 secret_police:0 "Secret Police"
 general_strike:0 "General Strike"
 general_strike_desc:0 "The entire country is experiencing a worker's strike, greatly impacting our entire economy."
 address:0 "Address the Nation"
 address_desc:0 "The nation has been addressed by our leaders. The effects of that address will no doubt be felt for years to come."
 tour:0 "Whistlestop Tour"
 tour_desc:0 "The rulers of the nation have started to charter tour train rides over the country. It is having a positive effect upon the population of our Great Nation."
 futile:0 "Futile"
 futile_desc:0 "We have made our gesture of defiance against the greater powers. Now we must wait, lest we push our luck too far."
 parade:0 "Military Parade"
 parade_desc:0 "Let us display our nation's armed forces in the streets. We are a power to be reckoned with, and all the world will know it!"
 conference:0 "National Conference"
 conference_desc:0 "A grand display of our nation's scientific prowess. Let us bring the intelligentsia together in the capital, so that great minds may share ideas and advance our country's interests."
 exhibition:0 "Exhibition"
 census:0 "National Census"
 census_desc:0 "A national census is currently being conducted."
 recruitment_drive:0 "National Recruitment Drive"
 recruitment_drive_desc:0 "A national drive to increase our level of army recruits is underway."
 the_statue_of_liberty:0 "La Liberté éclairant le Monde"
 the_statue_of_liberty_desc:0 "The first thing people see as they approach Nouvelle Amsterdam harbor, by boat from the Old World, is the gleaming tip of an enormous torch, symbolizing the freedom and liberty of the New. For many of the immigrants to our great nation, this will be the lasting first impression of a country forged and born in liberty, and of a new home."
 expert_diplomat:0 "Expert Diplomat"
 expert_diplomat_desc:0 "Our leader is an expert in the art of diplomacy."
 successful_industrialist:0 "Successful Industrialist"
 successful_industrialist_desc:0 "Our leader is a wealthy industrialist skilled in matters of business and finance."
 ivory_tower_intellectual:0 "Ivory Tower Intellectual"
 ivory_tower_intellectual_desc:0 "Our leader hails from the ranks of the intelligentsia, possessing a superior education."
 man_of_the_people:0 "Man of the People"
 man_of_the_people_desc:0 "Our leader is charismatic, and has a way of connecting with our country's people that few understand."
 landed_gentleman:0 "Landed Gentleman"
 landed_gentleman_desc:0 "Our leader hails from the ranks of the landed gentry, a man of breeding who is familiar with our country's aristocracy."
 military_man:0 "Military Man"
 military_man_desc:0 "Our leader has a significant military background, and is familiar with the needs of our armed forces."
 lord_admiral:0 "Lord Admiral"
 lord_admiral_desc:0 "Our leader has a significant naval background, and is familiar with the needs of our country's navy."
 raving_loon:0 "Raving Loon"
 raving_loon_desc:0 "To put it politely, we will be fortunate if our leader does not cause the country considerable harm. Many consider him a lunatic."
 luddite:0 "Luddite"
 luddite_desc:0 "Our leader is no friend of progress and technology, favoring traditionalism over industrial development."
 backroom_boy:0 "Backroom Boy"
 backroom_boy_desc:0 "Our leader hails from the ranks of the bureaucracy, possessing a way of ensuring the country's administration is run smoothly."
 great_reformer:0 "Great Reformer"
 great_reformer_desc:0 "A champion of reform, our leader is seen as someone who can enact significant change in our country."
 gauche_buffoon:0 "Gauche Buffoon"
 gauche_buffoon_desc:0 "For the love of God, don't let our leader interact with foreign dignitaries. He has, shall we say, a facility for saying the wrong thing at the wrong time."
 administrative_genius:0 "Administrative Genius"
 administrative_genius_desc:0 "Under our leader's guidance, the country's bureaucracy has never run more efficiently. Nothing escapes his notice."
 visionary_thinker:0 "Visionary Thinker"
 visionary_thinker_desc:0 "Our leader is a true visionary, and under his guidance we shall almost certainly see great leaps in technological progress."
 competent_placeholder:0 "Competent Placeholder"
 competent_placeholder_desc:0 "Little good can be said about our leader. Fortunately, little bad can be said about him as well."
 imperious_autocrat:0 "Imperious Autocrat"
 imperious_autocrat_desc:0 "No-one challenges our leader, for any reason. That said, he's quite impressive."
 prince_of_terror:0 "Prince of Terror"
 prince_of_terror_desc:0 "Woe betide anyone or any nation that gets in the way of our leader's ambition."
 efficient_sociopath:0 "Efficient Sociopath"
 efficient_sociopath_desc:0 "The country has never run more smoothly than under our leader's guidance. Everyone agrees. Just ask them. They're all nodding and smiling, aren't they?"
 pig_headed_isolationist:0 "Pig-Headed Isolationist"
 pig_headed_isolationist_desc:0 "Our leader is determined to keep our country isolated, favoring unquestioning adherence to tradition over all else."
 ambitious_union_boss:0 "Ambitious Union Boss"
 ambitious_union_boss_desc:0 "Our leader hails from the ranks of the blue-collar unions, a man who has worked his way up through the ranks... right to the very top."
 dour_economist:0 "Dour Economist"
 dour_economist_desc:0 "Our leader has a penchant for numbers and economics, even if he isn't particularly good with people."
