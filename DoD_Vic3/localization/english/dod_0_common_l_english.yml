 reactionary_rebels_name:0 "$COUNTRY$ Reactionaries"
 reactionary_rebels_desc:0 "Reactionary rebels hanker for a return to the good old days. Whether they are outright monarchists, or simply opposed to what they perceive as the ideologies of modernity, you can always find these counter-revolutionaries on the forefront in the battle against Socialism and Liberalism."
 reactionary_rebels_army:0 "$COUNTRY_ADJ$ White Army"
 communist_rebels_title:0 "Communist"
 communist_rebels_name:0 "$COUNTRY$ Communists"
 communist_rebels_desc:0 "The Red Guards are communists who have risen in open rebellion against the government, and, more importantly, against all of what they consider to be the reactionary trappings of the bourgeois state, and even society. In opposition to the institutions of religion, tradition, private ownership and family, these revolutionaries seek instead to establish a 'Dictatorship of The Proletariat', the first step on the long, corpse-strewn way to the promised classless utopia of Communism."
 communist_rebels_army:0 "$COUNTRY_ADJ$ Red Guards"
 anarcho_liberal_rebels_title:0 "Anarcho-Liberal"
 anarcho_liberal_rebels_name:0 "$COUNTRY$ Anarcho-Liberals"
 anarcho_liberal_rebels_desc:0 "The Citizen Guard are militant liberals who have risen up in rebellion against the, real or perceived, oppressive practices of the government and the state apparatus, seeking to protect their personal liberty whatever the cost. Fighting against the tyrannical state, these revolutionaries consider themselves freedom-fighters in the true sense of the word."
