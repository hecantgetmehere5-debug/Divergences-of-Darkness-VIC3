 dhy_schools:0 "The Dahomey Schools"
 dhy_schools_desc:0 "To combat the illiteracy in our country we've seriously invested in improving the national schools into some of Africa's best."
 dhy_universities:0 "The Dahomey Universities"
 dhy_universities_desc:0 "We've founded several large universities in our cities to create some of the Africa's brightest men."
