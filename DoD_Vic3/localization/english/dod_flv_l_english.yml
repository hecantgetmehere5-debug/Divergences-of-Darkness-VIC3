l_english:
 dod_flv.1.t:0 "Iron Mines in Normandie"
 dod_flv.1.d:0 "Normandie, heart of the Anglois nation, is a backward, farming region. Recent surveys have found iron ore beneath it."
 dod_flv.1.f:0 "Iron Mines in Normandie"
 dod_flv.1.a:0 "We shall not pass over this opportunity."
 dod_flv.2.t:0 "Iron Mines in Burgundy"
 dod_flv.2.d:0 "Burgundy emerged from the Great German War as Europe's leading industrial power. New techniques now make the iron of the Burgundian heartland worth mining."
 dod_flv.2.f:0 "Iron Mines in Burgundy"
 dod_flv.2.a:0 "We shall not pass over this opportunity."
 dod_flv.3.t:0 "The Discovery of Troy"
 dod_flv.3.d:0 "Digging beside a wall in the hill of Hisarlik, an archaeologist has found a great copper vessel and, behind it, a hoard of gold. The world is calling it the Treasure of Priam."
 dod_flv.3.f:0 "The Discovery of Troy"
 dod_flv.3.a:0 "Troy was real!"
 dod_flv.4.t:0 "Anvers Lost!"
 dod_flv.4.d:0 "Antwerp, our capital, is in enemy hands. The government has fled and the realm is cut off from its heart."
 dod_flv.4.f:0 "Anvers Lost!"
 dod_flv.4.a:0 "We are a maritime power, after all."
 dod_flv.5.t:0 "Anvers Reconquered"
 dod_flv.5.d:0 "Antwerp is ours again. The palace can be rebuilt and the government can come home."
 dod_flv.5.f:0 "Anvers Reconquered"
 dod_flv.5.a:0 "At last."
 dod_flv.6.t:0 "A World's Fair"
 dod_flv.6.d:0 "Our capital will host a great exhibition of industry and the arts from every nation. Pavilions of iron and glass are going up, and visitors are expected by the hundred thousand."
 dod_flv.6.f:0 "A World's Fair"
 dod_flv.6.a:0 "Let the world come and see."
 dod_flv.7.t:0 "A New Sporting Club"
 dod_flv.7.d:0 "Gentlemen in our capital have founded a club for football, rowing and athletics. The craze for sport is spreading to the factory towns."
 dod_flv.7.f:0 "A New Sporting Club"
 dod_flv.7.a:0 "Splendid."
 dod_flv.8.t:0 "Mostly Harmless"
 dod_flv.8.d:0 "A clerk in the ministry has filed a long report concluding that our country is, on the whole, mostly harmless. Nobody is sure whether to be insulted."
 dod_flv.8.f:0 "Mostly Harmless"
 dod_flv.8.a:0 "Don't panic."
 dod_flv.9.t:0 "A Landmark in Ruins"
 dod_flv.9.d:0 "Fighting in our capital has left one of its great buildings in ruins. The people take it as a national humiliation."
 dod_flv.9.f:0 "A Landmark in Ruins"
 dod_flv.9.a:0 "It will be rebuilt."
