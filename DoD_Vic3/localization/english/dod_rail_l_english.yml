l_english:
 dod_rail.1.t:0 "The Reconquest of the Indies"
 dod_rail.1.d:0 "The Columbian Alliance fleet lies at the bottom of the sea off Havana, and Mexico has seized the Alliance and proclaimed Gran Colombia. Madrid sees its chance: the army of reconquest is ready to sail for the mainland."
 dod_rail.1.f:0 "The Spanish return."
 dod_rail.1.a:0 "Reconquer the colonies!"
 dod_rail.1.b:0 "We cannot afford another war."
 dod_rail.2.t:0 "The Rebel Provinces"
 dod_rail.2.d:0 "Mustafa IV has restarted the Civil War to undo his brother's reforms and win back every land lost since 1807. Albania and Macedonia, backed by Aragon and Venice, and the Alawiyya rebels in Egypt must be brought to heel."
 dod_rail.2.f:0 "The Sultan's wars."
 dod_rail.2.a:0 "March on the rebels!"
 dod_rail.2.b:0 "Deal with them one at a time."
 dod_rail.3.t:0 "The War against Egypt"
 dod_rail.3.d:0 "Muhammad of the House of Alawiyya proclaimed himself Sultan in 1833. The Hafsids are already at war with him; the Empire must strike before Egypt grows stronger."
 dod_rail.3.f:0 "Cairo must fall."
 dod_rail.3.a:0 "Strike Egypt!"
 dod_rail.3.b:0 "Not yet."
 dod_rail.4.t:0 "The Albanian Revolt"
 dod_rail.4.d:0 "Albania still defies the Sultan from its mountains."
 dod_rail.4.f:0 "The mountains must be pacified."
 dod_rail.4.a:0 "Crush the Albanians!"
 dod_rail.4.b:0 "Not yet."
 dod_rail.5.t:0 "The Hafsids against Egypt"
 dod_rail.5.d:0 "Like the Ottomans, the Hafsid Kingdom is at war with the new Egyptian Sultan, and Cyrenaica lies between us."
 dod_rail.5.f:0 "Cyrenaica beckons."
 dod_rail.5.a:0 "Press the war in Cyrenaica."
 dod_rail.5.b:0 "Leave it to the Ottomans."
 dod_rail.10.t:0 "The Imperial Lands"
 dod_rail.10.d:0 "Since the Treaty of Paris, Scandinavia holds Pomerania and the Rhineland looks to Anvers. If the King of the Germans is ever to be Emperor again, those Imperial lands must be freed first."
 dod_rail.10.f:0 "Liberate the Imperial lands."
 dod_rail.10.a:0 "Claim the Imperial lands."
 dod_rail.10.b:0 "The time is not right."
 dod_rail.11.t:0 "The Moment Has Passed"
 dod_rail.11.d:0 "The Emperor waited too long. The German princes have grown used to their independence, Burgundy and Scandinavia stand guard, and the dream of a centralised Empire has faded into the realm of speculative histories."
 dod_rail.11.f:0 "Ein Deutschland? Perhaps one day."
 dod_rail.11.a:0 "So be it."
