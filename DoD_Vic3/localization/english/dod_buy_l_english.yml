l_english:
 dod_buy.1.t:0 "An Offer to Buy"
 dod_buy.1.d:0 "[SCOPE.sCountry('dod_buy_buyer').GetName] has offered a great deal of money for some of our overseas territory. The land costs us more than it brings, but selling it would be a sign of weakness."
 dod_buy.1.f:0 "An Offer to Buy"
 dod_buy.1.a:0 "We gladly accept."
 dod_buy.1.b:0 "We refuse."
 dod_buy.2.t:0 "The Offer Is Accepted"
 dod_buy.2.d:0 "[SCOPE.sCountry('dod_buy_seller').GetName] has accepted our offer. The territory is ours, to be paid for over the coming years."
 dod_buy.2.f:0 "The Offer Is Accepted"
 dod_buy.2.a:0 "Excellent."
 dod_buy.3.t:0 "The Offer Is Refused"
 dod_buy.3.d:0 "[SCOPE.sCountry('dod_buy_seller').GetName] has refused our offer. If we still want the territory, we will have to take it."
 dod_buy.3.f:0 "The Offer Is Refused"
 dod_buy.3.a:0 "Then we will claim it."
 dod_buy.3.b:0 "Hm, I see."
 dod_buy.10.t:0 "News from Distant Shores"
 dod_buy.10.d:0 "With the Curonian motherland lost, the Ducal Colonial Trading Company has no one left to protect its far-flung trading posts. They pass to whoever holds Courland now."
 dod_buy.10.f:0 "News from Distant Shores"
 dod_buy.10.a:0 "I can't even find the place on the map."
 dod_buy_athesia:0 "Purchase Athesia"
 dod_buy_athesia_desc:0 "Venice holds the Athesian peninsula and the islands of Eleuthera and Lucaya far from home. Their viceroy might be persuaded to sell."
 dod_buy_cuba:0 "Purchase Cuba"
 dod_buy_cuba_desc:0 "Cuba has served Spain for centuries, but the Spanish treasury is empty and the island is far away."
 dod_buy_sudurhafeyjar:0 "Purchase Sudurhafeyjar"
 dod_buy_sudurhafeyjar_desc:0 "Scandinavia's Caribbean islands of Ayiti and Righavn have become a drain on its treasury."
 dod_buy_falklands:0 "Purchase the South Atlantic Islands"
 dod_buy_falklands_desc:0 "Scandinavia holds the South Atlantic islands but has little use for them. Beornia does."
 dod_buy_spanish_pacific:0 "Purchase the Spanish Pacific"
 dod_buy_spanish_pacific_desc:0 "With Manila lost, Spain's Pacific holdings are hard to govern and expensive to keep. Our government wants a foothold in the Pacific."
 dod_buy_curonian_colonies:0 "Purchase the Curonian Colonies"
 dod_buy_curonian_colonies_desc:0 "The Duchy of Courland's trading company holds posts across the world that the Duke can barely defend. A rich buyer could take them off his hands."
