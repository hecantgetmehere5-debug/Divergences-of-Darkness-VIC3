l_english:
 je_dod_arcadian_union:0 "The Arcadian Union"
 je_dod_arcadian_union_reason:0 "Arcadia has been proclaimed, but its peoples have yet to embrace it. Hold conferences with the Vinlanders, Septimans, Plantagenians and Lusitanians, then call a Continental Congress to make the Union real."
 dod_form_arcadia:0 "Proclaim the Unification of Arcadia"
 dod_form_arcadia_desc:0 "Since the end of colonial rule, the Arcadian nations have fought each other. One of them must unite them all."
 dod_arcadian_conference:0 "Hold an Arcadian Conference"
 dod_arcadian_conference_desc:0 "Invite the delegates of one of the Arcadian peoples to debate joining the Union."
 dod_continental_congress:0 "Hold the Continental Congress"
 dod_continental_congress_desc:0 "Gather the representatives of all Arcadian peoples at Nye Nidaros to decide the fate of national unity."
 dod_arcadia_manifest_destiny:0 "Manifest Destiny"
 dod_arcadia_manifest_destiny_desc:0 "Our destiny is to unite all of Arcadia under our flag."
 dod_push_west:0 "Push to the West"
 dod_push_west_desc:0 "Qingqiu holds vast lands beyond its heartland. Arcadia will claim everything up to the Rocky Mountains."
 dod_arcadia_integrate:0 "Integrate the Peoples of Arcadia"
 dod_arcadia_integrate_desc:0 "Athesians, Caribenos, Ayitians, the freed Afro-Germanic slaves and the Rohnnst are all part of Arcadia."
 dod_purchase_athesia:0 "The Athesian Purchase"
 dod_purchase_athesia_desc:0 "Athesia is far from its European masters. Perhaps they would sell it."
 dod_purchase_habana:0 "The Habanan Purchase"
 dod_purchase_habana_desc:0 "The Spanish Caribbean is a burden for Madrid. We could buy it."
 dod_purchase_ayiti:0 "The Sudurhafeyjar Purchase"
 dod_purchase_ayiti_desc:0 "The Scandinavian islands of the Caribbean could be bought."
 dod_lot_statue:0 "Build a Statue for Edward IV"
 dod_lot_statue_desc:0 "A monument to the Beornian King in Fort Lothere would bring our two nations closer."
 dod_form_ameriga:0 "The Amerigan Federation"
 dod_form_ameriga_desc:0 "The peoples of the Amerigan Atlantic coast must unite into a single Federation."
 dod_federation_invite:0 "Invite Our Neighbours into the Federation"
 dod_federation_invite_desc:0 "Beornia, Equinoxea and Atlantia could all join the Federation."
 dod_ameriga_integrate:0 "The Amerigan Ideal"
 dod_ameriga_integrate_desc:0 "Beornians, Granadans and Guaranis alike are Amerigans."
 dod_beornia_inca_treaty:0 "The Beornian-Incan Border"
 dod_beornia_inca_treaty_desc:0 "Propose a treaty to fix our border with the Incas."
 dod_dine_claims:0 "Our Claim to Dine Bikeyah"
 dod_dine_claims_desc:0 "The lands of the Pueblos are part of our ancestral homeland."
 dod_arcadian_concessions:0 "Arcadian Concessions"
 dod_arcadian_concessions_desc:0 "We bowed to the demands of an Arcadian people."
 dod_arcadian_separatism:0 "Arcadian Separatism"
 dod_arcadian_separatism_desc:0 "Some Arcadians oppose the Union."
 dod_pan_arcadianism:0 "Pan-Arcadianism"
 dod_pan_arcadianism_desc:0 "All Arcadians are one people."
 dod_land_of_the_free:0 "Land of the Free"
 dod_land_of_the_free_desc:0 "Immigrants flock to Arcadia."
 dod_brown_sugar:0 "Brown Sugar Scandal"
 dod_brown_sugar_desc:0 "A novel about our plantations has scandalised Europe."
 dod_colonial_purchase:0 "Colonial Purchase"
 dod_colonial_purchase_desc:0 "We have bought new lands."
 dod_beornian_friendship:0 "Beornian Friendship"
 dod_beornian_friendship_desc:0 "Beornia and Lotharingia are close friends."
 dod_daigle_rule:0 "The Rule of d'Aigle"
 dod_daigle_rule_desc:0 "Denis d'Aigle governs Lotharingia."
 dod_beornian_volunteers:0 "Beornian Volunteers"
 dod_beornian_volunteers_desc:0 "Beornian volunteers fight for England."
 dod_ameriga_federation:0 "The Amerigan Federation"
 dod_ameriga_federation_desc:0 "From the jungles to the pampas, Ameriga is one."
 dod_ame.1.t:0 "The Arcadian Conference"
 dod_ame.1.d_vinlander:0 "Delegates from Vinland have gathered to debate joining a united Arcadia. Some embrace the idea with their minds and hearts; others demand reforms first; and some would rather fight than submit."
 dod_ame.1.d_septiman:0 "Delegates from New Burgundy have gathered to debate joining a united Arcadia. Some embrace the idea with their minds and hearts; others demand reforms first; and some would rather fight than submit."
 dod_ame.1.d_plantagenian:0 "Delegates from Plantagenia have gathered to debate joining a united Arcadia. Some embrace the idea with their minds and hearts; others demand reforms first; and some would rather fight than submit."
 dod_ame.1.d_lusitanian:0 "Delegates from Lusitania have gathered to debate joining a united Arcadia. Some embrace the idea with their minds and hearts; others demand reforms first; and some would rather fight than submit."
 dod_ame.1.f:0 "Will they join the Union?"
 dod_ame.1.a:0 "They embrace a united Arcadia!"
 dod_ame.1.b:0 "Bow to their demands."
 dod_ame.1.c:0 "Turn them down."
 dod_ame.1.opt_d:0 "Curse them!"
 dod_ame.2.t:0 "The Continental Congress"
 dod_ame.2.d_success:0 "Representatives of the Plantagenians, Septimans and Vinlanders gathered at Nye Nidaros, a middle ground between the three nations. After weeks of debate, the Congress has succeeded: the ideal of unity and equality in Arcadia is reborn."
 dod_ame.2.d_failure:0 "Representatives of the Plantagenians, Septimans and Vinlanders gathered at Nye Nidaros, but the Congress collapsed into petty squabbles. One delegation stormed out, and Pan-Arcadianism remains a dream."
 dod_ame.2.f:0 "The dream of Arcadia."
 dod_ame.2.a:0 "The dream lives on!"
 dod_ame.2.b:0 "Well... damn."
 dod_ame.3.t:0 "The Land of the Free"
 dod_ame.3.d:0 "Since the end of colonial rule, Arcadia has known constant rivalry and war. Yet immigrants fleeing war-torn Europe keep arriving, drawn by the promise of a land where anyone can start anew."
 dod_ame.3.f:0 "A new star arises!"
 dod_ame.3.a:0 "A new star arises!"
 dod_ame.4.t:0 "Westward Expansion"
 dod_ame.4.d:0 "Arcadia demands that we give up every territory beyond our historic Qingqiuan heartland, claiming the land up to the Rocky Mountains. Refusal may mean war with the new giant of the continent."
 dod_ame.4.f:0 "Give up the frontier?"
 dod_ame.4.a:0 "Sign the treaty."
 dod_ame.4.b:0 "We won't be bullied!"
 dod_ame.5.t:0 "Qingqiu Refuses"
 dod_ame.5.d:0 "Qingqiu has refused to give up its frontier territories."
 dod_ame.5.f:0 "Our army could use the practice."
 dod_ame.5.a:0 "Our army could use the practice."
 dod_ame.5.b:0 "We don't need a war yet."
 dod_ame.6.t:0 "The Iroquois Exodus"
 dod_ame.6.d:0 "Since the conquest of the Six Nations and the founding of the Republic of Carolina, many Iroquois have chosen to leave for the western frontier rather than live under our rule."
 dod_ame.6.f:0 "Let them go, or make them stay?"
 dod_ame.6.a:0 "Whoever wishes to go may leave."
 dod_ame.6.b:0 "Give them incentives to stay."
 dod_ame.7.t:0 "'Brown Sugar'"
 dod_ame.7.d:0 "Mr Armstrong's novel, set on a Plantagenian plantation, has become one of the best-selling books of the decade, at home and abroad. Its portrait of slavery has caused a scandal in Europe."
 dod_ame.7.f:0 "At least it's selling abroad."
 dod_ame.7.a:0 "At least it's selling abroad."
 dod_ame.10.t:0 "An Offer for Our Colonies"
 dod_ame.10.d_athesia:0 "A letter has arrived from our Viceroy in Athesia: the Arcadians have offered to purchase the peninsula. They have a great deal of money, and Athesia is far away."
 dod_ame.10.d_habana:0 "A great sum of money has been offered for our Caribbean islands. They have served us for centuries, but their upkeep is a burden."
 dod_ame.10.d_ayiti:0 "A buyer has set its eyes on our Caribbean islands. They have become a financial burden, and the offer is generous."
 dod_ame.10.f:0 "Sell, or refuse?"
 dod_ame.10.a:0 "We gladly accept."
 dod_ame.10.b:0 "We refuse."
 dod_ame.11.t:0 "Our Offer is Refused"
 dod_ame.11.d:0 "Our offer to buy the islands has been turned down. We can accept it, or press the matter."
 dod_ame.11.f:0 "Hm, I see."
 dod_ame.11.a:0 "Hm, I see."
 dod_ame.11.b:0 "Then we will take them."
 dod_ame.20.t:0 "Lotharingia Calls for a Summit"
 dod_ame.20.d:0 "Lotharingia has paid tribute to our King Edward IV with a statue in Fort Lothere, and has invited our government to a summit."
 dod_ame.20.f:0 "Friends, or rivals?"
 dod_ame.20.a:0 "Beornians and Lotharians have always been friends."
 dod_ame.20.b:0 "Attend the summit, but keep our distance."
 dod_ame.20.c:0 "We have our differences."
 dod_ame.21.t:0 "Amerigan Destiny"
 dod_ame.21.d:0 "The partisans of Amerigan expansion are divided into three camps: those who want only the border states, those who would free the Guarani, and those who dream of a greater Amerigan Federation."
 dod_ame.21.f:0 "How far shall the Federation reach?"
 dod_ame.21.a:0 "Only the states along our border."
 dod_ame.21.b:0 "We will free the Guarani!"
 dod_ame.21.c:0 "A greater Amerigan Federation!"
 dod_ame.22.t:0 "An Amerigan Proposition"
 dod_ame.22.d:0 "Representatives of the Amerigan Federation have come to discuss our integration into their state. We have long had ties with them, but joining would end our independence."
 dod_ame.22.f:0 "Join the Federation?"
 dod_ame.22.a:0 "We will join the Federation!"
 dod_ame.22.b:0 "They can go to hell with their Federation!"
 dod_ame.23.t:0 "The Proposal is Refused"
 dod_ame.23.d:0 "They have refused to join the Federation."
 dod_ame.23.f:0 "They thought no was an answer?"
 dod_ame.23.a:0 "Across the river, then!"
 dod_ame.23.b:0 "Leave them in their backwater."
 dod_ame.24.t:0 "The Question of Government"
 dod_ame.24.d:0 "With Atlantia reconquered, some begin to question the benevolent rule of Denis d'Aigle. The President has announced he will address the nation."
 dod_ame.24.f:0 "What does Lotharingia need?"
 dod_ame.24.a:0 "Denis d'Aigle will lead us as he always has."
 dod_ame.24.b:0 "Denis d'Aigle will call new elections."
 dod_ame.24.c:0 "What Lotharingia needs is a strong monarch."
 dod_ame.25.t:0 "Revolution in England"
 dod_ame.25.d:0 "Our brethren in England have finally risen against the King in Paris. Many young Beornian officers want to sail across the ocean and fight for the old country."
 dod_ame.25.f:0 "Help the English?"
 dod_ame.25.a:0 "Liberals or not, we will help the English."
 dod_ame.25.b:0 "Our prayers are with them, but that is all."
 dod_ame.26.t:0 "The Beornia-Inca Border Treaty"
 dod_ame.26.d:0 "Now that Araucania and Patagonia are settled, the Beornians propose a treaty to fix our southern border once and for all."
 dod_ame.26.f:0 "Sign the treaty?"
 dod_ame.26.a:0 "Sign the treaty."
 dod_ame.26.b:0 "There is no need for such an agreement."
 dod_ame.27.t:0 "The Incas Refuse the Treaty"
 dod_ame.27.d:0 "The Incas have refused to fix our border. Our settlers in the south will press their own claims."
 dod_ame.27.f:0 "Then we claim it all."
 dod_ame.27.a:0 "Then we claim it all."
