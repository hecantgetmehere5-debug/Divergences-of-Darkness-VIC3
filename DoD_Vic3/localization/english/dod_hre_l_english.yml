l_english:
 # Journal entries
 je_dod_prague_proclamation:0 "The Prague Proclamation"
 je_dod_prague_proclamation_reason:0 "Emperor Sigismund V means to finish the work his father Wenceslaus VIII began in the German Wars: one state from the Danube to the Elbe. Once the Empire is at peace and counted among the Great Powers, the Proclamation can be sent to the Imperial Diet."
 je_dod_imperial_diets:0 "The Imperial Diets"
 je_dod_imperial_diets_reason:0 "The Elbian, Rhenish and Danubian diets are debating the Proclamation. Each prince must choose: join the Reich, negotiate to keep his privileges, or refuse outright. In half a year we will know where the Empire stands."
 je_dod_submission_or_conquest:0 "Submission or Conquest"
 je_dod_submission_or_conquest_reason:0 "Tired of the slowness of the negotiations, the Emperor has decided to use the harsh way: every prince still outside the Reich must submit, or be conquered."
 je_dod_bohemian_question:0 "The Bohemian Question"
 je_dod_bohemian_question_reason:0 "'Lion over Eagle! We are no Germans!' The Bohemians fear that the privileged place they held for centuries as the heart of the Empire is slipping away. Restore the Bohemian crown's standing, or adopt multicultural laws, before their anger boils over."
 je_dod_war_for_bohemia:0 "The War for Bohemia"
 je_dod_war_for_bohemia_reason:0 "The Bohemian Crown Lands have declared their independence. The Empire must bring them back by force, or accept their loss."

 # The Prague Proclamation
 dod_hre.1.t:0 "The Prague Proclamation"
 dod_hre.1.d:0 "Having reaffirmed his hegemony over the principalities of the Holy Roman Empire, Emperor Sigismund V has drafted a Proclamation to every member of the Imperial Diet. Determined to pursue the centralising reforms of his father Wenceslaus VIII, he asks all the princes of the Empire to join in a single state from the Danube to the Elbe. A centralised Empire would upend the balance of power on the continent, but nothing is set in stone yet."
 dod_hre.1.f:0 "Ein Reich, from the Danube to the Elbe."
 dod_hre.1.a:0 "Send the Proclamation!"
 dod_hre.1.b:0 "Send it, with guarantees for the princes."

 dod_hre.10.t:0 "An Imperial Proposition"
 dod_hre.10.d_elbe:0 "A courier from Prague has brought the Emperor's Proclamation to our court. Sigismund V asks the Elbian princes to give up their crowns and join a single Empire. Our neighbours along the Elbe are already debating the matter, and Kiel and Heligoland watch to see which way the North will turn."
 dod_hre.10.d_rhine:0 "A courier from Prague has brought the Emperor's Proclamation to our court. Sigismund V asks the Rhenish princes to give up their crowns and join a single Empire. From Aachen to Trier, the Rhineland is debating whether the Emperor's protection is worth the price of its liberties."
 dod_hre.10.d_danube:0 "A courier from Prague has brought the Emperor's Proclamation to our court. Sigismund V asks the Danubian princes to give up their crowns and join a single Empire. The South has long been the greatest threat to Imperial unity, and all eyes are on our answer."
 dod_hre.10.f:0 "The Emperor has decided to pursue the centralisation of the Empire."
 dod_hre.10.a:0 "Gott erhalte den Kaiser!"
 dod_hre.10.b:0 "We need to negotiate."
 dod_hre.10.c:0 "To hell with centralisation."

 dod_hre.20.t:0 "The Reactions to the Proclamation"
 dod_hre.20.d_success:0 "Most of the princes and free cities of the Empire have accepted the Proclamation, and the dissenting voices stand alone. The Emperor is now truly King of the Germans, and to reassure his new subjects he will move his court to Frankfurt am Main, where the institutions of the Reich will be centralised."
 dod_hre.20.d_mixed:0 "The princes neither embraced nor rejected centralisation. Some joined the Reich, others are negotiating to keep their privileges, and in some regions the refusers have banded together against Prague. The Empire is half made."
 dod_hre.20.d_failure:0 "Instead of a centralised Empire, the Proclamation has brought about the very opposite. The princes of the Elbe, the Rhine and the Danube have each united against us, and their armies are marching on Prague!"
 dod_hre.20.f:0 "The diets have spoken."
 dod_hre.20.a:0 "Submission or conquest: that is their only choice now."
 dod_hre.20.b:0 "Let the rebels stew for now."

 dod_hre.30.t:0 "An Imperial Ultimatum"
 dod_hre.30.d:0 "[SCOPE.sCountry('dod_prince').GetName] still stands outside the Reich, clinging to its ancient privileges. The Emperor's patience has run out. Shall we offer it a final choice between submission and conquest?"
 dod_hre.30.f:0 "Submission or conquest."
 dod_hre.30.a:0 "Send the ultimatum."
 dod_hre.30.b:0 "Not yet."

 dod_hre.31.t:0 "The Emperor's Ultimatum"
 dod_hre.31.d:0 "An envoy from Prague has delivered a blunt message: accept the Emperor as our overlord, or face his armies. There will be no more negotiations."
 dod_hre.31.f:0 "Submission or conquest."
 dod_hre.31.a:0 "We submit to the Emperor."
 dod_hre.31.b:0 "Let him come!"

 dod_hre.32.t:0 "The Ultimatum is Refused"
 dod_hre.32.d:0 "Our envoy has returned empty-handed. The prince has rejected the Emperor's ultimatum and is calling his men to arms."
 dod_hre.32.f:0 "It cannot be avoided then."
 dod_hre.32.a:0 "Onwards!"
 dod_hre.32.b:0 "Leave them to their folly, for now."

 dod_hre.40.t:0 "The Reich Made Whole"
 dod_hre.40.d:0 "The last of the princes has bowed to the Emperor. For the first time in centuries, the lands from the Danube to the Elbe answer to a single crown. What remains to be decided is the shape of this new Reich: a German state governed from Frankfurt, an Empire of two crowns, or a federation of loyal vassals."
 dod_hre.40.f:0 "Ein Reich, ein Deutschland."
 dod_hre.40.a:0 "Ein Reich: one German state, ruled from Frankfurt."
 dod_hre.40.b:0 "One Reich, two crowns: Bohemia keeps its place."
 dod_hre.40.c:0 "Keep the princes as loyal vassals."

 # The Bohemian Question
 dod_hre.50.t:0 "Bohemian Nationalism?"
 dod_hre.50.d:0 "'Lion over Eagle! We are no Germans! Down with the traitor!' These and many more shouts can be heard almost every day in Prague, Pilsen and Brünn. The Bohemian people feel betrayed by the new order and fear that the privileged position they have enjoyed for centuries as citizens of the Imperial heartland is slipping away. Is it a sign of things to come?"
 dod_hre.50.f:0 "I fear we have awoken something..."
 dod_hre.50.a:0 "They will come around."

 dod_hre.51.t:0 "Bohemian Riots"
 dod_hre.51.d:0 "It started as a meaningless brawl. A drunk Bohemian was loudly cursing the Empire, and a passing police officer tried to calm him down, only to be punched in the face. The drunk pulled a knife, the officer panicked and shot him. Bohemians who saw it killed the officer, stormed a nearby weapons depot and began building a barricade across the street. Trouble is brewing."
 dod_hre.51.f:0 "The barricades are going up in Prague."
 dod_hre.51.a:0 "Send in the troops."
 dod_hre.51.b:0 "Restore the Bohemian crown's standing."
 dod_hre.51.c:0 "They can complain; it won't get them anywhere."

 dod_hre.52.t:0 "Reconciliation with Bohemia"
 dod_hre.52.d:0 "The Emperor has recognised the Bohemian crown as an equal pillar of the Reich. The barricades in Prague have come down, and the Lion and the Eagle fly side by side once more."
 dod_hre.52.f:0 "Two crowns, one Empire."
 dod_hre.52.a:0 "Long may it last."

 dod_hre.54.t:0 "The Bohemian Revolution!"
 dod_hre.54.d:0 "To arms! To arms! For our freedom and our pride! Down with the German tyranny! After a series of incidents following the centralisation of the Empire, the situation in Bohemia has escalated into a full-blown crisis. Bohemian aristocrats have formed a national assembly and declared the Bohemian Crown Lands independent. Disgruntled Bohemians, joined by many veterans of the Imperial armies, are flocking to their ranks. Is peace in Central Europe an impossible dream?"
 dod_hre.54.f:0 "When one attacks the Empire, the Empire strikes back."
 dod_hre.54.a:0 "The Empire strikes back!"
 dod_hre.54.b:0 "Let Bohemia go."

 dod_hre.55.t:0 "Intervention in Mitteleuropa?"
 dod_hre.55.d:0 "The Bohemians have risen against the Emperor. This is our chance to cripple the Kaiserreich before it can consolidate its new power."
 dod_hre.55.f:0 "For glory!"
 dod_hre.55.a:0 "We will 'support' the Bohemians!"
 dod_hre.55.b:0 "This is not our fight."

 dod_hre.57.t:0 "Bohemian Mobilisation"
 dod_hre.57.d:0 "It is clear that the war between the Empire and Bohemia will be fought on a scale never seen before. Bohemian citizens are joining the Free Corps en masse and donating their belongings to the war effort. The story of a girl who, having no property or money, donated a lock of her hair is just one of many. The Bohemian lion stands tall, ready to face its enemies."
 dod_hre.57.f:0 "We shall be free from the Emperor's yoke!"
 dod_hre.57.a:0 "Na zdar!"

 dod_hre.58.t:0 "Prague is Lost"
 dod_hre.58.d:0 "Ein Reich, ein Deutschland: easier said than done. The Bohemians refused to become ordinary members of the Empire and somehow defeated our newborn state, dealing it a deep wound. With the blue-red-white tricolour flying over Prague Castle, they have thrown away the chance to be full citizens of the Empire."
 dod_hre.58.f:0 "Bohemia is lost."
 dod_hre.58.a:0 "A bitter day."

 dod_hre.59.t:0 "The Revolution is Crushed!"
 dod_hre.59.d:0 "Ein Reich, ein Deutschland. Only fools stand against the wind of destiny. The Bohemians tried, and paid in blood. But the Empire has bled too, and peace must now reign in Mitteleuropa for good."
 dod_hre.59.f:0 "The Lion is caged once more."
 dod_hre.59.a:0 "Long live the Reich!"

 dod_hre.60.t:0 "The New Constitution"
 dod_hre.60.d:0 "At last we have succeeded. The war cost us many lives, but our homeland is safe from the traitor Kaiser. Let it be known that Bohemia will never again bow before the Germans! The national assembly is to be dissolved and replaced with a proper government. The only question is what form it shall take."
 dod_hre.60.f:0 "Bohemia is free."
 dod_hre.60.a:0 "For the people!"
 dod_hre.60.b:0 "For the King!"

 # Flavour
 dod_hre.70.t:0 "Bohemian Rhapsody"
 dod_hre.70.d:0 "The composer Smetana has published his new opus, the 'Bohemian Rhapsody'. The romantic piece has been a great success at the court in Prague, and musicians all over the world are now playing it."
 dod_hre.70.f:0 "They say you can hear it even in Zanzibar."
 dod_hre.70.a:0 "Bravo!"

 dod_hre.71.t:0 "The 1100th Anniversary of the Empire"
 dod_hre.71.d:0 "In the year of Our Lord 800, Karl the Great, King of the Franks, was crowned Roman Emperor by the Pope, claiming the inheritance of the old Empire. The Empire vanished for a few decades amid the wars of the Karling kings, but Otto I revived it in 967. Today we celebrate the crowning of Charlemagne and the resilience of an Empire that has changed so much over the centuries. The Emperor will attend mass in the Palatine Chapel, in memory of the Father of Europe."
 dod_hre.71.f:0 "Eleven centuries of Empire."
 dod_hre.71.a:0 "Vivat Imperator!"

 # Modifiers
 dod_imperial_guarantees:0 "Imperial Guarantees"
 dod_imperial_guarantees_desc:0 "The Emperor has promised the princes that their rights will be respected in the new Reich."
 dod_imperial_hegemony:0 "Imperial Hegemony"
 dod_imperial_hegemony_desc:0 "The Emperor's authority runs from the Danube to the Elbe."
 dod_federal_reich:0 "Federal Reich"
 dod_federal_reich_desc:0 "The Reich rests on the loyalty of its many crowns."
 dod_princes_endure:0 "The Princes Endure"
 dod_princes_endure_desc:0 "The Emperor failed to bring the princes to heel."
 dod_bohemian_crackdown:0 "Bohemian Crackdown"
 dod_bohemian_crackdown_desc:0 "The violent suppression of the Prague riots has outraged educated society."
 dod_bohemian_mobilisation:0 "Bohemian Mobilisation"
 dod_bohemian_mobilisation_desc:0 "The whole nation has risen to fight for Bohemian freedom."
 dod_revolution_crushed:0 "Revolution Crushed"
 dod_revolution_crushed_desc:0 "The Bohemian revolt was defeated."
 dod_prague_lost:0 "Prague Lost"
 dod_prague_lost_desc:0 "The ancient Imperial capital is in foreign hands."
 dod_bohemian_victory:0 "Bohemian Victory"
 dod_bohemian_victory_desc:0 "Bohemia won its freedom from the Emperor."
 dod_bohemian_rhapsody:0 "Bohemian Rhapsody"
 dod_bohemian_rhapsody_desc:0 "Smetana's masterpiece is played across the world."
 dod_imperial_jubilee:0 "Imperial Jubilee"
 dod_imperial_jubilee_desc:0 "The Empire celebrates 1100 years since Charlemagne's coronation."

 # =============== Elbian Confederation ===============
 dod_form_elbian_confederation:0 "Found the Elbian Confederation"
 dod_form_elbian_confederation_desc:0 "Born of the liberal spirit of the age, the Elbian Confederation would unite Bohemians and Elbians as equals, from Prague to the Baltic shore."

 je_dod_elbian_unity:0 "Elbian Unity"
 je_dod_elbian_unity_reason:0 "Beyond Pomerania, the Baltic Elbians of Courland, Livonia and Baltenland live under the shadow of Scandinavia, Poland and Russia. Prague can offer them protection inside the Confederation, or impose it."
 je_dod_elbian_secession_war:0 "The Elbian Civil War"
 je_dod_elbian_secession_war_reason:0 "The League of Berlin has declared its independence from Prague. The Confederation must be reunited by the sword, or it will fall apart."
 je_dod_bohemian_secession_war:0 "The Bohemian Secession"
 je_dod_bohemian_secession_war_reason:0 "Prague has issued an Ordinance of Secession. Only war can now keep the Confederation united."

 dod_elb.1.t:0 "The Fredensborg Incident"
 dod_elb.1.d:0 "Prague has long encouraged Elbian merchants to trade with the rich kingdoms of the Gold Coast. A growing Elbian community settled in the European quarter of Accra, Fredensborg, angering the Ashanti chieftains who saw their trade threatened. As tensions rose, the merchants hired Bohemian mercenaries for protection. Now reports arrive of a massacre of the whole community, and the wildest rumours claim the Ashanti King drinks from the skull of the mercenaries' captain. If we want to protect our interests, we must take control of the Gold Coast."
 dod_elb.1.f:0 "Blood on the Gold Coast."
 dod_elb.1.a:0 "Send an ultimatum to the Ashanti."
 dod_elb.1.b:0 "We won't be distracted by colonial adventures."

 dod_elb.2.t:0 "The Elbian Demands"
 dod_elb.2.d:0 "The European presence in Accra has corrupted our kingdom. The merchants were expelled in 1817, but they crept back, tolerated for the profit of their trade. Now the chieftains have sacked their quarter and killed or enslaved the merchants. The Elbian Confederation sends us an ultimatum, demanding that we submit to its protection."
 dod_elb.2.f:0 "The Europeans want our coast."
 dod_elb.2.a:0 "We won't give up without a fight."
 dod_elb.2.b:0 "We can't afford war with a Western power."

 dod_elb.3.t:0 "The Elbian-Ashanti War"
 dod_elb.3.d:0 "The Ashanti King has refused to cede any more of his sovereignty to European colonisers. There is little doubt that war is coming."
 dod_elb.3.f:0 "To the Gold Coast."
 dod_elb.3.a:0 "Ashanti transgressions shall not go unpunished."
 dod_elb.3.b:0 "We can't afford a distraction in Africa right now."

 dod_elb.10.t:0 "An Invitation to the Baltic"
 dod_elb.10.d:0 "[SCOPE.sCountry('dod_baltic_target').GetName] is home to Elbians who live in fear of the great powers around them. Shall we propose that they join the Confederation?"
 dod_elb.10.f:0 "United we stand."
 dod_elb.10.a:0 "Send our diplomats."
 dod_elb.10.b:0 "Not now."

 dod_elb.11.t:0 "Prague Proposes Integration into the Elbian Confederation"
 dod_elb.11.d_courland:0 "Courland has kept its independence for centuries by balancing between Copenhagen and Warsaw. With Poland in decline, we have fallen ever further under Scandinavian control. Now diplomats from Prague propose that we place ourselves under the protection of the Elbian Confederation. It would end the threat of a Scandinavian takeover, but also centuries of defiant Courlander independence."
 dod_elb.11.d_livonia:0 "For centuries the Baltic was a no-man's land between Copenhagen and Warsaw, until the Elbians rose up and founded an independent Livonia. That independence looks ever more brittle, as the Latvian and Estonian peasantry grows restless and Russia and Poland grow bolder. Diplomats from Prague now offer a way out: incorporation into the Elbian Confederation, in exchange for its protection."
 dod_elb.11.d_baltenland:0 "Once masters of the Baltic, the Elbians east of Pomerania steadily lost their independence to Poland-Lithuania and Scandinavia. Our new pan-Baltic state gives hope, but Polish revanchism and Russian expansion threaten it. Bohemian diplomats propose that we join the Elbian Confederation: protection from the threats on the horizon, at the cost of our hard-won independence."
 dod_elb.11.f:0 "Protection, at a price."
 dod_elb.11.a:0 "Accept the proposal. United we stand!"
 dod_elb.11.b:0 "We will not submit to the Bohemians."

 dod_elb.12.t:0 "Our Proposal is Refused"
 dod_elb.12.d:0 "Our diplomats have returned empty-handed. The Baltic Elbian nobility has made it crystal clear that it will not give up an inch of its power or privileges. Force is our only option, if we insist."
 dod_elb.12.f:0 "Brothers, divided."
 dod_elb.12.a:0 "Elbian unity is non-negotiable."
 dod_elb.12.b:0 "No blood will be shed between brothers."

 dod_elb.15.t:0 "The Baltic Joins the Confederation"
 dod_elb.15.d:0 "Every Elbian state on the Baltic now stands under the protection of Prague. Bohemians and Elbians share one Confederation, from the Sudetes to the Gulf of Riga. Whether the old balance between them can survive millions of new Elbian citizens is another matter."
 dod_elb.15.f:0 "From the Sudetes to Riga."
 dod_elb.15.a:0 "A great day for the Confederation."

 dod_elb.20.t:0 "Elbian Agitation in the Baltic"
 dod_elb.20.d:0 "Since the Northern Crusades, the Elbians have dominated the upper ranks of Baltic society, and Mitau and Riga have taken on a strongly German character. The Baltic Elbian nobility has long been loyal and enjoyed ample autonomy. But with the rise of nationalism and the founding of the Elbian Confederation, more and more of them call for an independent Livonian state and plead with Prague to intervene."
 dod_elb.20.f:0 "Trouble in Riga."
 dod_elb.20.a:0 "We can expect trouble in the coming months."

 dod_elb.21.t:0 "The Baltic Elbian Plight"
 dod_elb.21.d:0 "The Confederation was meant to bind Elbians and Bohemians together and keep nationalism in check. Now that same force is rising in our northern provinces as news of Elbian repression in the Baltic spreads. Committees for Baltic Friendship are opening across the North, and calls for intervention grow louder. We could declare ourselves protectors of the Baltic Elbians, but that would put us on the warpath with the masters of Riga."
 dod_elb.21.f:0 "Our brothers call for help."
 dod_elb.21.a:0 "We shall liberate our Elbian brothers."
 dod_elb.21.b:0 "We can't upset the balance between Bohemians and Elbians."

 dod_elb.22.t:0 "The New Regime in Riga"
 dod_elb.22.d:0 "Our victories have brought the Baltic Elbians under our flag, and turmoil to the Confederation. The northern states demand outright annexation, while Bohemia and Moravia refuse any further commitment to a backwater of no interest to Bohemians. One compromise is possible: a Baltic Elbian state outside the Confederation, under the close supervision of Prague."
 dod_elb.22.f:0 "Freundschaft, Frohsinn, Tugend, Wissen: soll man nie bei den Balten missen."
 dod_elb.22.a:0 "Create a Baltic state under our protection."
 dod_elb.22.b:0 "Annex the Baltic outright."

 dod_elb.30.t:0 "Secession Crisis in the Elbian Confederation"
 dod_elb.30.d:0 "The Elbian Confederation was born of the liberal revolutions, founded on the rejection of absolutism and the equality of Bohemians and Elbians. That understanding has broken down as the Confederation slid into authoritarianism, ruled with an iron fist from Prague. Representatives of the Elbian states have met and concluded that the Confederation is dead and secession is the only way. North of the Sudetes, barricades are going up as the country braces for civil war."
 dod_elb.30.f:0 "The League of Berlin is born."
 dod_elb.30.a:0 "The Confederation shall be reunited, by force if necessary."
 dod_elb.30.b:0 "If the Elbians want to go, they can go."

 dod_elb.31.t:0 "The Confederation Restored"
 dod_elb.31.d:0 "The League of Berlin has been defeated and the Elbian lands are ours once more. The Confederation endures, though it will never again be the federation of equals its founders dreamed of."
 dod_elb.31.f:0 "Union, enforced by the sword."
 dod_elb.31.a:0 "The Confederation endures."

 dod_elb.32.t:0 "The Dissolution of the Elbian Confederation"
 dod_elb.32.d:0 "The dream of a common state for Elbians and Bohemians has proven folly. The League of Berlin has asserted its independence, and a border is drawn north of the old duchies of Bohemia and Silesia. The rump Confederation accepts the turning of the tide, declares itself dissolved and gives up all claims to German domination."
 dod_elb.32.f:0 "Grasp all, lose all."
 dod_elb.32.a:0 "Bohemia stands alone."

 dod_elb.40.t:0 "Uprising in Prague"
 dod_elb.40.d:0 "The Baltic question has torn the fragile Confederation apart. The balance between Bohemians and Elbians could not survive millions of new non-Bohemian citizens. Fearing that Bohemia would become little more than an Elbian protectorate, the governor in Prague has issued an Ordinance of Secession, and the other Bohemian provinces have followed. As barricades go up and Elbian forces are recalled to Berlin, only war can keep the Confederation united."
 dod_elb.40.f:0 "Alea iacta est."
 dod_elb.40.a:0 "The upstart revolutionaries will be crushed in due time."
 dod_elb.40.b:0 "We won't keep the Bohemians in by force."

 dod_elb.41.t:0 "Bohemia Brought Back"
 dod_elb.41.d:0 "The Bohemian secession has been crushed and Prague is ours again. The Confederation survives, held together now by force rather than consent."
 dod_elb.41.f:0 "One Confederation, by any means."
 dod_elb.41.a:0 "The Confederation survives."

 dod_elb.42.t:0 "The Disintegration of the Elbian Confederation"
 dod_elb.42.d:0 "The Elbian Confederation, born of the dream of Bohemians and Elbians living in harmony, is no more. The Bohemian Republic has won its independence, leaving only the German and Baltic lands. The Confederation was Prague's vision; without Bohemia, we must accept reality and remake ourselves as an Elbian nation."
 dod_elb.42.f:0 "Einmal ist keinmal."
 dod_elb.42.a:0 "A new Elbian nation."

 dod_elbian_confederation_founded:0 "Founding of the Confederation"
 dod_elbian_confederation_founded_desc:0 "Bohemians and Elbians have joined as equals in a new Confederation."
 dod_colonial_humiliation:0 "Colonial Humiliation"
 dod_colonial_humiliation_desc:0 "We backed down in the face of an African kingdom."
 dod_brothers_spared:0 "Brothers Spared"
 dod_brothers_spared_desc:0 "We refused to force our Baltic brothers into the Confederation."
 dod_baltic_betrayal:0 "Baltic Betrayal"
 dod_baltic_betrayal_desc:0 "We abandoned the Baltic Elbians to their fate."
 dod_elbian_union_restored:0 "Union Restored"
 dod_elbian_union_restored_desc:0 "The secessionists were defeated and the Confederation restored."
 dod_grasp_all_lose_all:0 "Grasp All, Lose All"
 dod_grasp_all_lose_all_desc:0 "The Confederation has broken apart."
