l_english:
 dod_col_pla_upper_messipi:0 "Claim the Upper Messipi"
 dod_col_pla_upper_messipi_desc:0 "The Messipi is a crucial waterway for the economy of our country, vertebrating trade and transport on a south-north axis beggining in our capital, Nouvelle Orleáns, located on the delta. If we control direclty the upper course we will be able to extend our influence north-westwards, bringing a large territory in continental Arcadia under our control and pre-emting Lusitanian expansion into the area."
 dod_col_pla_messipi_basin:0 "Claim the Sioux Hinterland"
 dod_col_pla_messipi_basin_desc:0 "We now control most of the Messipi watershed, with only the lands far to the North inhabited by the Sioux resisting our rule. Although we already have relations with them through traders and missionaries, it is time to bring them closer into our fold, forcefully if necessary."
 dod_col_vin_gylhenvik:0 "Claim Gylhenvik"
 dod_col_vin_gylhenvik_desc:0 "Thea area around lake Finnjøn is divided between Rhønnst, Algonquin and Sioux tribes which are mutually hostile. For a long time we have mantained a policy of divide and rule to forward our interests, but now it might be time to directly occupy the area and establish formally our frontier with the Rønnst polity further west."
 dod_col_vin_tjorin:0 "Claim Tjorin"
 dod_col_vin_tjorin_desc:0 "In recent years reports from prospectors have shown region of Tjørin is rich in coal ore. Wrestling control of this land from the native Sioux tribes will allow us to establish coal mines and fuel our hungry industry"
 dod_col_vin_northern_lakes:0 "Claim the Northern Lakes"
 dod_col_vin_northern_lakes_desc:0 "The territories to the extreme North-West of our frontiers are inhospitable and largely uncharted except for a few major landmarks reported by fur traders. Although mostly frozen wastes, occuppying this area around lakes Blasjøn and Lillenhavet will give us control over large tracts of unclaimed land, ripe for prospecting."
 dod_col_ama_amazonian_basin:0 "Claim the Amazonian Basin"
 dod_col_ama_amazonian_basin_desc:0 "For years, the vast and largely unexplored amazonian basin has drawn adventurers from all over our country, driven by a promise of fortune. Now that we have the technology to establish long-distance communication, using the waterways to transport personnel and supplies, we can finally occupy the amazonian hinterland and its riches before other powers do so."
 dod_col_ama_amazonie_profonde:0 "Claim Amazonie Profonde"
 dod_col_ama_amazonie_profonde_desc:0 "Although we have established firm control over most of the Amazonian basin, the northernmost territories are still uncharted, the dense rainforest hindering settlement of colonists. Recent technological advances and, most importantly, the rise of rubber as a valuable commodity, have however made this region, previously thought to be economically barren, target for fortune seekers coming up the Amazon River. It is on our best interests to establish formal control over the area and exploit its resources."
 dod_col_lot_grand_chaco:0 "Claim the Grand Chaco"
 dod_col_lot_grand_chaco_desc:0 "The Grand Chaco lies on our eastern frontier, inhabited mostly by nomadic Guarani tribes. Although most of it is arid and unsuitable for agriculture, we have a formal claim on it since the 18th Century explorations by Burgundian missionaries, and we would to well to occupy it before other powers move in to encroach upon our frontiers."
 dod_col_gan_wencheng:0 "Claim Wencheng"
 dod_col_gan_wencheng_desc:0 "The Azhou peninsula lies north to our lands. Controlling it would give us access to fertile lands for farming as well as a commanding position in the Torres strait, making it a strategic possession."
 dod_col_gan_oodnatta:0 "Claim Oodnatta"
 dod_col_gan_oodnatta_desc:0 "The region of Oodnatta is mostly arid and unsuitable for agriculture, but the areas around the South-Eastern lakes and the southern coast have a much milder climate, making them targets for the settlement of Zhourao pioneers."
 dod_col_gan_noongar:0 "Claim Noongar"
 dod_col_gan_noongar_desc:0 "The areas around Noongar and Kojonup represent the most fertile land in the western coast of the continent. Bringing them under our control will be an important step in our expansion westwards, before foreign powers establish colonies that might threaten the integrity of our celestial realm."
 dod_col_gan_coomalong:0 "Claim Coomalong"
 dod_col_gan_coomalong_desc:0 "Establishing direct control over the Coomalong region will finally formalize our direct control over the entire seaboard of Zhourao. Heaven has led us west!"
 dod_col_gan_yolngu:0 "Claim Yolngu"
 dod_col_gan_yolngu_desc:0 "The climate in the region of Yolngu is harsh, but establishing premanent presence in the Northen coast would allow us to establish firmer trade links with Nusantara and its rich lands."
 dod_col_gan_pitja:0 "Claim Pitjantjatjara"
 dod_col_gan_pitja_desc:0 "The Pitjantjatjara desert is the last remnant of untamed land in our realm. Although dry, inhospitable and sparsely populated, establishing direct control would allow Zhourao prospectors to look for valuable resources."
 dod_col_aot_motu_timu:0 "Claim Motu Timu"
 dod_col_aot_motu_timu_desc:0 "Motu Timu, the island south of our great realm, is inhabited by various fragmented Maori tribes. It is time to formally occupy Motu Pari, before any colonial power decides to enslave our brothers to the south!"
 dod_col_dng_yicheng:0 "Claim Yicheng"
 dod_col_dng_yicheng_desc:0 "Traditionally our Eastern border has been delimited by the Great Eastern Mountain Range, except for its southernmost section, where the native Pueblo people still control land west of the cordillera. Recent reports by prospectors have pointed out to the presence of coal ore in the region, which if we control directly could be used to build up our industry."
 dod_col_dng_haikou:0 "Claim Haikou"
 dod_col_dng_haikou_desc:0 "Although in the past Qingqiuan polities have seen the Great Eastern Mountain Range as the natural border of our realm, in recent years the great plains beyond to the west have become enticing avenues of expansion. Formalizing our claim to the area would allow us to exploit its resources and prevent Easterners from encroaching upon our natural frontiers."
 dod_col_dng_yulin:0 "Claim Yulin"
 dod_col_dng_yulin_desc:0 "With the Great Eastern Mountain Range now fully in our control, it has become time to move our frontiers westward and establish a buffer zone against Easterner agression."
 dod_col_dng_baizehu:0 "Claim Baizehu"
 dod_col_dng_baizehu_desc:0 "The Baizehu region has been disputed for many years between us and the Rhonnst people, with neither side actually exercising direct control over the area. We must move first and establish a formal colony in the area!"
 dod_col_dng_tangwan:0 "Claim Tangwan"
 dod_col_dng_tangwan_desc:0 "Tangwan, the region immediately north to our northernmost settlements, has for many years attracted Qingqiuan settlers looking to participate in the lucrative fur trade. It might be time to formally occupy these lands, lest our competitors east or west steal our thunder."
 dod_col_hhr_baizehu:0 "Claim Baizehu"
 dod_col_hhr_baizehu_desc:0 "The Baizehu region has been disputed for many years between us and the Qingqiu people, with neither side actually exercising direct control over the area. We must move first and establish a formal colony in the area!"
 dod_col_hhr_tjorin:0 "Claim Tjorin"
 dod_col_hhr_tjorin_desc:0 "Traditionally an area of conflict between our Rhonnst brothers and Sioux and Angolquin tribes, the Tjorin region is now being threatened by Vinlander expansionism. We must move quickly if we are to secure our borders against western agression."
 dod_col_hhr_torsmark:0 "Claim Torsmark"
 dod_col_hhr_torsmark_desc:0 "Although sparsely populated, the Torsmark region is home to a significant Rhonnst population. We should establish firmer control of the area in hopes of deterring further western expansionism and exploitation of our kin."
 dod_col_sahara_1807:0 "Claim the Tessalit Oasis"
 dod_col_sahara_1807_desc:0 "The nomads of the Saharan desert have always been too trouble with not enough benefits to be kept under control. With the Great Powers quickly setting out to carve Africa, establishing proper borders and proper control of even remote regions becomes a necessity. We can  strike out a series of treaties to set up the Saharan frontier of our territories and eliminate any possibility of border conflicts in the Sahara."
 dod_col_sahara_1813:0 "Claim Agadés"
 dod_col_sahara_1813_desc:0 "Agadés has been for over half a millennia a crucial node in trans-Saharan trade, being the crossroad of caravan roads coming east from Kano, west from Timbuktu and north from Tripoli. Controling it would grant us uncontested control over the Tuareg people living in the surrounding region."
 dod_col_sahara_1825:0 "Claim Zouar"
 dod_col_sahara_1825_desc:0 "The nomads of the Saharan desert have always been too trouble with not enough benefits to be kept under control. With the Great Powers quickly setting out to carve Africa, establishing proper borders and proper control of even remote regions becomes a necessity. We can  strike out a series of treaties to set up the Saharan frontier of our territories and eliminate any possibility of border conflicts in the Sahara."
