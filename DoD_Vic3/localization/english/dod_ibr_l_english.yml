l_english:
 dod_propose_iberian_union:0 "Propose an Iberian Union"
 dod_propose_iberian_union_desc:0 "Uniting Iberia was the ambition of medieval monarchs: Sancho III of Navarre and Alfonso VII of Leon and Castile both styled themselves Emperor of All Hispania. Now that Aragon is in decline, the dream is within reach."
 dod_integrate_catalans:0 "Catalan Acceptance"
 dod_integrate_catalans_desc:0 "The Catalans refused union at first, but our standing in Europe has made them reconsider."
 dod_unify_navarra:0 "Unify with Navarre"
 dod_unify_navarra_desc:0 "To truly become the Iberian Union, we must bring the Basque lands into our country."
 dod_form_mancomunidad:0 "Mancomunidad de las Naciones Colombianas"
 dod_form_mancomunidad_desc:0 "Liberalism has changed our society, and the old relationship between Castilians and criollos, built on inequality and submission, can no longer stand. It is time for a new era of brotherhood between the Hispanic peoples."
 dod_iberian_cooperation:0 "Perpetual Treaty of Iberian Friendship"
 dod_iberian_cooperation_desc:0 "Spain and Aragon have had a stormy relationship for centuries. Now that our interests lie across the ocean, we can offer Aragon lasting friendship."
 dod_greater_euskadia:0 "Greater Euskadi"
 dod_greater_euskadia_desc:0 "To secure our position on the Bay of Biscay, we must extend our lands to the north."
 dod_mancomunidad:0 "La Mancomunidad"
 dod_mancomunidad_desc:0 "The Hispanic peoples share in the government of the empire."
 dod_ibr.2.t:0 "Spain Proposes an Iberian Union"
 dod_ibr.2.d:0 "The venerable Crown of Aragon, once master of the western Mediterranean, is no more, and our state is reduced to its Catalan core. Madrid now proposes that Catalonia join a great Iberian Confederation."
 dod_ibr.2.f:0 "Union, or independence?"
 dod_ibr.2.a:0 "The Catalans will have a brighter future within Spain."
 dod_ibr.2.b:0 "Catalonia will never submit to Castilian imperialism!"
 dod_ibr.3.t:0 "The Catalans Refuse Our Offer"
 dod_ibr.3.d:0 "The Catalan diplomats have returned a stern answer: Catalan independence is inviolable, and they will never accept union."
 dod_ibr.3.f:0 "There shall be Catalan autonomy no more."
 dod_ibr.3.a:0 "The Catalans will join the Confederation by force."
 dod_ibr.3.b:0 "Let them keep their independence, for now."
 dod_ibr.4.t:0 "The Plight of the Basques"
 dod_ibr.4.d:0 "Spain has almost achieved its medieval dream: a united Iberia from the Algarve to Perpignan. Only one piece is missing. The Basques have fallen under foreign rule, and it is our duty to free them."
 dod_ibr.4.f:0 "Euskadi shall be ours."
 dod_ibr.4.a:0 "Euskadi shall be ours."
 dod_ibr.5.t:0 "The Mancomunidad"
 dod_ibr.5.d:0 "The Commonwealth of Colombian Nations has been proclaimed. The old relationship of inequality between Castilians and criollos is over, and the overseas peoples now share in the government of the empire."
 dod_ibr.5.f:0 "Viva la Mancomunidad!"
 dod_ibr.5.a:0 "Viva la Mancomunidad de las Naciones Colombianas!"
 dod_ibr.6.t:0 "The Cuban Dominion"
 dod_ibr.6.d:0 "The Cubans ask to be granted the same self-government as their Colombian brothers."
 dod_ibr.6.f:0 "Home rule for Cuba?"
 dod_ibr.6.a:0 "This can only be good for the empire."
 dod_ibr.6.b:0 "No, they shall remain under our direct control."
 dod_ibr.7.t:0 "Perpetual Treaty of Iberian Cooperation"
 dod_ibr.7.d:0 "The new Hispanic Commonwealth has made an intriguing offer. Now that Madrid looks mostly to the New World, its European interests no longer clash with ours, and it proposes a perpetual treaty of friendship."
 dod_ibr.7.f:0 "Iberian brothers, or rivals?"
 dod_ibr.7.a:0 "A welcome proposal from our Iberian brethren."
 dod_ibr.7.b:0 "We are fine on our own."
 dod_ibr.7.c:0 "We will crush the Spanish upstarts!"
 dod_ibr.8.t:0 "The Aragonese Insult Us"
 dod_ibr.8.d:0 "Not only has Aragon refused our treaty, it has expelled our diplomats and insulted our nation. If they want a war, they shall have one!"
 dod_ibr.8.f:0 "To war!"
 dod_ibr.8.a:0 "To war!"
 dod_ibr.8.b:0 "We will not stoop to their level."
 dod_ibr.10.t:0 "Basque Independence?"
 dod_ibr.10.d:0 "Navarre has been at the centre of rival ambitions since the Renaissance. Forsaken by the Spanish Crown, it was coveted by both Aragon and the Dual Monarchy, and Aragon struck first. Now that Aragon is weakening, King Henry IV sees a chance to break free."
 dod_ibr.10.f:0 "Navarre for the Navarrese!"
 dod_ibr.10.a:0 "We will ask the Anglo-French for help!"
 dod_ibr.10.b:0 "We will ask Spain for help!"
 dod_ibr.10.c:0 "We are no vultures. Aragon has our loyalty!"
 dod_ibr.11.t:0 "A Call from Pamplona"
 dod_ibr.11.d:0 "The King of Navarre asks for our help in winning his independence. Aragon may be decaying, but it is not dead yet. Henry IV awaits our answer."
 dod_ibr.11.f:0 "Help Navarre?"
 dod_ibr.11.a:0 "Of course we will help Navarre."
 dod_ibr.11.b:0 "His place is under the Aragonese yoke."
 dod_ibr.13.t:0 "A Call from Pamplona"
 dod_ibr.13.d:0 "The King of Navarre asks for our help in winning his independence from Aragon. Henry IV de Bourbon awaits our answer."
 dod_ibr.13.f:0 "Help Navarre?"
 dod_ibr.13.a:0 "Of course we will help Navarre!"
 dod_ibr.13.b:0 "It is Aragon's domain..."
 dod_ibr.12.t:0 "Independence of Navarre!"
 dod_ibr.12.d:0 "With foreign backing, Navarre has proclaimed its independence. The Aragonese legate and all Aragonese officials have been expelled, and Henry IV has been acclaimed by the crowds of Pamplona. Aragon will not take this lying down."
 dod_ibr.12.f:0 "Let them come!"
 dod_ibr.12.a:0 "Let them come!"
 dod_ibr.14.t:0 "Abandoned"
 dod_ibr.14.d:0 "Our allies beyond the Pyrenees have refused to help us. Without them, our plan is doomed, unless Spain will listen."
 dod_ibr.14.f:0 "Is there still hope?"
 dod_ibr.14.a:0 "Call the Spanish king!"
 dod_ibr.14.b:0 "It may be time to give up this folly..."
 dod_ibr.15.t:0 "The Death of Henry IV of Navarre"
 dod_ibr.15.d_main:0 "The Bourbon line has produced ever fewer sons. The last true Bourbon, descendant of Hugh Capet, has died in Pamplona. He leaves two possible heirs: his sister, the Countess of San Sebastian, married into the Aragonese royal family, and his niece, the Infante of Bilbao, wife of the Dauphin of the Dual Monarchy."
 dod_ibr.15.f:0 "The Bourbons are gone."
 dod_ibr.15.a:0 "The Infante of Bilbao is the rightful queen!"
 dod_ibr.15.b:0 "The Countess of San Sebastian is the rightful queen!"
 dod_ibr.15.c:0 "We don't need any monarchs!"
 dod_ibr.16.t:0 "The Coronation of the Infante of Bilbao"
 dod_ibr.16.d:0 "The Navarrese Estates have crowned the Dauphin's wife Queen of Navarre, and Anglois troops have entered the Basque lands to guard them against Aragon. The Aragonese court is furious: the Countess of San Sebastian had the better claim."
 dod_ibr.16.f:0 "Soon kings of France, England and Navarre."
 dod_ibr.16.a:0 "Soon kings of France, England and Navarre!"
 dod_ibr.17.t:0 "The Coronation of the Countess of San Sebastian"
 dod_ibr.17.d:0 "The Navarrese Estates have crowned Henry IV's sister Queen of Navarre, and our troops have secured the Basque mountains against an Anglois intervention. Paris will not like this."
 dod_ibr.17.f:0 "Navarre has always been ours."
 dod_ibr.17.a:0 "Navarre has always been ours."
 dod_ibr.18.t:0 "Reaction to the Anglois Takeover"
 dod_ibr.18.d:0 "The Navarrese Estates chose the Infante of Bilbao as Queen, denying the rights of her aunt, the Countess of San Sebastian. We could press the Countess's claim, or let the matter drop."
 dod_ibr.18.f:0 "Press the claim?"
 dod_ibr.18.a:0 "Crown the Countess Queen of Navarre!"
 dod_ibr.18.b:0 "Acknowledge the Infante of Bilbao..."
 dod_ibr.19.t:0 "Reaction to the Aragonese Takeover"
 dod_ibr.19.d:0 "The Navarrese Estates chose the Countess of San Sebastian as Queen, denying the rights of her niece, the Infante of Bilbao. We could press the Infante's claim, or let the matter drop."
 dod_ibr.19.f:0 "Press the claim?"
 dod_ibr.19.a:0 "Crown the Infante Queen of Navarre!"
 dod_ibr.19.b:0 "Acknowledge the Countess of San Sebastian..."
 dod_ibr.20.t:0 "Rival Claims to Navarre"
 dod_ibr.20.d:0 "A rival crown is pressing its claim to the throne of Navarre. We could send an ultimatum demanding that they back down, or let them dream."
 dod_ibr.20.f:0 "An ultimatum?"
 dod_ibr.20.a:0 "Send an ultimatum! Navarre is rightfully ours."
 dod_ibr.20.b:0 "Who cares about their claims?"
