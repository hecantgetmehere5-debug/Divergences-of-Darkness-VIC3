l_english:
 je_dod_timurtash_restoration:0 "The Timurtash Restoration"
 je_dod_timurtash_restoration_reason:0 "The Timurtash Empire has fragmented, its provinces held by rival dynasties and rebellious governors. Firuz II must reassert the throne's authority over the Iranian heartlands."
 dod_unite_iran:0 "Unite Iran"
 dod_unite_iran_desc:0 "The lands of Iran have been divided for too long. We hold enough of them to proclaim a single Iranian state."
 dod_iranshahr:0 "Iranshahr Reborn"
 dod_iranshahr_desc:0 "Iran must reclaim every land where Iranian peoples live, from the Caucasus to the Indus."
 dod_reclaim_mawarannahr:0 "Reclaim Mawara an-Nahr"
 dod_reclaim_mawarannahr_desc:0 "Transoxiana was the heart of the old Timurid empire. It must be ours again."
 dod_revoke_karabakh:0 "Revoke the Treaty of Karabakh"
 dod_revoke_karabakh_desc:0 "The treaty that gave the Caucasus khanates their autonomy was signed in weakness. It is void."
 dod_iran_armenians:0 "Integrate the Armenians"
 dod_iran_armenians_desc:0 "The Armenians have served Iran as merchants and craftsmen for centuries. They deserve full rights."
 dod_settle_nomads:0 "Force the Tribes to Settle Down"
 dod_settle_nomads_desc:0 "The nomadic tribes must give up their wandering and become farmers and townsmen."
 dod_avenge_karbala:0 "Avenge the Martyrs of Karbala"
 dod_avenge_karbala_desc:0 "The holy shrines of Iraq must be under Shi'a protection."
 dod_lahijan_tea:0 "Encourage Tea Plantations in Lahijan"
 dod_lahijan_tea_desc:0 "The humid slopes of Gilan are perfect for tea."
 dod_kk_modern_army:0 "Reform the Army along Western Lines"
 dod_kk_modern_army_desc:0 "Our tribal levies are no match for modern armies. We need drilled regiments and modern guns."
 dod_irq_shield:0 "Become the Shield of the Levant"
 dod_irq_shield_desc:0 "Iraq must protect all the Arabs of the Fertile Crescent."
 dod_irq_persian_dream:0 "The Persian Dream"
 dod_irq_persian_dream_desc:0 "Iran is divided and weak. Its western lands are ripe for the taking."
 dod_arab_sharia:0 "Institutionalise Shari'a"
 dod_arab_sharia_desc:0 "The law of God must be the law of the land."
 dod_arab_secular:0 "Secularise Society"
 dod_arab_secular_desc:0 "Modern states separate faith from government."
 dod_arab_nationalism:0 "Encourage Arab Nationalism"
 dod_arab_nationalism_desc:0 "All Arabs are one nation, whatever their tribe or region."
 dod_restore_rashids:0 "Restore the House of Rashid"
 dod_restore_rashids_desc:0 "The House of Rashid once ruled the heart of Arabia. With the Nejd fallen, we can restore it."
 dod_claim_caliphate:0 "Claim the Title of Caliph"
 dod_claim_caliphate_desc:0 "We hold the Holy Cities. The title of Caliph is ours by right, not the Sultan's."
 dod_form_uar:0 "Unite All the Arab Nations"
 dod_form_uar_desc:0 "From the Atlantic to the Gulf, the Arabs must be one state."
 dod_form_kurdistan:0 "Unite the Kurdish States"
 dod_form_kurdistan_desc:0 "The Kurdish emirates must unite into a single Kurdistan."
 dod_soyurghal_curbed:0 "Soyurghals Curbed"
 dod_soyurghal_curbed_desc:0 "The governors' land grants are being reined in."
 dod_clergy_pleased:0 "Clergy Pleased"
 dod_clergy_pleased_desc:0 "The clergy approve of our religious policy."
 dod_clergy_angered:0 "Clergy Angered"
 dod_clergy_angered_desc:0 "The clergy resent our religious policy."
 dod_khorasan_purge:0 "Khorasan Purge"
 dod_khorasan_purge_desc:0 "The rebellious governors are being purged."
 dod_turquoise_mines:0 "Turquoise Mines"
 dod_turquoise_mines_desc:0 "The mines of Nishapur enrich the treasury."
 dod_khorasani_letters:0 "Khorasani Letters"
 dod_khorasani_letters_desc:0 "Khorasani poetry is in fashion."
 dod_timurtash_restored:0 "Timurtash Restored"
 dod_timurtash_restored_desc:0 "The Timurtash rule Iran once more."
 dod_constitutional_fervour:0 "Constitutional Fervour"
 dod_constitutional_fervour_desc:0 "The intelligentsia demand a Majles."
 dod_majles_opened:0 "The Majles"
 dod_majles_opened_desc:0 "A parliament now sits in Lahijan."
 dod_monarchy_lives_on:0 "The Monarchy Lives On"
 dod_monarchy_lives_on_desc:0 "The Amir crushed the revolution."
 dod_shahdom_centralised:0 "Centralised Shahdom"
 dod_shahdom_centralised_desc:0 "The tribes serve the Shah."
 dod_armenia_free:0 "Armenia Free"
 dod_armenia_free_desc:0 "The Shaki have been driven out."
 dod_caliphate_lost:0 "Caliphate Lost"
 dod_caliphate_lost_desc:0 "The Sultan no longer claims the Caliphate."
 dod_assyrian_coexistence:0 "Assyrian Coexistence"
 dod_assyrian_coexistence_desc:0 "Kurds and Assyrians live as equals."
 dod_assyrian_persecution:0 "Assyrian Persecution"
 dod_assyrian_persecution_desc:0 "The Assyrians are being persecuted."
 dod_baalbek_ruins:0 "Ruins of Baalbek"
 dod_baalbek_ruins_desc:0 "Scholars flock to the temples of Baalbek."
 dod_sharia_law:0 "Shari'a Law"
 dod_sharia_law_desc:0 "The law of God is the law of the land."
 dod_secular_society:0 "Secular Society"
 dod_secular_society_desc:0 "Faith and government are separate."
 dod_tea_plantations:0 "Lahijan Tea"
 dod_tea_plantations_desc:0 "Tea plantations flourish in Gilan."
 dod_western_army:0 "Western-Style Army"
 dod_western_army_desc:0 "Our army is drilled along Western lines."
 dod_settled_tribes:0 "Settled Tribes"
 dod_settled_tribes_desc:0 "The nomads are becoming farmers."
 dod_caliph:0 "Caliph"
 dod_caliph_desc:0 "Our ruler is Caliph of all Muslims."
 dod_per.1.t:0 "Fragmentation and Florescence"
 dod_per.1.d:0 "The venerable land of Iran is in turmoil. The Timurtash, Shahanshahs of Iran for over two centuries, have lost their grip, and rival dynasties rule in Tabriz, Shiraz and Lahijan. Yet from the chaos, poets, scholars and merchants flourish as never before."
 dod_per.1.f:0 "Who will reunite Iran?"
 dod_per.1.a:0 "Iran will be whole again."
 dod_per.2.t:0 "The Soyurghal System"
 dod_per.2.d:0 "Disastrous defeats against the Ottomans and the Dzunghar conquest of Transoxiana forced the Timurtash to buy the loyalty of their governors with soyurghals: hereditary land grants that drain the treasury and weaken the throne."
 dod_per.2.f:0 "Reform, or keep the governors happy?"
 dod_per.2.a:0 "The soyurghals must be curbed."
 dod_per.2.b:0 "We cannot afford to anger the governors."
 dod_per.3.t:0 "The Persecution of the Ismaili Da'i"
 dod_per.3.d:0 "Ismailism is an esoteric branch of Shi'a Islam, and its missionaries have been gaining converts in Khorasan. The clergy demand that we persecute them."
 dod_per.3.f:0 "Tolerance, or the clergy's favour?"
 dod_per.3.a:0 "Persecute the Ismaili missionaries."
 dod_per.3.b:0 "Leave them in peace."
 dod_per.4.t:0 "The Conspiracy against Firuz II"
 dod_per.4.d:0 "In the middle of the night, during a hunting expedition, assassins sent by the military governors of Khorasan tried to kill Firuz II. The Shahanshah survived, but the conspiracy runs deep."
 dod_per.4.f:0 "War looms over Khorasan once more."
 dod_per.4.a:0 "Crush the governors!"
 dod_per.4.b:0 "Buy them off, for now."
 dod_per.5.t:0 "Turquoise Mining in Nishapur"
 dod_per.5.d:0 "The mountains of Nishapur are dotted with turquoise mines that have supplied the jewellers of the world for centuries. New techniques could make them far more profitable."
 dod_per.5.f:0 "The blue stone of Persia."
 dod_per.5.a:0 "Invest in the mines."
 dod_per.6.t:0 "The Ruby of Badakhshan"
 dod_per.6.d:0 "Nasir Khusraw, the Khorasani poet and philosopher, wrote of the rubies of Badakhshan. A new edition of his works has become the talk of Herat."
 dod_per.6.f:0 "Poetry of the old empire."
 dod_per.6.a:0 "A treasure of our culture."
 dod_per.7.t:0 "The Restoration of the Timurtash Empire"
 dod_per.7.d:0 "The Timurtash Empire, so recently on the brink of collapse, has reasserted its authority over the heartlands of Iran. Firuz II will be remembered as the Restorer."
 dod_per.7.f:0 "Shahanshah of Iran once more."
 dod_per.7.a:0 "Glory to the Restorer!"
 dod_per.8.t:0 "The Death of Firuz II"
 dod_per.8.d:0 "Last night Firuz II, Shahanshah of the Timurtash Empire, passed away in his sleep. The empire mourns the man who saved it from ruin."
 dod_per.8.f:0 "Requiem for the Restorer."
 dod_per.8.a:0 "Long live the new Shahanshah!"
 dod_per.9.t:0 "The Turki Khojas of Moghulistan"
 dod_per.9.d:0 "The Tarim Basin has long been ruled by the Naqshbandi Khojas. Our diplomats suggest they could be brought under our protection, securing the mountain passes to the east."
 dod_per.9.f:0 "Beyond the Pamirs."
 dod_per.9.a:0 "Demand their tribute."
 dod_per.9.b:0 "The Tarim is too far."
 dod_per.10.t:0 "The Timurtash Demand Tribute"
 dod_per.10.d:0 "Timurtash envoys have crossed the Pamirs demanding that we become their tributaries. Refusing may bring an Iranian army down on our young state."
 dod_per.10.f:0 "Bow, or delay?"
 dod_per.10.a:0 "Bow before the Timurtash throne."
 dod_per.10.b:0 "Play for time."
 dod_per.20.t:0 "The Constitutionalist Movement"
 dod_per.20.d:0 "The ripples of events in distant lands are reaching the Kar-Kiya domains. The intelligentsia, inspired by Western ideas, call for a constitution and a parliament, a Majles, to limit the Amir's power."
 dod_per.20.f:0 "The Majles?"
 dod_per.20.a:0 "Let them talk."
 dod_per.21.t:0 "The Olama and the Merchants"
 dod_per.21.d:0 "The Olama, long allies of the Amirs, now fear for their courts and endowments, and the once apolitical merchants resent foreign concessions. Both are drifting towards the constitutionalists."
 dod_per.21.f:0 "The ground is shifting."
 dod_per.21.a:0 "Worrying."
 dod_per.22.t:0 "The Constitutional Revolution"
 dod_per.22.d:0 "The tensions between Amir Rostam Kiya and his subjects have finally erupted. Crowds have taken sanctuary in the shrine of Yahya ibn Abdallah, demanding a Majles. The Amir must decide."
 dod_per.22.f:0 "Bow, or break them?"
 dod_per.22.a:0 "Bow to popular pressure and open the Majles."
 dod_per.22.b:0 "Only absolute power can save the monarchy."
 dod_per.23.t:0 "Bloodbath at the Shrine"
 dod_per.23.d_kalwatiya:0 "The Amir's troops fired on the crowds in the holy shrine. Shaikh Zahed Rudbari, leader of the Kalwatiya Sufi order, seized the moment: his followers stormed the palace, and the Kar-Kiya monarchy has been replaced by a regime of the faithful."
 dod_per.23.d_monarchy:0 "The Amir's troops fired on the crowds in the holy shrine. The Kalwatiya tried to seize power, but the Cossack guard held the palace. The monarchy lives on, stained with blood."
 dod_per.23.f:0 "Lahijan burns."
 dod_per.23.a:0 "So be it."
 dod_per.24.t:0 "A Treaty of Friendship with Russia?"
 dod_per.24.d:0 "The Russian Empire looms over the Caspian. A treaty of friendship would protect us from our Iranian rivals, but Russian friendship always comes at a price."
 dod_per.24.f:0 "The Bear's embrace."
 dod_per.24.a:0 "Sign the treaty."
 dod_per.24.b:0 "We trust no Tsar."
 dod_per.30.t:0 "The Tribes of the Zagros"
 dod_per.30.d:0 "Nomadism in the Zagros dates back to the Mongol devastation of Iran. The Lurs and the Qashqai confederacy are the backbone of our army, but they obey the Shah only when it suits them."
 dod_per.30.f:0 "The tribes are our strength, and our weakness."
 dod_per.30.a:0 "Try to settle the tribes."
 dod_per.30.b:0 "Leave the tribes be."
 dod_per.31.t:0 "The Tribes Rise in Rebellion"
 dod_per.31.d:0 "The unwritten pact between the tribes and the Shah has broken down. The Lurs have risen and proclaimed their own state in Luristan."
 dod_per.31.f:0 "Chaos in southern Iran."
 dod_per.31.a:0 "Crush them!"
 dod_per.31.b:0 "Let the mountains have their chiefs."
 dod_per.32.t:0 "The Centralisation of the Shahdom"
 dod_per.32.d:0 "As the dust settles over Luristan, the balance of power has shifted decisively towards the throne. The tribal chiefs now serve the Shah, not the other way round."
 dod_per.32.f:0 "The Shah rules."
 dod_per.32.a:0 "The Shah rules."
 dod_per.40.t:0 "Wrath of the Highlands"
 dod_per.40.d:0 "Worrying news reach us from Erivan: the Armenian highlanders have rallied behind a peasant-king and refuse our authority."
 dod_per.40.f:0 "The Armenians rise."
 dod_per.40.a:0 "We will crush them."
 dod_per.41.t:0 "Gifts of the Mountains"
 dod_per.41.d:0 "The Shaki hordes will soon fall upon our reborn kingdom. But we have resisted here for generations, and we know these mountains."
 dod_per.41.f:0 "Armenia will be free!"
 dod_per.41.a:0 "Armenia will be free!"
 dod_per.41.b:0 "We cannot win. Submit."
 dod_per.42.t:0 "Armenia is Victorious!"
 dod_per.42.d:0 "The foreign tyrants have been driven out of our kingdom at last!"
 dod_per.42.f:0 "Armenia is free!"
 dod_per.42.a:0 "Armenia is free!"
 dod_per.43.t:0 "Trouble in Kalat"
 dod_per.43.d:0 "Under Sanjar III, Sindh beat off the Mughals and made us its vassals. Now the Sindhi grip is slipping, and our chiefs speak of freedom."
 dod_per.43.f:0 "Baluchistan for the Baluch!"
 dod_per.43.a:0 "Rise against Sindh!"
 dod_per.43.b:0 "Not yet."
 dod_per.50.t:0 "The Arab Revolt"
 dod_per.50.d:0 "With the Ottoman Empire torn apart by civil war, the Arabs of the Hejaz have risen against Turkish rule."
 dod_per.50.f:0 "The Arabs rise."
 dod_per.50.a:0 "Throw off the Turkish yoke!"
 dod_per.50.b:0 "Wait for a better moment."
 dod_per.51.t:0 "The Question of Arabia"
 dod_per.51.d:0 "With Istanbul weakened, we have a chance to unite the Holy Cities under our rule. Shall we offer the Hejaz union, or take it by force?"
 dod_per.51.f:0 "Power through unity, or freedom through blood?"
 dod_per.51.a:0 "Power through unity: propose a union."
 dod_per.51.b:0 "Freedom through blood!"
 dod_per.52.t:0 "Drums of War"
 dod_per.52.d:0 "An emissary from Nejd declares that the Amir wishes to unite his realm with ours. Refusal will surely mean war."
 dod_per.52.f:0 "Unity, or war?"
 dod_per.52.a:0 "Accept the union."
 dod_per.52.b:0 "Never!"
 dod_per.53.t:0 "Rule by Iron"
 dod_per.53.d:0 "The Hejaz has refused our offer. Mecca and Medina must be ours, whatever the cost."
 dod_per.53.f:0 "Conquer through blood."
 dod_per.53.a:0 "Conquer through blood!"
 dod_per.53.b:0 "Not now."
 dod_per.54.t:0 "An Arabian Claim to the Caliphate"
 dod_per.54.d:0 "The Amir of Nejd, master of the Holy Cities, has proclaimed himself Caliph of all Muslims, denying the Sultan's ancient title. This insult cannot stand."
 dod_per.54.f:0 "Who is the true Caliph?"
 dod_per.54.a:0 "Defend the Ottoman Caliphate!"
 dod_per.54.b:0 "Let the desert Amir have his title."
 dod_per.60.t:0 "The Kuren Kurdistana Azad"
 dod_per.60.d:0 "With central authority in Persia and the Ottoman Empire nearly gone, the Kurds must fend for themselves. A new militia, the Kuren Kurdistana Azad, has risen to drive out foreign plunderers and unite the Kurdish lands."
 dod_per.60.f:0 "Free Kurdistan!"
 dod_per.60.a:0 "Support the liberation of Kurdistan."
 dod_per.60.b:0 "These militias are dangerous."
 dod_per.61.t:0 "The Assyrian Question"
 dod_per.61.d:0 "Eastern Anatolia has always been home to many peoples. The Kurds may be the most numerous, but the Assyrian Christians of the mountains have lived here for millennia and look on our rule with suspicion."
 dod_per.61.f:0 "Coexistence, or dominance?"
 dod_per.61.a:0 "We will live together as equals."
 dod_per.61.b:0 "They will accept our predominance or perish."
 dod_per.70.t:0 "Ancient Ruins in Baalbek"
 dod_per.70.d:0 "Archaeologists have uncovered magnificent Roman temples at Baalbek. Scholars from across Europe are flocking to see them."
 dod_per.70.f:0 "The glory of the ancients."
 dod_per.70.a:0 "Fund the excavations."
