l_english:
 return_core_on_title:0 "Enable 'Return Cores' decisions"
 return_core_on_desc:0 "The Return Cores decisions allow you to return cores of vassals and spherelings, as long as you don't have a core in the province, and are otherwise kept hidden from view to avoid having them clutter up your decision list."
 return_core_off_title:0 "Disable 'Return Cores' decisions"
 return_core_off_desc:0 "Your decision list will now be uncluttered."
 return_core_disabled_title:0 "Deactivate 'Return Cores' decisions"
 return_core_disabled_desc:0 "The 'Return Cores' decisions will disappear from this game session and won't reappear again. You won't be able to use these decisions again for this game."
 return_cores_MNP_title:0 "Return cores to Manipur"
 return_cores_MNP_desc:0 "We hold provinces that Manipur has claims on. Returning these provinces, as an act of good faith, would surely bolster our relations."
