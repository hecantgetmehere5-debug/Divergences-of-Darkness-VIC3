l_english:
 dod_form_grossdeutschland:0 "Let the German Eagle Rise"
 dod_form_grossdeutschland_desc:0 "For the first time in a millennium, the German people are united under one flag: ours. Let us proclaim the Greater German state and take our place as the leading power of Europe."
 dod_move_capital_frankfurt:0 "Move the Capital to Frankfurt"
 dod_move_capital_frankfurt_desc:0 "The princes of the Empire did not accept our claim, but we defeated them. In Frankfurt we can be recognised as Kaiser by all the Germans."
 dod_integrate_prussia:0 "Integration of Prussia"
 dod_integrate_prussia_desc:0 "Prussia was never in our sphere, but the lands we conquered there are German. We can make them part of our realm."
 dod_integrate_elsass:0 "Integration of Elsass"
 dod_integrate_elsass_desc:0 "Elsass has been outside the Empire since the first Burgundian wars. Its Rhenish people can be brought home to the Reich."
 dod_integrate_rhineland:0 "Integration of the Rhine"
 dod_integrate_rhineland_desc:0 "We control most of the Rhine and have won the support of its people. Fur das Vaterland!"
 dod_integrate_elbe:0 "Integration of the North"
 dod_integrate_elbe_desc:0 "Our hold on the North German lands is secure. We can win the cooperation of their people."
 dod_integrate_south:0 "Integration of the South"
 dod_integrate_south_desc:0 "Our hold on the South German lands is secure. We can win the cooperation of their people."
 dod_form_north_german_league:0 "Create the North German League"
 dod_form_north_german_league_desc:0 "We dominate the North German states. It is time to bind them together, a step towards German unity."
 dod_form_danubian_confederation:0 "Form the Danubian Confederation"
 dod_form_danubian_confederation_desc:0 "Our hold on the southern and central German states is firm. A proper German kingdom here is a stepping stone to greater unity."
 dod_kingdom_of_hanover:0 "Proclaim the Kingdom of Hanover"
 dod_kingdom_of_hanover_desc:0 "For ages we have been dukes. Recognised as a power, we shall proclaim the Kingdom of Hanover and lay claim to the German coast."
 dod_united_frisia:0 "Frisian Unity"
 dod_united_frisia_desc:0 "Frisia survived for centuries between Burgundy and Scandinavia, but the Burgundian conquests left it divided. Now Frisia will be whole."
 dod_form_westphalia:0 "Become Westphalia"
 dod_form_westphalia_desc:0 "With Westfalen in our hands we can raise our country to the Grand Duchy of Westfalen."
 dod_form_rhineland:0 "Become Rhineland"
 dod_form_rhineland_desc:0 "We have defeated our former master Burgundy and hold both banks of the Rhine. We can proclaim the Kingdom of Rhineland."
 dod_greater_rhineland:0 "The Greater Rhineland"
 dod_greater_rhineland_desc:0 "We own only part of the river that gives us our name. We must secure all of the Rhine, from its sources to its delta."
 dod_reclaim_trans_krusne:0 "Reclaim Trans-Krusne"
 dod_reclaim_trans_krusne_desc:0 "We were forced to give up the lands north of the Krusne range to the League of Berlin. Some in Bohemia have never accepted it."
 dod_new_oostkolonisatie:0 "The New Oostkolonisatie"
 dod_new_oostkolonisatie_desc:0 "For too long the Elbians of the Baltic have lived under foreign rule. We must restore our dominance on its shores."
