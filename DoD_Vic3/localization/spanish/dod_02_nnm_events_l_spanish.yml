 IS_IN_REGION:0 "Está en la región"
 EVTNAME13010:0 "Marineros naufragados"
 EVTOPTA13010:0 "Dejadles regresar a casa."
 EVTOPTB13010:0 "Obligadles a quedarse."
 EVTNAME13015:0 "Contrabandistas extranjeros"
 EVTDESC13056:0 "Los grandes veleros clíper navegan por nuestras costas, recorriéndolas de norte a sur, como lobos que acechan a los débiles y corruptibles con el veneno que venden. Cuando encuentran un puerto desprotegido, un barco extranjero atraca y clava su colmillo en el cuerpo de nuestra nación. El uso del opio se ha extendido a $PROVINCENAME$."
 EVTDESC13061:0 "El uso del opio en una provincia vecina se ha extendido al interior. Los granjeros y los peones de $PROVINCENAME$ no han vuelto al trabajo, y las cosechas de campos enteros se marchitan, mientras los habitantes de $PROVINCENAME$ se sumergen cada vez más en las nieblas de la adicción."
 EVTDESC60140:0 "Los liberales, con un firme control sobre el país, creen que ha llegado el momento de organizar una convención constitucional. Todo el mundo (al menos todo el mundo que cuenta) estará representado en esta gran asamblea que dará forma al futuro de nuestro país."
 apply_for_USA_statehood2_title:0 "Solicitud de ingreso como estado"
 apply_for_USA_statehood2_desc:0 "Por nuestra posición en el continente norteamericano y nuestros vínculos culturales tradicionales con los EE.UU. parece probable que nos acepten como estado de la Unión si lo solicitamos. Si lo hacemos, nuestro país será anexionado por los Estados Unidos."
 fsa_shermans_march_to_the_sea_title:0 "La marcha hacia el mar de Sherman"
 fsa_shermans_march_to_the_sea_desc:0 "Durante la campaña llevada a cabo en Georgia entre noviembre y diciembre de 1864, el general William Tecumseh Sherman aplicó las doctrinas de la guerra total en lo que podría describirse perfectamente como una campaña de terror dirigida contra las poblaciones civiles del sur. Se cree que al operar en el interior de territorio confederado y destruir gran parte de la infraestructura civil del enemigo, Sherman logró quebrantar la voluntad de combatir del sur. La aplicación de estos métodos podría suponer el último clavo en la tapa del ataúd del enemigo."
 fsa_enact_radical_reconstruction_title:0 "Reconstrucción radical"
 austrian_form_south_german_confederation2_desc:0 "Aunque Alemania no estuvo unida hasta la proclamación del Imperio Alemán, tras la guerra franco-prusiana, el nacionalismo emergente del siglo XIX puso de relieve que la unificación era inevitable. La asamblea de Frankfurt de 1848 supuso un importante precedente. Al alcanzar una posición dominante entre los estados germanos meridionales, podemos formar la Confederación de Alemania del Sur."
 peking_convention_TPG_title:0 "La convención de Pekín"
 peking_convention_TPG_desc:0 "Desde el tratado de Nerchinsk (1689), el imperio ruso siempre había reconocido el río Argun y la cordillera de Stanovoy como fronteras naturales entre Rusia y China.  A mediados del siglo XIX, los rusos se expandirían más allá de esta frontera para apoderarse de los vastos territorios situados entre las montañas Stanovoy y el río Amur. Más adelante, los países occidentales pondrían fin a la Segunda Guerra del Opio incendiando los palacios estivales del emperador de China y ocupando Pekín. Un astuto general llamado Nikolay Ignatiev logró convencer a los chinos de que solo el apoyo de Rusia obligaría a los aliados a evacuar la capital. El precio de este apoyo fue la convención de Pekín, donde se confirmaron las ganancias obtenidas por Muravyov y, además, China cedió a Rusia nuevos territorios entre el río Ussuri y el Pacífico. De este modo, Rusia adquirió unas 350.000 millas cuadradas de territorio sin tener que disparar un solo tiro."
